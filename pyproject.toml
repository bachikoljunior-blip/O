[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-chatgpt"
version = "0.5.0"
description = "Evidence-driven continual agent runtime and conservative AGI evaluation harness"
requires-python = ">=3.11"
dependencies = ["openai>=1.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
continual = "continual.cli:main"
agi-benchmark = "agi.cli:main"
agi-autonomy = "agi.autonomy:main"
agi-evidence = "agi.evidence_cli:main"
agi-longhorizon = "agi.sandbox_protocol_cli:main"
agi-external-evidence = "agi.external_provenance:main"
agi-induction = "agi.induction_cli:main"
agi-external-claim = "agi.external_claim_cli:main"
agi-external-request = "agi.external_evaluation_request:main"
agi-capability-campaign = "agi.capability_campaign_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
