[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-chatgpt"
version = "0.4.0"
description = "Evidence-driven continual agent runtime and conservative AGI evaluation harness"
requires-python = ">=3.11"
dependencies = ["openai>=1.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
continual = "continual.cli:main"
agi-benchmark = "agi.cli:main"
agi-autonomy = "agi.autonomy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
