[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-chatgpt"
version = "0.1.0"
description = "Minimal continual-learning orchestration for ChatGPT/OpenAI Responses API"
requires-python = ">=3.11"
dependencies = ["openai>=1.0"]

[project.scripts]
continual = "continual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
