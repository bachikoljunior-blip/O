          }
          rp=root/'.continual/runs'/run_id/'recovery-receipts'/'gen29-execute-cross-repository-repair-transfer-freeze-task-evaluate-v1.json'
          rp.parent.mkdir(parents=True,exist_ok=True); rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path('/tmp/paths.json').write_text(json.dumps({'response':response_rel,'fragment':ex_native['fragment_ref'],'local':local_rel,'result':result_path.relative_to(root).as_posix(),'task':task_path.relative_to(root).as_posix(),'native':native_path.relative_to(root).as_posix(),'request':request_rel,'receipt':rp.relative_to(root).as_posix()},sort_keys=True))
          PY

      - name: Commit exact lifecycle delta
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run=os.environ['RUN_ID']; p=json.loads(Path('/tmp/paths.json').read_text())
          required=[
            f'.continual/runs/{run}/events.jsonl',
            f".continual/runs/{run}/invocations/{os.environ['EXECUTE_NATIVE_ID']}.json",
            p['response'],p['fragment'],p['local'],p['result'],p['task'],
            f'.continual/runs/{run}/snapshot.json',p['native'],p['request'],p['receipt'],
            *[f"{os.environ['TRIAL_DIR']}/{n}" for n in ['selection-provenance.json','task-a-baseline.json','task-b-source-readiness.json','bounded-result.json','replay-verification.json','stop-cause-recurrence-guard.json']]
          ]
          for path in required:
              if not Path(path).is_file(): raise SystemExit('missing '+path)
          subprocess.run(['git','add','-f','--',*required],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=set(required): raise SystemExit('staged delta mismatch '+json.dumps(sorted(staged^set(required))))
          for path in staged:
              if path.startswith('src/') or path.startswith('tests/') or path in {'agi/WORK_EXECUTION_STATE.json','agi/USER_INPUT_INBOX.json'}:
                  raise SystemExit('forbidden lifecycle mutation '+path)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '[native-execute-cross-repository-repair-transfer-result] gen29 freeze NOT_EVALUABLE Task Evaluate'
          git push origin "HEAD:$GITHUB_REF_NAME"
