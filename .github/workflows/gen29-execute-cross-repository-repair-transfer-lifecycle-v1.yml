name: gen29 consume cross repository repair transfer Execute v1

on:
  push:
    branches:
      - work/gen29-execute-cross-repository-repair-transfer-v1

permissions:
  contents: write

concurrency:
  group: gen29-execute-cross-repository-repair-transfer-v1
  cancel-in-progress: false

jobs:
  consume:
    if: \${{ !contains(github.event.head_commit.message, '[native-execute-cross-repository-repair-transfer-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: \${{ github.token }}
      EXPECTED_MAIN: 8a713203b146817f40b9d31dee276de8ceb8bd9e
      EXPECTED_STATE_BLOB: d7d4b983a6fc2dd30d62a3d82c56debef3d4e1cd
      EXPECTED_SNAPSHOT_BLOB: aab17ad8ba903bf21d09304409ea0829f654473c
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXPECTED_INBOX_REVISION: '38'
      MANIFEST_BLOB: b04e4622d7f4f44ddf793171d6dfad0b0ca3145e
      EXECUTE_NATIVE_ID: invoke-73dbc0b33e2c738622eaa72d
      EXECUTE_NATIVE_BLOB: d12c67ef2c55d45dc349241438cbc9871a5808e1
      EXECUTE_WORK_ID: invoke-81825eded6a1e237f600734c
      EXECUTE_REQUEST_BLOB: 5f64c99f5d9fddf862d8f7801d68907e2fbf4866
      EXECUTE_REQUEST_DIGEST: 1e53248b774802474798043a5bb462cb842d325b8617eab8bf3d75c270c43274
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-cross-repository-repair-transfer-v1
      TASK_UNIT_ID: unit-generation29-evaluate-cross-repository-repair-transfer-v1
      TRIAL_DIR: .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-repository-repair-transfer-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      TASK_A_REPO: ipolharvard/cms-icd
      TASK_A_COMMIT: b65d2955be39affbfe3fa4cab8868423c89def44
      TASK_B_REPO: jorgebotas/publiplots
      TASK_B_COMMIT: 6dd597386797ddcffbe5113a18ab0a5cbae7d863
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact authority and frozen Execute
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object agi/USER_INPUT_INBOX.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object "$TRIAL_DIR/precommitted-selector-manifest.json")" = "$MANIFEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$EXECUTE_NATIVE_ID.json)" = "$EXECUTE_NATIVE_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$EXECUTE_WORK_ID/request.json)" = "$EXECUTE_REQUEST_BLOB"
          test ! -e ".continual/work-model/invocations/$EXECUTE_WORK_ID/response.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root=Path('.').resolve()
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          snap=json.loads((root/'.continual/runs'/os.environ['RUN_ID']/'snapshot.json').read_text())
          inbox=json.loads(Path('agi/USER_INPUT_INBOX.json').read_text())
          req=verified_work_request(root, os.environ['EXECUTE_WORK_ID'])
          native=json.loads((root/'.continual/runs'/os.environ['RUN_ID']/'invocations'/f"{os.environ['EXECUTE_NATIVE_ID']}.json").read_text())
          assert state['execution_id']=='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3'
          assert state['lease_generation']==29
          assert hashlib.sha256(state['fence_token'].encode()).hexdigest()=='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'
          assert state['status']=='running' and state['resume_required'] is True
          assert state['active_component']=='generation29_execute_cross_repository_repair_transfer_pending_native_consume'
          bind=state['generation29_candidate_cross_repository_repair_transfer_execute_bind_v1']
          assert bind['status']=='state_cas_exact_readback_verified_execute_pending_native_consume'
          assert bind['pending_execute']['work_invocation_id']==os.environ['EXECUTE_WORK_ID']
          assert bind['pending_execute']['native_invocation_id']==os.environ['EXECUTE_NATIVE_ID']
          exact=state['exact_continuation']
          assert exact['pending_work_invocation_id']==os.environ['EXECUTE_WORK_ID']
          assert exact['pending_native_invocation_id']==os.environ['EXECUTE_NATIVE_ID']
          assert exact['snapshot_revision']==129 and exact['pending_component']=='execute'
          assert inbox['revision']==38
          assert snap['revision']==129 and snap['phase']=='unit_pending'
          assert snap['current_component']=='execute' and snap['current_unit']==os.environ['RESULT_UNIT_ID']
          assert req['component']=='execute' and req['request_digest']==os.environ['EXECUTE_REQUEST_DIGEST']
          assert req['payload']['execution_unit']['unit_id']==os.environ['RESULT_UNIT_ID']
          assert req['payload']['preflight_selection']['decision']=='BASELINE_FIRST'
          assert native['status']=='awaiting_work_model' and native['work_invocation_id']==os.environ['EXECUTE_WORK_ID']
          pending=pending_work_invocations(root,run_id=os.environ['RUN_ID'])
          assert len(pending)==1 and pending[0]['invocation_id']==os.environ['EXECUTE_WORK_ID']
          before=verify_work_invocations(root,run_id=os.environ['RUN_ID'])
          assert before['valid'] is True and before['pending']==1 and before['requests']==before['responses']+1
          Path('/tmp/work-verify-before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
          PY

      - name: Verify immutable upstream inputs and reproduce baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/task-a /tmp/task-b
          git clone --filter=blob:none --no-checkout "https://github.com/$TASK_A_REPO.git" /tmp/task-a
          git -C /tmp/task-a checkout --detach "$TASK_A_COMMIT"
          test "$(git -C /tmp/task-a rev-parse HEAD)" = "$TASK_A_COMMIT"
          test "$(git -C /tmp/task-a status --porcelain)" = ""
          test "$(git -C /tmp/task-a rev-parse HEAD:LICENSE)" = d645695673349e3947e8e5ae42332d0ac3164cd7
          test "$(git -C /tmp/task-a rev-parse HEAD:pyproject.toml)" = 0fab037540ed8573b5e9c08d7223a68bc87d879c
          test "$(git -C /tmp/task-a rev-parse HEAD:src/cms_icd/sources.py)" = e17995ad2908c510313607e7911c68f284b01b08
          git clone --filter=blob:none --no-checkout "https://github.com/$TASK_B_REPO.git" /tmp/task-b
          git -C /tmp/task-b checkout --detach "$TASK_B_COMMIT"
          test "$(git -C /tmp/task-b rev-parse HEAD)" = "$TASK_B_COMMIT"
          test "$(git -C /tmp/task-b status --porcelain)" = ""
          test "$(git -C /tmp/task-b rev-parse HEAD:LICENSE)" = fdcc6d60f5efa7703582c360bbd932455ed1b426
          test "$(git -C /tmp/task-b rev-parse HEAD:pyproject.toml)" = 978e5e33cc65d9259d3b3bdc37d7ac34cd5bc437
          test "$(git -C /tmp/task-b rev-parse HEAD:src/publiplots/utils/legend.py)" = d49d7d05b82f56f05526ada2089f1a1868e4abd9
          curl -fsSL https://api.github.com/repos/ipolharvard/cms-icd/issues/25 > /tmp/task-a-issue.json
          curl -fsSL https://api.github.com/repos/jorgebotas/publiplots/issues/223 > /tmp/task-b-issue.json
          jq -e '.number==25 and .state=="open" and .created_at=="2026-09-01T05:24:54Z" and .comments==0' /tmp/task-a-issue.json
          jq -e '.number==223 and .state=="open" and .created_at=="2026-09-01T05:18:09Z" and .comments==0' /tmp/task-b-issue.json
          python -m pip install -e /tmp/task-a
          python - <<'PY' > /tmp/task-a-baseline-output.json
          import json, tempfile
          from datetime import date
          from cms_icd.models import Release
          from cms_icd.sources import DirectoryProvider
          with tempfile.TemporaryDirectory() as directory:
              provider=DirectoryProvider(directory, Release(2026,date(2025,10,1)))
              try:
                  provider.paths('cm','tabular2')
              except Exception as exc:
                  result={'baseline_reproduced':type(exc) is KeyError,'exception_type':type(exc).__name__,'exception_args':[list(x) if isinstance(x,tuple) else x for x in exc.args],'pair':['cm','tabular2']}
              else:
                  result={'baseline_reproduced':False,'exception_type':None,'pair':['cm','tabular2']}
          print(json.dumps(result,sort_keys=True))
          if not result['baseline_reproduced']:
              raise SystemExit('Task A did not reproduce raw KeyError')
          PY
          if grep -q '_inside_cbar_anchor' /tmp/task-b/src/publiplots/utils/legend.py; then
            echo "unexpected target symbol present" >&2
            exit 1
          fi
          if grep -qi 'inside colorbar' /tmp/task-b/src/publiplots/utils/legend.py; then
            echo "unexpected target feature text present" >&2
            exit 1
          fi
          test "$(git -C /tmp/task-a status --porcelain)" = ""
          test "$(git -C /tmp/task-b status --porcelain)" = ""

      - name: Persist bounded NOT_EVALUABLE evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TRIAL_DIR"
          python - <<'PY'
          import hashlib, json, os
          from datetime import UTC, datetime
          from pathlib import Path
          now=datetime.now(UTC).isoformat().replace('+00:00','Z')
          root=Path(os.environ['TRIAL_DIR'])
          baseline=json.loads(Path('/tmp/task-a-baseline-output.json').read_text())
          provenance={
            'schema_version':1,'record_type':'generation29_cross_repository_repair_transfer_provenance',
            'recorded_at':now,'precommitted_manifest_blob_sha':os.environ['MANIFEST_BLOB'],
            'tasks':[
              {'task_id':'task-a-domain-error-validation','repository':os.environ['TASK_A_REPO'],'issue_number':25,'exact_commit':os.environ['TASK_A_COMMIT'],'license':'Apache-2.0','license_blob_sha':'d645695673349e3947e8e5ae42332d0ac3164cd7','pyproject_blob_sha':'0fab037540ed8573b5e9c08d7223a68bc87d879c','source_blob_sha':'e17995ad2908c510313607e7911c68f284b01b08','clean_checkout':True,'issue_comments_read':0},
              {'task_id':'task-b-location-code-mapping','repository':os.environ['TASK_B_REPO'],'issue_number':223,'exact_commit':os.environ['TASK_B_COMMIT'],'license':'MIT','license_blob_sha':'fdcc6d60f5efa7703582c360bbd932455ed1b426','pyproject_blob_sha':'978e5e33cc65d9259d3b3bdc37d7ac34cd5bc437','source_blob_sha':'d49d7d05b82f56f05526ada2089f1a1868e4abd9','clean_checkout':True,'issue_comments_read':0}],
            'solution_prs_read':0,'later_answer_bearing_commits_read':0,'gold_patches_read':0,'prior_run_solutions_read':0,'upstream_writes':0
          }
          task_a={'schema_version':1,'task_id':'task-a-domain-error-validation','exact_commit':os.environ['TASK_A_COMMIT'],**baseline,'patch_generated':False,'official_suite_run':False,'scoring_status':'UNSCORED_DUE_TO_JOINT_PREFLIGHT_TERMINATION'}
          task_b={'schema_version':1,'task_id':'task-b-location-code-mapping','exact_commit':os.environ['TASK_B_COMMIT'],'source_readiness':False,'target_symbol':'_inside_cbar_anchor','target_symbol_present':False,'inside_colorbar_path_present':False,'declared_baseline_reproducible':False,'reason':'The frozen exact pre-issue commit predates the issue-referenced inside-colorbar feature introduced by PR218, so the declared ValueError path does not exist at the immutable commit.','patch_generated':False,'official_suite_run':False}
          core={'schema_version':1,'trial_id':'generation29-cross-repository-repair-transfer-v1','unit_id':os.environ['RESULT_UNIT_ID'],'verdict':'NOT_EVALUABLE','joint_preflight_completed':False,'task_a_baseline_reproduced':True,'task_a_scored':False,'task_b_source_ready':False,'task_b_baseline_reproduced':False,'task_b_scored':False,'patches_generated':0,'official_suites_run':0,'upstream_write_performed':False,'candidate_activation':False,'provider_route_changed':False,'production_route_changed':False,'agi_claim_supported':False,'upper_objective_achieved':False,'user_level_objective_met':False,'reason':'Frozen Task B commit lacks the issue-referenced target symbol and feature path; the precommitted ordering requires both baselines before either patch, so the joint trial terminates before patch scoring.','claim_boundary':'NOT_EVALUABLE is a protocol result limited to the two frozen issues and commits; it is not negative evidence about repair capability, generalized transfer, AGI, or user completion.'}
          digest=hashlib.sha256(json.dumps(core,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          bounded={**core,'result_digest':digest,'recorded_at':now}
          replay={'schema_version':1,'replay_verified':True,'task_a_commit_match':True,'task_a_source_blob_match':True,'task_a_raw_keyerror_reproduced':True,'task_b_commit_match':True,'task_b_source_blob_match':True,'task_b_target_symbol_absent':True,'task_b_issue_path_absent':True,'manifest_identity_unchanged':True,'patches_replayed':0,'upstream_writes':0,'result_digest':digest}
          guard={'schema_version':1,'stop_cause':'selector source-readiness gap: a referenced feature path was absent at the precommitted exact commit','repair_action':'Do not mutate this frozen trial. Add a future selector recurrence guard that verifies every issue-referenced symbol and baseline path exists at the candidate exact commit before final precommit.','recurrence_check':'Before freezing a future multi-task selector, exact-read each referenced source path and assert named target symbols/features exist without inspecting or generating a repair.','this_trial_identity_changed':False}
          docs={'selection-provenance.json':provenance,'task-a-baseline.json':task_a,'task-b-source-readiness.json':task_b,'bounded-result.json':bounded,'replay-verification.json':replay,'stop-cause-recurrence-guard.json':guard}
          for name,value in docs.items():
              (root/name).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          Path('/tmp/result-digest').write_text(digest)
          PY

      - name: Recheck main and consume Execute exactly once
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$EXPECTED_MAIN" > /tmp/state-doc.json
          test "$(jq -r .sha /tmp/state-doc.json)" = "$EXPECTED_STATE_BLOB"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['TRIAL_DIR'])
          digest=Path('/tmp/result-digest').read_text().strip()
          artifacts={n:(root/n).as_posix() for n in ['precommitted-selector-manifest.json','selection-provenance.json','task-a-baseline.json','task-b-source-readiness.json','bounded-result.json','replay-verification.json','stop-cause-recurrence-guard.json']}
          next_unit={
            'unit_id':os.environ['TASK_UNIT_ID'],'component':'task_evaluate',
            'goal':'Independently adjudicate the frozen two-task transfer trial, especially the immutable Task B source-readiness failure, Task A raw-KeyError baseline, precommit ordering, zero-patch termination, and bounded NOT_EVALUABLE verdict.',
            'scope':'agi/cross-repository-repair-transfer/two-frozen-tasks/task-evaluate',
            'inputs':list(artifacts.values()),
            'evidence_needed':['exact manifest and provenance blobs','Task A raw KeyError baseline receipt','Task B absent target-symbol and feature-path receipt','joint ordering and zero-patch evidence','result digest and replay receipt'],
            'success_conditions':['confirm Task B was not source-ready at the frozen commit','confirm selector identities were not changed after precommit','confirm no patch, official-suite scoring, upstream write, Candidate activation, or route change occurred','preserve NOT_EVALUABLE as a bounded protocol verdict only'],
            'failure_conditions':['task identity or commit changed after precommit','a repair was generated before both baselines','a solution artifact or issue comment was read','any upstream write or claim broadening occurred'],
            'expected_outputs':['independent bounded-unit verdict','source-readiness and ordering findings','recurrence guard assessment','separate unchanged upper-objective and user-level verdicts'],
            'parent_continuation':'After Task Evaluate, continue Candidate, Consolidate Episode, Learn, return to Root, and select a materially different safe unit while AGI and user completion remain false.'
          }
          result={'unit_id':os.environ['RESULT_UNIT_ID'],'trial_id':'generation29-cross-repository-repair-transfer-v1','status':'NOT_EVALUABLE','verdict':'UNIT_RESULT_REQUIRES_INDEPENDENT_TASK_EVALUATE','result_digest':digest,'task_count':2,'task_a_baseline_reproduced':True,'task_a_scored':False,'task_b_source_ready':False,'task_b_scored':False,'patches_generated':0,'official_suites_run':0,'upstream_write_performed':False,'candidate_activation':False,'provider_route_changed':False,'production_route_changed':False,'agi_claim_supported':False,'upper_objective_achieved':False,'user_level_objective_met':False,'artifacts':artifacts,'negative_evidence':['Task B exact frozen commit predates the issue-referenced inside-colorbar target path.','Task A reproduced a raw KeyError but remains unscored because joint preflight terminated before patch generation.','No generalized transfer, production capability, AGI, or completion conclusion follows from this protocol failure.'],'claim_boundary':'The verdict concerns source readiness of these two frozen issue/commit pairs only.','continuation':'Independently Task Evaluate the exact frozen evidence and recurrence guard, then continue the unchanged lifecycle.','next_execution_unit':next_unit}
          output={'result':result,'fragment':{'component':'execute','unit_id':os.environ['RESULT_UNIT_ID'],'status':'NOT_EVALUABLE','result_digest':digest,'task_a_baseline_reproduced':True,'task_b_source_ready':False,'patches_generated':0,'candidate_activation':False,'agi_claim_supported':False,'user_level_objective_met':False,'upstream_write_performed':False,'claim_boundary':result['claim_boundary']},'local_learn':{'decision':'NO_CHANGE','candidates':[],'observations':['A multi-task precommit must verify issue-referenced symbols and feature paths exist at each frozen exact commit before final selector freeze.','When a frozen task is not source-ready, preserving identity and terminating before patch scoring is stronger evidence than silently swapping tasks.','One reproduced baseline plus one non-evaluable task does not support transfer, Candidate activation, AGI, or completion.']}}
          Path('/tmp/execute-output.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          PY
          continual --root . work-submit "$EXECUTE_WORK_ID" --response /tmp/execute-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/execute-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate Task Evaluate freeze and persist receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']
          before=json.loads(Path('/tmp/work-verify-before.json').read_text()); after=verify_work_invocations(root,run_id=run_id)
          expected={'valid':True,'requests':before['requests']+1,'responses':before['responses']+1,'pending':1,'native_completed':before['native_completed']+1,'native_fragments':before['native_fragments']+1,'native_local_learn':before['native_local_learn']+1}
          for k,v in expected.items(): assert after[k]==v,(k,after[k],v)
          output=json.loads(Path('/tmp/execute-output.json').read_text())
          verified=verified_work_invocation(root,os.environ['EXECUTE_WORK_ID'])
          assert verified['output']==output
          snap_path=root/'.continual/runs'/run_id/'snapshot.json'; snap=json.loads(snap_path.read_text())
          assert snap['revision']==130 and snap['phase']=='unit_pending'
          assert snap['current_component']=='task_evaluate' and snap['current_unit']==os.environ['TASK_UNIT_ID']
          pending=pending_work_invocations(root,run_id=run_id); assert len(pending)==1
          req=pending[0]; assert req['component']=='candidate_evaluate'
          assert req['payload']['mode']=='pre-application' and req['payload']['target_component']=='task_evaluate'
          work_id=req['invocation_id']; request_rel=f'.continual/work-model/invocations/{work_id}/request.json'
          awaiting=[]
          for p in sorted((root/'.continual/runs'/run_id/'invocations').glob('*.json')):
              v=json.loads(p.read_text())
              if v.get('status')=='awaiting_work_model': awaiting.append((p,v))
          assert len(awaiting)==1
          native_path,native=awaiting[0]
          assert native['component']=='candidate_evaluate' and native['work_invocation_id']==work_id
          ex_native_path=root/'.continual/runs'/run_id/'invocations'/f"{os.environ['EXECUTE_NATIVE_ID']}.json"
          ex_native=json.loads(ex_native_path.read_text()); assert ex_native['status']=='complete'
          result_path=root/'.continual/runs'/run_id/'artifacts'/f"{os.environ['RESULT_UNIT_ID']}-result.json"
          task_path=root/'.continual/runs'/run_id/'execution-units'/f"{os.environ['TASK_UNIT_ID']}.json"
          response_rel=f".continual/work-model/invocations/{os.environ['EXECUTE_WORK_ID']}/response.json"
          local_rel=f".continual/runs/{run_id}/local-learn/{os.environ['EXECUTE_NATIVE_ID']}-execute.json"
          receipt={
            'schema_version':1,'record_type':'generation29_execute_cross_repository_repair_transfer_consume_receipt',
            'recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),
            'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},
            'source_main_sha':os.environ['EXPECTED_MAIN'],'source_state_blob_sha':os.environ['EXPECTED_STATE_BLOB'],
            'idempotency_key':f"o-work-gen29:consume-execute-{os.environ['EXECUTE_WORK_ID']}:freeze-cross-repository-repair-transfer-task-evaluate:v1",
            'trial_status':'NOT_EVALUABLE','trial_result_digest':Path('/tmp/result-digest').read_text().strip(),
            'stop_cause':'frozen Task B exact commit lacks the issue-referenced feature path',
            'repair_evidence':'trial identity preserved; terminated before patch scoring; recurrence guard persisted',
            'completed_effect':{
              'execute_work_invocation_id':os.environ['EXECUTE_WORK_ID'],'execute_native_invocation_id':os.environ['EXECUTE_NATIVE_ID'],
              'execute_response_ref':response_rel,'execute_response_blob_sha':subprocess.check_output(['git','hash-object',response_rel],text=True).strip(),
              'execute_native_blob_sha':subprocess.check_output(['git','hash-object',str(ex_native_path)],text=True).strip(),
              'execute_fragment_ref':ex_native['fragment_ref'],'execute_fragment_blob_sha':subprocess.check_output(['git','hash-object',ex_native['fragment_ref']],text=True).strip(),
              'execute_local_learn_ref':local_rel,'execute_local_learn_blob_sha':subprocess.check_output(['git','hash-object',local_rel],text=True).strip(),
              'canonical_result_ref':result_path.relative_to(root).as_posix(),'canonical_result_blob_sha':subprocess.check_output(['git','hash-object',str(result_path)],text=True).strip(),
              'task_unit_ref':task_path.relative_to(root).as_posix(),'task_unit_blob_sha':subprocess.check_output(['git','hash-object',str(task_path)],text=True).strip(),
              'snapshot_revision':130,'snapshot_blob_sha':subprocess.check_output(['git','hash-object',str(snap_path)],text=True).strip(),
              'pending_native_invocation_id':native['invocation_id'],'pending_native_invocation_ref':native_path.relative_to(root).as_posix(),'pending_native_invocation_blob_sha':subprocess.check_output(['git','hash-object',str(native_path)],text=True).strip(),
              'pending_work_invocation_id':work_id,'pending_request_ref':request_rel,'pending_request_digest':req['request_digest'],'pending_request_blob_sha':subprocess.check_output(['git','hash-object',request_rel],text=True).strip(),
              'pending_component':'candidate_evaluate','target_component':'task_evaluate','verification':expected},
            'upstream_write_performed':False,'request_recreated':False,'execute_reinvoked':False,'resume_required':True,
