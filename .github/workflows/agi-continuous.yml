name: stop-agi-copilot-automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agi-continuous
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm Copilot automation shutdown
        run: echo "Copilot-based AGI automation is disabled."
