name: reconcile-revision25-once

on:
  push:
    branches: [fix/mechanical-no-discretionary-checkpoint-v1]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mechanical-no-discretionary-checkpoint-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/reconcile_revision25.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Reconcile revision 25 typed directives"
          git push origin HEAD:fix/mechanical-no-discretionary-checkpoint-v1
