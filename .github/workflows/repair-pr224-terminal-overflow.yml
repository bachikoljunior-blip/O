name: repair-pr224-terminal-overflow

on:
  push:
    branches:
      - 'agi/sequence-affine-six-synthesis-r58'
    paths:
      - '.github/workflows/repair-pr224-terminal-overflow.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Patch only the demonstrated derived-literal boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agi/acquired_programs.py')
          text = path.read_text(encoding='utf-8')

          widened = '''    base_constants: list[tuple[str, Any]] = [\n        *[("numeric", value) for value in range(-5, 6)],\n        ("numeric", -6),\n        ("numeric", 6),\n        ("string", ""),\n'''
          legacy = '''    base_constants: list[tuple[str, Any]] = [\n        *[("numeric", value) for value in range(-5, 6)],\n        ("string", ""),\n'''
          if text.count(widened) != 1:
              raise SystemExit('expected append-only ±6 seed block not found exactly once')
          text = text.replace(widened, legacy)

          terminal = '''    raise AcquiredProgramError(\n        "no bounded pure typed program matches all demonstrations"\n    )\n'''
          fallback = '''    # Preserve the legacy deterministic frontier exactly. Only after that frontier\n    # is exhausted, derive a bounded integer affine literal pair from demonstrations\n    # for a sequence-sum -> canonical numeric-string terminal program. The derived\n    # literals never enter the generic frontier/seen sets, so unrelated synthesis\n    # ordering and protected fail-closed behavior remain unchanged.\n    if (\n        input_domain == "sequence"\n        and output_domain == "string"\n        and allow_sequence_folds\n        and max_nodes >= 7\n    ):\n        affine_points: list[tuple[int, int]] = []\n        affine_valid = True\n        for item in examples:\n            total = 0\n            if not isinstance(item.input, (list, tuple)):\n                affine_valid = False\n                break\n            for raw in item.input:\n                if (\n                    isinstance(raw, bool)\n                    or not isinstance(raw, (int, float))\n                    or not math.isfinite(float(raw))\n                    or not float(raw).is_integer()\n                ):\n                    affine_valid = False\n                    break\n                total += int(raw)\n            if not affine_valid:\n                break\n            rendered = item.output\n            if not isinstance(rendered, str):\n                affine_valid = False\n                break\n            try:\n                target_value = int(rendered)\n            except ValueError:\n                affine_valid = False\n                break\n            if str(target_value) != rendered:\n                affine_valid = False\n                break\n            affine_points.append((total, target_value))\n\n        if affine_valid:\n            anchor: tuple[int, int, int, int] | None = None\n            for left_index, (left_x, left_y) in enumerate(affine_points):\n                for right_x, right_y in affine_points[left_index + 1 :]:\n                    if right_x != left_x:\n                        anchor = (left_x, left_y, right_x, right_y)\n                        break\n                if anchor is not None:\n                    break\n            if anchor is not None:\n                left_x, left_y, right_x, right_y = anchor\n                delta_x = right_x - left_x\n                delta_y = right_y - left_y\n                if delta_y % delta_x == 0:\n                    coefficient = delta_y // delta_x\n                    offset = left_y - coefficient * left_x\n                    try:\n                        _validate_constant(coefficient, "numeric")\n                        _validate_constant(offset, "numeric")\n                    except AcquiredProgramError:\n                        pass\n                    else:\n                        if all(\n                            coefficient * observed_x + offset == observed_y\n                            for observed_x, observed_y in affine_points\n                        ):\n                            expression = {\n                                "op": "to_string",\n                                "arg": {\n                                    "op": "add",\n                                    "left": {\n                                        "op": "mul",\n                                        "left": {\n                                            "op": "fold_numeric",\n                                            "arg": {"op": "input"},\n                                            "reducer": "add",\n                                            "initial": 0,\n                                        },\n                                        "right": {\n                                            "op": "const",\n                                            "domain": "numeric",\n                                            "value": coefficient,\n                                        },\n                                    },\n                                    "right": {\n                                        "op": "const",\n                                        "domain": "numeric",\n                                        "value": offset,\n                                    },\n                                },\n                            }\n                            if _candidate_outputs(expression, input_domain, examples) == expected:\n                                support = [\n                                    {"input": item.input, "output": item.output}\n                                    for item in examples\n                                ]\n                                program = AcquiredProgram(\n                                    input_domain=input_domain,\n                                    output_domain=output_domain,\n                                    expression=expression,\n                                    support_sha256=_digest(support),\n                                    max_steps=max(16, max_nodes * 2),\n                                    max_output_length=1024,\n                                    effects=(),\n                                )\n                                program.validate()\n                                return program\n\n    raise AcquiredProgramError(\n        "no bounded pure typed program matches all demonstrations"\n    )\n'''
          if text.count(terminal) != 1:
              raise SystemExit('expected terminal synthesis failure block not found exactly once')
          text = text.replace(terminal, fallback)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused coefficient-six regression
        run: pytest -q tests/test_sequence_affine_string_synthesis.py
      - name: Protected object fail-closed regression
        run: pytest -q tests/test_acquired_program_structured.py::test_value_sensitive_object_classification_requires_observed_constants_and_equality
      - name: Prior sequence-string synthesis regression
        run: pytest -q tests/test_generated_crossdomain_cegis.py -k 'cross-family-14'
      - name: Compile source
        run: python -m compileall -q src
      - name: Commit focused-validated repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .github/workflows/repair-pr224-terminal-overflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agi/acquired_programs.py
          git diff --cached --quiet && { echo 'repair produced no source change' >&2; exit 1; }
          git commit -m 'Derive bounded affine literals after legacy frontier exhaustion'
          git push origin "HEAD:${GITHUB_REF_NAME}"
