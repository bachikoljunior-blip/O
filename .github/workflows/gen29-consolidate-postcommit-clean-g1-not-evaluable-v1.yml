                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/pre-retrieval-manifest.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/causal-digest-control-matrix.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/contamination-mutation-audit.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/focused-validation.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/bounded-result.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-evaluate-postcommit-clean-g1-independent-live-forecast-v1-result.json",
                "github://bachikoljunior-blip/O/pull/379",
                "github://bachikoljunior-blip/O/pull/380"
              ],
              "observations": [
                "Both required independent surfaces were unavailable before retrieval, and the shared Work session was ineligible as predictor.",
                "Every source, retrieval, prediction, reveal, score, baseline, and substitution effect stayed zero.",
                "Task Evaluate returned bounded unit PASS, live-trial NOT_EVALUABLE, task/user/upper FAIL, and agi_claim_supported=false.",
                "No Candidate activation or provider/production routing change occurred."
              ],
              "purpose": "Consolidate the post-revision-113 clean_g1 independent-surface audit, exact pre-retrieval hold, bounded Task Evaluate PASS, live-trial NOT_EVALUABLE verdict, and unchanged upper FAIL without widening the claim.",
              "unresolved": [
                "Learn and a materially different successor Root unit",
                "later publication/readback of the Task response and current successor lifecycle",
