                "A bounded control PASS must remain separate from a live-trial NOT_EVALUABLE verdict and the unchanged task, user, upper-objective, and AGI failures.",
                "The prior contaminated trial remains FAIL; later protocol or control success cannot retroactively repair, relabel, or aggregate it.",
                "Request-time provenance is immutable: later workflow, CI, PR, merge, readback, user input, or capability facts belong to later boundaries."
              ],
              "reason": "The episode validates one exact fail-closed ordering decision and strict claim separation, but supplies no successful forecast, new capability, production evidence, or distinct reversible prompt improvement. Existing contracts already require the retained lessons, so no Candidate or activation is justified."
            },
            "result": {
