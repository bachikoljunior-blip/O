name: materialize-sequence-six-scope-once

on:
  push:
    branches:
      - 'agi/sequence-affine-six-scoped-diagnostic-r60'
    paths:
      - '.github/workflows/materialize-sequence-six-scope-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Scope new constants to sequence inputs only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agi/acquired_programs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    base_constants: list[tuple[str, Any]] = [
        *[("numeric", value) for value in range(-5, 6)],
        ("numeric", -6),
        ("numeric", 6),
        ("string", ""),
        ("sequence", []),
        ("boolean", False),
        ("boolean", True),
        ("object", {}),
    ]
'''
          new = '''    base_constants: list[tuple[str, Any]] = [
        *[("numeric", value) for value in range(-5, 6)],
        ("string", ""),
        ("sequence", []),
        ("boolean", False),
        ("boolean", True),
        ("object", {}),
    ]
    if input_domain == "sequence":
        base_constants.extend((("numeric", -6), ("numeric", 6)))
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one appended coefficient-six seed block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/materialize-sequence-six-scope-once.yml').unlink()
          PY
          git diff --check
      - name: Commit diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agi/acquired_programs.py .github/workflows/materialize-sequence-six-scope-once.yml
          git commit -m 'Scope coefficient-six synthesis seeds to sequence inputs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
