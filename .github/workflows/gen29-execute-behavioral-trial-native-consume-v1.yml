name: gen29 consume behavioral trial Execute v1

on:
  push:
    branches:
      - work/gen29-execute-behavioral-trial-native-consume-v1

permissions:
  contents: write

concurrency:
  group: gen29-execute-behavioral-trial-native-consume-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-after-execute-behavioral-trial-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 8aafbc01a34161fd4685d488a6e8623966794b21
      EXPECTED_STATE_BLOB: a38ff299ad2d385984e425d46278ea82fd98a6d9
      EXPECTED_SNAPSHOT_BLOB: 3d6387236299dabff188a9b9401b6707c74f9ae3
      EXPECTED_REQUEST_BLOB: 8f877ca0be349e6736ba803e596549f86cf91727
      EXPECTED_RESPONSE_BLOB: b0f179751041db8e4137baa89ff26248b0e85417
      EXPECTED_REQUEST_DIGEST: 3866a4ccba345ee9538ca39fce087529283c05595fa7fc05c84be3e060934ad0
      EXPECTED_RESPONSE_DIGEST: fd832614cc51e061b944056e62cd03798535a75863c9fa4092e49ad9598c3977
      RUN_ID: run-work-recovery-gen9-durability-repair
      OLD_NATIVE_ID: invoke-ea55cc8d30783a55c0d51e07
      OLD_WORK_ID: invoke-1fcc456eaec7f8f134759b06
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      SOURCE_CI_RUN_ID: '33238893400'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .
      - name: Assert exact main, authority, and frozen Execute response
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base "${EXPECTED_MAIN}" HEAD)" = "${EXPECTED_MAIN}"
          cat > /tmp/validate-runtime-main.py <<'PY'
          import sys
          expected, observed = sys.argv[1:]
          if observed != expected:
              raise SystemExit(
                  f'runtime main changed after frozen launch: {observed} != {expected}'
              )
          print('RUNTIME_MAIN_EXACT=' + observed)
          PY
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${RUNTIME_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${RUNTIME_MAIN}" > /tmp/runtime-state-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          git show HEAD:agi/WORK_EXECUTION_STATE.json > /tmp/branch-state.json
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "${RUNTIME_STATE_BLOB}"
          echo "RUNTIME_STATE_BLOB=${RUNTIME_STATE_BLOB}" >> "${GITHUB_ENV}"
          echo "RUNTIME_MAIN=${RUNTIME_MAIN}" >> "${GITHUB_ENV}"
          test "$(git hash-object .continual/runs/${RUN_ID}/snapshot.json)" = "${EXPECTED_SNAPSHOT_BLOB}"
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/request.json)" = "${EXPECTED_REQUEST_BLOB}"
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/response.json)" = "${EXPECTED_RESPONSE_BLOB}"
          mapfile -t launch_delta < <(git diff --name-only "${EXPECTED_MAIN}" HEAD)
          test "${#launch_delta[@]}" -eq 1
          test "${launch_delta[0]}" = ".github/workflows/gen29-execute-behavioral-trial-native-consume-v1.yml"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          request = json.loads((root / '.continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/request.json').read_text())
          response = json.loads((root / '.continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/response.json').read_text())
          native = json.loads((root / '.continual/runs/run-work-recovery-gen9-durability-repair/invocations/invoke-ea55cc8d30783a55c0d51e07.json').read_text())
          fence_digest = hashlib.sha256(state['fence_token'].encode('utf-8')).hexdigest()
          if state['execution_id'] != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state['lease_generation'] != 29 or fence_digest != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state['status'] != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_execute_response_remote_main_readback_verified_native_consume_required':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected_exact = {
              'pending_native_invocation_id': 'invoke-ea55cc8d30783a55c0d51e07',
              'pending_native_invocation_ref': '.continual/runs/run-work-recovery-gen9-durability-repair/invocations/invoke-ea55cc8d30783a55c0d51e07.json',
              'pending_work_invocation_id': 'invoke-1fcc456eaec7f8f134759b06',
              'pending_request_ref': '.continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/request.json',
              'pending_request_blob_sha': '8f877ca0be349e6736ba803e596549f86cf91727',
              'pending_request_digest': '3866a4ccba345ee9538ca39fce087529283c05595fa7fc05c84be3e060934ad0',
              'pending_response_ref': '.continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/response.json',
              'pending_response_blob_sha': 'b0f179751041db8e4137baa89ff26248b0e85417',
              'pending_response_digest': 'fd832614cc51e061b944056e62cd03798535a75863c9fa4092e49ad9598c3977',
              'response_exists_on_authoritative_remote': True,
              'snapshot_revision': 99,
              'native_phase': 'unit_pending',
              'pending_component': 'execute',
              'selected_unit_id': 'unit-generation29-external-observation-behavioral-effect-v1',
          }
          for key, value in expected_exact.items():
              if exact.get(key) != value:
                  raise SystemExit(
                      f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}'
                  )
          if request['request_digest'] != '3866a4ccba345ee9538ca39fce087529283c05595fa7fc05c84be3e060934ad0':
              raise SystemExit('request digest mismatch')
          if response['request_digest'] != request['request_digest'] or response['response_digest'] != 'fd832614cc51e061b944056e62cd03798535a75863c9fa4092e49ad9598c3977':
              raise SystemExit('response binding mismatch')
          if native.get('status') != 'awaiting_work_model' or native.get('work_invocation_id') != request['invocation_id']:
              raise SystemExit('native is not awaiting the exact Work invocation')
          PY
      - name: Assert causal continuity and capture before state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          result = assert_work_resume_continuity_preflight(
              Path('.'),
              run_id='run-work-recovery-gen9-durability-repair',
              executor_binding='current_chatgpt_work_session',
              model_identity='chatgpt-work-model-unverified',
          )
          if result.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight did not authorize exact resume')
          print('CONTINUITY_PREFLIGHT=' + json.dumps(result, sort_keys=True))
          PY
          continual --root . work-verify --run-id "${RUN_ID}" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "${RUN_ID}" > /tmp/work-pending-before.json
          cat /tmp/work-verify-before.json
          cat /tmp/work-pending-before.json
      - name: Precommit and record runtime latest GitHub main observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          OBSERVED_MAIN="$(git rev-parse origin/main)"
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${OBSERVED_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${OBSERVED_MAIN}" > /tmp/remote-state-document.json
          test "$(jq -r '.sha' /tmp/remote-state-document.json)" = "${RUNTIME_STATE_BLOB}"
          continual --root . work-source-observation-prepare "${RUN_ID}" --state-blob-sha "${RUNTIME_STATE_BLOB}" --expected-commit-sha "${OBSERVED_MAIN}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-prepare.json
          echo "OBSERVED_MAIN=${OBSERVED_MAIN}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/remote-state-document.json').read_text())
          content = base64.b64decode(''.join(document['content'].splitlines())).decode()
          state = json.loads(content)
          digest = Store.stable_digest(state['fence_token'], length=64)
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': digest,
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "${RUN_ID}" "${WORK_OBSERVATION_ID}" --request-digest "${WORK_REQUEST_DIGEST}" --commit-sha "${OBSERVED_MAIN}" --blob-sha "${RUNTIME_STATE_BLOB}" --projection /tmp/work-source-projection.json --observed-at "${OBSERVED_AT}" --executor-binding "${EXECUTOR_BINDING}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-receipt.json
      - name: Precommit and record exact fixed-policy successful CI observation
        shell: bash
        run: |
          set -euo pipefail
          continual --root . ci-source-observation-prepare "${RUN_ID}"             --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-prepare.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}" > /tmp/workflow-run-full.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "${RUN_ID}" "${CI_OBSERVATION_ID}"             --request-digest "${CI_REQUEST_DIGEST}"             --workflow-run /tmp/workflow-run-projection.json             --jobs /tmp/workflow-jobs-projection.json             --observed-at "${OBSERVED_AT}"             --executor-binding "${EXECUTOR_BINDING}"             --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-receipt.json
      - name: Verify fresh receipts and runtime authority before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${LATEST_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${LATEST_MAIN}" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "${RUNTIME_STATE_BLOB}"
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(
              root, run_id='run-work-recovery-gen9-durability-repair',
              state=state, state_blob_sha=__import__('os').environ['RUNTIME_STATE_BLOB'], now=now,
          )
          ci = verify_ci_source_observation(
              root, run_id='run-work-recovery-gen9-durability-repair', state=state, now=now,
          )
          print('WORK_SOURCE_VERIFY=' + json.dumps(work, sort_keys=True))
          print('CI_SOURCE_VERIFY=' + json.dumps(ci, sort_keys=True))
          PY
      - name: Consume exact Execute response once and reach Root boundary
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-resume "$RUN_ID" --max-steps 1 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          cat /tmp/native-resume.json
          test "$(git hash-object .continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/request.json)" = "8f877ca0be349e6736ba803e596549f86cf91727"
          test "$(git hash-object .continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/response.json)" = "b0f179751041db8e4137baa89ff26248b0e85417"
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json
      - name: Validate exact completed Execute and Root checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations
          root = Path('.').resolve()
          run_id = 'run-work-recovery-gen9-durability-repair'
          run_dir = root / '.continual' / 'runs' / run_id
          old_native_id = 'invoke-ea55cc8d30783a55c0d51e07'
          old_work_id = 'invoke-1fcc456eaec7f8f134759b06'
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_before = {
              'valid': True, 'requests': 94, 'responses': 94, 'pending': 0,
              'native_completed': 87, 'native_fragments': 87, 'native_local_learn': 80,
          }
          expected_after = {
              'valid': True, 'requests': 94, 'responses': 94, 'pending': 0,
              'native_completed': 88, 'native_fragments': 88, 'native_local_learn': 81,
          }
          for key, expected in expected_before.items():
              if before.get(key) != expected:
                  raise SystemExit(f'before verification mismatch for {key}: {before.get(key)!r} != {expected!r}')
          for key, expected in expected_after.items():
              if after.get(key) != expected:
                  raise SystemExit(f'after verification mismatch for {key}: {after.get(key)!r} != {expected!r}')
          journal = json.loads((run_dir / 'invocations' / f'{old_native_id}.json').read_text())
          response = json.loads((root / '.continual/work-model/invocations' / old_work_id / 'response.json').read_text())
          snapshot = json.loads((run_dir / 'snapshot.json').read_text())
          artifact_ref = 'artifacts/unit-generation29-external-observation-behavioral-effect-v1-result.json'
          artifact = json.loads((run_dir / artifact_ref).read_text())
          fragment = json.loads((run_dir / 'fragments' / f'{old_native_id}-execute.json').read_text())
          local_learn = json.loads((run_dir / 'local-learn' / f'{old_native_id}-execute.json').read_text())
          if journal.get('status') != 'complete' or journal.get('component') != 'execute':
              raise SystemExit('old Execute native invocation was not completed exactly')
          if journal.get('output') != response.get('output'):
              raise SystemExit('completed native output differs from exact response')
          if any(key in journal for key in ('work_invocation_id', 'work_request_ref', 'work_request_digest')):
              raise SystemExit('complete journal retained stale awaiting-work fields')
          if artifact != response['output']['result']:
              raise SystemExit('durable result artifact differs from exact response result')
          for key, value in response['output']['fragment'].items():
              if fragment.get(key) != value:
                  raise SystemExit(f'fragment mismatch for {key}')
          if fragment.get('invocation_id') != old_native_id or fragment.get('component') != 'execute':
              raise SystemExit('fragment identity mismatch')
          if local_learn != response['output']['local_learn']:
              raise SystemExit('local learn differs from exact response')
          if pending_work_invocations(root, run_id=run_id):
              raise SystemExit('Root checkpoint unexpectedly has a pending Work request')
          awaiting = []
          for path in sorted((run_dir / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append(value)
          if awaiting:
              raise SystemExit(f'Root checkpoint retained awaiting native journals: {awaiting!r}')
          expected_snapshot = {
              'status': 'continue',
              'phase': 'root_pending',
              'revision': 101,
              'checkpoint_reason': 'step_budget_exhausted',
              'current_unit': 'unit-generation29-external-observation-behavioral-effect-v1',
              'last_result_ref': artifact_ref,
          }
          for key, expected in expected_snapshot.items():
              if snapshot.get(key) != expected:
                  raise SystemExit(f'snapshot mismatch for {key}: {snapshot.get(key)!r} != {expected!r}')
          summary = {
              'completed_native_invocation_id': old_native_id,
              'completed_work_invocation_id': old_work_id,
              'completed_response_digest': 'fd832614cc51e061b944056e62cd03798535a75863c9fa4092e49ad9598c3977',
              'root_snapshot_revision': snapshot['revision'],
              'root_snapshot_phase': snapshot['phase'],
              'root_checkpoint_reason': snapshot['checkpoint_reason'],
              'pending_work_requests': 0,
              'verification': {key: after[key] for key in expected_after},
              'next_component': 'root',
          }
          Path('/tmp/native-result-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print('NATIVE_RESULT=' + json.dumps(summary, sort_keys=True))
          PY
      - name: Persist exact Root-boundary result and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "a38ff299ad2d385984e425d46278ea82fd98a6d9"
          test "$(git hash-object .continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/request.json)" = "8f877ca0be349e6736ba803e596549f86cf91727"
          test "$(git hash-object .continual/work-model/invocations/invoke-1fcc456eaec7f8f134759b06/response.json)" = "b0f179751041db8e4137baa89ff26248b0e85417"
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          run_id = 'run-work-recovery-gen9-durability-repair'
          old_native = 'invoke-ea55cc8d30783a55c0d51e07'
          summary = json.loads(Path('/tmp/native-result-summary.json').read_text())
          work_prepare = json.loads(Path('/tmp/work-source-prepare.json').read_text())
          ci_prepare = json.loads(Path('/tmp/ci-source-prepare.json').read_text())
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-native-after-execute-behavioral-trial-v1.json'
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_native_after_execute_consume_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': os.environ['OBSERVED_MAIN'],
              'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': 33238893400,
              'idempotency_key': 'o-work-gen29:invoke-ea55cc8d30783a55c0d51e07:consume-execute-behavioral-trial-response-once:v1',
              'completed_effect': summary,
              'resume_required': True,
              'next_action': 'Exact-head validate and merge this unchanged Root-boundary lifecycle, then resume Root exactly once to freeze the next Work-exclusive request.',
          }
          receipt_path = Path(receipt_rel)
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          work_obs = work_prepare['observation_id']
          ci_obs = ci_prepare['observation_id']
          artifact = f'.continual/runs/{run_id}/artifacts/unit-generation29-external-observation-behavioral-effect-v1-result.json'
          required = {
              f'.continual/runs/{run_id}/events.jsonl',
              f'.continual/runs/{run_id}/snapshot.json',
              f'.continual/runs/{run_id}/invocations/{old_native}.json',
              f'.continual/runs/{run_id}/fragments/{old_native}-execute.json',
              f'.continual/runs/{run_id}/local-learn/{old_native}-execute.json',
              artifact,
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json',
              receipt_rel,
          }
          for path in sorted(required):
              if not Path(path).is_file():
                  raise SystemExit('required lifecycle path missing: ' + path)
          tracked = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          normal = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          ignored = subprocess.check_output(['git', 'ls-files', '--others', '--ignored', '--exclude-standard'], text=True).splitlines()
          all_changed = set(tracked) | set(normal) | set(ignored)
          install_artifacts = {
              path for path in all_changed
              if path.startswith('src/agi/__pycache__/')
              or path.startswith('src/continual/__pycache__/')
              or path.startswith('src/continual_chatgpt.egg-info/')
          }
          tracked_install_artifacts = sorted(set(tracked) & install_artifacts)
          if tracked_install_artifacts:
              raise SystemExit('tracked install artifact mutation forbidden: ' + ', '.join(tracked_install_artifacts))
          changed = all_changed - install_artifacts
          unexpected = sorted(changed - required)
          missing = sorted(required - changed)
          print('IGNORED_UNTRACKED_INSTALL_ARTIFACTS=' + '\\n'.join(sorted(install_artifacts)))
          if unexpected:
