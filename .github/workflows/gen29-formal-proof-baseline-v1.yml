name: gen29-formal-proof-lifecycle-consume-v1

on:
  push:
    branches:
      - work/gen29-formal-proof-execute-precommit-v1
    paths:
      - .github/workflows/gen29-formal-proof-baseline-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact frozen lifecycle inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "LIFECYCLE_CONSUME_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object .continual/work-model/invocations/invoke-7f53acc04154a015c5e8dcb1/request.json)" = "3701a16f284ea7af43eeae35c0d5dc557c302a3d"
          test "$(git hash-object .continual/runs/run-work-recovery-gen9-durability-repair/invocations/invoke-7276e562993c76fdcf772759.json)" = "0ca03ab363676a597515d136a99b0f6bc6efda3b"
          test "$(git hash-object .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/execute-output.json)" = "30c1930ae788e3d2b7c6b6762f5fd45683ee562a"
          test "$(git hash-object .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/proof-verification-receipt.json)" = "b099ba7292e2f0ada6b59492eb23fa1b737a1877"
          test "$(git hash-object .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1-result.json)" = "a27362930779f3202773baeadb291865b03587bd"
          PYTHONPATH=src python -m continual.cli --root . work-pending --run-id run-work-recovery-gen9-durability-repair > pending-before.json
          python - <<'PY'
          import json
          pending=json.load(open("pending-before.json"))["pending"]
          assert len(pending)==1, pending
          assert pending[0]["invocation_id"]=="invoke-7f53acc04154a015c5e8dcb1", pending
          assert pending[0]["component"]=="execute", pending
          PY

      - name: Submit immutable Execute response and resume native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m continual.cli --root . work-submit invoke-7f53acc04154a015c5e8dcb1 \
            --response .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/execute-output.json \
            --model-identity chatgpt-work-model-unverified > submitted-response.json
          PYTHONPATH=src python -m continual.cli --root . work-resume run-work-recovery-gen9-durability-repair \
            --max-steps 64 \
            --model-identity chatgpt-work-model-unverified > resume-result.json
          PYTHONPATH=src python -m continual.cli --root . work-verify \
            --run-id run-work-recovery-gen9-durability-repair > work-verify.json

      - name: Require completed Execute and unique Task Evaluate successor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          response=json.loads(Path(".continual/work-model/invocations/invoke-7f53acc04154a015c5e8dcb1/response.json").read_text())
          assert response["invocation_id"]=="invoke-7f53acc04154a015c5e8dcb1"
          assert response["output"]["result"]["bounded_result"]=="SOLVED"
          native=json.loads(Path(".continual/runs/run-work-recovery-gen9-durability-repair/invocations/invoke-7276e562993c76fdcf772759.json").read_text())
          assert native["status"]=="complete", native
          assert native["component"]=="execute", native
          snapshot=json.loads(Path(".continual/runs/run-work-recovery-gen9-durability-repair/snapshot.json").read_text())
          assert snapshot["phase"]=="unit_pending", snapshot
          assert snapshot["current_component"]=="task_evaluate", snapshot
          assert snapshot["current_unit"]=="unit-generation29-evaluate-external-formal-proof-synthesis-v1", snapshot
          assert snapshot["status"]=="running", snapshot
          pending=json.load(open("resume-result.json"))["pending"]
          assert len(pending)==1, pending
          assert pending[0]["component"]=="candidate_evaluate", pending
          assert pending[0]["payload"]["mode"]=="pre-application", pending
          assert pending[0]["payload"]["target_component"]=="task_evaluate", pending
          verify=json.load(open("work-verify.json"))
          assert verify["valid"] is True, verify
          print("EXECUTE_CONSUMED_TASK_EVALUATE_SCHEDULED",
                response["response_digest"], pending[0]["invocation_id"],
                snapshot["revision"])
          PY

      - name: Commit exact lifecycle effects
        shell: bash
        run: |
          set -euo pipefail
          rm -f pending-before.json submitted-response.json resume-result.json work-verify.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .continual/work-model/invocations .continual/runs/run-work-recovery-gen9-durability-repair
          test -n "$(git status --porcelain)"
          git commit -m "o-work: consume formal-proof Execute and schedule Evaluate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
