name: gen29-formal-proof-verification-v1

on:
  push:
    branches:
      - work/gen29-formal-proof-execute-precommit-v1
    paths:
      - .github/workflows/gen29-formal-proof-baseline-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Sparse checkout frozen upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aimmerwahr/lean-math-exercises.git external
          git -C external sparse-checkout init --no-cone
          {
            echo "/lean-toolchain"
            echo "/lakefile.toml"
            echo "/lake-manifest.json"
            echo "/LICENSE"
            echo "/Exercises/Analysis/01OrderCompleteness.lean"
          } > external/.git/info/sparse-checkout
          git -C external checkout ef9d2506ecf03bb3338e59d33edded195d94a9be
          test "$(git -C external rev-parse HEAD)" = "ef9d2506ecf03bb3338e59d33edded195d94a9be"
          test "$(git -C external hash-object LICENSE)" = "e96cb121c4f899640c741149fd80f1293b377eac"
          test "$(git -C external hash-object lean-toolchain)" = "fd85b262bf1c734663aa8292b0101f672168788f"
          test "$(git -C external hash-object lakefile.toml)" = "8c225ae03f6eeebfc75a3a9dad604b419a012470"
          test "$(git -C external hash-object lake-manifest.json)" = "79c3014a9dfd92cc1516b1c08554d59431dcf2c7"
          test "$(git -C external hash-object Exercises/Analysis/01OrderCompleteness.lean)" = "b1472e9b72df28045f33d0270f860ce793ffbd5e"
          test ! -e external/Solutions
          test ! -e external/Meta/Checks
          cp external/Exercises/Analysis/01OrderCompleteness.lean pristine.lean

      - name: Install exact Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: external
          auto-config: false
          use-github-cache: false

      - name: Fetch frozen dependencies without solution paths
        working-directory: external
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "4851ebd9bfe9aae548388b92ebd13ded9332abba"
          test ! -e Solutions
          test ! -e Meta/Checks

      - name: Apply committed candidate proof
        working-directory: external
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("Exercises/Analysis/01OrderCompleteness.lean")
          artifact = Path("../.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/candidate-proof.json")
          data = json.loads(artifact.read_text())
          proof = data["proof"]
          for token in ("sorry", "admit", "axiom", "unsafe"):
              if token in proof:
                  raise SystemExit(f"forbidden candidate token: {token}")
          old = """theorem q1_integer_fractional_decomposition (x : ℝ) :
              ∃! p : ℤ × ℝ, x = (p.1 : ℝ) + p.2 ∧ 0 ≤ p.2 ∧ p.2 < 1 := by
            sorry"""
          new = old.replace("by\n  sorry", proof)
          text = source.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"selector cardinality mismatch: {text.count(old)}")
          source.write_text(text.replace(old, new, 1))
          Path("../candidate-proof.sha256").write_text(__import__("hashlib").sha256(proof.encode()).hexdigest()+"\n")
          PY
          sha256sum Exercises/Analysis/01OrderCompleteness.lean | tee ../candidate-patched-source.sha256

      - name: Require candidate proof to compile
        working-directory: external
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          lake env lean Exercises/Analysis/01OrderCompleteness.lean 2>&1 | tee candidate.log
          elapsed=$(( $(date +%s) - started ))
          ! grep -q " error:" candidate.log
          ! grep -Eq "Exercises/Analysis/01OrderCompleteness\.lean:55:.*declaration uses .*sorry" candidate.log
          test ! -e Solutions
          test ! -e Meta/Checks
          echo "CANDIDATE_PROOF_PASS elapsed_seconds=$elapsed proof_sha256=$(cat ../candidate-proof.sha256) patched_sha256=$(cut -d' ' -f1 ../candidate-patched-source.sha256)"

      - name: Require corrupted proof rejection
        working-directory: external
        shell: bash
        run: |
          set -euo pipefail
          cp ../pristine.lean Exercises/Analysis/01OrderCompleteness.lean
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Exercises/Analysis/01OrderCompleteness.lean")
          s = p.read_text()
          old = """theorem q1_integer_fractional_decomposition (x : ℝ) :
              ∃! p : ℤ × ℝ, x = (p.1 : ℝ) + p.2 ∧ 0 ≤ p.2 ∧ p.2 < 1 := by
            sorry"""
          new = old.replace("by\n  sorry", "by\n  rfl")
          if s.count(old) != 1:
              raise SystemExit("corruption selector mismatch")
          p.write_text(s.replace(old, new, 1))
          PY
          set +e
          lake env lean Exercises/Analysis/01OrderCompleteness.lean > corruption.log 2>&1
          code=$?
          set -e
          sed -n '1,80p' corruption.log
          test "$code" -ne 0
          grep -q "Exercises/Analysis/01OrderCompleteness.lean:55:2: error" corruption.log
          echo "CORRUPTED_PROOF_REJECTED exit=$code"

      - name: Require changed-statement rejection
        working-directory: external
        shell: bash
        run: |
          set -euo pipefail
          cp ../pristine.lean Exercises/Analysis/01OrderCompleteness.lean
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("Exercises/Analysis/01OrderCompleteness.lean")
          proof = json.loads(Path("../.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/candidate-proof.json").read_text())["proof"]
          s = p.read_text()
          old = """theorem q1_integer_fractional_decomposition (x : ℝ) :
              ∃! p : ℤ × ℝ, x = (p.1 : ℝ) + p.2 ∧ 0 ≤ p.2 ∧ p.2 < 1 := by
            sorry"""
          changed = old.replace("p.2 < 1 := by", "p.2 < 1 ∧ False := by").replace("by\n  sorry", proof)
          if s.count(old) != 1:
              raise SystemExit("statement mutation selector mismatch")
          p.write_text(s.replace(old, changed, 1))
          PY
          set +e
          lake env lean Exercises/Analysis/01OrderCompleteness.lean > statement-mutation.log 2>&1
          code=$?
          set -e
          sed -n '1,100p' statement-mutation.log
          test "$code" -ne 0
          grep -q "Exercises/Analysis/01OrderCompleteness.lean" statement-mutation.log
          echo "CHANGED_STATEMENT_REJECTED exit=$code mutation=append_false"

      - name: Fresh exact-source replay
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aimmerwahr/lean-math-exercises.git replay
          git -C replay sparse-checkout init --no-cone
          {
            echo "/lean-toolchain"
            echo "/lakefile.toml"
            echo "/lake-manifest.json"
            echo "/LICENSE"
            echo "/Exercises/Analysis/01OrderCompleteness.lean"
          } > replay/.git/info/sparse-checkout
          git -C replay checkout ef9d2506ecf03bb3338e59d33edded195d94a9be
          test "$(git -C replay hash-object Exercises/Analysis/01OrderCompleteness.lean)" = "b1472e9b72df28045f33d0270f860ce793ffbd5e"
          test ! -e replay/Solutions
          test ! -e replay/Meta/Checks
          cp -a external/.lake replay/.lake
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("replay/Exercises/Analysis/01OrderCompleteness.lean")
          proof = json.loads(Path(".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1/candidate-proof.json").read_text())["proof"]
          s = p.read_text()
          old = """theorem q1_integer_fractional_decomposition (x : ℝ) :
              ∃! p : ℤ × ℝ, x = (p.1 : ℝ) + p.2 ∧ 0 ≤ p.2 ∧ p.2 < 1 := by
            sorry"""
          new = old.replace("by\n  sorry", proof)
          if s.count(old) != 1:
              raise SystemExit("replay selector mismatch")
          p.write_text(s.replace(old, new, 1))
          PY
          sha256sum replay/Exercises/Analysis/01OrderCompleteness.lean | tee replay-patched-source.sha256
          test "$(cut -d' ' -f1 replay-patched-source.sha256)" = "$(cut -d' ' -f1 candidate-patched-source.sha256)"
          (cd replay && lake env lean Exercises/Analysis/01OrderCompleteness.lean > replay.log 2>&1)
          test ! -s replay/replay.log
          echo "FRESH_REPLAY_PASS patched_sha256=$(cut -d' ' -f1 replay-patched-source.sha256)"
