name: gen29 consume Root cross source data reconciliation v2
# one-shot exact frozen request consume

on:
  push:
    branches:
      - work/gen29-root-cross-source-data-reconciliation-v2

permissions:
  contents: write

concurrency:
  group: gen29-root-cross-source-data-reconciliation-v2
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-root-cross-source-data-reconciliation-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_BASE: 2372360c144d8ca49e9a4182b1015710b3a4696e
      RUNTIME_MAIN: 2372360c144d8ca49e9a4182b1015710b3a4696e
      RUNTIME_STATE_BLOB: e60371c4120c20129c3620ab8898f0f4e7e0f678
      EXPECTED_SNAPSHOT_BLOB: aee721c36907668ffd9e4e57504dcfea8753939a
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      ROOT_NATIVE_ID: invoke-61622cc42438018f9e4d5108
      ROOT_NATIVE_BLOB: cf73510a12f51793aba984e6ddae7ec53731b96f
      ROOT_WORK_ID: invoke-b26b9b21916d14afae757348
      ROOT_REQUEST_BLOB: 08f6c8aa9444c51f4fb80747b4f268dd4efa8c53
      ROOT_REQUEST_DIGEST: 51019cfcf5535798773c995e08b6071fdbb6f47d236bffee11320d44572563cc
      RESPONSE_TEMPLATE_BLOB: 38ca43d36292c54abeb968b696c2303f11f25e94
      RUN_ID: run-work-recovery-gen9-durability-repair
      UNIT_ID: unit-generation29-cross-source-data-reconciliation-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact authority and Root binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          python - <<'PY'
          import os, subprocess
          expected=['.github/workflows/gen29-root-cross-source-data-reconciliation-v2-response.json','.github/workflows/gen29-root-cross-source-data-reconciliation-v2.yml']
          observed=subprocess.check_output(['git','diff','--name-only',os.environ['EXPECTED_BASE'],'HEAD'],text=True).splitlines()
          assert observed==expected,(observed,expected)
          PY
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/state-doc.json
          test "$(jq -r .sha /tmp/state-doc.json)" = "$RUNTIME_STATE_BLOB"
          jq -r .content /tmp/state-doc.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$RUNTIME_STATE_BLOB"
          test "$(git hash-object agi/USER_INPUT_INBOX.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$ROOT_WORK_ID/request.json)" = "$ROOT_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$ROOT_NATIVE_ID.json)" = "$ROOT_NATIVE_BLOB"
          test "$(git hash-object .github/workflows/gen29-root-cross-source-data-reconciliation-v2-response.json)" = "$RESPONSE_TEMPLATE_BLOB"
          test ! -e ".continual/work-model/invocations/$ROOT_WORK_ID/response.json"
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/33483568370" > /tmp/test-run.json
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/33483568370/jobs?per_page=100" > /tmp/test-jobs.json
          jq -e '.head_sha=="c259f43441006de797d13322dba36bbd44185a73" and .status=="completed" and .conclusion=="success"' /tmp/test-run.json
          jq -e '[.jobs[]|select(.id==99778355355 or .id==99778355599 or .id==99778355609 or .id==99778355768 or .id==99788301404)|select(.status=="completed" and .conclusion=="success")]|length==5' /tmp/test-jobs.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_request,verify_work_invocations
          root=Path('.').resolve(); run=os.environ['RUN_ID']
          s=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text()); snap=json.loads((root/'.continual/runs'/run/'snapshot.json').read_text())
          req=verified_work_request(root,os.environ['ROOT_WORK_ID']); native=json.loads((root/'.continual/runs'/run/'invocations'/f"{os.environ['ROOT_NATIVE_ID']}.json").read_text())
          assert s['execution_id']=='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3' and s['lease_generation']==29
          assert hashlib.sha256(s['fence_token'].encode()).hexdigest()=='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'
          assert s['active_component']=='generation29_root_after_cross_repository_transfer_pending_native_consume'
          b=s['generation29_task_evaluate_cross_repository_repair_transfer_root_bind_v1']
          assert b['status']=='state_cas_exact_readback_verified_root_pending_native_consume' and b['exact_readback_verified'] is True
          repair=s['generation29_root_continuation_durability_repair_v1']; assert repair['status']=='state_cas_exact_readback_verified_ready_to_retry' and repair['exact_readback_verified'] is True
          e=s['exact_continuation']; assert e['status']=='remote_main_readback_verified' and e['verified_remote_readback'] is True
          assert e['pending_work_invocation_id']==os.environ['ROOT_WORK_ID'] and e['pending_native_invocation_id']==os.environ['ROOT_NATIVE_ID']
          assert e['snapshot_revision']==131 and e['pending_component']=='root'
          assert snap['revision']==131 and snap['phase']=='root_pending' and snap['current_component']=='task_evaluate'
          assert req['component']=='root' and req['request_digest']==os.environ['ROOT_REQUEST_DIGEST']
          assert native['status']=='awaiting_work_model' and native['work_invocation_id']==os.environ['ROOT_WORK_ID']
          pending=pending_work_invocations(root,run_id=run); assert len(pending)==1 and pending[0]['invocation_id']==os.environ['ROOT_WORK_ID']
          before=verify_work_invocations(root,run_id=run); assert before['valid'] is True and before['pending']==1
          Path('/tmp/before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
          PY

      - name: Record fresh Work and CI source observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.store import Store
          s=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          projection={'status':s['status'],'owner_kind':s['owner_kind'],'execution_id':s['execution_id'],'lease_generation':s['lease_generation'],'fence_token_digest':Store(Path('.')).stable_digest(s['fence_token'],length=64),'heartbeat_at':s['heartbeat_at']}
          Path('/tmp/work-projection.json').write_text(json.dumps(projection,sort_keys=True)+'\n')
          PY
          OID="$(jq -r .observation_id /tmp/work-source-prepare.json)"
          ODIG="$(jq -r .request_digest /tmp/work-source-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$OID" --request-digest "$ODIG" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          jq '{id,workflow_id,name,status,conclusion,head_sha}' /tmp/test-run.json > /tmp/test-run-projection.json
          jq '[.jobs[]|{id,name,status,conclusion}]|sort_by(.id)' /tmp/test-jobs.json > /tmp/test-jobs-projection.json
          COID="$(jq -r .observation_id /tmp/ci-source-prepare.json)"
          CDIG="$(jq -r .request_digest /tmp/ci-source-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$COID" --request-digest "$CDIG" --workflow-run /tmp/test-run-projection.json --jobs /tmp/test-jobs-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Consume Root exactly once and freeze Execute
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/gen29-root-cross-source-data-reconciliation-v2-response.json /tmp/root-output.json
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" | jq -e --arg b "$RUNTIME_STATE_BLOB" '.sha==$b'
          continual --root . work-submit "$ROOT_WORK_ID" --response /tmp/root-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/after.json

      - name: Validate exact Execute successor and receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_invocation,verify_work_invocations
          root=Path('.').resolve(); run=os.environ['RUN_ID']; nid=os.environ['ROOT_NATIVE_ID']; wid=os.environ['ROOT_WORK_ID']
          out=json.loads(Path('/tmp/root-output.json').read_text()); before=json.loads(Path('/tmp/before.json').read_text()); after=verify_work_invocations(root,run_id=run)
          expected={'valid':True,'requests':before['requests']+1,'responses':before['responses']+1,'pending':1,'native_completed':before['native_completed']+1,'native_fragments':before['native_fragments']+1,'native_local_learn':before['native_local_learn']+1}
          for k,v in expected.items(): assert after[k]==v,(k,after[k],v)
          verified=verified_work_invocation(root,wid); assert verified['output']==out
          npath=root/'.continual/runs'/run/'invocations'/f'{nid}.json'; native=json.loads(npath.read_text()); assert native['status']=='complete' and native['output']==out
          snap_path=root/'.continual/runs'/run/'snapshot.json'; snap=json.loads(snap_path.read_text())
          assert snap['revision']==132 and snap['phase']=='unit_pending' and snap['current_component']=='execute' and snap['current_unit']==os.environ['UNIT_ID']
          pending=pending_work_invocations(root,run_id=run); print('PENDING_DIAGNOSTIC='+json.dumps([{k:v.get(k) for k in ['invocation_id','component','prompt_path','request_digest']} for v in pending],sort_keys=True)); assert len(pending)==1 and pending[0]['component']=='execute'
          req=pending[0]; nwid=req['invocation_id']; nreq=f'.continual/work-model/invocations/{nwid}/request.json'; assert req['prompt_path']=='prompts/execute.md' and not (root/nreq).with_name('response.json').exists()
          awaiting=[]
          for p in (root/'.continual/runs'/run/'invocations').glob('*.json'):
            v=json.loads(p.read_text())
            if v.get('status')=='awaiting_work_model': awaiting.append((p,v))
          assert len(awaiting)==1; np,nv=awaiting[0]; assert nv['component']=='execute' and nv['work_invocation_id']==nwid and nv['work_request_digest']==req['request_digest']
          unit_ref=f'.continual/runs/{run}/execution-units/{os.environ["UNIT_ID"]}.json'; unit_path=root/unit_ref
          assert unit_path.is_file(); unit=json.loads(unit_path.read_text()); assert unit['component']=='execute' and unit['unit_id']==os.environ['UNIT_ID']
          h=lambda p:subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          response=f'.continual/work-model/invocations/{wid}/response.json'; local=f'.continual/runs/{run}/local-learn/{nid}-root.json'
          summary={'root_native_invocation_id':nid,'root_work_invocation_id':wid,'root_response_ref':response,'root_response_digest':verified['response']['response_digest'],'root_response_blob_sha':h(response),'root_native_blob_sha':h(npath),'root_fragment_ref':native['fragment_ref'],'root_fragment_blob_sha':h(native['fragment_ref']),'root_local_learn_ref':local,'root_local_learn_blob_sha':h(local),'execution_unit_ref':unit_ref,'execution_unit_blob_sha':h(unit_path),'selected_semantic_component':'execute','pending_native_invocation_id':nv['invocation_id'],'pending_native_invocation_ref':np.relative_to(root).as_posix(),'pending_native_invocation_blob_sha':h(np),'pending_work_invocation_id':nwid,'pending_request_ref':nreq,'pending_request_digest':req['request_digest'],'pending_request_blob_sha':h(nreq),'pending_preflight_component':'execute','snapshot_ref':snap_path.relative_to(root).as_posix(),'snapshot_revision':132,'snapshot_phase':'unit_pending','snapshot_blob_sha':h(snap_path),'verification':expected}
          receipt={'schema_version':1,'record_type':'generation29_root_response_and_execute_freeze_receipt','recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},'source_main_sha':os.environ['RUNTIME_MAIN'],'source_state_blob_sha':os.environ['RUNTIME_STATE_BLOB'],'source_ci_workflow_run_id':33483568370,'completed_effect':summary,'idempotency_key':f'o-work-gen29:consume-root-{wid}:freeze-cross-source-data-reconciliation-preflight:v1','request_recreated':False,'root_reinvoked':False,'resume_required':True,'next_action':'Remove one-shot files, exact-head validate and merge, bind state to the unique Execute request, consume it once, and run the bounded cross-source data reconciliation unit.'}
          rp=root/'.continual/runs'/run/'recovery-receipts'/'gen29-root-consume-cross-source-data-reconciliation-freeze-v1.json'; rp.parent.mkdir(parents=True,exist_ok=True); rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path('/tmp/paths.json').write_text(json.dumps({**summary,'receipt':rp.relative_to(root).as_posix()}))
          PY

      - name: Commit exact Root lifecycle delta
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          run=os.environ['RUN_ID']; nid=os.environ['ROOT_NATIVE_ID']; wid=os.environ['ROOT_WORK_ID']; x=json.loads(Path('/tmp/paths.json').read_text())
          wo=json.loads(Path('/tmp/work-source-prepare.json').read_text())['observation_id']; co=json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          required=[f'.continual/runs/{run}/events.jsonl',f'.continual/runs/{run}/snapshot.json',f'.continual/runs/{run}/invocations/{nid}.json',x['root_response_ref'],x['root_fragment_ref'],x['root_local_learn_ref'],x['execution_unit_ref'],x['pending_native_invocation_ref'],x['pending_request_ref'],x['receipt'],f'.continual/runs/{run}/work-source-observations/{wo}/request.json',f'.continual/runs/{run}/work-source-observations/{wo}/receipt.json',f'.continual/runs/{run}/ci-source-observations/{co}/request.json',f'.continual/runs/{run}/ci-source-observations/{co}/receipt.json']
          for p in required:
            if not Path(p).is_file(): raise SystemExit('missing '+p)
          subprocess.run(['git','add','-f','--',*required],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=set(required): raise SystemExit('staged mismatch '+json.dumps(sorted(staged^set(required))))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '[native-root-cross-source-data-reconciliation-result] gen29 select unit and freeze Execute'
          git push origin "HEAD:$GITHUB_REF_NAME"
