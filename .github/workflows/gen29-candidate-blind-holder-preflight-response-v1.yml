              "scope": "agi/heldout-protocol/blind-holder-gate-v1",
              "applicability": [
                {
                  "candidate_id": "candidate-agi-benchmark-suite-v1",
                  "decision": "DEFER",
                  "reason": "Its broad capability-evaluation scope may later consume protocol-valid evidence, but applying a benchmark suite inside this repository-local gate repair would widen the frozen unit and confound whether the ordering validator itself works."
                },
                {
                  "candidate_id": "candidate-bounded-recursive-context-retrieval-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It targets deterministic recursive Context Kernel retrieval; this unit builds a blind-holder ordering, isolation, reveal, and replay gate using synthetic controls."
                },
                {
                  "candidate_id": "candidate-c6c462472386c57b124d",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Its indexed scope is campaign authoring, not repository-local held-out protocol enforcement."
                },
                {
                  "candidate_id": "candidate-copilot-sdk-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It is active only for live genuine-model campaign migration, while this unit forbids provider execution, live routing, and production effects."
                },
                {
                  "candidate_id": "candidate-github-models-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It is rejected for live-campaign migration and cannot affect this synthetic non-production protocol-repair unit."
                },
                {
                  "candidate_id": "candidate-live-campaign-stage-isolation-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Its verified scope is live-campaign evidence-stage isolation with live-campaign dependencies. This unit instead requires a fresh predictor-isolation receipt schema and deterministic fail-closed checks without running a live campaign."
                },
                {
                  "candidate_id": "candidate-live-request-status-rendezvous-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It governs live-request status observability, not holder commitment, predictor isolation, post-response reveal, or deterministic replay."
                },
                {
                  "candidate_id": "candidate-self-application-context-hygiene-v1",
                  "decision": "DEFER",
