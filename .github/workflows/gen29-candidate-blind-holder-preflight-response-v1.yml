          continual --root . work-submit "$CANDIDATE_WORK_ID" --response /tmp/candidate-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/candidate-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate Candidate completion and exact Execute freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          candidate_native_id = os.environ['CANDIDATE_NATIVE_ID']
          candidate_work_id = os.environ['CANDIDATE_WORK_ID']
          expected_output = json.loads(Path('/tmp/candidate-output.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 109, 'responses': 108, 'pending': 1, 'native_completed': 102, 'native_fragments': 102, 'native_local_learn': 94}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_candidate = verified_work_invocation(root, candidate_work_id)
          if verified_candidate.get('output') != expected_output:
              raise SystemExit('persisted Candidate output mismatch')
          candidate_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{candidate_native_id}.json'
          candidate_native = json.loads(candidate_native_path.read_text())
