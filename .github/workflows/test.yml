name: test

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src
      - run: agi-benchmark validate-suite
      - run: agi-benchmark run-reference --output /tmp/reference-report.json
