name: test

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src
      - run: agi-benchmark validate-suite
      - run: agi-benchmark validate-workspace-suite
      - run: agi-benchmark validate-heldout-suite
      - run: agi-longhorizon validate-protocol
      - run: agi-benchmark run-reference --output /tmp/core-reference.json
      - run: agi-benchmark run-workspace-reference --output /tmp/workspace-reference.json
      - run: agi-benchmark run-heldout-reference --output /tmp/heldout-reference.json
      - run: agi-longhorizon run-reference --output-dir /tmp/longhorizon-reference
      - run: agi-benchmark run-campaign-reference --runs 2 --output-dir /tmp/reference-campaign
