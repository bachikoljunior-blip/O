name: test

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run pytest and publish bounded failure diagnostic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          pytest -q > /tmp/pytest.log 2>&1
          rc=$?
          set -e
          cat /tmp/pytest.log
          if (( rc != 0 )); then
            python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          lines = Path('/tmp/pytest.log').read_text(encoding='utf-8', errors='replace').splitlines()
          candidates = [line.strip() for line in lines if line.startswith(('FAILED ', 'ERROR '))]
          if not candidates:
              candidates = [
                  line.strip()
                  for line in lines
                  if any(token in line for token in ('Error:', 'Exception:', 'AssertionError'))
              ]
          description = (candidates[-1] if candidates else 'pytest failed; inspect exact workflow log')
          description = ' '.join(description.split())[:139]
          payload = json.dumps({
              'state': 'error',
              'context': 'diagnostic/pytest',
              'description': description,
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              response.read()
          PY
            exit "$rc"
          fi
      - run: python -m compileall -q src
      - run: agi-benchmark validate-suite
      - run: agi-benchmark validate-workspace-suite
      - run: agi-benchmark validate-heldout-suite
      - run: agi-longhorizon validate-protocol
      - run: agi-benchmark run-reference --output /tmp/core-reference.json
      - run: agi-benchmark run-workspace-reference --output /tmp/workspace-reference.json
      - run: agi-benchmark run-heldout-reference --output /tmp/heldout-reference.json
      - run: agi-longhorizon run-reference --output-dir /tmp/longhorizon-reference
      - run: agi-benchmark run-campaign-reference --runs 2 --output-dir /tmp/reference-campaign
