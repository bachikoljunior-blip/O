name: repair gen29 Root durability staging v1

on:
  push:
    branches:
      - work/gen29-root-formal-proof-synthesis-v1

permissions:
  contents: write

concurrency:
  group: repair-gen29-root-formal-proof-durability-v1
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[root-durability-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: run-work-recovery-gen9-durability-repair
      EXPECTED_HEAD: 1ef3f7c239a2334c79f1adce093d2e21c40c8cc6
      EXPECTED_MAIN: f945f369ebcf4d6ee0e527c2cd94a0f78dc85336
      ROOT_NATIVE_ID: invoke-951a8a494631b41867dc48aa
      ROOT_WORK_ID: invoke-f72ab3eeeccf55038abb9407
      SUCCESSOR_NATIVE_ID: invoke-ed94ce2e2204b683b42af73c
      SUCCESSOR_NATIVE_BLOB: 654faf52ebad711956387b28d09c742c1e155551
      SUCCESSOR_WORK_ID: invoke-41fe14117283ba173c0fb998
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Reconstruct only log-bound missing durability files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from continual.store import Store
          from continual.work_session import verify_work_invocations, verified_work_request
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']
          root_native_path=root/'.continual/runs'/run_id/'invocations'/f"{os.environ['ROOT_NATIVE_ID']}.json"
          root_native=json.loads(root_native_path.read_text())
          if root_native.get('status')!='complete' or root_native.get('work_invocation_id')!=os.environ['ROOT_WORK_ID']:
              raise SystemExit('completed Root mismatch')
          successor=verified_work_request(root,os.environ['SUCCESSOR_WORK_ID'])
          if successor.get('component')!='candidate_evaluate' or successor.get('request_digest')!='0460c645a61533258a54b53a1d487cb01f235c3df81d926fe1e71a1893a27ef3':
              raise SystemExit('successor request mismatch')
          missing=[
            root/'.continual/runs'/run_id/'fragments'/f"{os.environ['ROOT_NATIVE_ID']}-root.json",
            root/'.continual/runs'/run_id/'local-learn'/f"{os.environ['ROOT_NATIVE_ID']}-root.json",
            root/'.continual/runs'/run_id/'invocations'/f"{os.environ['SUCCESSOR_NATIVE_ID']}.json",
            root/'.continual/runs'/run_id/'recovery-receipts/gen29-root-cross-source-consume-formal-proof-successor-v1.json',
          ]
          if any(p.exists() for p in missing): raise SystemExit('repair target unexpectedly exists')
          fragment={
            'component':'root',
            'environment':{
              'active_components_digest':'3974833d170f43432c948095',
              'model':'chatgpt-work-model-unverified',
              'os':'Linux-6.17.0-1022-azure-x86_64-with-glibc2.39',
              'python':'3.11.16',
              'repository_commit':'ce9696f6a5f2504e1ddbd24a09177a0b3c5cde07',
              'runner':'python-engine-v2',
            },
            'invocation_id':os.environ['ROOT_NATIVE_ID'],
            'observations':root_native['output']['fragment']['observations'],
          }
          local=root_native['output']['local_learn']
          native={
            'attempt':1,
            'component':'candidate_evaluate',
            'invocation_id':os.environ['SUCCESSOR_NATIVE_ID'],
            'payload_digest':Store(root).stable_digest(successor['payload'],length=24),
            'prompt_path':'prompts/candidate_evaluate.md',
            'started_at':None,
            'status':'awaiting_work_model',
            'work_invocation_id':os.environ['SUCCESSOR_WORK_ID'],
            'work_request_digest':successor['request_digest'],
            'work_request_ref':f".continual/work-model/invocations/{os.environ['SUCCESSOR_WORK_ID']}/request.json",
          }
          receipt={
            'agi_achieved':False,
            'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d','lease_generation':29},
            'completed_effect':{'component':'root','native_invocation_id':os.environ['ROOT_NATIVE_ID'],'request_blob_sha':'825b731e015741c92021c7da914d0aaf3fdc74b4','request_digest':'fe0caaa7ff344a4b8985846fb420364de729dd7589dbb022152c35a87ef5a5cf','response_blob_sha':'d7c56f6ec23ae1fa461f2f6db916660036770f28','response_digest':'7f6359a6f4ccae2267d439f71f81c1e1acd8d2d28605a25d5ce34f549e01022f','response_ref':f".continual/work-model/invocations/{os.environ['ROOT_WORK_ID']}/response.json",'unit_id':'unit-generation29-external-formal-proof-synthesis-v1','work_invocation_id':os.environ['ROOT_WORK_ID']},
            'idempotency_key':'o-work-gen29:consume-root-invoke-f72ab3eeeccf55038abb9407:freeze-formal-proof-successor:revision38:v1',
            'next_action':'Publish exact Root lifecycle through protected CI and expected-head merge, bind state, then consume the unique formal-proof successor exactly once.',
            'pending_successor':{'component':'candidate_evaluate','native_blob_sha':os.environ['SUCCESSOR_NATIVE_BLOB'],'native_invocation_id':os.environ['SUCCESSOR_NATIVE_ID'],'native_ref':f".continual/runs/{run_id}/invocations/{os.environ['SUCCESSOR_NATIVE_ID']}.json",'request_blob_sha':'44ebfd3cacf195f5ddf1c763bcf2502069c87ae3','request_digest':'0460c645a61533258a54b53a1d487cb01f235c3df81d926fe1e71a1893a27ef3','request_ref':f".continual/work-model/invocations/{os.environ['SUCCESSOR_WORK_ID']}/request.json",'snapshot_blob_sha':'f85c5321c44b004c1bd01f9f7441be08b0c2b9eb','snapshot_phase':'unit_pending','snapshot_ref':f'.continual/runs/{run_id}/snapshot.json','snapshot_revision':137,'work_invocation_id':os.environ['SUCCESSOR_WORK_ID']},
            'record_type':'generation29_root_consume_receipt','recorded_at':'2026-09-01T17:18:55.228138Z','request_recreated':False,'response_repeated':False,'resume_required':True,'schema_version':1,'source_ci_workflow_run_id':33532115535,'source_main_sha':os.environ['EXPECTED_MAIN'],'source_state_blob_sha':'b333a7ff2a99b675a3500b885e5d34faf446c726','upper_objective_achieved':False,
          }
          values=[fragment,local,native,receipt]
          for p,v in zip(missing,values):
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          observed=subprocess.check_output(['git','hash-object',str(missing[2])],text=True).strip()
          if observed!=os.environ['SUCCESSOR_NATIVE_BLOB']: raise SystemExit(f'native recurrence mismatch {observed}')
          after=verify_work_invocations(root,run_id=run_id)
          expected={'valid':True,'requests':149,'responses':148,'pending':1,'native_completed':142,'native_fragments':142,'native_local_learn':129}
          for k,v in expected.items():
            if after.get(k)!=v: raise SystemExit(f'after repair mismatch {k}: {after.get(k)} != {v}')
          Path('/tmp/repair-paths.txt').write_text('\n'.join(str(p.relative_to(root)) for p in missing)+'\n')
          print(json.dumps({'repaired':[str(p.relative_to(root)) for p in missing],'verification':after,'native_blob':observed},sort_keys=True))
          PY
          mapfile -t PATHS < /tmp/repair-paths.txt
          git add -f -- "${PATHS[@]}"
          test "$(git diff --cached --name-only | wc -l)" = 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[root-durability-repair] persist exact missing Root lifecycle files'
          git push origin "HEAD:$GITHUB_REF_NAME"
