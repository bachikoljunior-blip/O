      - name: Validate Candidate consume and exact Task Evaluate freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          candidate_native_id = os.environ['CANDIDATE_NATIVE_ID']
          candidate_work_id = os.environ['CANDIDATE_WORK_ID']
          expected_output = json.loads(Path('/tmp/candidate-output.json').read_text())
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          expected_before = {
              'valid': True, 'requests': 87, 'responses': 86, 'pending': 1,
              'native_completed': 80, 'native_fragments': 80, 'native_local_learn': 74,
          }
          for key, value in expected_before.items():
              if before.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {before.get(key)!r}')
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {
              'valid': True, 'requests': 88, 'responses': 87, 'pending': 1,
              'native_completed': 81, 'native_fragments': 81, 'native_local_learn': 75,
          }
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after verification mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_candidate = verified_work_invocation(root, candidate_work_id)
          if verified_candidate.get('output') != expected_output:
              raise SystemExit('persisted Candidate output differs from exact submitted output')
          candidate_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{candidate_native_id}.json'
          candidate_native = json.loads(candidate_native_path.read_text())
          if candidate_native.get('status') != 'complete' or candidate_native.get('component') != 'candidate_evaluate':
              raise SystemExit('Candidate native journal is not complete')
          if candidate_native.get('output') != expected_output:
              raise SystemExit('Candidate native output mismatch')
          snapshot_path = root / '.continual' / 'runs' / run_id / 'snapshot.json'
          if subprocess.check_output(['git', 'hash-object', str(snapshot_path)], text=True).strip() != os.environ['EXPECTED_SNAPSHOT_BLOB']:
              raise SystemExit('revision95 snapshot changed while only preflight was consumed')
          unit_path = root / '.continual' / 'runs' / run_id / 'execution-units' / f"{os.environ['RESULT_UNIT_ID']}.json"
          unit = json.loads(unit_path.read_text())
          matches = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'preflight').glob('preflight-task_evaluate-*.json')):
              if json.loads(path.read_text()) == expected_output:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f'expected one exact Task Evaluate preflight output, got {len(matches)}')
          preflight_path = matches[0]
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one Task Evaluate request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'task_evaluate':
              raise SystemExit('next pending request is not Task Evaluate')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Task Evaluate request identity mismatch')
          payload = request.get('payload', {})
          if payload.get('execution_unit') != unit:
              raise SystemExit('Task Evaluate request did not bind exact selected unit')
          if payload.get('preflight_selection', {}).get('decision') != 'TRIAL_CANDIDATE':
              raise SystemExit('Task Evaluate request did not retain trial decision')
          candidate = payload.get('candidate', {})
          if candidate.get('candidate_id') != 'candidate-task-evaluate-unit-verdict-v1' or candidate.get('prompt_mode') != 'overlay':
              raise SystemExit('Task Evaluate request candidate binding mismatch')
          clocks = payload.get('decision_context', {}).get('source_clock', {})
          if clocks.get('user_input_inbox', {}).get('version') != 'revision:35':
              raise SystemExit('Task Evaluate request inbox clock mismatch')
          if clocks.get('native_run_snapshot', {}).get('version') != 'revision:95':
              raise SystemExit('Task Evaluate request snapshot clock mismatch')
          work_id = request['invocation_id']
          request_rel = f'.continual/work-model/invocations/{work_id}/request.json'
          if (root / request_rel).with_name('response.json').exists():
              raise SystemExit('Task Evaluate request already has a response')
          prompt_ref = request.get('prompt_path')
          if not isinstance(prompt_ref, str) or not prompt_ref.startswith(f'.continual/runs/{run_id}/effective-prompts/task_evaluate-candidate-task-evaluate-unit-verdict-v1-'):
              raise SystemExit('Task Evaluate effective prompt binding mismatch')
          prompt_path = root / prompt_ref
          prompt_text = prompt_path.read_text()
          if '# Scoped Candidate overlay' not in prompt_text or 'unit_verdict' not in prompt_text:
              raise SystemExit('Task Evaluate effective prompt lost scoped overlay')
          awaiting = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append((path, value))
          if len(awaiting) != 1:
              raise SystemExit(f'expected one awaiting Task Evaluate native journal, got {len(awaiting)}')
          native_path, native = awaiting[0]
          if native.get('component') != 'task_evaluate' or native.get('work_invocation_id') != work_id:
              raise SystemExit('Task Evaluate native-to-Work identity mismatch')
          if native.get('work_request_digest') != request.get('request_digest') or native.get('work_request_ref') != request_rel:
              raise SystemExit('Task Evaluate native-to-Work digest/ref mismatch')
          response_rel = f'.continual/work-model/invocations/{candidate_work_id}/response.json'
          fragment_rel = candidate_native['fragment_ref']
          local_learn_rel = f'.continual/runs/{run_id}/local-learn/{candidate_native_id}-candidate_evaluate.json'
          summary = {
              'candidate_native_invocation_id': candidate_native_id,
              'candidate_work_invocation_id': candidate_work_id,
              'candidate_response_ref': response_rel,
              'candidate_response_digest': verified_candidate['response']['response_digest'],
              'candidate_response_blob_sha': subprocess.check_output(['git', 'hash-object', response_rel], text=True).strip(),
              'candidate_native_blob_sha': subprocess.check_output(['git', 'hash-object', str(candidate_native_path)], text=True).strip(),
              'candidate_fragment_ref': fragment_rel,
              'candidate_fragment_blob_sha': subprocess.check_output(['git', 'hash-object', fragment_rel], text=True).strip(),
              'candidate_local_learn_ref': local_learn_rel,
              'candidate_local_learn_blob_sha': subprocess.check_output(['git', 'hash-object', local_learn_rel], text=True).strip(),
              'semantic_preflight_ref': preflight_path.relative_to(root).as_posix(),
              'semantic_preflight_blob_sha': subprocess.check_output(['git', 'hash-object', str(preflight_path)], text=True).strip(),
              'effective_prompt_ref': prompt_ref,
              'effective_prompt_blob_sha': subprocess.check_output(['git', 'hash-object', str(prompt_path)], text=True).strip(),
              'pending_native_invocation_id': native['invocation_id'],
              'pending_native_invocation_ref': native_path.relative_to(root).as_posix(),
              'pending_native_invocation_blob_sha': subprocess.check_output(['git', 'hash-object', str(native_path)], text=True).strip(),
              'pending_work_invocation_id': work_id,
              'pending_request_ref': request_rel,
              'pending_request_digest': request['request_digest'],
              'pending_request_blob_sha': subprocess.check_output(['git', 'hash-object', request_rel], text=True).strip(),
              'pending_component': 'task_evaluate',
              'selected_candidate_id': 'candidate-task-evaluate-unit-verdict-v1',
              'snapshot_revision': 95,
              'snapshot_phase': 'unit_pending',
              'snapshot_blob_sha': os.environ['EXPECTED_SNAPSHOT_BLOB'],
              'verification': expected_after,
          }
          Path('/tmp/candidate-consume-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-candidate-preflight-consume-task-evaluate-freeze-v1.json'
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_candidate_preflight_consume_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': os.environ['RUNTIME_MAIN'],
              'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': int(os.environ['SOURCE_CI_RUN_ID']),
              'idempotency_key': 'o-work-gen29:consume-candidate-preflight-invoke-6fefa64dcaa56548bf1c3de0:freeze-task-evaluate:v1',
              'completed_effect': summary,
              'request_recreated': False,
              'candidate_reinvoked': False,
              'resume_required': True,
              'next_action': 'Exact-head validate and merge this Candidate preflight response plus Task Evaluate freeze, bind state, then answer the exact Task Evaluate request once.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print('CANDIDATE_CONSUME=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Stage only exact Candidate lifecycle delta and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          candidate_native_id = os.environ['CANDIDATE_NATIVE_ID']
          candidate_work_id = os.environ['CANDIDATE_WORK_ID']
          summary = json.loads(Path('/tmp/candidate-consume-summary.json').read_text())
          work_obs = json.loads(Path('/tmp/work-source-prepare.json').read_text())['observation_id']
          ci_obs = json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-candidate-preflight-consume-task-evaluate-freeze-v1.json'
          expected_status = {
              f'.continual/runs/{run_id}/events.jsonl': 'M',
              f'.continual/runs/{run_id}/invocations/{candidate_native_id}.json': 'M',
              f'.continual/work-model/invocations/{candidate_work_id}/response.json': 'A',
              summary['candidate_fragment_ref']: 'A',
              summary['candidate_local_learn_ref']: 'A',
              summary['semantic_preflight_ref']: 'A',
              summary['pending_native_invocation_ref']: 'A',
              summary['pending_request_ref']: 'A',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json': 'A',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json': 'A',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json': 'A',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json': 'A',
              receipt_rel: 'A',
          }
          status = {}
          for line in subprocess.check_output(['git', 'diff', '--name-status'], text=True).splitlines():
              code, path = line.split('\t', 1)
              status[path] = code
          normal = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          ignored = subprocess.check_output(['git', 'ls-files', '--others', '--ignored', '--exclude-standard'], text=True).splitlines()
          for path in normal + ignored:
              status.setdefault(path, 'A')
          install_artifacts = {
              path for path in status
              if path.startswith('src/agi/__pycache__/')
              or path.startswith('src/continual/__pycache__/')
              or path.startswith('src/continual_chatgpt.egg-info/')
          }
          for path in install_artifacts:
              status.pop(path, None)
          preflight_prefix = f'.continual/runs/{run_id}/preflight/preflight-'
          preflight_paths = sorted(
              path for path, code in status.items()
              if path.startswith(preflight_prefix) and path.endswith('.json') and code == 'A'
          )
          if summary['semantic_preflight_ref'] not in preflight_paths:
              raise SystemExit('semantic Task Evaluate preflight is not a new exact artifact')
          for path in preflight_paths:
              expected_status[path] = 'A'
          effective = summary['effective_prompt_ref']
          if status.get(effective) == 'A':
              expected_status[effective] = 'A'
          elif effective in status:
              raise SystemExit('effective prompt changed unexpectedly')
          if status != expected_status:
              raise SystemExit('lifecycle mutation mismatch: ' + json.dumps({
                  'expected': expected_status,
                  'observed': status,
                  'missing': sorted(set(expected_status) - set(status)),
                  'unexpected': sorted(set(status) - set(expected_status)),
              }, sort_keys=True))
          required = sorted(expected_status)
          for path in required:
              if not Path(path).is_file():
                  raise SystemExit('required lifecycle path missing: ' + path)
          subprocess.run(['git', 'add', '-f', '--', *required], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != set(required):
              raise SystemExit('staged lifecycle set mismatch')
          immutable = sorted(path for path in staged if path.startswith('.continual/work-model/invocations/'))
          expected_immutable = sorted([
              f'.continual/work-model/invocations/{candidate_work_id}/response.json',
              summary['pending_request_ref'],
          ])
          if immutable != expected_immutable:
              raise SystemExit('immutable Work mutation set mismatch: ' + json.dumps(immutable))
          print('STAGED_PATHS=' + '\n'.join(required))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-candidate-preflight-result] gen29 consume Candidate preflight and freeze Task Evaluate'
          git push origin "HEAD:$GITHUB_REF_NAME"
