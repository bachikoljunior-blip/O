name: apply-agent-bundle-v3

on:
  push:
    branches: [agent/agi-workspace-campaign-v3]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage AGI v0.3 bundle chunk 06')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/agi-workspace-campaign-v3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-bundle-v3/chunk-* | base64 -d > /tmp/agi-v3.tar.gz
          echo "bc97e786034efd35d0155c55522f6b3201e92b275bf7d07cd360973408c4a059  /tmp/agi-v3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agi-v3.tar.gz
          rm -rf .agent-bundle-v3
      - name: Validate v0.3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          pytest -q
          python -m compileall -q src
          agi-benchmark validate-suite
          agi-benchmark validate-workspace-suite
          agi-benchmark run-reference --output /tmp/core-reference.json
          agi-benchmark run-workspace-reference --output /tmp/workspace-reference.json
          agi-benchmark run-campaign-reference --runs 2 --output-dir /tmp/reference-campaign
          rm -rf src/continual_chatgpt.egg-info
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "O continual agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ':!.github/workflows/apply-agent-bundle-v3.yml'
          git commit -m "Build tool-mediated AGI development campaign v0.3"
          git push origin HEAD:agent/agi-workspace-campaign-v3
