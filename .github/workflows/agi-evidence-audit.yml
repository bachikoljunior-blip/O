name: AGI evidence audit

on:
  push:
    branches: [main]
    paths:
      - 'src/agi/**'
      - 'tests/test_agi_*.py'
      - 'evidence/**'
      - '.github/workflows/agi-evidence-audit.yml'
  pull_request:
    paths:
      - 'src/agi/**'
      - 'tests/test_agi_*.py'
      - 'evidence/**'
      - '.github/workflows/agi-evidence-audit.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agi-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest
      - name: Verify provenance and regression gates
        run: pytest -q tests/test_agi_provenance.py tests/test_agi_regression.py
      - name: Audit committed evidence ledger
        run: >-
          python -m agi.provenance audit evidence/ledger.json
          --registry evidence/verifiers.json
          --output agi-evidence-audit.json
          --require-clean-ledger
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: agi-evidence-audit-${{ github.run_id }}
          path: agi-evidence-audit.json
          if-no-files-found: error
          retention-days: 90
