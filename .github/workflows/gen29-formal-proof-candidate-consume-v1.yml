name: gen29 consume formal-proof Candidate Evaluate and freeze Task Evaluate

on:
  push:
    branches:
      - work/gen29-formal-proof-task-evaluate-v1
    paths:
      - .github/workflows/gen29-formal-proof-candidate-consume-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen29-formal-proof-candidate-consume-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-formal-proof-task-evaluate-frozen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN: 43797dfd01686ece3a3cdd9aa4e01f0164daee3f
      EXPECTED_STATE_BLOB: d5e9cb7a65a6e8053d0f55d35ce56cfcbe167655
      RUN_ID: run-work-recovery-gen9-durability-repair
      CAND_NATIVE_ID: invoke-33e60b195ac9c3ad911e4dd4
      CAND_WORK_ID: invoke-30ecaff11dc4ceb278ad5ac6
      CAND_REQUEST_DIGEST: 109ecda329ef556b433d5d7033f83150efbeff3535abd3dc0a16d5e79ffd6381
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Verify authority and exact frozen Candidate Evaluate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$CAND_WORK_ID/request.json)" = "552ca9b9fbc403f6e0cc34fcce171eb3d84153e3"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$CAND_NATIVE_ID.json)" = "f9ab6a3a0ee3a1fe3741c7e75cd543af4dbb3b8d"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "cc17d0a358b4f6e7a605519e2d7f7470fd3e155f"
          PYTHONPATH=src python -m continual.cli --root . work-pending --run-id "$RUN_ID" > /tmp/pending-before.json
          PYTHONPATH=src python -m continual.cli --root . work-verify --run-id "$RUN_ID" > /tmp/verify-before.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          assert state['status']=='running'
          assert state['execution_id']=='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3'
          assert state['lease_generation']==29
          assert hashlib.sha256(state['fence_token'].encode()).hexdigest()=='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'
          assert state['pending_work_invocation_id']==os.environ['CAND_WORK_ID']
          assert state['pending_native_invocation_id']==os.environ['CAND_NATIVE_ID']
          assert state['pending_request_digest']==os.environ['CAND_REQUEST_DIGEST']
          assert state['finalization_readback_verified'] is True
          assert state['exact_continuation']['status']=='remote_main_readback_verified'
          p=json.load(open('/tmp/pending-before.json'))['pending']
          assert len(p)==1 and p[0]['invocation_id']==os.environ['CAND_WORK_ID'], p
          assert p[0]['component']=='candidate_evaluate', p
          assert p[0]['payload']['mode']=='pre-application', p
          assert p[0]['payload']['target_component']=='task_evaluate', p
          v=json.load(open('/tmp/verify-before.json'))
          assert v['valid'] is True and v['pending']==1, v
          PY
      - name: Record fresh authoritative Work source observation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.store import Store
          from continual.work_source_observation import prepare_work_source_observation,record_work_source_observation_receipt,verify_work_source_observation
          root=Path('.').resolve();run_id=os.environ['RUN_ID']
          state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text())
          request=prepare_work_source_observation(root,run_id=run_id,state=state,state_blob_sha=os.environ['EXPECTED_STATE_BLOB'],expected_commit_sha=os.environ['EXPECTED_MAIN'],model_identity=os.environ['MODEL_IDENTITY'])
          headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+os.environ['GITHUB_TOKEN']}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:return json.load(response)
          branch=get('https://api.github.com/repos/bachikoljunior-blip/O/branches/main')
          remote=get('https://api.github.com/repos/bachikoljunior-blip/O/contents/agi/WORK_EXECUTION_STATE.json?ref=main')
          assert branch['commit']['sha']==os.environ['EXPECTED_MAIN']
          assert remote['sha']==os.environ['EXPECTED_STATE_BLOB']
          remote_state=json.loads(base64.b64decode(remote['content']).decode())
          store=Store(root)
          projection={'status':remote_state['status'],'owner_kind':remote_state['owner_kind'],'execution_id':remote_state['execution_id'],'lease_generation':remote_state['lease_generation'],'fence_token_digest':store.stable_digest(remote_state['fence_token'],length=64),'heartbeat_at':remote_state['heartbeat_at']}
          observed_at=datetime.now(UTC).isoformat().replace('+00:00','Z')
          receipt=record_work_source_observation_receipt(root,run_id=run_id,observation_id=request['observation_id'],request_digest=request['request_digest'],executor_binding=state['authoritative_source_observation_policy']['executor_binding'],model_identity=os.environ['MODEL_IDENTITY'],commit_sha=branch['commit']['sha'],blob_sha=remote['sha'],projection=projection,observed_at=observed_at)
          verified=verify_work_source_observation(root,run_id=run_id,state=state,state_blob_sha=os.environ['EXPECTED_STATE_BLOB'],now=observed_at)
          assert verified['observation_id']==request['observation_id']
          print(json.dumps({'request':request,'receipt':receipt,'verified':verified},sort_keys=True))
          PY
      - name: Record fresh exact CI source observation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.ci_source_observation import prepare_ci_source_observation,record_ci_source_observation_receipt,verify_ci_source_observation
          root=Path('.').resolve();run_id=os.environ['RUN_ID']
          state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text())
          request=prepare_ci_source_observation(root,run_id=run_id,state=state,model_identity=os.environ['MODEL_IDENTITY'])
          headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+os.environ['GITHUB_TOKEN']}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:return json.load(response)
          policy=state['ci_source_observation_policy'];rid=policy['workflow_run_id']
          remote_run=get(f'https://api.github.com/repos/bachikoljunior-blip/O/actions/runs/{rid}')
          remote_jobs=get(f'https://api.github.com/repos/bachikoljunior-blip/O/actions/runs/{rid}/jobs?per_page=100')['jobs']
          required={v['id'] for v in policy['required_jobs']}
          jobs=[{'id':v['id'],'name':v['name'],'status':v['status'],'conclusion':v['conclusion']} for v in remote_jobs if v['id'] in required]
          run_projection={'id':remote_run['id'],'workflow_id':remote_run['workflow_id'],'name':remote_run['name'],'status':remote_run['status'],'conclusion':remote_run['conclusion'],'head_sha':remote_run['head_sha']}
          observed_at=datetime.now(UTC).isoformat().replace('+00:00','Z')
          receipt=record_ci_source_observation_receipt(root,run_id=run_id,observation_id=request['observation_id'],request_digest=request['request_digest'],executor_binding=policy['executor_binding'],model_identity=os.environ['MODEL_IDENTITY'],workflow_run=run_projection,jobs=jobs,observed_at=observed_at)
          verified=verify_ci_source_observation(root,run_id=run_id,state=state,now=observed_at)
          assert verified['observation_id']==request['observation_id']
          print(json.dumps({'request':request,'receipt':receipt,'verified':verified},sort_keys=True))
          PY
      - name: Submit Candidate baseline response and freeze Task Evaluate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidate-output.json <<'CANDJSON'
          {
            "fragment": {
              "component": "candidate_evaluate",
              "mode": "pre-application",
              "unit_id": "unit-generation29-evaluate-external-formal-proof-synthesis-v1",
              "selected_strategy": "unchanged active Task Evaluate prompt with independent bounded and original-goal verdicts",
              "candidate_activation": false,
              "claim_boundary": "This chooses the active Task Evaluate baseline for one exact formal-proof unit. It does not activate a Candidate or establish generalized theorem proving, production readiness, AGI, upper-objective achievement, user-level completion, or monitor completion.",
              "continuation": "Independently Task Evaluate the exact bounded formal-proof evidence after protected exact-head CI, expected-head merge, and remote readback; then continue Candidate Evaluate, Consolidate Episode, Learn, Root, and materially different safe work."
            },
            "local_learn": {
              "candidates": [],
              "decision": "NO_CHANGE",
              "observations": [
                "The unit-verdict overlay is directionally applicable to Task Evaluate but is not verified for this exact formal-proof evaluation scope.",
                "The Candidate remains status candidate and its closest scope states are PROPOSE_ACTIVATION, which does not authorize activation.",
                "The frozen Task Evaluate unit already requires independent bounded, upper-objective, user-level, Candidate, and AGI verdicts, so the active prompt preserves the needed claim separation without confounding the baseline."
              ]
            },
            "result": {
              "decision": "BASELINE_FIRST",
              "evaluated_candidate_id": "candidate-task-evaluate-unit-verdict-v1",
              "scope": "agi/capability-evaluation/external-formal-proof-synthesis-v1/task-evaluate; exact frozen theorem only",
              "candidate_activation": false,
              "global_activation_authorized": false,
              "agi_claim_supported": false,
              "upper_objective_achieved": false,
              "user_level_objective_met": false,
              "applicability": [
                {
                  "candidate_id": "candidate-task-evaluate-unit-verdict-v1",
                  "decision": "BASELINE_FIRST",
                  "reason": "It targets Task Evaluate and its dual-verdict behavior is relevant, but it is not VERIFIED_FOR_SCOPE for this exact formal-proof evaluation and remains only PROPOSE_ACTIVATION in its closest scopes. Use the unchanged active prompt and collect an exact protected baseline before any activation decision."
                }
              ],
              "baseline": "Use the unchanged active Task Evaluate prompt. Independently verify precommit ordering, immutable identities, contamination exclusions, failing sentinel baseline, candidate and replay compilation, rejection of both negative controls, zero upstream writes, protected exact-head CI, expected-head merge, and exact remote artifact readbacks. Return the original-task verdict separately from the bounded-unit verdict without widening either claim.",
              "evidence_to_collect": [
                "precommit, source-readiness, baseline, candidate-proof, verification, result, and lifecycle artifacts with exact Git blob readbacks",
                "upstream commit and source blob, exact Lean toolchain and mathlib commit, proof and patched-source SHA-256 identities",
                "candidate compilation, corrupted-proof rejection, changed-statement rejection, clean immutable-source replay, and zero-upstream-write audit",
                "protected final PR-head CI, expected-head merge commit, and post-merge exact remote readbacks",
                "separate bounded-unit, original-task, upper-objective, user-level, Candidate-activation, and AGI verdicts with negative evidence"
              ],
              "regression_checks": [
                "no selector, theorem, statement, import, toolchain, proof, budget, or contamination rule drifts",
                "no solution file, Meta/Checks, later answer-bearing commit, sorry, admit, axiom, unsafe escape, theorem weakening, or external proof service is used",
                "candidate and fresh replay compile while both precommitted controls fail closed",
                "final protected CI binds the exact expected PR head and merge rejects head drift",
                "a bounded SOLVED/PASS result is never widened into generalized capability, Candidate activation, production readiness, AGI, or completion"
              ],
              "rollback": "On identity drift, contamination, compilation failure, control acceptance, replay mismatch, CI failure, head mismatch, merge failure, or readback mismatch, preserve the frozen request and negative evidence, return FAIL or UNCERTAIN for only the bounded unit as supported, activate no Candidate, repair the concrete cause, and rerun the strongest exact recurrence check.",
              "cost_dimensions": {
                "quality": "Independent exact identities, mechanical Lean results, negative controls, protected CI, expected-head merge, and remote readbacks dominate self-report.",
                "latency": "Measure only the bounded evaluation, CI, merge, and readback path.",
                "token": "Record directly measured usage only when available; infer none.",
                "tool": "Use immutable Git reads, exact workflow/job results, expected-head merge, and exact blob readback.",
                "external": "No provider switch, credential disclosure, upstream mutation, issue comment, fork mutation, deployment, or paid proof service.",
                "failure_risk": "Primary risks are lifecycle duplication, evidence or head drift, solution leakage, control misclassification, and claim widening."
              },
              "reason": "Baseline-first preserves causal attribution and the single-writer boundary. The Candidate is relevant but not verified for the exact scope, while the active Task Evaluate contract already requires the necessary independent and separated verdicts."
            }
          }
          CANDJSON
          PYTHONPATH=src python -m continual.cli --root . work-submit "$CAND_WORK_ID" --response /tmp/candidate-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/submitted.json
          PYTHONPATH=src python -m continual.cli --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/resumed.json
          PYTHONPATH=src python -m continual.cli --root . work-verify --run-id "$RUN_ID" > /tmp/verify-after.json
          PYTHONPATH=src python -m continual.cli --root . work-pending --run-id "$RUN_ID" > /tmp/pending-after.json
      - name: Validate and persist exact lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.work_session import verified_work_invocation
          run_id=os.environ['RUN_ID'];wid=os.environ['CAND_WORK_ID'];nid=os.environ['CAND_NATIVE_ID']
          expected=json.load(open('/tmp/candidate-output.json'))
          verified=verified_work_invocation(Path('.').resolve(),wid)
          assert verified['output']==expected, verified
          native=json.loads(Path(f'.continual/runs/{run_id}/invocations/{nid}.json').read_text())
          assert native['status']=='complete' and native['component']=='candidate_evaluate', native
          before=json.load(open('/tmp/verify-before.json'));after=json.load(open('/tmp/verify-after.json'))
          assert after['valid'] is True and after['pending']==1, after
          for k in ('requests','responses','native_completed','native_fragments','native_local_learn'):
            assert after[k]==before[k]+1,(k,before,after)
          p=json.load(open('/tmp/pending-after.json'))['pending']
          assert len(p)==1 and p[0]['component']=='task_evaluate',p
          successor=p[0]
          assert successor['payload']['execution_unit']['unit_id']=='unit-generation29-evaluate-external-formal-proof-synthesis-v1',successor
          waiting=[]
          for path in Path(f'.continual/runs/{run_id}/invocations').glob('*.json'):
            value=json.loads(path.read_text())
            if value.get('status')=='awaiting_work_model': waiting.append((path,value))
          assert len(waiting)==1 and waiting[0][1]['work_invocation_id']==successor['invocation_id'],waiting
          snapshot=json.loads(Path(f'.continual/runs/{run_id}/snapshot.json').read_text())
          assert snapshot['revision']==138 and snapshot['phase']=='unit_pending' and snapshot['status']=='continue',snapshot
          assert snapshot['current_component']=='task_evaluate'
          print('CANDIDATE_CONSUMED_TASK_EVALUATE_FROZEN',verified['response']['response_digest'],successor['invocation_id'],successor['request_digest'],waiting[0][1]['invocation_id'])
          PY
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          rm -f /tmp/pending-before.json /tmp/verify-before.json /tmp/submitted.json /tmp/resumed.json /tmp/verify-after.json /tmp/pending-after.json /tmp/candidate-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .continual/work-model/invocations .continual/runs/$RUN_ID
          test -n "$(git status --porcelain)"
          git commit -m "[native-formal-proof-task-evaluate-frozen] consume Candidate and freeze Task Evaluate"
          git push origin "HEAD:$GITHUB_REF_NAME"
