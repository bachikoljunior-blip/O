# exact frozen Root consume: post-commit clean_g1 independent live forecast selection
name: gen29 consume Root post-commit clean_g1 live forecast response v1

on:
  push:
    branches:
      - work/gen29-root-post-blind-holder-live-forecast-v1

permissions:
  contents: write

concurrency:
  group: gen29-root-post-blind-holder-live-forecast-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-root-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 4c169041a5b63b7d8461352077df40c8f80cbe63
      EXPECTED_STATE_BLOB: 9923ddf3465e6a8f9623ada49fc306a9b0d37983
      EXPECTED_SNAPSHOT_BLOB: b626b0fd1a15d5d9e7959c4317409cded5479bbc
      EXPECTED_INBOX_BLOB: 208906fb4669eca5c8f448a0a8db6e4dcb7dfee2
      EXPECTED_INBOX_REVISION: '37'
      ROOT_NATIVE_ID: invoke-5460d93b4ec9c9e99483b224
      ROOT_NATIVE_BLOB: 07e949903a658be55629c4a4c4483ae3e6e59ec5
      ROOT_WORK_ID: invoke-2f4f3d862749fb548a2328dc
      ROOT_REQUEST_BLOB: ba3add0807d6d2073a99387718bbe48bf9818e45
      ROOT_REQUEST_DIGEST: ade8ee25a68c0ef0a88f91d7f5958adb89293f15027ad0fcfb16afeef6af5901
      SOURCE_CI_RUN_ID: '33348319091'
      SOURCE_CI_HEAD: 09e59a3cb80a58437659bbbd48124a7c6f4ac527
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-postcommit-clean-g1-independent-live-forecast-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, runtime main, authority, and Root binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import os
          import subprocess
          expected = ['.github/workflows/gen29-root-post-blind-holder-live-forecast-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$ROOT_WORK_ID/request.json)" = "$ROOT_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$ROOT_NATIVE_ID.json)" = "$ROOT_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['ROOT_NATIVE_ID']
          work_id = os.environ['ROOT_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_root_after_blind_holder_learn_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'completed_native_invocation_id': 'invoke-d93f35729bb39b99f825b679',
              'completed_work_invocation_id': 'invoke-be4836bc70c25306389b6881',
              'completed_response_digest': '942ece8965f0415218dbbdbed46979176487a636e9f3c6e15580e9b53644d13a',
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['ROOT_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['ROOT_REQUEST_BLOB'],
              'pending_request_digest': os.environ['ROOT_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 113,
              'native_phase': 'root_pending',
              'pending_component': 'root',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          bind = state.get('generation29_root_after_blind_holder_learn_v1', {})
          if bind.get('status') != 'pending_native_consume':
              raise SystemExit('Root state binding status mismatch')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != 37:
              raise SystemExit('inbox revision mismatch')
          if snapshot.get('revision') != 113 or snapshot.get('phase') != 'root_pending' or snapshot.get('status') != 'continue':
              raise SystemExit('snapshot is not revision113 root_pending')
          if request.get('component') != 'root' or request.get('request_digest') != os.environ['ROOT_REQUEST_DIGEST']:
              raise SystemExit('Root request mismatch')
          if request.get('prompt_path') != 'prompts/root.md':
              raise SystemExit('Root prompt mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Root identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Root already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'root':
              raise SystemExit('Root native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Root is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 115, 'responses': 114, 'pending': 1, 'native_completed': 108, 'native_fragments': 108, 'native_local_learn': 99}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(expected_counts, sort_keys=True) + '\n')
          PY
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json

      - name: Record fresh exact main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'], 'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'], 'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$EXPECTED_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY

      - name: Submit exact Root response and freeze successor preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/root-output.json <<'JSON'
          {
            "fragment": {
              "component": "root",
              "observations": [
                "Revision 113 preserves the repository-local blind-holder gate as PASS while the task-level objective, user-level objective, and AGI objective remain false; that gate is enabling protocol evidence, not a capability result.",
                "The earlier clean_g1 scientific forecast remains a contaminated FAIL because outcome-bearing retrieval preceded the frozen prediction boundary and same-session isolation was unproven; it must never be rerun, relabeled, or upgraded.",
                "The next highest-value bounded unit is one genuinely new post-revision-113 clean_g1 live held-out forecast. It requires an independent holder and an independent predictor with externally checkable receipts, and must fail closed as NOT_EVALUABLE before any outcome-bearing retrieval if either independent surface is unavailable."
              ]
            },
            "local_learn": {
              "decision": "NO_CHANGE",
              "candidates": [],
              "observation": "The blind-holder gate now supports a new provenance-bound live trial, but it is not itself evidence of live forecasting capability. Run exactly one new source/task through independent holder and predictor surfaces; if independence cannot be established before retrieval, record NOT_EVALUABLE without synthetic substitution, baseline fabrication, or activation."
            },
            "result": {
              "component": "execute",
              "unit_id": "unit-generation29-postcommit-clean-g1-independent-live-forecast-v1",
              "goal": "Run exactly one new post-revision-113 clean_g1 live held-out forecast through the already validated blind-holder gate: durably commit source identity, task schema, label rule, deterministic score, holder commitment, predictor-context boundary, and idempotency keys before any outcome-bearing retrieval; obtain one exact predictor response from an independent no-outcome-access surface; only then authorize an independent holder reveal and deterministically score the frozen response.",
              "scope": "One previously unused clean_g1 public source and one new task only. Read-only source access; no rerun or relabel of the contaminated prior forecast; no same-session self-attestation as isolation; no synthetic fixture or fabricated baseline as a substitute for live evidence; no provider or production routing, Candidate activation, broad capability, AGI, or completion claim.",
              "inputs": [
                "the revision113 root_pending snapshot and exact frozen Root request",
                "the validated blind-holder protocol, transition validator, synthetic positive control, and negative-ordering fixtures merged at the exact protected head",
                "the prior contaminated forecast retained as FAIL and excluded from scoring or capability aggregation",
                "one newly selected public clean_g1 source whose immutable identity and pre-outcome locator can be committed without exposing outcome-bearing bytes",
                "an independent holder surface able to commit the source/outcome digest before prediction and reveal only after exact response readback",
                "an independent predictor surface whose fresh invocation, model/executor identity, allowed-input digests, denied locators, and absence of outcome access are externally checkable"
              ],
              "evidence_needed": [
                "a pre-retrieval causal receipt binding selection rule, immutable source identity, task and label schema, deterministic scoring rule, holder identity, predictor identity/context boundary, timestamps, control-plane revision, and idempotency key",
                "an independent holder commitment that binds hidden outcome bytes and immutable provenance while exposing no outcome-bearing content to the predictor",
                "an independent predictor receipt for a fresh invocation with no outcome access, no prior response reuse, no same-session carryover, exact allowed-input digests, and explicit denied source/outcome locators",
                "an exact frozen prediction request and exact response blob/digest read back durably before any reveal authorization",
                "a reveal receipt from the independent holder that cryptographically matches the prior commitment, immutable source identity, and exact prediction response",
                "deterministic score computation and replay with a full causal/digest/idempotency/control matrix",
                "focused validation, protected four-shard repository CI plus aggregate, expected-head merge, and exact remote readback for any repository mutation"
              ],
              "expected_outputs": [
                "one immutable live-trial manifest and pre-retrieval commitment receipt for a new post-commit clean_g1 source/task",
                "one independent-holder commitment receipt or a fail-closed NOT_EVALUABLE record produced before outcome-bearing retrieval",
                "one independent-predictor invocation/request/response receipt with exact digests, or a fail-closed NOT_EVALUABLE record produced before outcome-bearing retrieval",
                "when both independent surfaces are valid, one post-response reveal receipt and deterministic score/replay artifact bound to the frozen prediction",
                "a complete causal-order, provenance, digest, idempotency, and control matrix showing every transition and rejection reason",
                "a bounded task result that keeps the prior contaminated trial FAIL and states precisely whether this new trial is PASS, FAIL, or NOT_EVALUABLE",
                "a post-result Candidate Evaluate preflight followed by Consolidate Episode, Learn, exact-head publication, state binding, and return to Root"
              ],
              "success_conditions": [
                "all source/task/rule/holder/predictor commitments are durably exact-read back before the first outcome-bearing retrieval",
                "the predictor is demonstrably independent, fresh, and denied outcome access; same-task-chat or same-session self-attestation alone is rejected",
                "the holder is independent and cannot reveal before exact prediction response readback; revealed bytes match the precommitted digest and immutable source",
                "exactly one prediction and one reveal effect occur under stable idempotency keys, and deterministic replay produces identical decision, score, and digests",
                "the result is limited to this one live trial; no contaminated evidence is upgraded and no Candidate, production, provider, AGI, or user-completion claim is made",
                "any repository changes pass focused checks and the protected four-shard suite/aggregate, then merge through unchanged expected head with exact remote readback"
              ],
              "failure_conditions": [
                "either independent holder or independent predictor surface is unavailable or cannot provide externally checkable receipts before outcome-bearing retrieval; in that case stop the live trial as NOT_EVALUABLE and do not retrieve, fabricate, or substitute",
                "any outcome-bearing content is read before the full commitment boundary, or task/label/score rules change after source access",
                "same-session memory, self-attestation, manifest exclusion alone, a reused response, or an unverified context is accepted as predictor isolation",
                "reveal precedes exact response readback, holder/source/response digests mismatch, duplicate prediction or reveal occurs, or replay differs",
                "a synthetic fixture, historical result, fabricated baseline, or the contaminated prior forecast is presented as this live trial",
                "the unit mutates provider or production routing, activates a Candidate, broadens the claim, or bypasses focused/protected CI and exact-head publication controls"
              ],
              "parent_continuation": "After Execute, run Task Evaluate on only this exact unit and its causal/provenance matrix. Then run post-result Candidate Evaluate, Consolidate Episode, and Learn; publish through focused and protected exact-head CI with expected-head merge and remote readback, bind the next frozen continuation, return to Root, and keep the upper objective, AGI, and user-level completion false unless later authoritative goal evidence independently proves them."
