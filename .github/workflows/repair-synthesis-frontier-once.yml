name: repair-synthesis-frontier-once

on:
  push:
    branches:
      - 'agi/sequence-affine-six-synthesis-r58'
    paths:
      - '.github/workflows/repair-synthesis-frontier-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Preserve old synthesis ordering and append coefficient six
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agi/acquired_programs.py')
          text = path.read_text(encoding='utf-8')
          old = '        *[("numeric", value) for value in range(-6, 7)],\n'
          new = (
              '        *[("numeric", value) for value in range(-5, 6)],\n'
              '        ("numeric", -6),\n'
              '        ("numeric", 6),\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected exactly one PR 224 constant-kernel line')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/repair-synthesis-frontier-once.yml').unlink()
          PY
          git diff --check
      - name: Commit one-shot repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agi/acquired_programs.py .github/workflows/repair-synthesis-frontier-once.yml
          git commit -m 'Preserve synthesis frontier ordering for coefficient six'
          git push origin "HEAD:${GITHUB_REF_NAME}"
