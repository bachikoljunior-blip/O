name: gen29 validate Candidate unit durability repair

on:
  push:
    branches:
      - work/gen29-candidate-unit-durability-repair-v1

permissions:
  contents: read

concurrency:
  group: gen29-candidate-unit-durability-repair-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 620fec45a18a4c40c73f394a9a584edeaadb7c3e
      EXPECTED_STATE_BLOB: 9bc79b5ba06f07e4b6e6e03f6894d4609bba5479
      EXPECTED_SNAPSHOT_BLOB: f85c5321c44b004c1bd01f9f7441be08b0c2b9eb
      EXPECTED_NATIVE_BLOB: 654faf52ebad711956387b28d09c742c1e155551
      EXPECTED_REQUEST_BLOB: 44ebfd3cacf195f5ddf1c763bcf2502069c87ae3
      EXPECTED_UNIT_BLOB: f576390e00df1fc7a8a09ac66cc2b29c0d1deb57
      RUN_ID: run-work-recovery-gen9-durability-repair
      NATIVE_ID: invoke-ed94ce2e2204b683b42af73c
      WORK_ID: invoke-41fe14117283ba173c0fb998
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .
      - name: Verify exact restored unit and frozen authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$NATIVE_ID.json)" = "$EXPECTED_NATIVE_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$WORK_ID/request.json)" = "$EXPECTED_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/execution-units/unit-generation29-external-formal-proof-synthesis-v1.json)" = "$EXPECTED_UNIT_BLOB"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations
          root=Path('.')
          run_id=os.environ['RUN_ID']
          wid=os.environ['WORK_ID']
          req=json.loads((root/'.continual/work-model/invocations'/wid/'request.json').read_text())
          unit=json.loads((root/'.continual/runs'/run_id/'execution-units/unit-generation29-external-formal-proof-synthesis-v1.json').read_text())
          if unit != req['payload']['execution_unit']['execution_unit']:
              raise SystemExit('restored unit differs from immutable frozen request')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0]['invocation_id']!=wid:
              raise SystemExit(f'unexpected pre-resume pending identity: {pending}')
          before=verify_work_invocations(root,run_id=run_id)
          expected={'requests':149,'responses':148,'pending':1,'native_completed':142,'native_fragments':142,'native_local_learn':129}
          for key,value in expected.items():
              if before.get(key)!=value:
                  raise SystemExit(f'before mismatch {key}: {before.get(key)} != {value}')
          PY
      - name: Prove exact native replay creates no second request
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-resume "$RUN_ID" --max-steps 1 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/resume.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations
          root=Path('.')
          run_id=os.environ['RUN_ID']
          wid=os.environ['WORK_ID']
          resumed=json.loads(Path('/tmp/resume.json').read_text())
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0]['invocation_id']!=wid:
              raise SystemExit(f'replay minted or selected a different request: {pending}')
          if resumed['pending'][0]['invocation_id']!=wid:
              raise SystemExit(f'resume output identity mismatch: {resumed["pending"]}')
          after=verify_work_invocations(root,run_id=run_id)
          expected={'requests':149,'responses':148,'pending':1,'native_completed':142,'native_fragments':142,'native_local_learn':129}
          for key,value in expected.items():
              if after.get(key)!=value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)} != {value}')
          PY
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$NATIVE_ID.json)" = "$EXPECTED_NATIVE_BLOB"
          git diff --exit-code
