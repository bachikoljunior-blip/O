name: Append USER_INPUT_INBOX revision 39

on:
  push:
    branches:
      - user-input/rev39-matched-evidence-acquisition-20260902

permissions:
  contents: write

jobs:
  append-user-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-input/rev39-matched-evidence-acquisition-20260902
          fetch-depth: 0

      - name: Append minimal conversation-specific direction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("agi/USER_INPUT_INBOX.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entry_id = "user-direction-matched-evidence-candidate-20260902-v39"

          if any(entry.get("id") == entry_id for entry in data.get("entries", [])):
              raise SystemExit("revision 39 entry already exists")
          if data.get("revision") != 38:
              raise SystemExit(f"expected inbox revision 38, found {data.get('revision')!r}")

          data["revision"] = 39
          data["entries"].append(
              {
                  "sequence": 39,
                  "id": entry_id,
                  "received_at": "2026-09-02T05:51:03Z",
                  "kind": "learning_and_experiment_selection_clarification",
                  "status": "active",
                  "summary": "If a bounded success yields NO_CHANGE only because matched evidence is insufficient, preserve that gap as a testable candidate or matched-evidence continuation instead of letting an immediate domain switch make the evidence shortage self-perpetuating.",
                  "directives": [
                      "At the next safe Learn or Root boundary, if O has not independently derived an equivalent mechanism, treat this conversation-specific observation as a falsifiable hypothesis: when Learn declines a reusable change solely for lack of same-capability evidence and Root immediately switches domains, the missing evidence may never be acquired.",
                      "Create only the minimum reversible Candidate or explicit matched-evidence acquisition unit needed to test the hypothesis: run a bounded sequence of genuinely held-out same-capability tasks, compare a concrete candidate against baseline, include protected-regression and retention checks, and adopt only on causal improvement. Do not generalize from one success, do not force activation, avoid duplication when an equivalent mechanism already exists, and stop the sequence when its expected information value no longer justifies its cost."
                  ],
                  "supersedes": [],
                  "source": "user_chat"
              }
          )
          data["updated_at"] = "2026-09-02T05:51:03Z"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git rm .github/workflows/zz-append-user-input-rev39.yml
          git config user.name "chatgpt-user-input-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agi/USER_INPUT_INBOX.json
          git commit -m "user input: add matched-evidence candidate clarification (rev39)"
          git push origin HEAD:user-input/rev39-matched-evidence-acquisition-20260902
