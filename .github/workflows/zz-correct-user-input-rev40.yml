name: Correct USER_INPUT_INBOX revision 40 scope

on:
  push:
    branches:
      - user-input/rev40-context-only-scope-correction-20260902

permissions:
  contents: write

jobs:
  correct-user-input-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: user-input/rev40-context-only-scope-correction-20260902
          fetch-depth: 0

      - name: Append non-prescriptive revision-40 correction and bind it
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          inbox_path = Path("agi/USER_INPUT_INBOX.json")
          ledger_path = Path("agi/USER_DIRECTIVE_EVENTS.json")
          inbox = json.loads(inbox_path.read_text(encoding="utf-8"))
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))

          def digest(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          prior_entry_id = "user-direction-matched-evidence-candidate-20260902-v39"
          entry_id = "user-clarification-rev39-context-only-20260902-v40"
          atom_id = "r40-rev39-context-only-scope-correction"

          if inbox.get("revision") != 39:
              raise SystemExit(f"expected inbox revision 39, found {inbox.get('revision')!r}")
          if not any(item.get("id") == prior_entry_id for item in inbox.get("entries", [])):
              raise SystemExit("revision-39 source entry is missing")
          if any(item.get("id") == entry_id for item in inbox.get("entries", [])):
              raise SystemExit("revision-40 correction already exists")

          current_inbox_digest = digest(inbox)
          source = ledger.get("source", {})
          if source.get("revision") != 39 or source.get("content_digest") != current_inbox_digest:
              raise SystemExit("typed directive ledger is not bound to the exact revision-39 inbox")

          entry = {
              "sequence": 40,
              "id": entry_id,
              "received_at": "2026-09-02T10:41:37Z",
              "kind": "scope_correction",
              "status": "active",
              "summary": "Narrow revision 39 to a non-prescriptive conversation-specific observation and withdraw its specified Candidate and experiment procedure.",
              "directives": [
                  "Revision 39 is narrowed to this context only: if Learn returns NO_CHANGE solely because same-capability evidence is missing and Root immediately switches domains, the missing evidence may become self-perpetuating. The specific Candidate and experiment procedure in revision 39 are withdrawn and are not user requirements. No particular action, priority, continuation, or stopping rule is implied; O should use its own reasoning under the pre-existing objective and constraints."
              ],
              "supersedes": [prior_entry_id],
              "source": "user_chat"
          }

          inbox["revision"] = 40
          inbox.setdefault("entries", []).append(entry)
          inbox["updated_at"] = "2026-09-02T10:41:37Z"

          entry_digest = digest(entry)
          atom = {
              "atom_id": atom_id,
              "source_entry_id": entry_id,
              "source_entry_digest": entry_digest,
              "source_directive_indices": [0],
              "slot": "learning.evidence_acquisition_scope",
              "cardinality": "single",
              "value": "preserve_only_the_self_perpetuating_evidence_gap_observation_as_nonprescriptive_context_withdraw_revision_39_candidate_and_experiment_requirements_and_leave_action_selection_to_o_under_prior_objective_and_constraints",
              "precedence": 40,
              "supersedes": [
                  "r39-matched-evidence-self-sealing-risk",
                  "r39-minimum-reversible-matched-evidence-sequence"
              ]
          }

          existing = {item.get("atom_id"): item for item in ledger.get("atoms", [])}
          if atom_id in existing and existing[atom_id] != atom:
              raise SystemExit("conflicting revision-40 atom already exists")
          if atom_id not in existing:
              ledger.setdefault("atoms", []).append(atom)

          ledger["source"] = {
              "path": "agi/USER_INPUT_INBOX.json",
              "revision": 40,
              "content_digest": digest(inbox),
              "interpreted_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          }

          inbox_path.write_text(json.dumps(inbox, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git rm .github/workflows/zz-correct-user-input-rev40.yml
          git config user.name "chatgpt-user-input-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agi/USER_INPUT_INBOX.json agi/USER_DIRECTIVE_EVENTS.json
          git commit -m "user input: narrow revision 39 to context only (rev40)"
          git push origin HEAD:user-input/rev40-context-only-scope-correction-20260902
