name: Bootstrap resumable general-agent runtime

on:
  push:
    branches:
      - agent/agi-runtime-v1-20260816
    paths:
      - .agent-runtime/trigger

permissions:
  contents: write

concurrency:
  group: agi-runtime-bootstrap-v1
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agi-runtime-v1-20260816
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start from latest main
        shell: bash
        run: |
          set -euo pipefail
          cp -R .agent-runtime /tmp/agent-runtime
          git fetch origin main
          git checkout -B agent/agi-runtime-v1-20260816 origin/main
          rm -rf .agent-runtime .github/workflows/agi-runtime-bootstrap.yml
          cp -R /tmp/agent-runtime .agent-runtime
          test -f src/agi/campaign.py

      - name: Apply runtime implementation
        shell: bash
        run: |
          set -euo pipefail
          python .agent-runtime/01_models_tools.py
          python .agent-runtime/02_memory_skills.py
          python .agent-runtime/03_improvement_agent.py
          python .agent-runtime/04_benchmark_cli_tests.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          pytest -q
          python -m compileall -q src tests
          python -m agi.cli --root . advance > /tmp/campaign.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/campaign.json').read_text(encoding='utf-8'))
          assert state['status'] in {'continue', 'verified'}
          assert 'next_milestones' in state
          PY

      - name: Publish clean commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-runtime .github/workflows/agi-runtime-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add resumable general-agent runtime'
          git push --force-with-lease origin HEAD:agent/agi-runtime-v1-20260816
          git push origin HEAD:main

      - name: Remove temporary branch
        if: success()
        shell: bash
        run: git push origin --delete agent/agi-runtime-v1-20260816 || true
