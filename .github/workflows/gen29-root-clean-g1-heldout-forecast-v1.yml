# trigger-repair: initial workflow introduction commit was not enqueued; semantic body unchanged
name: gen29 consume Root response v1

on:
  push:
    branches:
      - work/gen29-root-clean-g1-heldout-forecast-v1

permissions:
  contents: write

concurrency:
  group: gen29-root-clean-g1-heldout-forecast-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-root-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 3d7923096edd108836b7be34ee95bb328c51b22d
      EXPECTED_STATE_BLOB: dd79d5388db38b0255f87153cf2b25520a2672ec
      EXPECTED_SNAPSHOT_BLOB: 5008bf4cd9eb834e0fe022bb52991b1648546205
      EXPECTED_INBOX_BLOB: 93889b482c5b54dd90944f19ce425e845f455b35
      EXPECTED_INBOX_REVISION: '35'
      ROOT_NATIVE_ID: invoke-35ff265f923c6c2543c47bf9
      ROOT_NATIVE_BLOB: 3127cdee6118e3df6412c7458b420b773ab0a71c
      ROOT_WORK_ID: invoke-2f3d30881fe6720af63eda81
      ROOT_REQUEST_BLOB: 8a98ebb6fb370666db8c2f13b839e4798445ff37
      ROOT_REQUEST_DIGEST: 0129c028acb0479c64cf33f17b805f2db4a76bb37fcb0166cd1f7449c608653f
      SOURCE_CI_RUN_ID: '33309445797'
      SOURCE_CI_HEAD: 2ba10010b40db67a612668849d2a5b54a3eddd45
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-clean-g1-heldout-scientific-forecast-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, runtime main, authority, and Root binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import os
          import subprocess
          expected = ['.github/workflows/gen29-root-clean-g1-heldout-forecast-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$ROOT_WORK_ID/request.json)" = "$ROOT_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$ROOT_NATIVE_ID.json)" = "$ROOT_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['ROOT_NATIVE_ID']
          work_id = os.environ['ROOT_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_root_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'completed_native_invocation_id': 'invoke-c95eb8fdf69b11b897460704',
              'completed_work_invocation_id': 'invoke-c42d69106561993ff4bb73e9',
              'completed_response_digest': '0f3031fff28d5198d2df7014b38631722f2495801efe5e320154cc3d525d0a5d',
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['ROOT_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['ROOT_REQUEST_BLOB'],
              'pending_request_digest': os.environ['ROOT_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 105,
              'native_phase': 'root_pending',
              'pending_component': 'root',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          bind = state.get('generation29_learn_after_external_observation_consume_v1', {})
          if bind.get('status') != 'merged_to_main_verified_root_bound_pending_native_consume':
              raise SystemExit('Root state binding status mismatch')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != 35:
              raise SystemExit('inbox revision mismatch')
          if snapshot.get('revision') != 105 or snapshot.get('phase') != 'root_pending' or snapshot.get('status') != 'continue':
              raise SystemExit('snapshot is not revision105 root_pending')
          if request.get('component') != 'root' or request.get('request_digest') != os.environ['ROOT_REQUEST_DIGEST']:
              raise SystemExit('Root request mismatch')
          if request.get('prompt_path') != 'prompts/root.md':
              raise SystemExit('Root prompt mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Root identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Root already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'root':
              raise SystemExit('Root native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Root is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 101, 'responses': 100, 'pending': 1, 'native_completed': 94, 'native_fragments': 94, 'native_local_learn': 86}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(expected_counts, sort_keys=True) + '\n')
          PY
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json

      - name: Record fresh exact main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'], 'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'], 'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$EXPECTED_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY

      - name: Submit exact Root response and freeze successor preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/root-output.json <<'JSON'
          {
            "fragment": {
              "component": "root",
              "observations": [
                "The revision105 snapshot preserves a bounded unit PASS while task and user-level verdicts remain FAIL; the upper objective and AGI claim remain open.",
                "The completed seven-case GitHub Actions observation trial is an internal read-only publication-decision fixture, and its Learn result requires the next unit to be materially different and aimed at independent external evidence or capability.",
                "This Root selects one non-production clean_g1 held-out scientific forecast rendezvous with outcome-hidden prediction, immutable primary-source reveal, deterministic scoring, and no repository, provider, Candidate, or production effect inside the trial."
              ]
            },
            "local_learn": {
              "candidates": [],
              "decision": "NO_CHANGE",
              "observation": "The prior bounded observation-admission result warrants no activation. The next informative step is a fresh externally sourced, outcome-hidden scientific forecast trial whose evidence is independently revealed and scored, with all claims limited to the exact selected source and task."
            },
            "result": {
              "component": "execute",
              "evidence_needed": [
                "one genuinely fresh clean_g1 feed record and immutable primary-source locator that were not present in the revision105 Root decision context",
                "a connector receipt binding source identity, publication version, retrieval time, content digest, and clean_g1 provenance without copying secrets",
                "a precommitted task/outcome split whose prediction bundle exposes only the research question, setup, interventions, and scoring rule while the primary-source outcome is excluded from the frozen decision manifest",
                "a digest commitment to the withheld outcome artifact before the model prediction is recorded, followed by an immutable primary-source reveal receipt",
                "one structured directional or ordinal forecast plus confidence and one next-experiment choice, recorded before reveal",
                "a same-input no-extra-context baseline or an explicit reason it cannot be constructed without contaminating the task",
                "a deterministic scorer, replay-stable manifests, contamination audit, focused tests, protected repository tests, and exact-head publication evidence"
              ],
              "expected_outputs": [
                "a machine-readable held-out trial specification naming the exact clean_g1 item, primary source, frozen source clocks, task fields, outcome-exclusion fields, and precommitted scoring rule",
                "separate immutable prediction and withheld-outcome commitment artifacts proving prediction preceded reveal",
                "an independently retrieved primary-source reveal receipt and deterministic score for the exact forecast and next-experiment choice",
                "a baseline comparison when valid, otherwise a fail-closed NOT_EVALUABLE reason with no substituted evidence",
                "a contamination and mutation audit showing the withheld outcome was absent from the prediction manifest and no provider, production, merge, dispatch, Candidate activation, or unrelated repository effect occurred inside the trial",
                "a bounded result that distinguishes one externally scored scientific forecast from generalized scientific capability, production reliability, AGI, or user-level completion"
              ],
              "failure_conditions": [
                "the selected source was already present in the frozen Root context, lacks clean_g1 provenance, or cannot be bound to an immutable primary version",
                "the primary result, answer, abstract result sentence, or equivalent outcome signal is visible in the prediction manifest before commitment",
                "the outcome commitment is created after the prediction, the reveal does not match the commitment and primary source, or the scorer is not deterministic",
                "the task or baseline conditions differ in an uncontrolled way, the baseline is fabricated, or missing external evidence is replaced with an internal fixture",
                "any replay changes the forecast inputs or score, any mutation audit is nonempty, or any real provider/production/repository effect occurs inside the trial",
                "the result is widened beyond the exact source and task or is presented as independent AGI proof or user-level completion"
              ],
              "goal": "Run one precommitted, read-only held-out scientific forecast trial using a genuinely fresh clean_g1 primary-source record: freeze an outcome-hidden task, record O's directional or ordinal prediction and next-experiment choice before reveal, then retrieve the immutable primary result independently and score the exact prediction without substituting an internal fixture.",
              "inputs": [
                "the revision35 user-input policy requiring clean_g1-only external research feed use at safe O boundaries",
                "agi/WORK_STRATEGY.json, including behavioral/outcome evaluation, exact source clocks, frozen-request provenance, and revision20 negative-evidence scope",
                "the O-owned DecisionContextManifest baseline and the revision105 Root manifest identifying what external evidence was and was not present",
                "the next eligible clean_g1 feed cursor item with a public primary-source artifact and an outcome that can be withheld from the prediction bundle",
                "the existing observation-receipt, contamination-rejection, deterministic replay, and exact-head publication safeguards"
              ],
              "parent_continuation": "After Execute, independently Task Evaluate only the exact source/task protocol, provenance, contamination audit, forecast score, and bounded capability evidence; then Consolidate Episode and Learn. Publish each immutable lifecycle through unchanged exact-head CI and expected-head merge, return to Root, and continue with another materially different safe unit rather than treating one external score as AGI or completion.",
              "scope": "agi/clean-g1/heldout-scientific-forecast-v1; exactly one fresh primary-source task, outcome-hidden and non-production; read-only evidence acquisition and scoring with no external write or effect dispatch",
              "success_conditions": [
                "one eligible fresh clean_g1 source is provenance-bound and its outcome is cryptographically committed but absent from the frozen prediction manifest",
                "the forecast, confidence, and next-experiment choice are durably recorded before an independently retrieved primary-source reveal",
                "the reveal matches both the prior commitment and immutable primary source, and the deterministic scorer produces one replay-stable exact-task result",
                "a valid baseline is scored under the same exposed inputs or the trial fails closed as NOT_EVALUABLE without inventing a comparator",
                "the contamination and mutation audits are empty, focused and protected tests pass, and publication uses one unchanged exact head",
                "all conclusions remain limited to this single externally scored task and retain task/user FAIL and agi_claim_supported=false unless later independent evidence separately establishes more"
              ],
              "unit_id": "unit-generation29-clean-g1-heldout-scientific-forecast-v1"
            }
          }
          JSON
          python -m json.tool /tmp/root-output.json > /dev/null
          continual --root . work-submit "$ROOT_WORK_ID" --response /tmp/root-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/root-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate exact Root completion and Candidate Evaluate freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          root_native_id = os.environ['ROOT_NATIVE_ID']
          root_work_id = os.environ['ROOT_WORK_ID']
          unit_id = os.environ['RESULT_UNIT_ID']
          expected_output = json.loads(Path('/tmp/root-output.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 102, 'responses': 101, 'pending': 1, 'native_completed': 95, 'native_fragments': 95, 'native_local_learn': 87}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_root = verified_work_invocation(root, root_work_id)
          if verified_root.get('output') != expected_output:
              raise SystemExit('persisted Root output mismatch')
          root_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{root_native_id}.json'
          root_native = json.loads(root_native_path.read_text())
          if root_native.get('status') != 'complete' or root_native.get('component') != 'root' or root_native.get('output') != expected_output:
              raise SystemExit('Root native completion mismatch')
          response_rel = f'.continual/work-model/invocations/{root_work_id}/response.json'
          fragment_rel = root_native.get('fragment_ref')
          local_learn_rel = f'.continual/runs/{run_id}/local-learn/{root_native_id}-root.json'
          for rel in (response_rel, fragment_rel, local_learn_rel):
              if not rel or not (root / rel).is_file():
                  raise SystemExit(f'Root lifecycle path missing: {rel}')
          unit_path = root / '.continual' / 'runs' / run_id / 'execution-units' / f'{unit_id}.json'
          if json.loads(unit_path.read_text()) != expected_output['result']:
              raise SystemExit('persisted execution unit mismatch')
          snapshot_path = root / '.continual' / 'runs' / run_id / 'snapshot.json'
          snapshot = json.loads(snapshot_path.read_text())
          expected_snapshot = {'revision': 106, 'phase': 'unit_pending', 'status': 'continue', 'current_component': 'execute', 'current_unit': unit_id}
          for key, value in expected_snapshot.items():
              if snapshot.get(key) != value:
                  raise SystemExit(f'snapshot mismatch {key}: {snapshot.get(key)!r} != {value!r}')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one successor pending request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'candidate_evaluate':
              raise SystemExit(f'expected Candidate Evaluate successor, got {request.get("component")!r}')
          payload = request.get('payload', {})
          if payload.get('mode') != 'pre-application' or payload.get('target_component') != 'execute':
              raise SystemExit('Candidate Evaluate request is not the scoped Execute preflight')
          execution_context = payload.get('execution_unit', {})
          if execution_context.get('execution_unit') != expected_output['result']:
              raise SystemExit('Candidate Evaluate request did not bind exact Root-selected unit')
          frozen_snapshot = execution_context.get('snapshot', {})
          if frozen_snapshot.get('revision') != 106 or frozen_snapshot.get('phase') != 'unit_pending' or frozen_snapshot.get('current_component') != 'execute' or frozen_snapshot.get('current_unit') != unit_id:
              raise SystemExit('Candidate Evaluate request snapshot binding mismatch')
          candidates = payload.get('candidate_index', {}).get('candidates', [])
