{
  "result": {
    "decision": "PROPOSE_ACTIVATION",
    "candidate_id": "candidate-task-