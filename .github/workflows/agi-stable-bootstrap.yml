name: Stable AGI evidence campaign bootstrap

on:
  push:
    branches:
      - agent/agi-evidence-stable-20260816
    paths:
      - .agent-stable/trigger

permissions:
  contents: write

concurrency:
  group: agi-evidence-stable-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agi-evidence-stable-20260816
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare latest main and bootstrap sources
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-stable/stable.py /tmp/stable.py
          git fetch origin main agent/agi-evidence-campaign-20260816-final3
          git checkout -B agent/agi-evidence-stable-20260816 origin/main
          if [ ! -f src/agi/campaign.py ] || [ ! -f .continual/agi/campaign.json ]; then
            git show origin/agent/agi-evidence-campaign-20260816-final3:.agent-bundle/01_core.py > /tmp/01_core.py
            git show origin/agent/agi-evidence-campaign-20260816-final3:.agent-bundle/02_campaign.py > /tmp/02_campaign.py
            python /tmp/01_core.py
            python /tmp/02_campaign.py
            python /tmp/stable.py
          fi

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m agi.cli --root . init
          python -m agi.cli --root . advance
          pytest -q
          python -m compileall -q src tests
          python -m agi.cli --root . validate-manifest > /tmp/manifest.json
          python -m agi.cli --root . status > /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/status.json').read_text(encoding='utf-8'))
          assert status['status'] in {'continue', 'verified'}
          assert status['report']['agi_claim_supported'] is False, (
              'The repository has no qualifying evidence yet, so a positive claim would be false.'
          )
          assert len(status['next_milestones']) > 0
          summary = Path('/tmp/summary.md')
          summary.write_text(
              '# AGI campaign validation\n\n'
              f"- status: `{status['status']}`\n"
              f"- iteration: `{status['iteration']}`\n"
              f"- objective evidence: `{status['report']['objective_evidence']}`\n"
              f"- missing: `{', '.join(status['report']['missing'])}`\n"
              f"- next milestones: `{len(status['next_milestones'])}`\n",
              encoding='utf-8',
          )
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish clean result when needed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-stable .github/workflows/agi-stable-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build evidence-driven AGI campaign'
            git push --force-with-lease origin HEAD:agent/agi-evidence-stable-20260816
            git push origin HEAD:main
          fi

      - name: Remove temporary implementation branches
        if: success()
        shell: bash
        run: |
          set +e
          for branch in \
            agent/agi-evidence-campaign-20260816 \
            agent/agi-evidence-campaign-20260816-v2 \
            agent/agi-evidence-campaign-20260816-v3 \
            agent/agi-evidence-campaign-20260816-v4 \
            agent/agi-evidence-campaign-20260816-final \
            agent/agi-evidence-campaign-20260816-final2 \
            agent/agi-evidence-campaign-20260816-final3 \
            agent/agi-evidence-stable-20260816; do
            git push origin --delete "$branch"
          done
          exit 0
