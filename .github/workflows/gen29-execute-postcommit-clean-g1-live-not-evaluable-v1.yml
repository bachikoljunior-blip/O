                "surface_availability_audit": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/surface-availability-audit.json",
                "pre_retrieval_manifest": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/pre-retrieval-manifest.json",
                "causal_digest_control_matrix": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/causal-digest-control-matrix.json",
                "contamination_mutation_audit": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/contamination-mutation-audit.json",
