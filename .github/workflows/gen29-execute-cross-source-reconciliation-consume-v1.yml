name: gen29 consume cross-source Execute v1

on:
  push:
    branches:
      - work/gen29-execute-cross-source-reconciliation-consume-v1

permissions:
  contents: write

concurrency:
  group: gen29-execute-cross-source-reconciliation-consume-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-execute-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 1d6b61c8b8f3a1ea51a106dd23579239bba6621a
      EXPECTED_STATE_BLOB: 6c21bd4ae53224884464f1e4a056bd08476b41af
      EXPECTED_SNAPSHOT_BLOB: 3cc0477c3a3b8d7cc418d6a726a813f8a6f37fe2
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXEC_NATIVE_ID: invoke-bc78eb5f075bb06ef6a4f92d
      EXEC_NATIVE_BLOB: 2bb406eed90aea2cdddd5ef39237058549840efc
      EXEC_WORK_ID: invoke-5c28ad87d810c530cf9f8371
      EXEC_REQUEST_BLOB: badc15b3967b928839359735ea04823cb5a9972c
      EXEC_REQUEST_DIGEST: a866c9a5c3cf1d2ce70f17f9fa3d347e1faec55e805aeea5c4cacfe69b8b3000
      RESULT_CI_RUN_ID: '33498703511'
      RESULT_CI_HEAD: 4082122194952c0363830871b0232fd24c575de1
      SOURCE_CI_RUN_ID: '33494389195'
      SOURCE_CI_HEAD: 12a61d6e7e87fcfb9d780fbdc0313cdb722b8e34
      RESULT_MERGE_SHA: 765064d5b2de4bfc828a99695f42a94690cd0225
      RUN_ID: run-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, authority, pending Execute, artifacts, and source CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          expected = ['.github/workflows/gen29-execute-cross-source-reconciliation-consume-v1.yml']
          observed = subprocess.check_output(['git','diff','--name-only',__import__('os').environ['EXPECTED_MAIN'],'HEAD'], text=True).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          test "$(jq -r '.sha' /tmp/runtime-state-document.json)" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$EXEC_WORK_ID/request.json)" = "$EXEC_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$EXEC_NATIVE_ID.json)" = "$EXEC_NATIVE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/precommitted-selector-manifest.json)" = b7c08e41c97a486a8d0610d6d8ab4487f2318e04
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/source-readiness.json)" = 35b5dbd0bf932843cb88740ec608af98492b0267
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/normalized-sources.json)" = 7f51c4d9ae19d0425c605f60adac28f8043bc241
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/reconciliation-report.json)" = 6e1b2f3d2068a35588fa36369b6622981080bf13
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/corruption-controls.json)" = c46a2c8bc935b2987a366fd09893859f08e522ff
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/replay-verification.json)" = f51d0b63710446e06f759edb68897aea698ac20e
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/bounded-result.json)" = 8486daa3d8da17e467325a9187758693048bb47f
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/mutation-audit.json)" = 059cf33a10ebf7e6fb3483d651b217b5aa91e661
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text()); inbox=json.loads(Path('/tmp/runtime-inbox.json').read_text())
          exact=state['exact_continuation']; durability=state['continuation_durability']
          if state.get('execution_id')!='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3' or state.get('lease_generation')!=29:
              raise SystemExit('authority identity mismatch')
          if hashlib.sha256(state['fence_token'].encode()).hexdigest()!='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('fence mismatch')
          if state.get('status')!='running' or state.get('resume_required') is not True or inbox.get('revision')!=38:
              raise SystemExit('state/inbox mismatch')
          if exact != durability or exact.get('status')!='remote_main_readback_verified' or exact.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability mismatch')
          expected={'pending_native_invocation_id':os.environ['EXEC_NATIVE_ID'],'pending_native_invocation_blob_sha':os.environ['EXEC_NATIVE_BLOB'],'pending_work_invocation_id':os.environ['EXEC_WORK_ID'],'pending_request_blob_sha':os.environ['EXEC_REQUEST_BLOB'],'pending_request_digest':os.environ['EXEC_REQUEST_DIGEST'],'pending_response_ref':None,'response_exists_on_authoritative_remote':False,'snapshot_revision':132,'native_phase':'unit_pending','pending_component':'execute','target_component':'task_evaluate'}
          for k,v in expected.items():
              if exact.get(k)!=v: raise SystemExit(f'continuation mismatch {k}: {exact.get(k)!r} != {v!r}')
          request=verified_work_request(root,os.environ['EXEC_WORK_ID'])
          if request.get('component')!='execute' or request.get('request_digest')!=os.environ['EXEC_REQUEST_DIGEST']:
              raise SystemExit('Execute request mismatch')
          if (root/'.continual/work-model/invocations'/os.environ['EXEC_WORK_ID']/'response.json').exists():
              raise SystemExit('Execute already answered')
          native=json.loads((root/'.continual/runs'/run_id/'invocations'/f"{os.environ['EXEC_NATIVE_ID']}.json").read_text())
          if native.get('status')!='awaiting_work_model' or native.get('component')!='execute' or native.get('work_invocation_id')!=os.environ['EXEC_WORK_ID']:
              raise SystemExit('native Execute mismatch')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0].get('invocation_id')!=os.environ['EXEC_WORK_ID']:
              raise SystemExit('Execute is not unique pending Work item')
          before=verify_work_invocations(root,run_id=run_id)
          expected_counts={'valid':True,'requests':143,'responses':142,'pending':1,'native_completed':136,'native_fragments':136,'native_local_learn':124}
          for k,v in expected_counts.items():
              if before.get(k)!=v: raise SystemExit(f'before count mismatch {k}: {before.get(k)!r}')
          bounded=json.loads((root/'.continual/runs'/run_id/'artifacts/unit-generation29-cross-source-data-reconciliation-v1/bounded-result.json').read_text())
          if bounded.get('verdict')!='PASS' or bounded.get('summary',{}).get('replay_digest')!='731301488a1530af9009ab6acf6fd6ebccd2b36f84d4885fc26bc889c389379b':
              raise SystemExit('bounded result mismatch')
          Path('/tmp/work-verify-before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESULT_CI_RUN_ID" > /tmp/result-workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESULT_CI_RUN_ID/jobs?per_page=100" > /tmp/result-workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/result-workflow-run-full.json)" = "$RESULT_CI_HEAD"
          test "$(jq -r '.status' /tmp/result-workflow-run-full.json)" = completed
          test "$(jq -r '.conclusion' /tmp/result-workflow-run-full.json)" = success
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/result-workflow-jobs-full.json

      - name: Record and verify fresh exact source observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$EXPECTED_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.store import Store
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          projection={'status':state['status'],'owner_kind':state['owner_kind'],'execution_id':state['execution_id'],'lease_generation':state['lease_generation'],'fence_token_digest':Store(Path('.')).stable_digest(state['fence_token'],length=64),'heartbeat_at':state['heartbeat_at']}
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection,sort_keys=True)+'\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$EXPECTED_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          jq '{id,workflow_id,name,status,conclusion,head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[]|{id,name,status,conclusion}]|sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root=Path('.').resolve(); state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text()); now=Store(root).utc_now()
          work=verify_work_source_observation(root,run_id=os.environ['RUN_ID'],state=state,state_blob_sha=os.environ['EXPECTED_STATE_BLOB'],now=now)
          ci=verify_ci_source_observation(root,run_id=os.environ['RUN_ID'],state=state,now=now)
          continuity=assert_work_resume_continuity_preflight(root,run_id=os.environ['RUN_ID'],executor_binding=os.environ['EXECUTOR_BINDING'],model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True: raise SystemExit('continuity not authorized')
          print(json.dumps({'work':work,'ci':ci,'continuity':continuity},sort_keys=True))
          PY

      - name: Submit exact Execute output and freeze the next native boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/execute-output.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/execute-output.json'))
          if list(value)!=['result','local_learn','fragment'] or value['result'].get('status')!='PASS' or value['fragment'].get('component')!='execute':
              raise SystemExit('exact Execute output shape mismatch')
          PY
          continual --root . work-submit "$EXEC_WORK_ID" --response /tmp/execute-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/execute-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json
          cat /tmp/execute-submit.json
          cat /tmp/native-resume.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json

      - name: Validate exactly-once Execute completion and unique successor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_invocation,verify_work_invocations
          root=Path('.').resolve();run_id=os.environ['RUN_ID'];nid=os.environ['EXEC_NATIVE_ID'];wid=os.environ['EXEC_WORK_ID']
          expected_output=json.loads(Path('/tmp/execute-output.json').read_text())
          after=verify_work_invocations(root,run_id=run_id)
          expected_after={'valid':True,'requests':144,'responses':143,'pending':1,'native_completed':137,'native_fragments':137,'native_local_learn':125}
          for k,v in expected_after.items():
              if after.get(k)!=v: raise SystemExit(f'after count mismatch {k}: {after.get(k)!r} != {v!r}')
          completed=verified_work_invocation(root,wid)
          if completed.get('output')!=expected_output: raise SystemExit('persisted Execute output mismatch')
          native_path=root/'.continual/runs'/run_id/'invocations'/f'{nid}.json';native=json.loads(native_path.read_text())
          if native.get('status')!='complete' or native.get('component')!='execute' or native.get('output')!=expected_output:
              raise SystemExit('native Execute completion mismatch')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1: raise SystemExit(f'expected one successor, got {len(pending)}')
          request=pending[0]; next_wid=request['invocation_id']
          if request.get('component') not in {'candidate_evaluate','task_evaluate'}:
              raise SystemExit(f"unexpected successor component {request.get('component')!r}")
          if request.get('executor_binding')!=os.environ['EXECUTOR_BINDING'] or request.get('model_identity')!=os.environ['MODEL_IDENTITY']:
              raise SystemExit('successor identity mismatch')
          awaiting=[]
          for path in sorted((root/'.continual/runs'/run_id/'invocations').glob('*.json')):
              val=json.loads(path.read_text())
              if val.get('status')=='awaiting_work_model': awaiting.append((path,val))
          if len(awaiting)!=1 or awaiting[0][1].get('work_invocation_id')!=next_wid:
              raise SystemExit('successor native uniqueness mismatch')
          next_native_path,next_native=awaiting[0]
          req_rel=f'.continual/work-model/invocations/{next_wid}/request.json'
          if next_native.get('work_request_digest')!=request.get('request_digest') or next_native.get('work_request_ref')!=req_rel:
              raise SystemExit('successor native/request binding mismatch')
          response_rel=f'.continual/work-model/invocations/{wid}/response.json'
          fragment_rel=native['fragment_ref']
          local_rel=f'.continual/runs/{run_id}/local-learn/{nid}-execute.json'
          snapshot_rel=f'.continual/runs/{run_id}/snapshot.json'; snapshot=json.loads((root/snapshot_rel).read_text())
          summary={
           'execute_native_invocation_id':nid,'execute_work_invocation_id':wid,'execute_response_ref':response_rel,
           'execute_response_digest':completed['response']['response_digest'],'execute_response_blob_sha':subprocess.check_output(['git','hash-object',response_rel],text=True).strip(),
           'execute_native_blob_sha':subprocess.check_output(['git','hash-object',str(native_path)],text=True).strip(),
           'execute_fragment_ref':fragment_rel,'execute_fragment_blob_sha':subprocess.check_output(['git','hash-object',fragment_rel],text=True).strip(),
           'execute_local_learn_ref':local_rel,'execute_local_learn_blob_sha':subprocess.check_output(['git','hash-object',local_rel],text=True).strip(),
           'pending_native_invocation_id':next_native['invocation_id'],'pending_native_invocation_ref':next_native_path.relative_to(root).as_posix(),'pending_native_invocation_blob_sha':subprocess.check_output(['git','hash-object',str(next_native_path)],text=True).strip(),
           'pending_work_invocation_id':next_wid,'pending_request_ref':req_rel,'pending_request_digest':request['request_digest'],'pending_request_blob_sha':subprocess.check_output(['git','hash-object',req_rel],text=True).strip(),
           'pending_component':request['component'],'snapshot_revision':snapshot['revision'],'snapshot_phase':snapshot['phase'],'snapshot_component':snapshot['current_component'],'snapshot_blob_sha':subprocess.check_output(['git','hash-object',snapshot_rel],text=True).strip(),
           'verification':expected_after
          }
          Path('/tmp/consume-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          receipt={'schema_version':1,'record_type':'generation29_cross_source_execute_consume_receipt','recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},'source_main_sha':os.environ['RUNTIME_MAIN'],'source_state_blob_sha':os.environ['EXPECTED_STATE_BLOB'],'source_result_merge_sha':os.environ['RESULT_MERGE_SHA'],'source_ci_workflow_run_id':int(os.environ['RESULT_CI_RUN_ID']),'idempotency_key':'o-work-gen29:consume-execute-invoke-5c28ad87d810c530cf9f8371:freeze-independent-task-evaluate-boundary:v1','completed_effect':summary,'request_recreated':False,'response_repeated':False,'resume_required':True,'upper_objective_achieved':False,'agi_achieved':False,'next_action':'Protect and merge this exact Execute completion and unique successor, bind state by two-phase readback CAS, then consume the successor exactly once.'}
          rp=root/f'.continual/runs/{run_id}/recovery-receipts/gen29-cross-source-execute-consume-successor-freeze-v1.json';rp.parent.mkdir(parents=True,exist_ok=True);rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Stage only the exact lifecycle delta and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          run_id=os.environ['RUN_ID'];summary=json.loads(Path('/tmp/consume-summary.json').read_text())
          work_obs=json.loads(Path('/tmp/work-source-prepare.json').read_text())['observation_id'];ci_obs=json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          required={
           f'.continual/runs/{run_id}/events.jsonl',
           f'.continual/runs/{run_id}/invocations/{os.environ["EXEC_NATIVE_ID"]}.json',
           summary['execute_response_ref'],summary['execute_fragment_ref'],summary['execute_local_learn_ref'],
           summary['pending_native_invocation_ref'],summary['pending_request_ref'],
           f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json',
           f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json',
           f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json',
           f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json',
           f'.continual/runs/{run_id}/recovery-receipts/gen29-cross-source-execute-consume-successor-freeze-v1.json'
          }
          snapshot=f'.continual/runs/{run_id}/snapshot.json'
          status={}
          for line in subprocess.check_output(['git','diff','--name-status'],text=True).splitlines():
              code,path=line.split('\t',1);status[path]=code
          for path in subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()+subprocess.check_output(['git','ls-files','--others','--ignored','--exclude-standard'],text=True).splitlines():
              status.setdefault(path,'A')
          for path in list(status):
              if path.startswith('src/agi/__pycache__/') or path.startswith('src/continual/__pycache__/') or path.startswith('src/continual_chatgpt.egg-info/'): status.pop(path)
          if snapshot in status: required.add(snapshot)
          if set(status)!=required:
              raise SystemExit('lifecycle mutation mismatch: '+json.dumps({'missing':sorted(required-set(status)),'unexpected':sorted(set(status)-required),'status':status},sort_keys=True))
          if 'agi/WORK_EXECUTION_STATE.json' in status: raise SystemExit('state mutation must not be staged')
          for path in sorted(required):
              if not Path(path).is_file(): raise SystemExit('missing lifecycle file '+path)
          subprocess.run(['git','add','-f','--',*sorted(required)],check=True)
