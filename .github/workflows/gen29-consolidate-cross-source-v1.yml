name: gen29 consume cross-source Consolidate response v1

on:
  push:
    branches:
      - work/gen29-consolidate-cross-source-v1

permissions:
  contents: write

concurrency:
  group: gen29-consolidate-cross-source-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-consolidate-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 85662c3455d084e00b670ece111343b6a91f86e5
      EXPECTED_STATE_BLOB: 3eedb88eea7481bd29c22de650653b1fccedb145
      EXPECTED_SNAPSHOT_BLOB: cbc21f3dbd15a8de4c8275605f46c2b46f682556
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXPECTED_INBOX_REVISION: '38'
      CONSOLIDATE_NATIVE_ID: invoke-cb8d52043d61b9c66990bc2c
      CONSOLIDATE_NATIVE_BLOB: 93db1d756d12053451ad73b7cfec12e737d3ff95
      CONSOLIDATE_WORK_ID: invoke-2b68ec6d0e21b7c420fde35b
      CONSOLIDATE_REQUEST_BLOB: 7cb54ed9d835e619fbf5825d62f1f629789d325a
      CONSOLIDATE_REQUEST_DIGEST: ce92eefa139f7ddde5696d16f56157a22b2b6f8f373fff4feba7d49da1077b48
      SOURCE_CI_RUN_ID: '33513797649'
      SOURCE_CI_HEAD: 78bafb24b4b903d43f7bcbabe37fe8f7b0ec13a0
      RUN_ID: run-work-recovery-gen9-durability-repair
      EPISODE_ID: episode-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, runtime main, authority, and Consolidate binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          echo "DIAG_HEAD=$(git rev-parse HEAD) DIAG_RUNTIME_MAIN=$RUNTIME_MAIN DIAG_MERGE_BASE=$(git merge-base "$EXPECTED_MAIN" HEAD)"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          expected = ['.github/workflows/gen29-consolidate-cross-source-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', __import__('os').environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          python - "$EXPECTED_MAIN" "$RUNTIME_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('runtime main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe runtime-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          echo "DIAG_STATE=$RUNTIME_STATE_BLOB DIAG_INBOX=$(jq -r '.sha' /tmp/runtime-inbox-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          echo "DIAG_LOCAL_STATE=$(git hash-object agi/WORK_EXECUTION_STATE.json) DIAG_LOCAL_INBOX=$(git hash-object /tmp/runtime-inbox.json)"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          echo "DIAG_SNAPSHOT=$(git hash-object .continual/runs/$RUN_ID/snapshot.json) DIAG_REQUEST=$(git hash-object .continual/work-model/invocations/$CONSOLIDATE_WORK_ID/request.json) DIAG_NATIVE=$(git hash-object .continual/runs/$RUN_ID/invocations/$CONSOLIDATE_NATIVE_ID.json)"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          jq -e --arg native "$CONSOLIDATE_NATIVE_ID" --arg work "$CONSOLIDATE_WORK_ID" --arg nblob "$CONSOLIDATE_NATIVE_BLOB" --arg rblob "$CONSOLIDATE_REQUEST_BLOB" --arg rdigest "$CONSOLIDATE_REQUEST_DIGEST" '
            .execution_id == "work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3"
            and .lease_generation == 29 and .status == "running" and .resume_required == true
            and .active_component == "generation29_consolidate_cross_source_reconciliation_pending_native_consume"
            and .exact_continuation.status == "remote_main_readback_verified"
            and .exact_continuation.verified_remote_readback == true
            and .exact_continuation.pending_native_invocation_id == $native
            and .exact_continuation.pending_native_invocation_blob_sha == $nblob
            and .exact_continuation.pending_work_invocation_id == $work
            and .exact_continuation.pending_request_blob_sha == $rblob
            and .exact_continuation.pending_request_digest == $rdigest
            and .exact_continuation.pending_response_ref == null
            and .exact_continuation.response_exists_on_authoritative_remote == false
            and .exact_continuation.snapshot_revision == 134
            and .exact_continuation.native_phase == "consolidate_pending"
            and .exact_continuation.pending_component == "consolidate_episode"
            and .exact_continuation.durability_status == "pending_native_consume"
            and .exact_continuation.completed_effect.native_invocation_id == "invoke-002e7b508042a134bb24c405"
            and .exact_continuation.completed_effect.work_invocation_id == "invoke-64f6b0cd887538ecd50c0a24"
            and .exact_continuation.completed_effect.response_digest == "5472db83780a5567a772870d3d0ba392555213659affdadfabe45e2ae366609d"
            and .exact_continuation.completed_effect.agi_achieved == false
            and .generation29_task_evaluate_cross_source_reconciliation_consolidate_bind_v1.status == "remote_main_readback_verified"
            and .generation29_task_evaluate_cross_source_reconciliation_consolidate_bind_v1.verified_remote_readback == true
            and .generation29_task_evaluate_cross_source_reconciliation_consolidate_bind_v1.pending_continuation.native_invocation_id == $native
            and .generation29_task_evaluate_cross_source_reconciliation_consolidate_bind_v1.pending_continuation.work_invocation_id == $work
          ' agi/WORK_EXECUTION_STATE.json
          jq -e '.revision == 38' /tmp/runtime-inbox.json
          jq -e '.revision == 134 and .phase == "consolidate_pending"' ".continual/runs/$RUN_ID/snapshot.json"
          jq -e --arg d "$CONSOLIDATE_REQUEST_DIGEST" '.component == "consolidate_episode" and .request_digest == $d and .prompt_path == "prompts/consolidate_episode.md" and .payload.preflight_selection.decision == "USE_ACTIVE" and .executor_binding == "current_chatgpt_work_session" and .model_identity == "chatgpt-work-model-unverified"' ".continual/work-model/invocations/$CONSOLIDATE_WORK_ID/request.json"
          jq -e --arg work "$CONSOLIDATE_WORK_ID" --arg d "$CONSOLIDATE_REQUEST_DIGEST" '.status == "awaiting_work_model" and .component == "consolidate_episode" and .work_invocation_id == $work and .work_request_digest == $d' ".continual/runs/$RUN_ID/invocations/$CONSOLIDATE_NATIVE_ID.json"
          test ! -e ".continual/work-model/invocations/$CONSOLIDATE_WORK_ID/response.json"
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/preflight-work-verify.json
          cat /tmp/preflight-work-verify.json
          jq -e '.valid == true and .requests == 146 and .responses == 145 and .pending == 1 and .native_completed == 139 and .native_fragments == 139 and .native_local_learn == 127' /tmp/preflight-work-verify.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/preflight-work-pending.json
          jq -e --arg work "$CONSOLIDATE_WORK_ID" '.pending | length == 1 and .[0].invocation_id == $work and .[0].component == "consolidate_episode"' /tmp/preflight-work-pending.json
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json
          cat /tmp/work-checkpoint-before.json
          jq -e '.valid == true' /tmp/work-checkpoint-before.json

      - name: Record fresh exact main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'], 'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'], 'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          python - "$EXPECTED_MAIN" "$LATEST_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('latest main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe latest-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Submit exact Consolidate response and freeze Learn
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/consolidate-output.json <<'JSON'
          {
            "result": {
              "episode_id": "episode-work-recovery-gen9-durability-repair",
              "episode_type": "bounded_cross_source_country_data_reconciliation_and_evaluation",
              "execute_unit_id": "unit-generation29-cross-source-data-reconciliation-v1",
              "evaluation_unit_id": "unit-generation29-evaluate-cross-source-data-reconciliation-v1",
              "status": "continue",
              "episode_summary": "A source-readiness-first, read-only reconciliation compared two exact public country datasets under frozen selectors, source/blob identities, normalization, thresholds, ten queries, two fail-closed corruption controls, deterministic replay, contamination exclusions, and zero-upstream-write budgets. Independent Task Evaluate reproduced the normalized records, all forty divergence keys and metrics, both control rejections, and the replay digest, returning bounded unit PASS while retaining task/user FAIL and agi_claim_supported=false. Both Candidate boundaries selected the protected active baseline and authorized no activation.",
              "claim_boundary": "PASS applies only to the exact frozen datasets/country-codes and samayo/country-json commits and four blobs under the precommitted normalization, thresholds, ten queries, two corruption controls, replay rule, contamination exclusions, zero-upstream-write budget, and supplied request-time publication evidence. It excludes generalized data reliability, changing upstreams, production behavior, independent external capability, Candidate activation, AGI, upper-objective achievement, and user-level completion.",
              "environment": {
                "model_identity": "chatgpt-work-model-unverified",
                "executor_binding": "current_chatgpt_work_session",
                "run_id": "run-work-recovery-gen9-durability-repair",
                "source_commits": {
                  "datasets/country-codes": "6a595f1a6f10b3d00175fe67375da88f64f7f76b",
                  "samayo/country-json": "41d4084bc1ccf9614dab45255a41ba3a5473be74"
                },
                "component_repository_commits": {
                  "selection_root": "f5fb42fc928339c52660d377393cc9062e7e9609",
                  "pre_execute_candidate": "d4ecb8ec26ce0839385ea5541aa4c02bddd2657b",
                  "execute": "a9329e7d9be62efd22053d66d235feddef3d6b53",
                  "post_execute_root": "4928a146dd55487a37f183169254e84c9c0d2212",
                  "pre_task_evaluate_candidate": "857ba49741215d63b9189aece052db00a39509b0",
                  "task_evaluate": "5ebb207c5cceab150d6d17cd37917bfb5853220e"
                }
              },
              "sequence": [
                {
                  "step": 1,
                  "component": "root",
                  "invocation_id": "invoke-61622cc42438018f9e4d5108",
                  "kind": "unit_selection",
                  "summary": "Changed domain from the preceding non-evaluable repair-transfer unit to a source-readiness-first cross-source public-data reconciliation."
                },
                {
                  "step": 2,
                  "component": "candidate_evaluate",
                  "invocation_id": "invoke-4207db89def9709f3545b270",
                  "kind": "pre_execute",
                  "summary": "Selected BASELINE_FIRST with the active Execute prompt and frozen source-readiness controls; no Candidate was activated."
                },
                {
                  "step": 3,
                  "component": "execute",
                  "invocation_id": "invoke-bc78eb5f075bb06ef6a4f92d",
                  "kind": "bounded_reconciliation",
                  "summary": "Produced exact normalized records, forty declared divergences, passing thresholds and ten queries, two rejected corruption controls, a byte-stable replay digest, and zero upstream writes."
                },
                {
                  "step": 4,
                  "component": "root",
                  "invocation_id": "invoke-fefcb593d1e33b69308cb773",
                  "kind": "routing",
                  "summary": "Routed the locally complete Execute result to the smallest independent bounded adjudication before consolidation."
                },
                {
                  "step": 5,
                  "component": "candidate_evaluate",
                  "invocation_id": "invoke-0be83d0a11994dff9bbc4b2c",
                  "kind": "pre_task_evaluate",
                  "summary": "Selected BASELINE_FIRST with unchanged active Task Evaluate and the exact frozen reconciliation evidence; no evaluation overlay or activation."
                },
                {
                  "step": 6,
                  "component": "task_evaluate",
                  "invocation_id": "invoke-002e7b508042a134bb24c405",
                  "kind": "independent_adjudication",
                  "summary": "Reproduced exact source identities, records, metrics, forty divergences, thresholds, queries, corruption-control rejections, replay, and zero-write audit; returned unit PASS, task/user FAIL, and AGI false."
                },
                {
                  "step": 7,
                  "component": "side_effect_state",
                  "kind": "frozen_request_boundary",
                  "summary": "The eight Execute artifacts and their PR407 publication facts are supplied as request-time evidence. The Task Evaluate lifecycle, this Consolidate response, Learn, and successor Root require their own later publication/readback; no later fact is backfilled."
                }
              ],
              "candidate_decisions": [
                {
                  "phase": "pre_execute",
                  "candidate_id": null,
                  "decision": "BASELINE_FIRST",
                  "activation_authorized": false,
                  "detail": "Used the unchanged active Execute prompt with the frozen source-readiness-first protocol."
                },
                {
                  "phase": "pre_task_evaluate",
                  "candidate_id": null,
                  "decision": "BASELINE_FIRST",
                  "activation_authorized": false,
                  "detail": "Used unchanged active Task Evaluate to preserve independent bounded adjudication."
                },
                {
                  "phase": "post_task_evaluate",
                  "candidate_id": null,
                  "decision": "NO_CANDIDATE_PRODUCED",
                  "activation_authorized": false,
                  "global_activation_authorized": false,
                  "detail": "Task Evaluate produced no candidate and no activation path is implied by the bounded PASS."
                }
              ],
              "evidence_classes": {
                "observation": [
                  "Checked-in selector/readiness, normalized-source, reconciliation, corruption-control, replay, bounded-result, mutation-audit, and Task Evaluate artifacts plus exact upstream commit/blob readbacks supplied in the frozen request."
                ],
                "external_evidence": [
                  "The payload cites exact public GitHub source commits/blobs and protected GitHub Actions/merge readbacks. These are source and repository-integrity evidence, not an independent generalized capability or production evaluation."
                ],
                "inference": [
                  "Within the exact frozen protocol, the two source datasets satisfy every declared coverage threshold while retaining forty explicit divergences and two fail-closed corruption controls."
                ],
                "model_self_report": [
                  "Root, Candidate, Execute, Task Evaluate, and Consolidate summaries are model-generated except where bound to the cited immutable artifacts and receipts."
                ],
                "later_user_feedback": "No later user-authored feedback is supplied inside this frozen invocation payload."
              },
              "objective_evidence": [
                {
                  "kind": "precommit_and_readiness",
                  "ref": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-source-data-reconciliation-v1/precommitted-selector-manifest.json",
                  "finding": "The selector manifest fixed repositories, commits, blobs, schemas, normalization, metrics, thresholds, ten queries, controls, replay, exclusions, and zero-write budgets before target acquisition; readiness was separately recorded after exact readback."
                },
                {
                  "kind": "exact_source_identity",
                  "ref": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-source-data-reconciliation-v1/source-readiness.json",
