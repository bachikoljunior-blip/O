                },
                {
                  "kind": "normalized_source_reproduction",
                  "ref": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-source-data-reconciliation-v1/normalized-sources.json",
                  "finding": "Independent parsing reproduced 249 left and 245 right normalized records byte-for-value."
                },
                {
                  "kind": "deterministic_reconciliation",
                  "ref": ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-source-data-reconciliation-v1/reconciliation-report.json",
                  "finding": "Overlap=242, union=252, overlap/smaller=0.9877551020408163, Jaccard=0.9603174603174603, exact names=212, NFKC/casefold equal=1, distinct nonempty overlapping names=29, left-only=7, right-only=3, and forty ordered divergence keys."
                },
