name: live-agi-development

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI API model alias or snapshot
        required: true
        default: gpt-5
        type: string
      runs:
        description: Number of repeated campaign runs
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: live-agi-development
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Require configured API key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY repository secret is not configured." >&2
            exit 1
          fi
      - name: Run bounded development campaign
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.runs }}" in
            1|2|3|4|5) ;;
            *) echo "runs must be an integer from 1 through 5" >&2; exit 2 ;;
          esac
          campaign_id="openai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output_dir=".continual/evidence/campaigns/${campaign_id}"
          agi-benchmark run-campaign-openai \
            --model "${OPENAI_MODEL}" \
            --runs "${{ inputs.runs }}" \
            --campaign-id "${campaign_id}" \
            --output-dir "${output_dir}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agi-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: .continual/evidence/campaigns/
          if-no-files-found: warn
          retention-days: 90
