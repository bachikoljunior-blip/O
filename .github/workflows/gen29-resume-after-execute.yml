name: gen29 resume after execute v3

on:
  push:
    branches:
      - agent/recovery-gen29-resume-after-execute-v3

permissions:
  contents: write

concurrency:
  group: gen29-resume-after-execute-v3
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-after-execute-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: f1cd8c9ef251a3f25558a95717e740ab1bcf66b6
      EXPECTED_STATE_BLOB: eed42e38643d927fabdf9cb208ab48c21eed764a
      EXPECTED_SNAPSHOT_BLOB: 48e919441f25db4a7e89d88c04888dff4d590e4f
      EXPECTED_REQUEST_BLOB: 85f97e7ec6942d9853d38e8b3e19f67206845ec4
      EXPECTED_RESPONSE_BLOB: 4b65ea2b1b75afa62ebbfe4be1f1f14b599643d6
      EXPECTED_REQUEST_DIGEST: 953e1139e714b04cf1e9f4d4b92e1738c3b8d092392d009b1ba41d1356be2802
      EXPECTED_RESPONSE_DIGEST: 9ad64d8f81fd256016fcf913826872d3e76b6dcce0f7cf9adbcba453416ee155
      RUN_ID: run-work-recovery-gen9-durability-repair
      OLD_NATIVE_ID: invoke-46f38354bc1b6c8a4d6b6564
      OLD_WORK_ID: invoke-e750825c4d5987ec613de791
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      SOURCE_CI_RUN_ID: '33238893400'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .
      - name: Assert exact main, authority, and frozen Execute response
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base "${EXPECTED_MAIN}" HEAD)" = "${EXPECTED_MAIN}"
          cat > /tmp/validate-runtime-main.py <<'PY'
          import json
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          merge_base = subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip()
          if merge_base != base:
              raise SystemExit(f'runtime main is not a descendant of checkpoint: {merge_base} != {base}')
          lines = subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines()
          allowed = ('note/automation_control/receipts/', 'note/research_workers_clean_g1/')
          observed = []
          for line in lines:
              status, path = line.split('\t', 1)
              if status != 'A' or not path.startswith(allowed):
                  raise SystemExit(f'non-receipt runtime main delta rejected: {status} {path}')
              observed.append({'status': status, 'path': path})
          print('RUNTIME_MAIN_DELTA=' + json.dumps(observed, sort_keys=True))
          PY
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${RUNTIME_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${RUNTIME_MAIN}" > /tmp/runtime-state-document.json
          test "$(jq -r '.sha' /tmp/runtime-state-document.json)" = "${EXPECTED_STATE_BLOB}"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "${EXPECTED_STATE_BLOB}"
          test "$(git hash-object .continual/runs/${RUN_ID}/snapshot.json)" = "${EXPECTED_SNAPSHOT_BLOB}"
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/request.json)" = "${EXPECTED_REQUEST_BLOB}"
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/response.json)" = "${EXPECTED_RESPONSE_BLOB}"
          mapfile -t launch_delta < <(git diff --name-only "${EXPECTED_MAIN}" HEAD)
          test "${#launch_delta[@]}" -eq 1
          test "${launch_delta[0]}" = ".github/workflows/gen29-resume-after-execute.yml"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          request = json.loads((root / '.continual/work-model/invocations/invoke-e750825c4d5987ec613de791/request.json').read_text())
          response = json.loads((root / '.continual/work-model/invocations/invoke-e750825c4d5987ec613de791/response.json').read_text())
          native = json.loads((root / '.continual/runs/run-work-recovery-gen9-durability-repair/invocations/invoke-46f38354bc1b6c8a4d6b6564.json').read_text())
          fence_digest = hashlib.sha256(
              json.dumps(state['fence_token'], ensure_ascii=False, sort_keys=True, separators=(',', ':'), default=str).encode()
          ).hexdigest()
          if state['execution_id'] != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state['lease_generation'] != 29 or fence_digest != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state['status'] != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if request['request_digest'] != '953e1139e714b04cf1e9f4d4b92e1738c3b8d092392d009b1ba41d1356be2802':
              raise SystemExit('request digest mismatch')
          if response['request_digest'] != request['request_digest'] or response['response_digest'] != '9ad64d8f81fd256016fcf913826872d3e76b6dcce0f7cf9adbcba453416ee155':
              raise SystemExit('response binding mismatch')
          if native.get('status') != 'awaiting_work_model' or native.get('work_invocation_id') != request['invocation_id']:
              raise SystemExit('native is not awaiting the exact Work invocation')
          PY
      - name: Assert causal continuity and capture before state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          result = assert_work_resume_continuity_preflight(
              Path('.'),
              run_id='run-work-recovery-gen9-durability-repair',
              executor_binding='current_chatgpt_work_session',
              model_identity='chatgpt-work-model-unverified',
          )
          if result.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight did not authorize exact resume')
          print('CONTINUITY_PREFLIGHT=' + json.dumps(result, sort_keys=True))
          PY
          continual --root . work-verify --run-id "${RUN_ID}" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "${RUN_ID}" > /tmp/work-pending-before.json
          cat /tmp/work-verify-before.json
          cat /tmp/work-pending-before.json
      - name: Precommit and record runtime latest GitHub main observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          OBSERVED_MAIN="$(git rev-parse origin/main)"
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${OBSERVED_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${OBSERVED_MAIN}" > /tmp/remote-state-document.json
          test "$(jq -r '.sha' /tmp/remote-state-document.json)" = "${EXPECTED_STATE_BLOB}"
          continual --root . work-source-observation-prepare "${RUN_ID}" --state-blob-sha "${EXPECTED_STATE_BLOB}" --expected-commit-sha "${OBSERVED_MAIN}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-prepare.json
          echo "OBSERVED_MAIN=${OBSERVED_MAIN}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          document = json.loads(Path('/tmp/remote-state-document.json').read_text())
          content = base64.b64decode(''.join(document['content'].splitlines())).decode()
          state = json.loads(content)
          digest = hashlib.sha256(
              json.dumps(state['fence_token'], ensure_ascii=False, sort_keys=True, separators=(',', ':'), default=str).encode()
          ).hexdigest()
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': digest,
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "${RUN_ID}" "${WORK_OBSERVATION_ID}" --request-digest "${WORK_REQUEST_DIGEST}" --commit-sha "${OBSERVED_MAIN}" --blob-sha "${EXPECTED_STATE_BLOB}" --projection /tmp/work-source-projection.json --observed-at "${OBSERVED_AT}" --executor-binding "${EXECUTOR_BINDING}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-receipt.json
      - name: Precommit and record exact fixed-policy successful CI observation
        shell: bash
        run: |
          set -euo pipefail
          continual --root . ci-source-observation-prepare "${RUN_ID}"             --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-prepare.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}" > /tmp/workflow-run-full.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "${RUN_ID}" "${CI_OBSERVATION_ID}"             --request-digest "${CI_REQUEST_DIGEST}"             --workflow-run /tmp/workflow-run-projection.json             --jobs /tmp/workflow-jobs-projection.json             --observed-at "${OBSERVED_AT}"             --executor-binding "${EXECUTOR_BINDING}"             --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-receipt.json
      - name: Verify fresh receipts and runtime authority before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          python /tmp/validate-runtime-main.py "${EXPECTED_MAIN}" "${LATEST_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${LATEST_MAIN}" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "${EXPECTED_STATE_BLOB}"
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(
              root, run_id='run-work-recovery-gen9-durability-repair',
              state=state, state_blob_sha='eed42e38643d927fabdf9cb208ab48c21eed764a', now=now,
          )
          ci = verify_ci_source_observation(
              root, run_id='run-work-recovery-gen9-durability-repair', state=state, now=now,
          )
          print('WORK_SOURCE_VERIFY=' + json.dumps(work, sort_keys=True))
          print('CI_SOURCE_VERIFY=' + json.dumps(ci, sort_keys=True))
          PY
      - name: Consume exact Execute response once and reach Task Evaluate boundary
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-resume "${RUN_ID}"             --max-steps 1             --executor-binding "${EXECUTOR_BINDING}"             --model-identity "${MODEL_IDENTITY}" > /tmp/native-resume.json
          cat /tmp/native-resume.json
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/request.json)" = "${EXPECTED_REQUEST_BLOB}"
          test "$(git hash-object .continual/work-model/invocations/${OLD_WORK_ID}/response.json)" = "${EXPECTED_RESPONSE_BLOB}"
          test "$(git hash-object .continual/runs/${RUN_ID}/snapshot.json)" = "${EXPECTED_SNAPSHOT_BLOB}"
          continual --root . work-verify --run-id "${RUN_ID}" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "${RUN_ID}" > /tmp/work-pending-after.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json
      - name: Validate completed Execute and one exact next pending request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations
          root = Path('.').resolve()
          run_id = 'run-work-recovery-gen9-durability-repair'
          run_dir = root / '.continual' / 'runs' / run_id
          old_native_id = 'invoke-46f38354bc1b6c8a4d6b6564'
          old_work_id = 'invoke-e750825c4d5987ec613de791'
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_before = {
              'valid': True, 'requests': 85, 'responses': 85, 'pending': 0,
              'native_completed': 78, 'native_fragments': 78, 'native_local_learn': 72,
          }
          for key, expected in expected_before.items():
              if before.get(key) != expected:
                  raise SystemExit(f'before verification mismatch for {key}: {before.get(key)!r} != {expected!r}')
          expected_after = {
              'valid': True, 'requests': 86, 'responses': 85, 'pending': 1,
              'native_completed': 79, 'native_fragments': 79, 'native_local_learn': 73,
          }
          for key, expected in expected_after.items():
              if after.get(key) != expected:
                  raise SystemExit(f'after verification mismatch for {key}: {after.get(key)!r} != {expected!r}')
          journal = json.loads((run_dir / 'invocations' / f'{old_native_id}.json').read_text())
          response = json.loads((root / '.continual/work-model/invocations' / old_work_id / 'response.json').read_text())
          if journal.get('status') != 'complete' or journal.get('component') != 'execute':
              raise SystemExit('old Execute native invocation was not completed exactly')
          if journal.get('output') != response.get('output'):
              raise SystemExit('completed native output differs from exact response')
          if 'work_invocation_id' in journal or 'work_request_ref' in journal:
              raise SystemExit('complete journal retained stale awaiting-work fields')
          if not (run_dir / 'fragments' / f'{old_native_id}-execute.json').is_file():
              raise SystemExit('Execute fragment missing')
          if not (run_dir / 'local-learn' / f'{old_native_id}-execute.json').is_file():
              raise SystemExit('Execute local learn missing')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one next pending request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'task_evaluate' or request.get('invocation_id') == old_work_id:
              raise SystemExit('next pending Work request is not the unique Task Evaluate boundary')
          if request.get('executor_binding') != 'current_chatgpt_work_session' or request.get('model_identity') != 'chatgpt-work-model-unverified':
              raise SystemExit('next Work binding mismatch')
          if (root / '.continual/work-model/invocations' / request['invocation_id'] / 'response.json').exists():
              raise SystemExit('next Work response unexpectedly exists')
          awaiting = []
          for path in sorted((run_dir / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append(value)
          if len(awaiting) != 1 or awaiting[0].get('component') != 'task_evaluate' or awaiting[0].get('work_invocation_id') != request['invocation_id']:
              raise SystemExit('next native/Work Task Evaluate binding mismatch')
          summary = {
              'completed_native_invocation_id': old_native_id,
              'completed_work_invocation_id': old_work_id,
              'completed_response_digest': '9ad64d8f81fd256016fcf913826872d3e76b6dcce0f7cf9adbcba453416ee155',
              'next_native_invocation_id': awaiting[0]['invocation_id'],
              'next_work_invocation_id': request['invocation_id'],
              'next_request_digest': request['request_digest'],
              'next_component': request['component'],
              'verification': {key: after[key] for key in expected_after},
          }
          Path('/tmp/native-result-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print('NATIVE_RESULT=' + json.dumps(summary, sort_keys=True))
          PY
      - name: Persist bounded result receipt and push once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          summary = json.loads(Path('/tmp/native-result-summary.json').read_text())
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_native_after_execute_consume_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': __import__('os').environ['OBSERVED_MAIN'],
              'source_state_blob_sha': 'eed42e38643d927fabdf9cb208ab48c21eed764a',
              'source_ci_workflow_run_id': 33238893400,
              'idempotency_key': 'o-work-gen29:invoke-46f38354bc1b6c8a4d6b6564:consume-execute-response-once:v1',
              'completed_effect': summary,
              'resume_required': True,
              'next_action': 'Submit exactly one Work response to the newly frozen Task Evaluate request, then resume from that exact native journal without recreating any request.',
          }
          path = Path('.continual/runs/run-work-recovery-gen9-durability-repair/recovery-receipts/gen29-native-after-execute-f1cd8c9e-v3.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          paths = [line[3:] for line in changed]
          prefixes = (
              '.continual/runs/run-work-recovery-gen9-durability-repair/work-source-observations/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/ci-source-observations/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/invocations/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/fragments/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/local-learn/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/preflight/',
              '.continual/runs/run-work-recovery-gen9-durability-repair/recovery-receipts/',
              '.continual/work-model/invocations/',
          )
          exact = {'.continual/runs/run-work-recovery-gen9-durability-repair/events.jsonl'}
          unexpected = [p for p in paths if p not in exact and not p.startswith(prefixes)]
          if unexpected:
              raise SystemExit('unexpected native-after-execute mutations: ' + ', '.join(unexpected))
          if not paths:
              raise SystemExit('native resume produced no durable mutation')
          print('CHANGED_PATHS=' + '\n'.join(paths))
          PY
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "${EXPECTED_STATE_BLOB}"
          test "$(git hash-object .continual/runs/${RUN_ID}/snapshot.json)" = "${EXPECTED_SNAPSHOT_BLOB}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- ".continual/runs/${RUN_ID}/events.jsonl" ".continual/runs/${RUN_ID}/invocations/${OLD_NATIVE_ID}.json"
          while IFS= read -r generated_path; do
            case "${generated_path}" in
              ".continual/runs/${RUN_ID}/work-source-observations/"*|              ".continual/runs/${RUN_ID}/ci-source-observations/"*|              ".continual/runs/${RUN_ID}/invocations/"*|              ".continual/runs/${RUN_ID}/fragments/"*|              ".continual/runs/${RUN_ID}/local-learn/"*|              ".continual/runs/${RUN_ID}/preflight/"*|              ".continual/runs/${RUN_ID}/recovery-receipts/"*|              ".continual/work-model/invocations/"*)
                git add -f -- "${generated_path}"
                ;;
            esac
          done < <( { git ls-files --others --exclude-standard; git ls-files --others --ignored --exclude-standard; } | sort -u )
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          run_id = 'run-work-recovery-gen9-durability-repair'
          old_native = 'invoke-46f38354bc1b6c8a4d6b6564'
          summary = json.loads(Path('/tmp/native-result-summary.json').read_text())
          work_prepare = json.loads(Path('/tmp/work-source-prepare.json').read_text())
          ci_prepare = json.loads(Path('/tmp/ci-source-prepare.json').read_text())
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          prefixes = (
              f'.continual/runs/{run_id}/work-source-observations/',
              f'.continual/runs/{run_id}/ci-source-observations/',
              f'.continual/runs/{run_id}/invocations/',
              f'.continual/runs/{run_id}/fragments/',
              f'.continual/runs/{run_id}/local-learn/',
              f'.continual/runs/{run_id}/preflight/',
              f'.continual/runs/{run_id}/recovery-receipts/',
              '.continual/work-model/invocations/',
          )
          exact = {f'.continual/runs/{run_id}/events.jsonl'}
          unexpected = [p for p in staged if p not in exact and not p.startswith(prefixes)]
          if unexpected:
              raise SystemExit('unexpected staged paths: ' + ', '.join(unexpected))
          next_native = summary['next_native_invocation_id']
          next_work = summary['next_work_invocation_id']
          work_obs = work_prepare['observation_id']
          ci_obs = ci_prepare['observation_id']
          required = {
              f'.continual/runs/{run_id}/events.jsonl',
              f'.continual/runs/{run_id}/invocations/{old_native}.json',
              f'.continual/runs/{run_id}/invocations/{next_native}.json',
              f'.continual/runs/{run_id}/fragments/{old_native}-execute.json',
              f'.continual/runs/{run_id}/local-learn/{old_native}-execute.json',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json',
              f'.continual/runs/{run_id}/recovery-receipts/gen29-native-after-execute-f1cd8c9e-v3.json',
              f'.continual/work-model/invocations/{next_work}/request.json',
          }
          missing = sorted(required - set(staged))
          if missing:
              raise SystemExit('required staged lifecycle paths missing: ' + ', '.join(missing))
          preflight = [p for p in staged if p.startswith(f'.continual/runs/{run_id}/preflight/')]
          if len(preflight) != 1:
              raise SystemExit(f'expected one next-component preflight, got {preflight!r}')
          if any(p.endswith('/response.json') and next_work in p for p in staged):
              raise SystemExit('next Work response must not be staged before Work answers it')
          print('STAGED_PATHS=' + '\n'.join(staged))
          PY
          git commit -m '[native-after-execute-result] gen29 consume exact Execute response'
          git push origin "HEAD:${GITHUB_REF_NAME}"
