name: gen29 consume Candidate Evaluate and freeze formal-proof Execute v1

on:
  push:
    branches:
      - work/gen29-candidate-formal-proof-preflight-v1

permissions:
  contents: write

concurrency:
  group: gen29-candidate-formal-proof-preflight-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-candidate-formal-proof-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN: 625e17044463123974e2ec9fabb34a2c2f5dad86
      EXPECTED_STATE_BLOB: c77a6d748bb18a98ade99bf97b5f1002b3f3632f
      EXPECTED_SNAPSHOT_BLOB: f85c5321c44b004c1bd01f9f7441be08b0c2b9eb
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      CAND_NATIVE_ID: invoke-ed94ce2e2204b683b42af73c
      CAND_NATIVE_BLOB: 654faf52ebad711956387b28d09c742c1e155551
      CAND_WORK_ID: invoke-41fe14117283ba173c0fb998
      CAND_REQUEST_BLOB: 44ebfd3cacf195f5ddf1c763bcf2502069c87ae3
      CAND_REQUEST_DIGEST: 0460c645a61533258a54b53a1d487cb01f235c3df81d926fe1e71a1893a27ef3
      RUN_ID: run-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .
      - name: Verify authority and unique frozen Candidate Evaluate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object agi/USER_INPUT_INBOX.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$CAND_WORK_ID/request.json)" = "$CAND_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$CAND_NATIVE_ID.json)" = "$CAND_NATIVE_BLOB"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_request,verify_work_invocations
          root=Path('.').resolve();run_id=os.environ['RUN_ID'];wid=os.environ['CAND_WORK_ID'];nid=os.environ['CAND_NATIVE_ID']
          state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text())
          req=verified_work_request(root,wid)
          native=json.loads((root/'.continual/runs'/run_id/'invocations'/f'{nid}.json').read_text())
          checks=[
            state['execution_id']=='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
            state['lease_generation']==29,
            hashlib.sha256(state['fence_token'].encode()).hexdigest()=='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
            state['status']=='running',state['resume_required'] is True,
            state['active_component']=='generation29_candidate_formal_proof_synthesis_pending_native_consume',
            state['finalization_readback_verified'] is True,
            state['pending_work_invocation_id']==wid,
            state['pending_request_digest']==os.environ['CAND_REQUEST_DIGEST'],
            state['response_exists_on_authoritative_remote'] is False,
            req['component']=='candidate_evaluate',req['request_digest']==os.environ['CAND_REQUEST_DIGEST'],
            native['status']=='awaiting_work_model',native['work_invocation_id']==wid,
          ]
          if not all(checks): raise SystemExit('authority/frozen Candidate Evaluate mismatch')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0]['invocation_id']!=wid: raise SystemExit(f'pending mismatch: {pending}')
          before=verify_work_invocations(root,run_id=run_id)
          expected={'valid':True,'requests':149,'responses':148,'pending':1,'native_completed':142,'native_fragments':142,'native_local_learn':129}
          for k,v in expected.items():
            if before.get(k)!=v: raise SystemExit(f'before mismatch {k}: {before.get(k)} != {v}')
          print(json.dumps(before,sort_keys=True))
          PY
      - name: Submit exact Candidate Evaluate response and freeze Execute
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidate-output.json <<'CANDJSON'
          {
            "fragment": {
              "component": "candidate_evaluate",
              "mode": "pre-application",
              "unit_id": "unit-generation29-external-formal-proof-synthesis-v1",
              "selected_strategy": "unchanged active Execute prompt with the frozen formal-proof protocol",
              "candidate_activation": false,
              "claim_boundary": "This selects only a baseline for one bounded formal-proof trial. It does not activate a Candidate or establish generalized capability, production readiness, AGI, upper-objective achievement, or user-level completion.",
              "continuation": "Execute the exact precommitted theorem-selection and proof-synthesis protocol, independently Task Evaluate it, then continue the post-result lifecycle and next materially different safe unit."
            },
            "local_learn": {
              "candidates": [],
              "decision": "NO_CHANGE",
              "observations": [
                "The AGI benchmark overlay is directionally relevant but remains NEED_MORE_EVIDENCE for capability evaluation; applying it before a protected exact-scope comparison would confound the formal-proof baseline.",
                "The workspace-campaign index entry cannot be applied because its declared dependency is not verified and its prompt artifact is absent at the exact source head.",
                "The frozen Root unit already enforces held-out selection, mechanical judging, negative controls, strict bounded claims, and post-result independent evaluation."
              ]
            },
            "result": {
              "decision": "BASELINE_FIRST",
              "evaluated_candidate_id": "candidate-agi-benchmark-suite-v1",
              "scope": "agi/capability-evaluation/external-formal-proof-synthesis-v1",
              "candidate_activation": false,
              "global_activation_authorized": false,
              "agi_claim_supported": false,
              "upper_objective_achieved": false,
              "user_level_objective_met": false,
              "applicability": [
                {
                  "candidate_id": "candidate-agi-benchmark-suite-v1",
                  "decision": "BASELINE_FIRST",
                  "reason": "The Candidate can affect this capability-evaluation Execute call, but its exact scope state is NEED_MORE_EVIDENCE and it has no protected baseline comparison for this formal-proof unit. Preserve the active Execute prompt while collecting the mechanically judged evidence the Candidate calls for."
                },
                {
                  "candidate_id": "candidate-workspace-campaign-v1",
                  "decision": "BLOCKED",
                  "reason": "The index targets capability evaluation, but it depends on candidate-agi-benchmark-suite-v1 and neither its candidate record nor prompt artifact exists at the exact source head. It cannot safely modify this call."
                },
                {
                  "candidate_id": "candidate-bounded-recursive-context-retrieval-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The upcoming unit is theorem selection and proof synthesis, not recursive-context retrieval."
                },
                {
                  "candidate_id": "candidate-c6c462472386c57b124d",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The upcoming unit executes a frozen protocol rather than authoring a campaign."
                },
                {
                  "candidate_id": "candidate-copilot-sdk-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The exact scope excludes live model-campaign migration and provider routing."
                },
                {
                  "candidate_id": "candidate-github-models-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The exact scope excludes live model-campaign migration and provider routing."
                },
                {
                  "candidate_id": "candidate-live-campaign-stage-isolation-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The exact unit does not use a live campaign or its stage routing."
                },
                {
                  "candidate_id": "candidate-live-request-status-rendezvous-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The exact unit does not launch an asynchronous live-model request."
                },
                {
                  "candidate_id": "candidate-self-application-context-hygiene-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "The exact unit evaluates an external Lean theorem under a frozen protocol rather than changing O repository-development context handling."
                }
              ],
              "baseline": "Use the unchanged active Execute prompt. Before any theorem solution is read or generated, durably freeze the deterministic selector, repository and commit, license, theorem statement and import closure, Lean toolchain, allowed paths, budgets, success rules, and contamination exclusions. Then synthesize one proof, compile it under the exact toolchain, run relevant upstream checks, require both precommitted negative controls to fail closed, replay from the immutable commit, and record zero upstream writes.",
              "evidence_to_collect": [
                "exact pre-proof selector manifest plus remote commit/blob readbacks for repository, license, theorem statement, imports, and lean-toolchain",
                "a solution-access contamination audit and a failing unfilled/sentinel baseline",
                "the minimal proof text, exact patch/apply receipt, compiler output, and relevant upstream regression result",
                "corrupted-proof and changed-statement-or-import controls that both fail closed",
                "clean replay identities, timing/resource receipts, mutation audit, protected exact-head CI, expected-head merge, and exact artifact readbacks",
                "separate bounded SOLVED/FAILED/NOT_EVALUABLE, upper-objective, user-level, Candidate-activation, and AGI verdicts"
              ],
              "regression_checks": [
                "no theorem, statement, import, toolchain, selector, budget, or contamination rule drifts after precommit",
                "no sorry, admit, new axiom, unsafe escape, theorem weakening, unrelated change, answer-bearing later commit, hidden proof, or external proof service is used",
                "the exact compiler and relevant upstream check pass only for the candidate proof while both corrupted controls fail",
                "clean replay is semantically identical and all upstream writes, comments, forks, deployments, credentials, and routing changes remain zero",
                "a bounded proof success is never widened into generalized capability, Candidate activation, production readiness, AGI, or completion"
              ],
              "rollback": "On missing immutable inputs, contamination, build failure, negative-control acceptance, replay drift, or unverifiable provenance, preserve the exact frozen request and evidence, return FAILED or NOT_EVALUABLE for only the bounded unit, make no Candidate or routing change, and continue safe repair or a materially different unit.",
              "cost_dimensions": {
                "quality": "Mechanical Lean compilation, exact identities, negative controls, and independent post-result evaluation dominate self-report.",
                "latency": "Measure selector, toolchain setup, compile, regression, and replay durations for this bounded unit only.",
                "token": "Record directly measured model usage if available; do not infer absent usage.",
                "tool": "Use read-only immutable Git sources, an isolated exact Lean toolchain, protected O CI, and exact blob readback.",
                "external": "No provider switch, credential use, upstream mutation, issue comment, fork mutation, deployment, or paid external proof service.",
                "failure_risk": "Primary risks are solution leakage, theorem or import drift, toolchain mismatch, prohibited proof escapes, flaky build substitution, and claim widening."
              },
              "reason": "Baseline-first preserves causal attribution. The only directly applicable Candidate is not verified for this exact scope, while the frozen Root protocol already demands representative held-out selection, mechanical evidence, strict negative controls, and truthful claim separation."
            }
          }
          CANDJSON
          python -m json.tool /tmp/candidate-output.json >/dev/null
          continual --root . work-submit "$CAND_WORK_ID" --response /tmp/candidate-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/candidate-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/pending.json
          cat /tmp/candidate-submit.json
          cat /tmp/native-resume.json
          cat /tmp/after.json
          cat /tmp/pending.json
      - name: Validate, receipt, and persist exact lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_invocation,verify_work_invocations
          root=Path('.').resolve();run_id=os.environ['RUN_ID'];wid=os.environ['CAND_WORK_ID'];nid=os.environ['CAND_NATIVE_ID']
          expected=json.loads(Path('/tmp/candidate-output.json').read_text())
          verified=verified_work_invocation(root,wid)
          if verified['output']!=expected: raise SystemExit('Candidate Evaluate output mismatch')
          native_path=root/'.continual/runs'/run_id/'invocations'/f'{nid}.json'
          native=json.loads(native_path.read_text())
          if native.get('status')!='complete' or native.get('component')!='candidate_evaluate' or native.get('output')!=expected: raise SystemExit('Candidate native mismatch')
          after=verify_work_invocations(root,run_id=run_id)
          checks={'valid':True,'requests':150,'responses':149,'pending':1,'native_completed':143,'native_fragments':143,'native_local_learn':130}
          for k,v in checks.items():
            if after.get(k)!=v: raise SystemExit(f'after mismatch {k}: {after.get(k)} != {v}')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0].get('component')!='execute': raise SystemExit(f'Execute successor mismatch: {pending}')
          successor=pending[0]
          native_pending=[]
          for p in sorted((root/'.continual/runs'/run_id/'invocations').glob('*.json')):
            v=json.loads(p.read_text())
            if v.get('status')=='awaiting_work_model': native_pending.append((p,v))
          if len(native_pending)!=1 or native_pending[0][1].get('work_invocation_id')!=successor['invocation_id']: raise SystemExit('native Execute mismatch')
          snapshot_path=root/'.continual/runs'/run_id/'snapshot.json'
          snapshot=json.loads(snapshot_path.read_text())
          if snapshot.get('revision')!=138 or snapshot.get('status')!='continue': raise SystemExit(f'bad snapshot {snapshot.get("revision")} {snapshot.get("phase")}')
          response_rel=f'.continual/work-model/invocations/{wid}/response.json'
          successor_rel=f'.continual/work-model/invocations/{successor["invocation_id"]}/request.json'
          receipt={
            'schema_version':1,'record_type':'generation29_candidate_evaluate_consume_receipt',
            'recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),
            'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},
            'source_main_sha':os.environ['EXPECTED_MAIN'],'source_state_blob_sha':os.environ['EXPECTED_STATE_BLOB'],
            'idempotency_key':'o-work-gen29:consume-candidate-invoke-41fe14117283ba173c0fb998:freeze-formal-proof-execute:revision38:v1',
            'completed_effect':{'component':'candidate_evaluate','native_invocation_id':nid,'work_invocation_id':wid,'request_blob_sha':os.environ['CAND_REQUEST_BLOB'],'request_digest':os.environ['CAND_REQUEST_DIGEST'],'response_ref':response_rel,'response_blob_sha':subprocess.check_output(['git','hash-object',response_rel],text=True).strip(),'response_digest':verified['response']['response_digest'],'decision':'BASELINE_FIRST','candidate_activation':False},
            'pending_successor':{'component':'execute','work_invocation_id':successor['invocation_id'],'request_ref':successor_rel,'request_blob_sha':subprocess.check_output(['git','hash-object',successor_rel],text=True).strip(),'request_digest':successor['request_digest'],'native_invocation_id':native_pending[0][1]['invocation_id'],'native_ref':native_pending[0][0].relative_to(root).as_posix(),'native_blob_sha':subprocess.check_output(['git','hash-object',str(native_pending[0][0])],text=True).strip(),'snapshot_ref':f'.continual/runs/{run_id}/snapshot.json','snapshot_blob_sha':subprocess.check_output(['git','hash-object',str(snapshot_path)],text=True).strip(),'snapshot_revision':138,'snapshot_phase':snapshot.get('phase')},
            'request_recreated':False,'response_repeated':False,'resume_required':True,'upper_objective_achieved':False,'agi_achieved':False,
            'next_action':'Publish through exact-head CI and expected-head merge, bind state, then consume the unique formal-proof Execute request exactly once.'
          }
          rp=root/'.continual/runs'/run_id/'recovery-receipts/gen29-candidate-formal-proof-consume-execute-freeze-v1.json'
          rp.parent.mkdir(parents=True,exist_ok=True);rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          python - <<'PY'
          import os,subprocess
          run_id=os.environ['RUN_ID'];changed=[]
          for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
            path=line[3:]
            if ' -> ' in path: path=path.split(' -> ',1)[1]
            if path.startswith('src/agi/__pycache__/') or path.startswith('src/continual/__pycache__/') or path.startswith('src/continual_chatgpt.egg-info/'): continue
            if not (path.startswith(f'.continual/runs/{run_id}/') or path.startswith('.continual/work-model/invocations/')):
              raise SystemExit(f'unexpected mutation: {path}')
            changed.append(path)
          if not changed: raise SystemExit('no lifecycle delta')
          response=f'.continual/work-model/invocations/{os.environ["CAND_WORK_ID"]}/response.json'
          if response not in changed: raise SystemExit('Candidate response missing')
          subprocess.run(['git','add','-f','--',*changed],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-candidate-formal-proof-result] gen29 consume Candidate Evaluate and freeze Execute'
          git push origin "HEAD:$GITHUB_REF_NAME"
