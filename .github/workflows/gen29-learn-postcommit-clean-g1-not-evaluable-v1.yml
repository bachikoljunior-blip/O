          Path('/tmp/learn-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-learn-postcommit-clean-g1-not-evaluable-consume-root-freeze-v1.json'
