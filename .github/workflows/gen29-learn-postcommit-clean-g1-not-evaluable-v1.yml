          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          native_id = os.environ['LEARN_NATIVE_ID']
          work_id = os.environ['LEARN_WORK_ID']
          summary = json.loads(Path('/tmp/learn-summary.json').read_text())
