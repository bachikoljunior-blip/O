              raise SystemExit('existing Candidate retention decision mismatch')
          snapshot_rel = f'.continual/runs/{run_id}/snapshot.json'
          snapshot = json.loads((root / snapshot_rel).read_text())
          if snapshot.get('revision') != 118 or snapshot.get('phase') != 'root_pending' or snapshot.get('status') != 'continue':
              raise SystemExit(f'bad revision118 Root phase: {snapshot.get("revision")!r} {snapshot.get("phase")!r} {snapshot.get("status")!r}')
          if snapshot.get('produced_candidates') != []:
