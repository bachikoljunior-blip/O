name: gen29 consume Learn response v1

on:
  push:
    branches:
      - work/gen29-learn-postcommit-clean-g1-not-evaluable-v1

permissions:
  contents: write

concurrency:
  group: gen29-learn-postcommit-clean-g1-not-evaluable-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-learn-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: a4988f11c6389e2acd16491d2987b1a78ecfca65
      EXPECTED_STATE_BLOB: 4cfcffe49290f53879863d2ac9029944782c3535
      EXPECTED_SNAPSHOT_BLOB: 382e893e16d93252b7391b31d195455f30032ed3
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXPECTED_INBOX_REVISION: '38'
      LEARN_NATIVE_ID: invoke-2bc2261e87d1bd5f27aa083c
      LEARN_NATIVE_BLOB: 36fd1251e9ce20c3303dda9e191e6f556bdee779
      LEARN_WORK_ID: invoke-c5c119aff74ae340fd143b9b
      LEARN_REQUEST_BLOB: 43c9152ceeebe2259663534a04c438241a490f6e
      LEARN_REQUEST_DIGEST: 05bf12a57e4e6d517507bdbb59d15a2d39f3c2d0a40f2c3e0a51b73026543728
      SOURCE_CI_RUN_ID: '33377667811'
      SOURCE_CI_HEAD: 257e421a232ba600d00cb2cdbc028c73f31bfc3a
      RUN_ID: run-work-recovery-gen9-durability-repair
      EPISODE_ID: episode-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, runtime main, authority, and Learn binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          expected = ['.github/workflows/gen29-learn-postcommit-clean-g1-not-evaluable-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', __import__('os').environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          python - "$EXPECTED_MAIN" "$RUNTIME_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('runtime main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe runtime-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$LEARN_WORK_ID/request.json)" = "$LEARN_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$LEARN_NATIVE_ID.json)" = "$LEARN_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['LEARN_NATIVE_ID']
          work_id = os.environ['LEARN_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_learn_postcommit_clean_g1_not_evaluable_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'completed_native_invocation_id': 'invoke-d5b41f46660a1a1c9d0dd705',
              'completed_work_invocation_id': 'invoke-d3f294ae99e1b9f90f9f3595',
              'completed_response_digest': '35c3b574c6389292abd974e958660c6ac108e2e3a55dae92b49c061e844b15fa',
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['LEARN_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['LEARN_REQUEST_BLOB'],
              'pending_request_digest': os.environ['LEARN_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 117,
              'native_phase': 'post_task_learn_pending',
              'pending_component': 'learn',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          bind = state.get('generation29_consolidate_postcommit_clean_g1_not_evaluable_learn_bind_v1', {})
          if bind.get('status') != 'merged_to_main_verified_learn_bound_pending_native_consume':
              raise SystemExit('Learn state binding status mismatch')
          pending_learn = bind.get('pending_learn', {})
          if pending_learn.get('work_invocation_id') != work_id or pending_learn.get('native_invocation_id') != native_id:
              raise SystemExit('Learn state identity mismatch')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != 38:
              raise SystemExit('inbox revision mismatch')
          if snapshot.get('revision') != 117 or snapshot.get('phase') != 'post_task_learn_pending':
              raise SystemExit('snapshot is not revision117 post_task_learn_pending')
          if request.get('component') != 'learn' or request.get('request_digest') != os.environ['LEARN_REQUEST_DIGEST']:
              raise SystemExit('Learn request mismatch')
          if request.get('prompt_path') != 'prompts/learn.md':
              raise SystemExit('Learn prompt mismatch')
          if request.get('payload', {}).get('preflight_selection', {}).get('decision') != 'USE_ACTIVE':
              raise SystemExit('Learn preflight is not USE_ACTIVE')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Learn identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Learn already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'learn':
              raise SystemExit('Learn native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Learn is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 121, 'responses': 120, 'pending': 1, 'native_completed': 114, 'native_fragments': 114, 'native_local_learn': 105}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(expected_counts, sort_keys=True) + '\n')
          PY
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json
          cat /tmp/work-checkpoint-before.json

      - name: Record fresh exact main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'], 'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'], 'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          python - "$EXPECTED_MAIN" "$LATEST_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('latest main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe latest-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json


      - name: Submit exact Learn response and freeze Root
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/learn-output.json <<'JSON'
          {
            "fragment": {
              "component": "learn",
              "evidence_refs": [
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/surface-availability-audit.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/pre-retrieval-manifest.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/contamination-mutation-audit.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/focused-validation.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-postcommit-clean-g1-independent-live-forecast-v1/bounded-result.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-evaluate-postcommit-clean-g1-independent-live-forecast-v1-result.json",
                ".continual/episodes/episode-work-recovery-gen9-durability-repair/episode.json",
                ".continual/candidates/index.json"
              ],
              "observations": [
                "The holder and predictor availability audits ran before source selection; neither independently verifiable surface existed, and the current same-session Work surface was correctly rejected as an eligible predictor.",
                "The live trial remained NOT_EVALUABLE_PRE_RETRIEVAL with zero source, retrieval, prediction, reveal, score, baseline, synthetic, historical, or fabricated-substitution effects.",
                "The earlier contaminated forecast remains FAIL and excluded from scoring and capability aggregation.",
                "Task Evaluate kept the exact bounded fail-closed unit PASS separate from live-trial NOT_EVALUABLE, task/user/upper FAIL, and agi_claim_supported=false.",
                "No Candidate, provider, production route, external capability, AGI, or user-level completion was established."
              ],
              "purpose": "Retain the exact pre-retrieval fail-closed, independent-surface, immutable-provenance, contamination-retention, and claim-separation lessons without creating or activating a duplicate Candidate.",
              "unresolved": [
                "exact-head publication and remote-main readback of the current Consolidate and Learn lifecycle",
                "a materially different Root-selected safe unit rather than rerunning the unavailable-surface trial",
                "a genuinely independent holder and predictor with externally checkable no-outcome-access receipts before any future scored forecast",
                "broader independently verified capability evidence and the unchanged upper AGI objective"
              ]
            },
            "result": {
              "activation_authorized": false,
              "candidates": [],
              "claim_boundary": "This Learn decision is supported only by the exact frozen post-revision-113 clean_g1 surface audit, zero-effect pre-retrieval hold, contamination audit, bounded Task Evaluate result, consolidated Episode, and request-supplied lifecycle evidence. It does not establish an independent holder or predictor, forecast accuracy, generalized or production capability, Candidate activation, AGI, or user-level completion.",
              "decision": "NO_CHANGE",
              "existing_candidate_actions": [
                {
                  "action": "RETAIN_CANDIDATE",
                  "candidate_id": "candidate-task-evaluate-unit-verdict-v1",
                  "reason": "The bounded evaluation correctly separated unit PASS from live-trial NOT_EVALUABLE and unchanged task/user/upper FAIL, but protected-baseline VERIFIED_FOR_SCOPE evidence remains absent; neither scoped nor global activation is authorized.",
                  "scope": "continual/incremental-task-evaluation"
                }
              ],
              "next": "After exact-head publication and remote-main readback of the current lifecycle, return to Root and select a materially different safe unit. Do not rerun the unavailable-surface trial, relabel the earlier contaminated forecast, or treat fail-closed PASS as forecast or AGI progress.",
              "production_routing_change_authorized": false,
              "reason": "The episode supports retaining pre-retrieval independent-surface checks, same-session predictor rejection, zero-effect fail-closed ordering, immutable request-time provenance, retained contamination failure, and separate unit versus upper-objective claims. These behaviors are already represented by current contracts and the existing Task Evaluate Candidate; the evidence supplies no distinct reversible prompt change or activation basis, so no new Candidate is justified.",
              "retained_learning": [
                "A future held-out forecast is scoreable only after a genuinely independent holder and predictor provide immutable, externally checkable commitments and no-outcome-access evidence before any source retrieval.",
                "When those independent surfaces are absent, stop before source selection and preserve every outcome-bearing effect count at zero; this is correct control behavior, not forecast evidence.",
                "The current same-task Work context cannot self-attest to predictor isolation after exposure to task and outcome-bearing summaries.",
                "A contaminated historical forecast remains FAIL and cannot be repaired or replaced by a later fail-closed trial.",
                "Unit PASS, live-trial evaluability, task and user verdicts, Candidate state, production routing, independent external capability, AGI, and user completion are separate claims.",
                "Request-time provenance is immutable: later workflow, CI, PR, merge, readback, or user-input facts belong to subsequent safe boundaries and must not be backfilled."
              ]
            }
          }
          JSON
          python -m json.tool /tmp/learn-output.json > /dev/null
          continual --root . work-submit "$LEARN_WORK_ID" --response /tmp/learn-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/learn-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json
          cat /tmp/learn-submit.json
          cat /tmp/native-resume.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json

      - name: Validate exact Learn completion, no Candidate creation, and Root freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['LEARN_NATIVE_ID']
          work_id = os.environ['LEARN_WORK_ID']
          expected_output = json.loads(Path('/tmp/learn-output.json').read_text())
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          expected_before = {'valid': True, 'requests': 121, 'responses': 120, 'pending': 1, 'native_completed': 114, 'native_fragments': 114, 'native_local_learn': 105}
          for key, value in expected_before.items():
              if before.get(key) != value:
                  raise SystemExit(f'before mismatch {key}: {before.get(key)!r}')
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 122, 'responses': 121, 'pending': 1, 'native_completed': 115, 'native_fragments': 115, 'native_local_learn': 105}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified = verified_work_invocation(root, work_id)
          if verified.get('output') != expected_output:
