          root_request = pending[0]
          if root_request.get('component') != 'root' or root_request.get('prompt_path') != 'prompts/root.md':
              raise SystemExit('next pending component is not Root')
          if root_request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or root_request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Root identity mismatch')
          payload = root_request.get('payload', {})
          if payload.get('snapshot', {}).get('revision') != 118 or payload.get('snapshot', {}).get('phase') != 'root_pending':
