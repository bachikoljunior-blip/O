              'pending_request_digest': root_request['request_digest'],
              'pending_request_blob_sha': subprocess.check_output(['git','hash-object',root_rel], text=True).strip(),
              'pending_native_invocation_id': root_native['invocation_id'],
              'pending_native_invocation_ref': root_native_path.relative_to(root).as_posix(),
              'pending_native_invocation_blob_sha': subprocess.check_output(['git','hash-object',str(root_native_path)], text=True).strip(),
              'verification': expected_after,
