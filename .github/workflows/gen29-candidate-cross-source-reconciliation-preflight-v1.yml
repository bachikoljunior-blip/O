                "token": "Record only directly measured usage if available; do not infer missing token cost.",
                "tool": "Limit tools to read-only exact-commit acquisition, isolated deterministic local processing, immutable evidence artifacts, focused tests, and protected publication gates."
              },
              "decision": "BASELINE_FIRST",
              "evidence_to_collect": [
                "a precommit manifest fixing both repository identities, exact commits, permissive license blobs, data paths, schema mappings, normalization rules, overlap threshold, divergence categories, budgets, deterministic queries, corruption control, and zero-upstream-write scope",
