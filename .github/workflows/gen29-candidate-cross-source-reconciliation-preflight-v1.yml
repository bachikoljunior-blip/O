                "per-source normalized key-set digests, record counts, overlap coverage, symmetric differences, and explicit bounded attribution for every divergence",
                "deterministic query outputs across overlapping keys plus a locally corrupted-input negative control that must fail closed",
                "a clean replay from the exact commits reproducing manifest, normalized-output, divergence, query, corruption-control, and final-result digests",
                "focused tests, protected four-shard and aggregate CI, expected-head merge, exact remote readback, and claims limited to the bounded trial"
              ],
              "reason": "No indexed Candidate is verified for the exact cross-source country-data reconciliation scope. The unit itself already precommits source readiness, normalization, divergence, corruption, replay, and zero-write controls. The unchanged active Execute prompt is therefore the only attributable baseline, and target values must remain unread until the complete selector and protocol manifest is frozen.",
              "regression_checks": [
                "both exact sources retain the frozen repository, commit, license, path, schema, and required alpha-2 field bindings",
                "no source, mapping, threshold, divergence category, query, or budget changes after precommit",
                "normalized overlap meets the frozen threshold and no symmetric difference is silently discarded",
                "all precommitted query outputs agree where keys overlap or receive a bounded frozen-source attribution",
