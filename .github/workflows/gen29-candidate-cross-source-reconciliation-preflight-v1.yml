              ]
            },
            "result": {
              "applicability": [
                {
                  "candidate_id": "candidate-agi-benchmark-suite-v1",
                  "decision": "DEFER",
                  "reason": "Its broad capability-evaluation scope may later consume the bounded receipt, but applying it during source selection or reconciliation would widen the exact unit and confound provenance."
                },
                {
                  "candidate_id": "candidate-bounded-recursive-context-retrieval-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It targets Context Kernel recursive retrieval, not immutable acquisition and deterministic comparison of two public country datasets."
                },
                {
                  "candidate_id": "candidate-c6c462472386c57b124d",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Its indexed scope is campaign authoring, not public-data provenance, normalization, or reconciliation."
                },
                {
                  "candidate_id": "candidate-copilot-sdk-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It is active only for live genuine-model campaign migration; this unit forbids provider calls, live routing, and production effects."
                },
                {
                  "candidate_id": "candidate-github-models-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It is rejected for live-campaign migration and cannot affect this non-production, read-only dataset trial."
                },
                {
                  "candidate_id": "candidate-live-campaign-stage-isolation-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Its verified scope and dependencies concern live-campaign evidence stages, not exact-commit source readiness or deterministic normalization."
                },
                {
                  "candidate_id": "candidate-live-request-status-rendezvous-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "It governs live-request observability, while this unit performs no live model request."
                },
                {
                  "candidate_id": "candidate-self-application-context-hygiene-v1",
                  "decision": "DEFER",
                  "reason": "Repository context hygiene is adjacent to contamination control but remains REMAIN_CANDIDATE and is not VERIFIED_FOR_SCOPE for cross-source public-data reconciliation. An overlay would make the mechanism under test non-attributable."
