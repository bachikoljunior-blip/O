              ],
              "rollback": "If either frozen source is unavailable, unlicensed, missing its path or identifier field, selector contents drift after precommit, overlap misses threshold, a divergence is hidden, query attribution fails, corruption is accepted, replay changes, an upstream write occurs, protected validation fails, or the claim widens, stop without source substitution, keep all Candidate states unchanged, and record FAIL or NOT_EVALUABLE for only this exact unit.",
