name: gen29 formal-proof Root consume v1

on:
  push:
    branches:
      - work/gen29-formal-proof-root-response-v1

permissions:
  contents: write

concurrency:
  group: gen29-formal-proof-root-response-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-root-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 1b35796a97439d3f0a7ff77ce6e518e1229e7a0e
      EXPECTED_STATE_BLOB: 07b64c75754595826ca1df2e7dcad3107870582d
      EXPECTED_SNAPSHOT_BLOB: c30bb3a33b27400bf8c126fe67f8ad25cf09493c
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      ROOT_NATIVE_ID: invoke-a94426b3eb2e02e212175c9d
      ROOT_NATIVE_BLOB: acfac427216283fbc57becb0e2501698218f9656
      ROOT_WORK_ID: invoke-1e3ef82e947ba7ad4b64b4a9
      ROOT_REQUEST_BLOB: b0691c59554eb4cf781a6645465f11a29d4fe0ec
      ROOT_REQUEST_DIGEST: fd0c05107a314629a40898b2504b58a45a7b494bd0bb874ec485cdc42e18d67b
      RUN_ID: run-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      NEW_UNIT_ID: unit-generation29-external-relational-query-reasoning-v1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Validate exact frozen Root and refresh heartbeat by CAS
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          SOURCE_MAIN="$(git rev-parse origin/main)"
          test "$SOURCE_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          observed = subprocess.check_output(['git','diff','--name-only',__import__('os').environ['EXPECTED_MAIN'],'HEAD'], text=True).splitlines()
          expected = ['.github/workflows/gen29-formal-proof-root-response-v1.yml']
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$SOURCE_MAIN" > /tmp/state-doc.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$SOURCE_MAIN" > /tmp/inbox-doc.json
          test "$(jq -r '.sha' /tmp/state-doc.json)" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/inbox-doc.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/state-doc.json | tr -d '\n' | base64 --decode > /tmp/source-state.json
          jq -r '.content' /tmp/inbox-doc.json | tr -d '\n' | base64 --decode > /tmp/inbox.json
          test "$(git hash-object /tmp/source-state.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$ROOT_WORK_ID/request.json)" = "$ROOT_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$ROOT_NATIVE_ID.json)" = "$ROOT_NATIVE_BLOB"
          cp /tmp/source-state.json agi/WORK_EXECUTION_STATE.json
          python - <<'PY'
          import hashlib, json, os
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          state=json.loads(Path('/tmp/source-state.json').read_text())
          inbox=json.loads(Path('/tmp/inbox.json').read_text())
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']; work_id=os.environ['ROOT_WORK_ID']; native_id=os.environ['ROOT_NATIVE_ID']
          request=verified_work_request(root,work_id)
          native=json.loads((root/'.continual'/'runs'/run_id/'invocations'/f'{native_id}.json').read_text())
          snapshot=json.loads((root/'.continual'/'runs'/run_id/'snapshot.json').read_text())
          if state.get('execution_id')!='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3' or state.get('lease_generation')!=29:
              raise SystemExit('authority mismatch')
          if hashlib.sha256(state['fence_token'].encode()).hexdigest()!='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('fence mismatch')
          if state.get('status')!='running' or state.get('active_component')!='generation29_root_formal_proof_pending_native_consume':
              raise SystemExit('active Root mismatch')
          bind=state.get('generation29_formal_proof_learn_root_bind_v1',{})
          if bind.get('status')!='remote_main_readback_verified' or bind.get('phase2_exact_readback_verified') is not True:
              raise SystemExit('Root bind not verified')
          exact=state.get('exact_continuation',{})
          expected={
            'pending_component':'root','pending_work_invocation_id':work_id,'pending_request_blob_sha':os.environ['ROOT_REQUEST_BLOB'],
            'pending_request_digest':os.environ['ROOT_REQUEST_DIGEST'],'pending_native_invocation_id':native_id,
            'pending_native_invocation_blob_sha':os.environ['ROOT_NATIVE_BLOB'],'pending_response_blob_sha':None,
            'snapshot_revision':141,'snapshot_phase':'root_pending','native_phase':'root_pending','durability_status':'remote_main_readback_verified'
          }
          for k,v in expected.items():
              if exact.get(k)!=v: raise SystemExit(f'exact mismatch {k}: {exact.get(k)!r} != {v!r}')
          if state.get('continuation_durability',{}).get('verified_remote_readback') is not True:
              raise SystemExit('durability not verified')
          if inbox.get('revision')!=38 or snapshot.get('revision')!=141 or snapshot.get('phase')!='root_pending':
              raise SystemExit('inbox/snapshot mismatch')
          if request.get('component')!='root' or request.get('request_digest')!=os.environ['ROOT_REQUEST_DIGEST'] or request.get('prompt_path')!='prompts/root.md':
              raise SystemExit('Root request mismatch')
          if request.get('executor_binding')!=os.environ['EXECUTOR_BINDING'] or request.get('model_identity')!=os.environ['MODEL_IDENTITY']:
              raise SystemExit('Root identity mismatch')
          if (root/'.continual'/'work-model'/'invocations'/work_id/'response.json').exists():
              raise SystemExit('Root already answered')
          if native.get('status')!='awaiting_work_model' or native.get('component')!='root' or native.get('work_invocation_id')!=work_id:
              raise SystemExit('Root native mismatch')
          pending=pending_work_invocations(root,run_id=run_id); verified=verify_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0].get('invocation_id')!=work_id or verified.get('valid') is not True or verified.get('pending')!=1:
              raise SystemExit('Root not unique pending')
          Path('/tmp/verify-before.json').write_text(json.dumps(verified,sort_keys=True)+'\n')
          now=datetime.now(UTC).isoformat().replace('+00:00','Z')
          state['heartbeat_at']=now; state['last_activity_at']=now
          refresh=bind.setdefault('root_runner_start_refreshes',[])
          refresh.append({'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'refreshed_at':now,'reason':'Bound queue delay immediately before the unchanged exact Root consume.'})
          bind['root_runner_start_refresh_pending_exact_readback']=True
          bind['next_action']=f'Exact-read runner heartbeat, then consume {work_id} exactly once and freeze Execute.'
          Path('/tmp/refreshed-state.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          Path('/tmp/put.json').write_text(json.dumps({'message':'o-work: refresh formal-proof Root runner heartbeat','content':base64.b64encode(Path('/tmp/refreshed-state.json').read_bytes()).decode(),'sha':os.environ['EXPECTED_STATE_BLOB'],'branch':'main'})+'\n')
          PY
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json" --input /tmp/put.json > /tmp/put-result.json
          RUNTIME_MAIN="$(jq -r '.commit.sha' /tmp/put-result.json)"
          RUNTIME_STATE_BLOB="$(jq -r '.content.sha' /tmp/put-result.json)"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-doc.json
          test "$(jq -r '.sha' /tmp/runtime-state-doc.json)" = "$RUNTIME_STATE_BLOB"
          jq -r '.content' /tmp/runtime-state-doc.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$RUNTIME_STATE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"

      - name: Record fresh exact Work and policy-bound CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-prepare.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.store import Store
          s=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          p={'status':s['status'],'owner_kind':s['owner_kind'],'execution_id':s['execution_id'],'lease_generation':s['lease_generation'],'fence_token_digest':Store(Path('.')).stable_digest(s['fence_token'],length=64),'heartbeat_at':s['heartbeat_at']}
          Path('/tmp/work-projection.json').write_text(json.dumps(p,sort_keys=True)+'\n')
          PY
          WID="$(jq -r '.observation_id' /tmp/work-prepare.json)"; WDIG="$(jq -r '.request_digest' /tmp/work-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WID" --request-digest "$WDIG" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-prepare.json
          CI_RUN="$(jq -r '.source.workflow_run_id' /tmp/ci-prepare.json)"; CI_HEAD="$(jq -r '.source.exact_head_sha' /tmp/ci-prepare.json)"; CI_WF="$(jq -r '.source.workflow_id' /tmp/ci-prepare.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > /tmp/ci-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" > /tmp/ci-jobs.json
          test "$(jq -r '.workflow_id' /tmp/ci-run.json)" = "$CI_WF"; test "$(jq -r '.head_sha' /tmp/ci-run.json)" = "$CI_HEAD"
          test "$(jq -r '.status' /tmp/ci-run.json)" = completed; test "$(jq -r '.conclusion' /tmp/ci-run.json)" = success
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('/tmp/ci-prepare.json').read_text()); jobs={x['id']:x for x in json.loads(Path('/tmp/ci-jobs.json').read_text())['jobs']}
          for q in req['source']['required_jobs']:
              x=jobs.get(q['id'])
              if not x or x.get('name')!=q['name'] or x.get('status')!='completed' or x.get('conclusion')!='success': raise SystemExit(f'CI mismatch {q!r} -> {x!r}')
          PY
          jq '{id,workflow_id,name,status,conclusion,head_sha}' /tmp/ci-run.json > /tmp/ci-run-projection.json
          jq '[.jobs[]|{id,name,status,conclusion}]|sort_by(.id)' /tmp/ci-jobs.json > /tmp/ci-jobs-projection.json
          CID="$(jq -r '.observation_id' /tmp/ci-prepare.json)"; CDIG="$(jq -r '.request_digest' /tmp/ci-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CID" --request-digest "$CDIG" --workflow-run /tmp/ci-run-projection.json --jobs /tmp/ci-jobs-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-receipt.json

      - name: Recheck continuity and submit exact Root response
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root=Path('.').resolve(); state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text()); now=Store(root).utc_now()
          verify_work_source_observation(root,run_id=os.environ['RUN_ID'],state=state,state_blob_sha=os.environ['RUNTIME_STATE_BLOB'],now=now)
          verify_ci_source_observation(root,run_id=os.environ['RUN_ID'],state=state,now=now)
          x=assert_work_resume_continuity_preflight(root,run_id=os.environ['RUN_ID'],executor_binding=os.environ['EXECUTOR_BINDING'],model_identity=os.environ['MODEL_IDENTITY'])
          if x.get('resume_authorized') is not True: raise SystemExit('continuity denied')
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          cat > /tmp/root-output.json <<'JSON'
          {
            "result": {
              "component": "execute",
              "unit_id": "unit-generation29-external-relational-query-reasoning-v1",
              "goal": "Resolve and freeze one immutable permissively licensed Chinook SQLite fixture from lerocha/chinook-database without reading answer-bearing query examples, then produce exactly one SQL query that returns, for every genre, the artist with the greatest total invoiced line-item revenue during calendar year 2012 with ArtistId as the deterministic tie-break; validate the complete ordered row set against an independently implemented Python oracle and precommitted mutation controls.",
              "scope": "One read-only public GitHub repository at one exact commit, one exact Chinook SQLite database blob, an isolated temporary SQLite/Python runner, and O evidence artifacts. No upstream write, issue/comment action, unrelated dataset, example-query or solution access, Candidate activation, production routing change, deployment, credentials, AGI claim, or completion claim.",
              "inputs": [
                "revision141 Root context and the completed formal-proof Task Evaluate, Candidate Evaluate, Consolidate Episode, and Learn lifecycle",
                "the public lerocha/chinook-database repository, resolved to an exact commit and permissive license before database content is used",
                "the precommitted task text, selector order, allowed schema tables, 2012 time bound, ArtistId tie-break rule, output schema, budgets, and contamination exclusions",
                "an isolated GitHub Actions environment with sqlite3 and Python standard-library sqlite3"
              ],
              "evidence_needed": [
                "a pre-access manifest fixing repository, commit, license blob, database path/blob, task text, allowed paths/tables, query and runtime budgets, output ordering, tie-breaks, and forbidden answer-bearing sources",
                "schema and fixture readiness receipts obtained only after the manifest is durable, with no example SQL, solution, discussion, later commit, or external query service consumed",
                "the single candidate SQL query plus exact SQLite engine version, execution plan, ordered result rows, row-set digest, timing, and read-only/zero-upstream-write audit",
                "an independent Python oracle that computes invoice-line revenue by explicit row iteration rather than executing or translating the candidate SQL aggregation",
                "at least two precommitted fail-closed controls: a wrong-year predicate and a broken join or tie-break mutation, plus a clean immutable replay"
              ],
              "expected_outputs": [
                "an immutable source/task manifest and post-manifest readiness/contamination receipts",
                "one SQL artifact with no fixture mutation, extension loading, network access, nondeterministic function, or out-of-scope table use",
                "candidate, oracle, comparison, mutation-control, replay, timing, resource, and zero-write receipts with exact digests",
                "a bounded SOLVED, FAILED, or NOT_EVALUABLE result that keeps relational-query correctness separate from generalized data reasoning, production fitness, user completion, upper-objective completion, and AGI"
              ],
              "success_conditions": [
                "the exact repository commit, license, SQLite fixture blob, task, schema allowance, output ordering, and contamination exclusions are frozen before schema/data access",
                "the single query returns exactly the oracle row set for every genre under the 2012 predicate and deterministic ArtistId tie-break",
                "both corrupted controls fail against the oracle, the candidate succeeds on a clean replay from the same immutable blob, and all row-set/content digests reproduce",
                "the fixture remains byte-identical, no upstream write occurs, runtime/resource limits hold, and only bounded unit evidence is claimed",
                "validated artifacts publish only through protected exact-head CI, expected-head merge, and exact remote readback before Task Evaluate"
              ],
              "failure_conditions": [
                "the repository, license, immutable fixture, required schema, or reproducible SQLite runtime cannot be frozen within budget",
                "any example query, answer-bearing artifact, discussion, later commit, prior Run answer, or external query service enters the generation context",
                "the query mutates data, loads extensions, uses nondeterminism, exceeds scope/budget, omits genres, mishandles 2012 or ties, or diverges from the independent oracle",
                "either corruption control passes, clean replay diverges, provenance/readback fails, or any upstream write occurs",
                "the bounded result is broadened into Candidate activation, production routing, generalized database capability, AGI, or completion"
              ],
              "parent_continuation": "After Execute, independently Task Evaluate the exact pre-access ordering, repository/license/fixture bindings, contamination exclusions, SQL, independent oracle, complete ordered rows, negative controls, replay, resources, zero-write audit, exact-head CI, expected-head merge, and bounded verdict. Then run post-result Candidate Evaluate, Consolidate Episode, Learn, return to Root, and continue materially different safe work while user, upper-objective, and AGI completion remain false."
            },
            "local_learn": {
              "decision": "NO_CHANGE",
              "candidates": [],
              "observation": "The next unit should diversify from one formal theorem into externally anchored relational data reasoning with an independent oracle and mutation controls; selecting that evidence class does not justify a reusable Candidate, activation, routing change, generalized capability, or AGI claim."
            },
            "fragment": {
              "component": "root",
              "purpose": "Select one bounded external relational-query reasoning unit with immutable provenance, contamination controls, an independent oracle, and strict claim separation.",
              "observations": [
                "The formal-proof lifecycle is complete with bounded unit PASS, Learn NO_CHANGE, and unchanged task, user, upper-objective, and AGI FAIL.",
                "Recent units already cover forecasting, protocol judgment, clock resumption, software repair, cross-repository transfer, cross-source reconciliation, and formal proof.",
                "A multi-table relational query verified by an independent row-iteration oracle is materially different, executable without credentials, and falsifiable under exact immutable data."
              ]
            }
          }
          JSON
          python -m json.tool /tmp/root-output.json > /dev/null
          continual --root . work-submit "$ROOT_WORK_ID" --response /tmp/root-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/root-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json

      - name: Validate Root completion and unique pre-application Candidate Evaluate freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']; work_id=os.environ['ROOT_WORK_ID']; native_id=os.environ['ROOT_NATIVE_ID']
          output=json.loads(Path('/tmp/root-output.json').read_text()); before=json.loads(Path('/tmp/work-verify-before.json').read_text()); after=verify_work_invocations(root,run_id=run_id)
          if before.get('valid') is not True or before.get('pending')!=1 or after.get('valid') is not True or after.get('pending')!=1:
              raise SystemExit(f'verification invalid: {before!r} -> {after!r}')
          for key,delta in {'requests':1,'responses':1,'native_completed':1,'native_fragments':1,'native_local_learn':1}.items():
              if after.get(key)!=before.get(key)+delta: raise SystemExit(f'increment mismatch {key}: {before.get(key)} -> {after.get(key)}')
          v=verified_work_invocation(root,work_id)
          if v.get('output')!=output: raise SystemExit('Root persisted output mismatch')
          response_rel=f'.continual/work-model/invocations/{work_id}/response.json'
          native_path=root/'.continual'/'runs'/run_id/'invocations'/f'{native_id}.json'; native=json.loads(native_path.read_text())
          if native.get('status')!='complete' or native.get('component')!='root' or native.get('output')!=output: raise SystemExit('Root native mismatch')
          snapshot_rel=f'.continual/runs/{run_id}/snapshot.json'; snapshot=json.loads((root/snapshot_rel).read_text())
          if snapshot.get('revision')!=142 or snapshot.get('phase')!='unit_pending' or snapshot.get('status')!='continue' or snapshot.get('current_component')!='execute' or snapshot.get('current_unit')!=os.environ['NEW_UNIT_ID']:
              raise SystemExit(f'bad revision142 Execute freeze: {snapshot!r}')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1:
              raise SystemExit(f'bad pending count after Root: {pending!r}')
          req=pending[0]; payload=req.get('payload',{}); execution_unit=payload.get('execution_unit',{}); unit=execution_unit.get('execution_unit',{}); pending_snapshot=execution_unit.get('snapshot',{})
          if req.get('component')!='candidate_evaluate' or req.get('prompt_path')!='prompts/candidate_evaluate.md' or payload.get('mode')!='pre-application' or payload.get('target_component')!='execute':
              raise SystemExit(f'bad pre-application Candidate Evaluate envelope: {req!r}')
          if unit.get('unit_id')!=os.environ['NEW_UNIT_ID'] or pending_snapshot.get('revision')!=142 or pending_snapshot.get('current_component')!='execute' or pending_snapshot.get('current_unit')!=os.environ['NEW_UNIT_ID']:
              raise SystemExit(f'bad Candidate Evaluate execution-unit binding: {req!r}')
          candidate_id=req['invocation_id']; candidate_rel=f'.continual/work-model/invocations/{candidate_id}/request.json'
          awaiting=[]
          for p in sorted((root/'.continual'/'runs'/run_id/'invocations').glob('*.json')):
              y=json.loads(p.read_text())
              if y.get('status')=='awaiting_work_model': awaiting.append((p,y))
          if len(awaiting)!=1 or awaiting[0][1].get('component')!='candidate_evaluate' or awaiting[0][1].get('work_invocation_id')!=candidate_id:
              raise SystemExit(f'bad awaiting Candidate Evaluate: {awaiting!r}')
          enp,en=awaiting[0]
          summary={
            'root_work_invocation_id':work_id,'root_native_invocation_id':native_id,'root_response_ref':response_rel,
            'root_response_digest':v['response']['response_digest'],'root_response_blob_sha':subprocess.check_output(['git','hash-object',response_rel],text=True).strip(),
            'root_native_ref':native_path.relative_to(root).as_posix(),'root_native_blob_sha':subprocess.check_output(['git','hash-object',str(native_path)],text=True).strip(),
            'snapshot_ref':snapshot_rel,'snapshot_revision':142,'snapshot_phase':'unit_pending','snapshot_blob_sha':subprocess.check_output(['git','hash-object',snapshot_rel],text=True).strip(),
            'pending_component':'candidate_evaluate','pending_work_invocation_id':candidate_id,'pending_request_ref':candidate_rel,'pending_request_digest':req['request_digest'],
            'pending_request_blob_sha':subprocess.check_output(['git','hash-object',candidate_rel],text=True).strip(),
            'pending_native_invocation_id':en['invocation_id'],'pending_native_invocation_ref':enp.relative_to(root).as_posix(),
            'pending_native_invocation_blob_sha':subprocess.check_output(['git','hash-object',str(enp)],text=True).strip(),'verification':after
