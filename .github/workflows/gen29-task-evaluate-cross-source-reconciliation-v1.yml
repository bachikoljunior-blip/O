name: gen29 consume Task Evaluate cross-source reconciliation v1

on:
  push:
    branches:
      - work/gen29-task-evaluate-cross-source-reconciliation-v1

permissions:
  contents: write

concurrency:
  group: gen29-task-evaluate-cross-source-reconciliation-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-task-evaluate-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_MAIN: ee2ba62ab72b952091a2f4a90a109ebf73bd0082
      RUNTIME_STATE_BLOB: 82d92922fcd6fe9c6e66a10bc3d1a4eb8b6c564f
      EXPECTED_SNAPSHOT_BLOB: 21ff9cafbcf19972f2733808ca9304421a19cba5
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      TASK_NATIVE_ID: invoke-002e7b508042a134bb24c405
      TASK_NATIVE_BLOB: d8d755db2d08801264f7e0ea5e70f91e9139c057
      TASK_WORK_ID: invoke-64f6b0cd887538ecd50c0a24
      TASK_REQUEST_BLOB: f681f6ce4f4920268574dc02e24d55a9de78b79e
      TASK_REQUEST_DIGEST: 1b9ef8d1b6ba4edd98af10ec4cc88aaa8506efe942c1409270804c2d5f744865
      SOURCE_CI_RUN_ID: '33508508895'
      SOURCE_CI_HEAD: 5fae9fc3a151aa61e77109411cebcfc25d035339
      SOURCE_CI_WORKFLOW_ID: '335420036'
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-evaluate-cross-source-data-reconciliation-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact authority, frozen Task Evaluate, artifacts, and source CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          python - <<'PY'
          import os,subprocess
          expected=['.github/workflows/gen29-task-evaluate-cross-source-reconciliation-v1.yml']
          observed=subprocess.check_output(['git','diff','--name-only',os.environ['RUNTIME_MAIN'],'HEAD'],text=True).splitlines()
          if observed!=expected: raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/state-doc.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/inbox-doc.json
          test "$(jq -r .sha /tmp/state-doc.json)" = "$RUNTIME_STATE_BLOB"
          test "$(jq -r .sha /tmp/inbox-doc.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r .content /tmp/state-doc.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r .content /tmp/inbox-doc.json | tr -d '\n' | base64 --decode > /tmp/inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$RUNTIME_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$TASK_WORK_ID/request.json)" = "$TASK_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$TASK_NATIVE_ID.json)" = "$TASK_NATIVE_BLOB"
          test ! -e ".continual/work-model/invocations/$TASK_WORK_ID/response.json"
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/precommitted-selector-manifest.json)" = b7c08e41c97a486a8d0610d6d8ab4487f2318e04
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/source-readiness.json)" = 35b5dbd0bf932843cb88740ec608af98492b0267
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/normalized-sources.json)" = 7f51c4d9ae19d0425c605f60adac28f8043bc241
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/reconciliation-report.json)" = 6e1b2f3d2068a35588fa36369b6622981080bf13
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/corruption-controls.json)" = c46a2c8bc935b2987a366fd09893859f08e522ff
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/replay-verification.json)" = f51d0b63710446e06f759edb68897aea698ac20e
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/bounded-result.json)" = 8486daa3d8da17e467325a9187758693048bb47f
          test "$(git hash-object .continual/runs/$RUN_ID/artifacts/unit-generation29-cross-source-data-reconciliation-v1/mutation-audit.json)" = 059cf33a10ebf7e6fb3483d651b217b5aa91e661
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/test-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/test-jobs.json
          jq -e --arg h "$SOURCE_CI_HEAD" --argjson w "$SOURCE_CI_WORKFLOW_ID" '.head_sha==$h and .workflow_id==$w and .status=="completed" and .conclusion=="success"' /tmp/test-run.json
          jq -e '[.jobs[]|select(.id==99858241095 or .id==99858241365 or .id==99858241366 or .id==99858241503 or .id==99869200219)|select(.status=="completed" and .conclusion=="success")]|length==5' /tmp/test-jobs.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_request,verify_work_invocations
          root=Path('.').resolve(); run=os.environ['RUN_ID']
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text()); inbox=json.loads(Path('/tmp/inbox.json').read_text()); snap=json.loads((root/'.continual/runs'/run/'snapshot.json').read_text())
          if state['execution_id']!='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3' or state['lease_generation']!=29: raise SystemExit('authority mismatch')
          if hashlib.sha256(state['fence_token'].encode()).hexdigest()!='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d': raise SystemExit('fence mismatch')
          if state['status']!='running' or state['resume_required'] is not True or inbox['revision']!=38: raise SystemExit('state/inbox mismatch')
          if state.get('active_component')!='generation29_task_evaluate_cross_source_reconciliation_pending_native_consume': raise SystemExit('active component mismatch')
          exact=state['exact_continuation']; durability=state['continuation_durability']
          if exact!=durability or exact.get('status')!='remote_main_readback_verified' or exact.get('verified_remote_readback') is not True: raise SystemExit('continuation mismatch')
          expected={'pending_native_invocation_id':os.environ['TASK_NATIVE_ID'],'pending_native_invocation_blob_sha':os.environ['TASK_NATIVE_BLOB'],'pending_work_invocation_id':os.environ['TASK_WORK_ID'],'pending_request_blob_sha':os.environ['TASK_REQUEST_BLOB'],'pending_request_digest':os.environ['TASK_REQUEST_DIGEST'],'pending_response_ref':None,'response_exists_on_authoritative_remote':False,'snapshot_revision':133,'native_phase':'unit_pending','pending_component':'task_evaluate','target_component':'candidate_evaluate'}
          for k,v in expected.items():
              if exact.get(k)!=v: raise SystemExit(f'continuation mismatch {k}: {exact.get(k)!r} != {v!r}')
          bind=state['generation29_candidate_cross_source_reconciliation_task_evaluate_bind_v1']
          if bind.get('status')!='state_cas_exact_readback_verified_task_evaluate_pending_native_consume' or bind.get('exact_readback_verified') is not True: raise SystemExit('binding record mismatch')
          policy=state['ci_source_observation_policy']
          if policy.get('workflow_run_id')!=int(os.environ['SOURCE_CI_RUN_ID']) or policy.get('exact_head_sha')!=os.environ['SOURCE_CI_HEAD'] or sorted(x['id'] for x in policy.get('required_jobs',[]))!=sorted([99858241095,99858241365,99858241366,99858241503,99869200219]): raise SystemExit('CI policy mismatch')
          if snap.get('revision')!=133 or snap.get('phase')!='unit_pending' or snap.get('current_component')!='task_evaluate' or snap.get('current_unit')!=os.environ['RESULT_UNIT_ID']: raise SystemExit('snapshot mismatch')
          req=verified_work_request(root,os.environ['TASK_WORK_ID'])
          if req.get('component')!='task_evaluate' or req.get('request_digest')!=os.environ['TASK_REQUEST_DIGEST'] or req.get('payload',{}).get('execution_unit',{}).get('unit_id')!=os.environ['RESULT_UNIT_ID'] or req.get('payload',{}).get('preflight_selection',{}).get('decision')!='BASELINE_FIRST': raise SystemExit('Task Evaluate request mismatch')
          native=json.loads((root/'.continual/runs'/run/'invocations'/f"{os.environ['TASK_NATIVE_ID']}.json").read_text())
          if native.get('status')!='awaiting_work_model' or native.get('component')!='task_evaluate' or native.get('work_invocation_id')!=os.environ['TASK_WORK_ID']: raise SystemExit('native mismatch')
          pending=pending_work_invocations(root,run_id=run)
          if len(pending)!=1 or pending[0].get('invocation_id')!=os.environ['TASK_WORK_ID']: raise SystemExit('Task Evaluate is not unique pending request')
          before=verify_work_invocations(root,run_id=run)
          expected_counts={'valid':True,'requests':145,'responses':144,'pending':1,'native_completed':138,'native_fragments':138,'native_local_learn':126}
          for k,v in expected_counts.items():
              if before.get(k)!=v: raise SystemExit(f'before count mismatch {k}: {before.get(k)!r}')
          Path('/tmp/before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
          PY

      - name: Record and verify fresh exact source observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.store import Store
          state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          projection={'status':state['status'],'owner_kind':state['owner_kind'],'execution_id':state['execution_id'],'lease_generation':state['lease_generation'],'fence_token_digest':Store(Path('.')).stable_digest(state['fence_token'],length=64),'heartbeat_at':state['heartbeat_at']}
          Path('/tmp/work-projection.json').write_text(json.dumps(projection,sort_keys=True)+'\n')
          PY
          OID="$(jq -r .observation_id /tmp/work-source-prepare.json)"
          ODIG="$(jq -r .request_digest /tmp/work-source-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$OID" --request-digest "$ODIG" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          jq '{id,workflow_id,name,status,conclusion,head_sha}' /tmp/test-run.json > /tmp/test-run-projection.json
          jq '[.jobs[]|{id,name,status,conclusion}]|sort_by(.id)' /tmp/test-jobs.json > /tmp/test-jobs-projection.json
          COID="$(jq -r .observation_id /tmp/ci-source-prepare.json)"
          CDIG="$(jq -r .request_digest /tmp/ci-source-prepare.json)"
          NOW="$(python -c 'from datetime import UTC,datetime;print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$COID" --request-digest "$CDIG" --workflow-run /tmp/test-run-projection.json --jobs /tmp/test-jobs-projection.json --observed-at "$NOW" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root=Path('.').resolve(); state=json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text()); now=Store(root).utc_now()
          work=verify_work_source_observation(root,run_id=os.environ['RUN_ID'],state=state,state_blob_sha=os.environ['RUNTIME_STATE_BLOB'],now=now)
          ci=verify_ci_source_observation(root,run_id=os.environ['RUN_ID'],state=state,now=now)
          continuity=assert_work_resume_continuity_preflight(root,run_id=os.environ['RUN_ID'],executor_binding=os.environ['EXECUTOR_BINDING'],model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True: raise SystemExit('continuity not authorized')
          print(json.dumps({'work':work,'ci':ci,'continuity':continuity},sort_keys=True))
          PY

      - name: Consume Task Evaluate exactly once and freeze Consolidate Episode
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/task-output.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/task-output.json'))
          if list(value)!=['result','local_learn','fragment'] or value['result'].get('verdict')!='FAIL' or value['result'].get('unit_verdict')!='PASS' or value['result'].get('agi_claim_supported') is not False or value['fragment'].get('component')!='task_evaluate':
              raise SystemExit('exact Task Evaluate output shape mismatch')
          PY
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" | jq -e --arg b "$RUNTIME_STATE_BLOB" '.sha==$b'
          continual --root . work-submit "$TASK_WORK_ID" --response /tmp/task-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/pending.json

      - name: Validate exact Consolidate Episode successor and write receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_invocation,verify_work_invocations
          root=Path('.').resolve(); run=os.environ['RUN_ID']; nid=os.environ['TASK_NATIVE_ID']; wid=os.environ['TASK_WORK_ID']
          out=json.loads(Path('/tmp/task-output.json').read_text()); after=verify_work_invocations(root,run_id=run)
          expected={'valid':True,'requests':146,'responses':145,'pending':1,'native_completed':139,'native_fragments':139,'native_local_learn':127}
          for k,v in expected.items():
              if after.get(k)!=v: raise SystemExit(f'after count mismatch {k}: {after.get(k)!r} != {v!r}')
          verified=verified_work_invocation(root,wid)
          if verified.get('output')!=out: raise SystemExit('persisted Task Evaluate output mismatch')
          npath=root/'.continual/runs'/run/'invocations'/f'{nid}.json'; native=json.loads(npath.read_text())
          if native.get('status')!='complete' or native.get('component')!='task_evaluate' or native.get('output')!=out: raise SystemExit('native Task Evaluate completion mismatch')
          snap_path=root/'.continual/runs'/run/'snapshot.json'; snap=json.loads(snap_path.read_text())
          if snap.get('revision')!=134 or snap.get('phase')!='consolidate_pending' or snap.get('current_component')!='task_evaluate': raise SystemExit(f'snapshot mismatch {snap.get("revision")} {snap.get("phase")} {snap.get("current_component")}')
          pending=pending_work_invocations(root,run_id=run)
          if len(pending)!=1 or pending[0].get('component')!='consolidate_episode': raise SystemExit('unique Consolidate Episode successor missing')
          req=pending[0]; nwid=req['invocation_id']; nreq=f'.continual/work-model/invocations/{nwid}/request.json'
          if req.get('prompt_path')!='prompts/consolidate_episode.md' or (root/nreq).with_name('response.json').exists(): raise SystemExit('Consolidate Episode prompt/response mismatch')
          awaiting=[]
          for p in sorted((root/'.continual/runs'/run/'invocations').glob('*.json')):
              val=json.loads(p.read_text())
              if val.get('status')=='awaiting_work_model': awaiting.append((p,val))
          if len(awaiting)!=1: raise SystemExit(f'expected one awaiting native, got {len(awaiting)}')
          np,nv=awaiting[0]
          if nv.get('component')!='consolidate_episode' or nv.get('work_invocation_id')!=nwid or nv.get('work_request_digest')!=req.get('request_digest'): raise SystemExit('Consolidate Episode native binding mismatch')
          result_ref=f'.continual/runs/{run}/artifacts/{os.environ["RESULT_UNIT_ID"]}-result.json'; result_path=root/result_ref
          if not result_path.is_file() or json.loads(result_path.read_text())!=out['result']: raise SystemExit('Task Evaluate result artifact mismatch')
          h=lambda p:subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          response=f'.continual/work-model/invocations/{wid}/response.json'; local=f'.continual/runs/{run}/local-learn/{nid}-task_evaluate.json'
          summary={'task_native_invocation_id':nid,'task_work_invocation_id':wid,'task_response_ref':response,'task_response_digest':verified['response']['response_digest'],'task_response_blob_sha':h(response),'task_native_blob_sha':h(npath),'task_fragment_ref':native['fragment_ref'],'task_fragment_blob_sha':h(native['fragment_ref']),'task_local_learn_ref':local,'task_local_learn_blob_sha':h(local),'task_result_artifact_ref':result_ref,'task_result_artifact_blob_sha':h(result_path),'pending_native_invocation_id':nv['invocation_id'],'pending_native_invocation_ref':np.relative_to(root).as_posix(),'pending_native_invocation_blob_sha':h(np),'pending_work_invocation_id':nwid,'pending_request_ref':nreq,'pending_request_digest':req['request_digest'],'pending_request_blob_sha':h(nreq),'pending_component':'consolidate_episode','snapshot_ref':snap_path.relative_to(root).as_posix(),'snapshot_revision':134,'snapshot_phase':'consolidate_pending','snapshot_blob_sha':h(snap_path),'verification':expected}
          receipt={'schema_version':1,'record_type':'generation29_task_evaluate_cross_source_reconciliation_consume_consolidate_episode_receipt','recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},'source_main_sha':os.environ['RUNTIME_MAIN'],'source_state_blob_sha':os.environ['RUNTIME_STATE_BLOB'],'source_ci_workflow_run_id':int(os.environ['SOURCE_CI_RUN_ID']),'source_ci_exact_head_sha':os.environ['SOURCE_CI_HEAD'],'completed_effect':summary,'idempotency_key':'o-work-gen29:consume-task-evaluate-invoke-64f6b0cd887538ecd50c0a24:freeze-cross-source-consolidate-episode:v1','request_recreated':False,'response_repeated':False,'resume_required':True,'unit_verdict':'PASS','upper_objective_verdict':'FAIL','user_level_verdict':'FAIL','agi_achieved':False,'claim_boundary':out['result']['claim_boundary'],'next_action':'Remove the one-shot workflow, validate and merge the exact head, bind state to the unique Consolidate Episode request, consume it once, and continue.'}
          rp=root/'.continual/runs'/run/'recovery-receipts'/'gen29-task-evaluate-cross-source-reconciliation-consume-consolidate-episode-freeze-v1.json'; rp.parent.mkdir(parents=True,exist_ok=True); rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          Path('/tmp/paths.json').write_text(json.dumps({**summary,'receipt':rp.relative_to(root).as_posix()}))
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Stage only the exact lifecycle delta and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          run=os.environ['RUN_ID']; nid=os.environ['TASK_NATIVE_ID']; x=json.loads(Path('/tmp/paths.json').read_text())
          wo=json.loads(Path('/tmp/work-source-prepare.json').read_text())['observation_id']; co=json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          required={
            f'.continual/runs/{run}/events.jsonl',f'.continual/runs/{run}/snapshot.json',f'.continual/runs/{run}/invocations/{nid}.json',
            x['task_response_ref'],x['task_fragment_ref'],x['task_local_learn_ref'],x['task_result_artifact_ref'],
            x['pending_native_invocation_ref'],x['pending_request_ref'],x['receipt'],
            f'.continual/runs/{run}/work-source-observations/{wo}/request.json',f'.continual/runs/{run}/work-source-observations/{wo}/receipt.json',
            f'.continual/runs/{run}/ci-source-observations/{co}/request.json',f'.continual/runs/{run}/ci-source-observations/{co}/receipt.json'
          }
          status={}
          for line in subprocess.check_output(['git','diff','--name-status'],text=True).splitlines():
              code,path=line.split('\t',1);status[path]=code
          for path in subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()+subprocess.check_output(['git','ls-files','--others','--ignored','--exclude-standard'],text=True).splitlines():
              status.setdefault(path,'A')
          for path in list(status):
              if path.startswith('src/agi/__pycache__/') or path.startswith('src/continual/__pycache__/') or path.startswith('src/continual_chatgpt.egg-info/'): status.pop(path)
          if set(status)!=required: raise SystemExit('lifecycle mutation mismatch: '+json.dumps({'missing':sorted(required-set(status)),'unexpected':sorted(set(status)-required),'status':status},sort_keys=True))
          if 'agi/WORK_EXECUTION_STATE.json' in status: raise SystemExit('state mutation must not be staged')
          for p in sorted(required):
              if not Path(p).is_file(): raise SystemExit('missing lifecycle file '+p)
          subprocess.run(['git','add','-f','--',*sorted(required)],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=required: raise SystemExit('staged set mismatch')
          immutable=sorted(p for p in staged if p.startswith('.continual/work-model/invocations/'))
          expected=sorted([x['task_response_ref'],x['pending_request_ref']])
