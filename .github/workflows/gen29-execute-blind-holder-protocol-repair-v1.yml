      - name: Submit exact Execute response and freeze Task Evaluate preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool /tmp/execute-output.json > /dev/null
          continual --root . work-submit "$EXECUTE_WORK_ID" --response /tmp/execute-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/execute-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate Execute completion and exact successor freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          execute_native_id = os.environ['EXECUTE_NATIVE_ID']
          execute_work_id = os.environ['EXECUTE_WORK_ID']
          expected_output = json.loads(Path('/tmp/execute-output.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 110, 'responses': 109, 'pending': 1, 'native_completed': 103, 'native_fragments': 103, 'native_local_learn': 95}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_execute = verified_work_invocation(root, execute_work_id)
          if verified_execute.get('output') != expected_output:
              raise SystemExit('persisted Execute output mismatch')
          execute_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{execute_native_id}.json'
          execute_native = json.loads(execute_native_path.read_text())
          if execute_native.get('status') != 'complete' or execute_native.get('component') != 'execute':
              raise SystemExit('Execute native completion mismatch')
          if execute_native.get('output') != expected_output:
              raise SystemExit('Execute native output mismatch')

          snapshot_path = root / '.continual' / 'runs' / run_id / 'snapshot.json'
          snapshot = json.loads(snapshot_path.read_text())
          if snapshot.get('revision') != 110 or snapshot.get('phase') != 'unit_pending':
              raise SystemExit(f'unexpected successor snapshot: {snapshot.get("revision")}/{snapshot.get("phase")}')
          if snapshot.get('current_component') != 'task_evaluate' or snapshot.get('current_unit') != os.environ['TASK_UNIT_ID']:
              raise SystemExit('Task Evaluate unit not scheduled')
          task_unit_path = root / '.continual' / 'runs' / run_id / 'execution-units' / f"{os.environ['TASK_UNIT_ID']}.json"
          task_unit = json.loads(task_unit_path.read_text())
          if task_unit != expected_output['result']['next_execution_unit']:
              raise SystemExit('Task Evaluate unit mismatch')
          canonical_result_path = root / '.continual' / 'runs' / run_id / 'artifacts' / f"{os.environ['RESULT_UNIT_ID']}-result.json"
          if json.loads(canonical_result_path.read_text()) != expected_output['result']:
              raise SystemExit('canonical Execute result mismatch')

          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one successor request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'candidate_evaluate':
              raise SystemExit('successor is not Task Evaluate Candidate preflight')
          payload = request.get('payload', {})
          if payload.get('mode') != 'pre-application' or payload.get('target_component') != 'task_evaluate':
              raise SystemExit('successor Candidate mode/target mismatch')
          wrapped = payload.get('execution_unit', {})
          if wrapped.get('execution_unit', {}).get('unit_id') != os.environ['TASK_UNIT_ID']:
              raise SystemExit('successor Candidate lost Task Evaluate unit')
          if wrapped.get('snapshot', {}).get('revision') != 110:
              raise SystemExit('successor Candidate snapshot mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('successor Candidate identity mismatch')
          work_id = request['invocation_id']
          request_rel = f'.continual/work-model/invocations/{work_id}/request.json'
          if (root / request_rel).with_name('response.json').exists():
              raise SystemExit('successor Candidate already answered')
          awaiting = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append((path, value))
          if len(awaiting) != 1:
              raise SystemExit(f'expected one awaiting Candidate native journal, got {len(awaiting)}')
          native_path, native = awaiting[0]
          if native.get('component') != 'candidate_evaluate' or native.get('work_invocation_id') != work_id:
              raise SystemExit('successor native/Work mismatch')
          if native.get('work_request_digest') != request.get('request_digest') or native.get('work_request_ref') != request_rel:
              raise SystemExit('successor native digest/ref mismatch')

          response_rel = f'.continual/work-model/invocations/{execute_work_id}/response.json'
          fragment_rel = execute_native['fragment_ref']
          local_learn_rel = f'.continual/runs/{run_id}/local-learn/{execute_native_id}-execute.json'
          summary = {
              'execute_native_invocation_id': execute_native_id,
              'execute_work_invocation_id': execute_work_id,
              'execute_response_ref': response_rel,
              'execute_response_digest': verified_execute['response']['response_digest'],
              'execute_response_blob_sha': subprocess.check_output(['git','hash-object',response_rel], text=True).strip(),
              'execute_native_blob_sha': subprocess.check_output(['git','hash-object',str(execute_native_path)], text=True).strip(),
              'execute_fragment_ref': fragment_rel,
              'execute_fragment_blob_sha': subprocess.check_output(['git','hash-object',fragment_rel], text=True).strip(),
              'execute_local_learn_ref': local_learn_rel,
              'execute_local_learn_blob_sha': subprocess.check_output(['git','hash-object',local_learn_rel], text=True).strip(),
              'canonical_result_ref': canonical_result_path.relative_to(root).as_posix(),
              'canonical_result_blob_sha': subprocess.check_output(['git','hash-object',str(canonical_result_path)], text=True).strip(),
              'task_unit_ref': task_unit_path.relative_to(root).as_posix(),
              'task_unit_blob_sha': subprocess.check_output(['git','hash-object',str(task_unit_path)], text=True).strip(),
              'snapshot_revision': 110,
              'snapshot_phase': 'unit_pending',
              'snapshot_blob_sha': subprocess.check_output(['git','hash-object',str(snapshot_path)], text=True).strip(),
              'pending_native_invocation_id': native['invocation_id'],
              'pending_native_invocation_ref': native_path.relative_to(root).as_posix(),
              'pending_native_invocation_blob_sha': subprocess.check_output(['git','hash-object',str(native_path)], text=True).strip(),
              'pending_work_invocation_id': work_id,
              'pending_request_ref': request_rel,
              'pending_request_digest': request['request_digest'],
              'pending_request_blob_sha': subprocess.check_output(['git','hash-object',request_rel], text=True).strip(),
              'pending_component': 'candidate_evaluate',
              'target_component': 'task_evaluate',
              'verification': expected_after,
          }
          Path('/tmp/execute-consume-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-execute-blind-holder-consume-task-evaluate-preflight-freeze-v1.json'
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_execute_blind_holder_protocol_consume_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00','Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': os.environ['RUNTIME_MAIN'],
              'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': int(os.environ['SOURCE_CI_RUN_ID']),
              'idempotency_key': 'o-work-gen29:consume-execute-invoke-0b550912d69027c31e0ce4d0:blind-holder-protocol:v1',
              'completed_effect': summary,
              'protocol': {
                  'protocol_id': 'agi/heldout-protocol/blind-holder-gate-v1',
                  'synthetic_positive_valid': True,
                  'negative_control_count': 14,
                  'all_negative_controls_fail_closed': True,
                  'deterministic_replay': True,
                  'prior_contaminated_trial_remains_fail': True,
                  'live_forecast_executed': False,
              },
              'request_recreated': False,
              'execute_reinvoked': False,
              'resume_required': True,
              'next_action': 'Remove this one-shot workflow, exact-head validate and merge the blind-holder Execute lifecycle, bind state to the unique Task Evaluate Candidate preflight, then consume it exactly once and continue.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Stage only exact Execute lifecycle delta and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          execute_native_id = os.environ['EXECUTE_NATIVE_ID']
          execute_work_id = os.environ['EXECUTE_WORK_ID']
          summary = json.loads(Path('/tmp/execute-consume-summary.json').read_text())
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-execute-blind-holder-consume-task-evaluate-preflight-freeze-v1.json'
          expected_status = {
              f'.continual/runs/{run_id}/events.jsonl': 'M',
              f'.continual/runs/{run_id}/invocations/{execute_native_id}.json': 'M',
              f'.continual/work-model/invocations/{execute_work_id}/response.json': 'A',
              summary['execute_fragment_ref']: 'A',
              summary['execute_local_learn_ref']: 'A',
              summary['canonical_result_ref']: 'A',
              summary['task_unit_ref']: 'A',
              f'.continual/runs/{run_id}/snapshot.json': 'M',
              summary['pending_native_invocation_ref']: 'A',
              summary['pending_request_ref']: 'A',
              f"{os.environ['TRIAL_DIR']}/protocol-spec.json": 'A',
              f"{os.environ['TRIAL_DIR']}/synthetic-positive-control.json": 'A',
              f"{os.environ['TRIAL_DIR']}/negative-controls.json": 'A',
              f"{os.environ['TRIAL_DIR']}/validation-report.json": 'A',
              f"{os.environ['TRIAL_DIR']}/migration-note.json": 'A',
              f"{os.environ['TRIAL_DIR']}/focused-validation.json": 'A',
              f"{os.environ['TRIAL_DIR']}/bounded-result.json": 'A',
              receipt_rel: 'A',
          }
          status = {}
          for line in subprocess.check_output(['git','diff','--name-status'], text=True).splitlines():
              code, path = line.split('\t', 1)
              status[path] = code
          untracked = (
              subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
              + subprocess.check_output(['git','ls-files','--others','--ignored','--exclude-standard'], text=True).splitlines()
          )
          for path in untracked:
              status.setdefault(path, 'A')
          for path in list(status):
              if (
                  path.startswith('src/agi/__pycache__/')
                  or path.startswith('src/continual/__pycache__/')
                  or path.startswith('src/continual_chatgpt.egg-info/')
                  or path.startswith('tests/__pycache__/')
              ):
                  status.pop(path, None)
          allowed_new_prefixes = (
              f'.continual/runs/{run_id}/work-source-observations/',
              f'.continual/runs/{run_id}/ci-source-observations/',
          )
          for path, code in status.items():
              if code == 'A' and path.startswith(allowed_new_prefixes):
                  expected_status[path] = 'A'
          if status != expected_status:
              raise SystemExit('lifecycle mutation mismatch: ' + json.dumps({
                  'expected': expected_status,
                  'observed': status,
                  'missing': sorted(set(expected_status) - set(status)),
                  'unexpected': sorted(set(status) - set(expected_status)),
              }, sort_keys=True))
          required = sorted(expected_status)
          for path in required:
              if not Path(path).is_file():
                  raise SystemExit('required lifecycle path missing: ' + path)
          subprocess.run(['git','add','-f','--',*required], check=True)
          staged = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if staged != set(required):
              raise SystemExit('staged lifecycle set mismatch')
          immutable = sorted(path for path in staged if path.startswith('.continual/work-model/invocations/'))
          expected_immutable = sorted([
              f'.continual/work-model/invocations/{execute_work_id}/response.json',
              summary['pending_request_ref'],
          ])
          if immutable != expected_immutable:
              raise SystemExit('immutable Work mutation set mismatch: ' + json.dumps(immutable))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-execute-blind-holder-result] gen29 consume blind-holder Execute and freeze Task Evaluate preflight'
          git push origin "HEAD:$GITHUB_REF_NAME"
