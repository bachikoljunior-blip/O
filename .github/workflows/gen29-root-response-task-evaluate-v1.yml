              raise SystemExit('recovered Root response digest mismatch')
          if response.get('received_at') != '2026-08-29T20:19:44.572136Z':
              raise SystemExit('recovered Root response timestamp mismatch')
          if next_request.get('invocation_id') != next_work_id:
              raise SystemExit('recovered Candidate Evaluate request invocation mismatch')
          if next_request.get('request_digest') != os.environ['RECOVERED_NEXT_REQUEST_DIGEST']:
