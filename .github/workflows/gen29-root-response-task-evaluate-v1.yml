          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one scoped Candidate Evaluate request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'candidate_evaluate':
              raise SystemExit('next pending request is not Candidate Evaluate')
          if request.get('invocation_id') != os.environ['RECOVERED_NEXT_WORK_ID']:
              raise SystemExit('recovered Candidate Evaluate invocation id mismatch')
          if request.get('request_digest') != os.environ['RECOVERED_NEXT_REQUEST_DIGEST']:
              raise SystemExit('recovered Candidate Evaluate digest mismatch')
          if request.get('created_at') != os.environ['RECOVERED_NEXT_CREATED_AT']:
              raise SystemExit('recovered Candidate Evaluate timestamp mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Candidate Evaluate request identity mismatch')
          payload = request.get('payload', {})
          if payload.get('mode') != 'pre-application' or payload.get('target_component') != 'task_evaluate':
              raise SystemExit('Candidate Evaluate request is not the scoped Task Evaluate preflight')
          execution_context = payload.get('execution_unit', {})
          if execution_context.get('execution_unit') != expected_output['result']:
              raise SystemExit('Candidate Evaluate request did not bind exact Root-selected unit')
          frozen_snapshot = execution_context.get('snapshot', {})
          if (
              frozen_snapshot.get('revision') != 95
              or frozen_snapshot.get('phase') != 'unit_pending'
              or frozen_snapshot.get('current_component') != 'task_evaluate'
              or frozen_snapshot.get('current_unit') != result_unit_id
          ):
              raise SystemExit('Candidate Evaluate request snapshot binding mismatch')
          candidates = payload.get('candidate_index', {}).get('candidates', [])
          if not any(
              item.get('candidate_id') == 'candidate-task-evaluate-unit-verdict-v1'
              and item.get('target_component') == 'task_evaluate'
              for item in candidates if isinstance(item, dict)
          ):
              raise SystemExit('expected scoped Task Evaluate candidate is absent')
          work_id = request['invocation_id']
          request_rel = f'.continual/work-model/invocations/{work_id}/request.json'
          if (root / request_rel).with_name('response.json').exists():
              raise SystemExit('Candidate Evaluate request already has a response')
          awaiting = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append((path, value))
          if len(awaiting) != 1:
              raise SystemExit(f'expected one awaiting native journal, got {len(awaiting)}')
          native_path, native = awaiting[0]
