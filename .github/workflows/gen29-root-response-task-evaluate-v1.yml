          if next_request.get('created_at') != os.environ['RECOVERED_NEXT_CREATED_AT']:
              raise SystemExit('recovered Candidate Evaluate request timestamp mismatch')
          if next_request.get('component') != 'candidate_evaluate':
              raise SystemExit('recovered next request is not Candidate Evaluate')
          store = Store(root)
          store.atomic_bytes(response_path, response_bytes)
          store.atomic_bytes(next_request_path, next_request_bytes)
          verified_root = verified_work_invocation(root, root_work_id)
          verified_next = verified_work_request(root, next_work_id)
          if verified_root['response'].get('response_digest') != os.environ['RECOVERED_ROOT_RESPONSE_DIGEST']:
              raise SystemExit('written Root response failed exact verification')
          if verified_next.get('request_digest') != os.environ['RECOVERED_NEXT_REQUEST_DIGEST']:
              raise SystemExit('written Candidate Evaluate request failed exact verification')
          engine = Engine(
              root,
              model=WorkModelClient(
                  root,
                  run_id=run_id,
                  executor_binding=os.environ['EXECUTOR_BINDING'],
                  model_identity=os.environ['MODEL_IDENTITY'],
              ),
          )
          snapshot = engine.resume(run_id, max_steps=2)
          resume_result = {
              'run_id': run_id,
              'snapshot': snapshot,
              'pending': pending_work_invocations(root, run_id=run_id),
          }
          Path('/tmp/root-submit.json').write_bytes(response_bytes)
          Path('/tmp/root-response.json').write_text(json.dumps(response['output'], indent=2, sort_keys=True) + '\n')
          Path('/tmp/native-resume.json').write_text(json.dumps(resume_result, indent=2, sort_keys=True) + '\n')
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json
          cat /tmp/root-submit.json
          cat /tmp/native-resume.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json

      - name: Validate one Root consume and exact scoped Candidate Evaluate freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
