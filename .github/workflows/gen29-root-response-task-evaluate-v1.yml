          response_rel = f'.continual/work-model/invocations/{root_work_id}/response.json'
          fragment_rel = root_native['fragment_ref']
          local_learn_rel = f'.continual/runs/{run_id}/local-learn/{root_native_id}-root.json'
          summary = {
              'root_native_invocation_id': root_native_id,
              'root_work_invocation_id': root_work_id,
              'root_response_ref': response_rel,
              'root_response_digest': verified_root['response']['response_digest'],
              'root_response_blob_sha': subprocess.check_output(['git', 'hash-object', response_rel], text=True).strip(),
              'root_native_blob_sha': subprocess.check_output(['git', 'hash-object', str(root_native_path)], text=True).strip(),
              'root_fragment_ref': fragment_rel,
              'root_fragment_blob_sha': subprocess.check_output(['git', 'hash-object', fragment_rel], text=True).strip(),
              'root_local_learn_ref': local_learn_rel,
              'root_local_learn_blob_sha': subprocess.check_output(['git', 'hash-object', local_learn_rel], text=True).strip(),
              'execution_unit_ref': unit_path.relative_to(root).as_posix(),
              'execution_unit_blob_sha': subprocess.check_output(['git', 'hash-object', str(unit_path)], text=True).strip(),
              'pending_native_invocation_id': native['invocation_id'],
              'pending_native_invocation_ref': native_path.relative_to(root).as_posix(),
              'pending_native_invocation_blob_sha': subprocess.check_output(['git', 'hash-object', str(native_path)], text=True).strip(),
              'pending_work_invocation_id': work_id,
              'pending_request_ref': request_rel,
              'pending_request_digest': request['request_digest'],
              'pending_request_blob_sha': subprocess.check_output(['git', 'hash-object', request_rel], text=True).strip(),
              'snapshot_revision': 95,
              'snapshot_phase': 'unit_pending',
              'snapshot_blob_sha': subprocess.check_output(['git', 'hash-object', str(snapshot_path)], text=True).strip(),
              'verification': expected_after,
              'selected_semantic_component': 'task_evaluate',
              'pending_preflight_component': 'candidate_evaluate',
              'recovered_from_job_id': int(os.environ['RECOVERY_LOG_JOB_ID']),
          }
          Path('/tmp/root-consume-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-root-consume-task-evaluate-freeze-v1.json'
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_root_response_and_candidate_preflight_recovery_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': os.environ['RUNTIME_MAIN'],
              'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': int(os.environ['SOURCE_CI_RUN_ID']),
              'idempotency_key': 'o-work-gen29:consume-root-invoke-91f2cb57cf0f69a5d9abfce6:freeze-task-evaluate-once:v1',
              'completed_effect': summary,
              'request_recreated': False,
              'root_reinvoked': False,
              'resume_required': True,
              'next_action': 'Exact-head validate and merge this immutable Root response and Candidate Evaluate preflight freeze, bind state, then answer the Candidate Evaluate request exactly once.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
