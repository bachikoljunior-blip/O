              receipt_rel: 'A',
          }
          status = {}
          for line in subprocess.check_output(['git','diff','--name-status'], text=True).splitlines():
              code, path = line.split('\t',1)
              status[path] = code
          others = (
              subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
              + subprocess.check_output(['git','ls-files','--others','--ignored','--exclude-standard'], text=True).splitlines()
          )
          for path in others:
              status.setdefault(path,'A')
          for path in list(status):
              if path.startswith('src/agi/__pycache__/') or path.startswith('src/continual/__pycache__/') or path.startswith('src/continual_chatgpt.egg-info/'):
                  status.pop(path,None)
          prefix = f'.continual/runs/{run_id}/preflight/preflight-root-'
