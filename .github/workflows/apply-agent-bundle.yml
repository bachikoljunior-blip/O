name: apply-agent-bundle

on:
  push:
    branches: [agent/agi-evidence-runtime-v2]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage AGI runtime bundle workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agi-evidence-runtime-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract bundle
        run: |
          set -euo pipefail
          cat .agent-bundle/chunk-* | base64 -d > /tmp/agent-bundle.tar.gz
          echo "dc0d48a9a3a5897a3611d3fcf42f812f768cf9596481c026b4727fc913eccaaf  /tmp/agent-bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agent-bundle.tar.gz
          rm -f agi/evaluation.py tests/test_agi_e2e.py
          rm -rf .agent-bundle
          rm -f .github/workflows/apply-agent-bundle.yml
      - name: Validate implementation
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          pytest -q
          python -m compileall -q src
          agi-benchmark validate-suite
          agi-benchmark run-reference --output /tmp/reference-report.json
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "O continual agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build evidence-driven AGI runtime v2"
          git push origin HEAD:agent/agi-evidence-runtime-v2
