                "an independently retrieved primary-source reveal matching both the commitment and immutable source",
                "a deterministic replay-stable score and a same-input no-extra-context baseline, or an exact fail-closed NOT_EVALUABLE reason",
                "an empty contamination and mutation audit, focused and protected tests, and unchanged exact-head publication evidence",
                "explicit negative evidence and a claim boundary limiting the result to this one scientific forecast"
              ],
              "reason": "No indexed Candidate is verified for the exact agi/clean-g1/heldout-scientific-forecast-v1 scope. The benchmark-suite and workspace-campaign Candidates are broader and would change this single precommitted task; repository-hygiene is adjacent but unverified; recursive-retrieval and live-campaign Candidates govern different mechanisms. The active Execute prompt is therefore the uncontaminated baseline.",
              "regression_checks": [
                "the selected source is fresh relative to the revision105 Root context and has exact clean_g1 and immutable-primary provenance",
                "no primary result, answer, abstract result sentence, or equivalent outcome signal appears in the frozen prediction bundle",
                "the withheld-outcome commitment predates the forecast and the reveal matches both commitment and primary source",
                "forecast, confidence, and next-experiment choice are recorded before reveal and scored by one deterministic replay-stable rule",
                "the baseline uses identical exposed inputs or the trial fails closed without a fabricated comparator",
                "the contamination and mutation audits remain empty and no provider, production, dispatch, Candidate activation, or unrelated effect occurs",
