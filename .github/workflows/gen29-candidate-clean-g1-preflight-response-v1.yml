                "latency": "Measure only the bounded acquisition, prediction, reveal, deterministic replay, and exact-head validation needed for this single trial; make no production-latency claim.",
                "quality": "Require immutable clean_g1 provenance, strict outcome hiding, pre-reveal prediction and next-experiment choice, commitment-matching reveal, replay-stable score, valid same-input baseline or NOT_EVALUABLE, and explicit negative evidence.",
                "token": "Record only directly measured usage if available; do not infer missing token cost.",
                "tool": "Use the minimum read-only source retrieval, repository-local artifact construction, deterministic tests, and protected publication gates required by the frozen unit."
              },
              "decision": "BASELINE_FIRST",
              "evidence_to_collect": [
