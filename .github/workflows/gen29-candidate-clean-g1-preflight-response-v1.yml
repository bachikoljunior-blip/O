              ],
              "rollback": "If provenance is stale or ambiguous, outcome leakage occurs, commitment ordering or reveal matching fails, the baseline is invalid, scoring is nondeterministic, any mutation occurs, protected tests fail, or the claim widens, discard the trial delta, keep every Candidate state unchanged, and record only the exact FAIL, UNCERTAIN, or NOT_EVALUABLE outcome."
