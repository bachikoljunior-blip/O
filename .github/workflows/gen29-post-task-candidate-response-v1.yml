          from pathlib import Path
          value = base64.b64decode("""
          ewogICJmcmFnbWVudCI6IHsKICAgICJjb21wb25lbnQiOiAiY2FuZGlkYXRlX2V2YWx1YXRlIiwKICAgICJvYnNlcnZhdGlvbnMi
