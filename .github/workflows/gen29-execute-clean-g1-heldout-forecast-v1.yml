name: gen29 consume clean-g1 held-out forecast Execute v1

on:
  push:
    branches:
      - work/gen29-execute-clean-g1-heldout-forecast-v1

permissions:
  contents: write

concurrency:
  group: gen29-execute-clean-g1-heldout-forecast-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-execute-clean-g1-forecast-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 92bccc8061e334facba2b1a4916f1ec00d217bc1
      EXPECTED_PREWORK_HEAD: 8d0c1a0121d88ef48282cd10c3b395810e8ea49f
      EXPECTED_STATE_BLOB: 39bd0408927e803104ccf68e0557cb2c045a9a00
      EXPECTED_SNAPSHOT_BLOB: eca73024e39a5079925d49c633991915367e5402
      EXPECTED_INBOX_BLOB: 93889b482c5b54dd90944f19ce425e845f455b35
      EXPECTED_INBOX_REVISION: '35'
      EXECUTE_NATIVE_ID: invoke-068a2c38f45162ec85f67601
      EXECUTE_NATIVE_BLOB: c489b49a925b440080388b914d429c2d24ca0320
      EXECUTE_WORK_ID: invoke-614676a3cdc4f32ee316fa58
      EXECUTE_REQUEST_BLOB: c4d5dab1bfa96d2d145eade2b848bb00563d8920
      EXECUTE_REQUEST_DIGEST: fd8b3e6d80101de8fbd1ed936ccd0276ab120cd8741dfe70099764000dee679d
      SOURCE_CI_RUN_ID: '33314468222'
      SOURCE_CI_HEAD: d35bc78fbbd4a9a6a26cb5855fe3805b298b1d1b
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-clean-g1-heldout-scientific-forecast-v1
      TASK_UNIT_ID: unit-generation29-evaluate-clean-g1-heldout-scientific-forecast-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      PRIMARY_REPO: arghavan-b/crucible-harness
      PRIMARY_COMMIT: 437835ded412544fd294c2b910942208216e85b2
      PRIMARY_BLOB: 30660760620ceb61c2cabb0d53c424482f50f40b
      PRIMARY_SHA256: 92b9790c386b3e445c44677636355942961a493bb66acad84303128fbb6dc818
      TRIAL_DIR: .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e '.[test]'

      - name: Assert exact branch, main, authority, and Execute binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREWORK_HEAD"
          test "$(git diff --name-only "$EXPECTED_PREWORK_HEAD" HEAD)" = ".github/workflows/gen29-execute-clean-g1-heldout-forecast-v1.yml"
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import os
          import subprocess

          expected = sorted([
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/contamination-mutation-audit.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/prediction.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/reveal-receipt.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/score.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/source-connector-receipt.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/trial-spec.json',
              '.continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-clean-g1-heldout-scientific-forecast-v1/withheld-outcome-commitment.json',
              '.github/workflows/gen29-execute-clean-g1-heldout-forecast-v1.yml',
              'src/agi/scientific_forecast.py',
              'tests/test_scientific_forecast.py',
          ])
          observed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines())
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          test "$(git hash-object "$TRIAL_DIR/withheld-outcome-commitment.json")" = 5e3f25940ce7ba367fcca6cebbc07c3fdb0abe1c
          test "$(git hash-object "$TRIAL_DIR/source-connector-receipt.json")" = 10e0d7db95f19dde30c9dc3828498d16545139c1
          test "$(git hash-object "$TRIAL_DIR/trial-spec.json")" = 287f2e6a0663babbe352477b0ee2c1c42d9e1641
          test "$(git hash-object "$TRIAL_DIR/prediction.json")" = 69af79c644a50bf50e30fd54418a76eed1b10dd1
          test "$(git hash-object "$TRIAL_DIR/reveal-receipt.json")" = c7de78899ff7312b042e685c36ad4d1045aa46ff
          test "$(git hash-object "$TRIAL_DIR/score.json")" = b186a0f97ea5b07be2c504aa15eead540f3be8b4
          test "$(git hash-object "$TRIAL_DIR/contamination-mutation-audit.json")" = 87668ab5113e454d6d6ded662ae7cdcd5ee8e735
          test "$(git hash-object src/agi/scientific_forecast.py)" = d58a2378fde418612d98a734666f11fb2399021b
          test "$(git hash-object tests/test_scientific_forecast.py)" = e15632ef537c3bd3487dae1b88c449a76abe25f2

          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$EXECUTE_WORK_ID/request.json)" = "$EXECUTE_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$EXECUTE_NATIVE_ID.json)" = "$EXECUTE_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['EXECUTE_NATIVE_ID']
          work_id = os.environ['EXECUTE_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_execute_clean_g1_heldout_forecast_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['EXECUTE_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['EXECUTE_REQUEST_BLOB'],
              'pending_request_digest': os.environ['EXECUTE_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 106,
              'native_phase': 'unit_pending',
              'pending_component': 'execute',
              'target_component': 'execute',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          if inbox.get('revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('inbox revision mismatch')
          if state.get('user_input_inbox', {}).get('highest_acknowledged_revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('state inbox acknowledgement mismatch')
          if snapshot.get('revision') != 106 or snapshot.get('phase') != 'unit_pending':
              raise SystemExit('snapshot revision/phase mismatch')
          if snapshot.get('current_component') != 'execute' or snapshot.get('current_unit') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('snapshot Execute unit mismatch')
          if request.get('component') != 'execute' or request.get('request_digest') != os.environ['EXECUTE_REQUEST_DIGEST']:
              raise SystemExit('Execute request mismatch')
          if request.get('prompt_path') != 'prompts/execute.md':
              raise SystemExit('Execute did not retain active prompt')
          payload = request.get('payload', {})
          if payload.get('execution_unit', {}).get('unit_id') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('Execute unit binding mismatch')
          if payload.get('preflight_selection', {}).get('decision') != 'BASELINE_FIRST':
              raise SystemExit('Execute preflight selection mismatch')
          if payload.get('candidate') not in (None, {}):
              raise SystemExit('unexpected Candidate overlay')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Execute identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Execute already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'execute':
              raise SystemExit('Execute native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Execute is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 103, 'responses': 102, 'pending': 1, 'native_completed': 96, 'native_fragments': 96, 'native_local_learn': 88}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Record fresh main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store

          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = completed
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = success
          jq -e '[.jobs[] | select(.id == 99265214724 or .id == 99265214683 or .id == 99265214601 or .id == 99265214705 or .id == 99269882446) | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$EXPECTED_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-inbox-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/pre-mutation-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          if gh api "repos/$GITHUB_REPOSITORY/contents/.continual/work-model/invocations/$EXECUTE_WORK_ID/response.json?ref=$LATEST_MAIN" >/tmp/unexpected-response.json 2>/dev/null; then
            echo "Execute response already exists on main" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation

          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY

      - name: Independently replay primary reveal and focused tests
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$PRIMARY_REPO/git/blobs/$PRIMARY_BLOB" > /tmp/primary-blob.json
          test "$(jq -r '.sha' /tmp/primary-blob.json)" = "$PRIMARY_BLOB"
          jq -r '.content' /tmp/primary-blob.json | tr -d '\n' | base64 --decode > /tmp/primary.py
          test "$(git hash-object /tmp/primary.py)" = "$PRIMARY_BLOB"
          test "$(sha256sum /tmp/primary.py | cut -d' ' -f1)" = "$PRIMARY_SHA256"
          python -m agi.scientific_forecast classify /tmp/primary.py > /tmp/ast-replay-1.json
          python -m agi.scientific_forecast classify /tmp/primary.py > /tmp/ast-replay-2.json
          cmp /tmp/ast-replay-1.json /tmp/ast-replay-2.json
          jq -e '.label == "DURABLE_EXPORT_ABSENT" and .match_count == 0 and (.matches | length) == 0' /tmp/ast-replay-1.json
          python -m pytest -p no:cacheprovider tests/test_scientific_forecast.py tests/test_heldout.py -q | tee /tmp/focused-tests.txt

          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          from agi.scientific_forecast import (
              ABSENT,
              PRESENT,
              ROUND_TRIP,
              SEEDED_EXPORT,
              canonical_digest,
              score_binary_forecast,
              validate_prediction_artifact,
          )

          root = Path('.').resolve()
          trial_dir = root / os.environ['TRIAL_DIR']
          prediction = json.loads((trial_dir / 'prediction.json').read_text())
          reveal = json.loads((trial_dir / 'reveal-receipt.json').read_text())
          score = json.loads((trial_dir / 'score.json').read_text())
          audit = json.loads((trial_dir / 'contamination-mutation-audit.json').read_text())
          ast_result = json.loads(Path('/tmp/ast-replay-1.json').read_text())
          prediction_validation = validate_prediction_artifact(prediction)
          if prediction_validation != {'valid': True, 'errors': []}:
              raise SystemExit(f'prediction validation failed: {prediction_validation!r}')
          if ast_result['label'] != reveal['frozen_extraction']['label']:
              raise SystemExit('reveal label mismatch')
          forecast = score_binary_forecast(
              forecast_label=prediction['forecast']['label'],
              probability_present=prediction['forecast']['probability_durable_export_present'],
              next_experiment_choice=prediction['forecast']['next_experiment_choice'],
              reveal_label=ast_result['label'],
          )
          baseline = score_binary_forecast(
              forecast_label=prediction['same_input_baseline']['label'],
              probability_present=prediction['same_input_baseline']['probability_durable_export_present'],
              next_experiment_choice=prediction['same_input_baseline']['next_experiment_choice'],
              reveal_label=ast_result['label'],
          )
          expected_forecast = score['forecast']
          expected_baseline = score['same_input_no_extra_context_baseline']
          for key in ('label_correct','confidence_brier','next_experiment_correct','composite_score'):
              if abs(float(forecast[key]) - float(expected_forecast[key])) > 1e-12:
                  raise SystemExit(f'forecast score mismatch for {key}')
              if abs(float(baseline[key]) - float(expected_baseline[key])) > 1e-12:
                  raise SystemExit(f'baseline score mismatch for {key}')
          if audit['contamination']['contamination_findings'] or audit['mutation']['mutation_findings']:
              raise SystemExit('audit findings are nonempty')

          now = datetime.now(UTC).isoformat().replace('+00:00','Z')
          focused = {
              'schema_version': 1,
              'record_type': 'heldout_scientific_forecast_focused_validation',
              'trial_id': 'gen29-clean-g1-crucible-provenance-export-v1',
              'validated_at': now,
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'primary_repository': os.environ['PRIMARY_REPO'],
              'primary_commit_sha': os.environ['PRIMARY_COMMIT'],
              'primary_blob_sha': os.environ['PRIMARY_BLOB'],
              'primary_sha256': os.environ['PRIMARY_SHA256'],
              'independent_read_exact': True,
              'ast_replay_count': 2,
              'ast_replay_identical': True,
              'ast_result': ast_result,
              'prediction_validation': prediction_validation,
              'forecast_score': forecast,
              'baseline_score': baseline,
              'focused_tests': {
                  'command': 'python -m pytest -p no:cacheprovider tests/test_scientific_forecast.py tests/test_heldout.py -q',
                  'passed': True,
                  'output_tail': Path('/tmp/focused-tests.txt').read_text()[-1000:],
              },
              'provider_execution': False,
              'production_route_change': False,
              'candidate_activation': False,
              'protected_ci_pending': True,
              'claim_boundary': 'Focused deterministic validation for one exact primary-source forecast only.',
              'agi_claim_supported': False,
              'user_level_objective_met': False,
              'resume_required': True,
          }
          focused_path = trial_dir / 'focused-validation.json'
          focused_path.write_text(json.dumps(focused, indent=2, sort_keys=True) + '\n')

          task_unit = {
              'unit_id': os.environ['TASK_UNIT_ID'],
              'component': 'task_evaluate',
