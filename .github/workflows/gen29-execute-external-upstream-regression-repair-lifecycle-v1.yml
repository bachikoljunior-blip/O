          test "$(git hash-object "$TRIAL_DIR/upstream.patch")" = "295f8f89deedd30fb42ef2fa23677510f599378b"
          test "$(git hash-object "$TRIAL_DIR/patch-manifest.json")" = "e8fed89ed12fd19e232343ab78120fb3c569d390"
          test "$(git hash-object "$TRIAL_DIR/patched-reproduction.json")" = "9bea944408711c8f6e13b9aa4c1f8876224e4407"
          test "$(git hash-object "$TRIAL_DIR/official-tests.json")" = "ed43f223fa7728737d4604d9e4c9f3ebbb371c1c"
          test "$(git hash-object "$TRIAL_DIR/bounded-result.json")" = "77e926936788d422387e52985f2c6859672f93c1"
          test "$(git hash-object "$TRIAL_DIR/replay-verification.json")" = "bfe0e2868659284f35736702b408e3bc6302fa8a"
          jq -e '.verdict == "SOLVED" and .baseline_reproduced == true and .focused_test_passed_after_patch == true and .official_tests_passed == true and .result_digest == "be61f8e69baf3bc2ac602c825dd962682ce16702b8e04fc1589aeca95770553b" and .upstream_write_performed == false' "$TRIAL_DIR/bounded-result.json"
          jq -e '.passed == true and .exit_code == 0 and (.output | contains("73 passed"))' "$TRIAL_DIR/official-tests.json"
          jq -e '.replay_verified == true and .exact_commit_verified == true and .patch_paths_exact == true and .result_digest == "be61f8e69baf3bc2ac602c825dd962682ce16702b8e04fc1589aeca95770553b"' "$TRIAL_DIR/replay-verification.json"
          base64 --decode > /tmp/execute-output.json <<'B64'
          ewogICJmcmFnbWVudCI6IHsKICAgICJhZ2lfY2xhaW1fc3VwcG9ydGVkIjogZmFsc2UsCiAgICAiYmFzZWxpbmVfcmVwcm9kdWNl
