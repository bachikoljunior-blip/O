name: Bootstrap hierarchical agent experiments

on:
  push:
    branches:
      - agent/agi-runtime-v2-20260816
    paths:
      - .agent-runtime-v2/trigger

permissions:
  contents: write

concurrency:
  group: agi-runtime-bootstrap-v2
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agi-runtime-v2-20260816
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start from latest main
        shell: bash
        run: |
          set -euo pipefail
          cp -R .agent-runtime-v2 /tmp/agent-runtime-v2
          git fetch origin main
          git checkout -B agent/agi-runtime-v2-20260816 origin/main
          rm -rf .agent-runtime-v2 .github/workflows/agi-runtime-v2-bootstrap.yml
          cp -R /tmp/agent-runtime-v2 .agent-runtime-v2
          test -f src/agi/agent.py
          test -f src/agi/benchmark_runner.py

      - name: Apply v2 implementation
        shell: bash
        run: |
          set -euo pipefail
          python .agent-runtime-v2/01_context_workspace.py
          python .agent-runtime-v2/02_hierarchy_experiments.py
          python .agent-runtime-v2/03_tests_docs.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          pytest -q
          python -m compileall -q src tests
          python -m agi.cli --root . advance > /tmp/campaign-v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/campaign-v2.json').read_text(encoding='utf-8'))
          assert state['status'] in {'continue', 'verified'}
          assert state['report']['agi_claim_supported'] is False
          assert state['next_milestones']
          PY

      - name: Publish clean commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-runtime-v2 .github/workflows/agi-runtime-v2-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add hierarchical agent experiments and transactional workspaces'
          git push --force-with-lease origin HEAD:agent/agi-runtime-v2-20260816
          git push origin HEAD:main

      - name: Remove temporary branch
        if: success()
        shell: bash
        run: git push origin --delete agent/agi-runtime-v2-20260816 || true
