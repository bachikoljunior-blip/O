      - name: Validate Task Evaluate consume and exact post-result Candidate freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verified_work_request, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          task_native_id = os.environ['TASK_NATIVE_ID']
          task_work_id = os.environ['TASK_WORK_ID']
          expected_output = json.loads(Path('/tmp/task-output.json').read_text())
          original_request = verified_work_request(root, task_work_id)
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          expected_before = {
            'valid': True, 'requests': 105, 'responses': 104, 'pending': 1,
            'native_completed': 98, 'native_fragments': 98, 'native_local_learn': 90,
          }
          for key, value in expected_before.items():
            if before.get(key) != value:
              raise SystemExit(f'before verification mismatch {key}: {before.get(key)!r}')
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {
            'valid': True, 'requests': 106, 'responses': 105, 'pending': 1,
            'native_completed': 99, 'native_fragments': 99, 'native_local_learn': 91,
          }
          for key, value in expected_after.items():
            if after.get(key) != value:
              raise SystemExit(f'after verification mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_task = verified_work_invocation(root, task_work_id)
          if verified_task.get('output') != expected_output:
            raise SystemExit('persisted Task Evaluate output differs from exact submitted output')
          task_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{task_native_id}.json'
          task_native = json.loads(task_native_path.read_text())
          if task_native.get('status') != 'complete' or task_native.get('component') != 'task_evaluate':
            raise SystemExit('Task Evaluate native journal is not complete')
          if task_native.get('output') != expected_output:
            raise SystemExit('Task Evaluate native output mismatch')
          snapshot_path = root / '.continual' / 'runs' / run_id / 'snapshot.json'
          if subprocess.check_output(['git', 'hash-object', str(snapshot_path)], text=True).strip() != os.environ['EXPECTED_SNAPSHOT_BLOB']:
            raise SystemExit('revision107 snapshot changed before post-result Candidate was consumed')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
            raise SystemExit(f'expected one post-result Candidate request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'candidate_evaluate':
            raise SystemExit('next pending request is not Candidate Evaluate')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
            raise SystemExit('post-result Candidate request identity mismatch')
          payload = request.get('payload', {})
          if payload.get('mode') != 'post-result' or payload.get('target_component') != 'task_evaluate':
            raise SystemExit('post-result Candidate mode/target mismatch')
          if payload.get('actual_result') != expected_output.get('result'):
            raise SystemExit('post-result Candidate actual_result mismatch')
          original_payload = original_request.get('payload', {})
          expected_post_unit = {
            'snapshot': original_payload.get('snapshot'),
            'execution_unit': original_payload.get('execution_unit'),
          }
          if payload.get('execution_unit') != expected_post_unit:
            raise SystemExit('post-result Candidate execution-unit mismatch')
          if payload.get('pre_application') != original_payload.get('preflight_selection'):
            raise SystemExit('post-result Candidate pre-application mismatch')
          candidate = payload.get('candidate', {})
          if candidate.get('candidate_id') != 'candidate-task-evaluate-unit-verdict-v1' or candidate.get('target_component') != 'task_evaluate':
            raise SystemExit('post-result Candidate binding mismatch')
          work_id = request['invocation_id']
          request_rel = f'.continual/work-model/invocations/{work_id}/request.json'
          if (root / request_rel).with_name('response.json').exists():
            raise SystemExit('post-result Candidate request already has a response')
          if request.get('prompt_path') != 'prompts/candidate_evaluate.md':
            raise SystemExit('post-result Candidate prompt binding mismatch')
          awaiting = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'invocations').glob('*.json')):
            value = json.loads(path.read_text())
            if value.get('status') == 'awaiting_work_model':
              awaiting.append((path, value))
          if len(awaiting) != 1:
            raise SystemExit(f'expected one awaiting post-result Candidate native journal, got {len(awaiting)}')
          native_path, native = awaiting[0]
          if native.get('component') != 'candidate_evaluate' or native.get('work_invocation_id') != work_id:
            raise SystemExit('post-result Candidate native-to-Work identity mismatch')
          if native.get('work_request_digest') != request.get('request_digest') or native.get('work_request_ref') != request_rel:
            raise SystemExit('post-result Candidate native-to-Work digest/ref mismatch')
          response_rel = f'.continual/work-model/invocations/{task_work_id}/response.json'
          fragment_rel = task_native['fragment_ref']
          local_learn_rel = f'.continual/runs/{run_id}/local-learn/{task_native_id}-task_evaluate.json'
          summary = {
            'task_native_invocation_id': task_native_id,
            'task_work_invocation_id': task_work_id,
            'task_response_ref': response_rel,
            'task_response_digest': verified_task['response']['response_digest'],
            'task_response_blob_sha': subprocess.check_output(['git', 'hash-object', response_rel], text=True).strip(),
            'task_native_blob_sha': subprocess.check_output(['git', 'hash-object', str(task_native_path)], text=True).strip(),
            'task_fragment_ref': fragment_rel,
            'task_fragment_blob_sha': subprocess.check_output(['git', 'hash-object', fragment_rel], text=True).strip(),
            'task_local_learn_ref': local_learn_rel,
            'task_local_learn_blob_sha': subprocess.check_output(['git', 'hash-object', local_learn_rel], text=True).strip(),
            'pending_native_invocation_id': native['invocation_id'],
            'pending_native_invocation_ref': native_path.relative_to(root).as_posix(),
            'pending_native_invocation_blob_sha': subprocess.check_output(['git', 'hash-object', str(native_path)], text=True).strip(),
            'pending_work_invocation_id': work_id,
            'pending_request_ref': request_rel,
            'pending_request_digest': request['request_digest'],
            'pending_request_blob_sha': subprocess.check_output(['git', 'hash-object', request_rel], text=True).strip(),
            'pending_component': 'candidate_evaluate',
            'candidate_mode': 'post-result',
            'selected_candidate_id': 'candidate-task-evaluate-unit-verdict-v1',
            'snapshot_revision': 107,
            'snapshot_phase': 'unit_pending',
            'snapshot_blob_sha': os.environ['EXPECTED_SNAPSHOT_BLOB'],
            'verification': expected_after,
          }
          Path('/tmp/task-consume-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-task-evaluate-clean-g1-consume-post-result-candidate-freeze-v1.json'
          receipt = {
            'schema_version': 1,
            'record_type': 'generation29_task_evaluate_consume_receipt',
            'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
            'authority': {
              'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
              'lease_generation': 29,
              'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
            },
            'source_main_sha': os.environ['RUNTIME_MAIN'],
            'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
            'source_ci_workflow_run_id': int(os.environ['SOURCE_CI_RUN_ID']),
            'idempotency_key': 'o-work-gen29:consume-clean-g1-task-evaluate-invoke-55fe7f1cb2ad60451c4954dc:freeze-post-result-candidate:v1',
            'completed_effect': summary,
            'request_recreated': False,
            'task_reinvoked': False,
            'resume_required': True,
            'next_action': 'Exact-head validate and merge this Task Evaluate response plus post-result Candidate freeze, bind state, then answer the exact post-result Candidate request once.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print('TASK_CONSUME=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Stage only exact Task Evaluate lifecycle delta and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          run_id = os.environ['RUN_ID']
          task_native_id = os.environ['TASK_NATIVE_ID']
          task_work_id = os.environ['TASK_WORK_ID']
          summary = json.loads(Path('/tmp/task-consume-summary.json').read_text())
          work_obs = json.loads(Path('/tmp/work-source-prepare.json').read_text())['observation_id']
          ci_obs = json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-task-evaluate-clean-g1-consume-post-result-candidate-freeze-v1.json'
          expected_status = {
            f'.continual/runs/{run_id}/events.jsonl': 'M',
            f'.continual/runs/{run_id}/invocations/{task_native_id}.json': 'M',
            f'.continual/work-model/invocations/{task_work_id}/response.json': 'A',
            summary['task_fragment_ref']: 'A',
            summary['task_local_learn_ref']: 'A',
            summary['pending_native_invocation_ref']: 'A',
            summary['pending_request_ref']: 'A',
            f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json': 'A',
            f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json': 'A',
            f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json': 'A',
            f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json': 'A',
            receipt_rel: 'A',
          }
          status = {}
          for line in subprocess.check_output(['git', 'diff', '--name-status'], text=True).splitlines():
            code, path = line.split('\t', 1)
            status[path] = code
          normal = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          ignored = subprocess.check_output(['git', 'ls-files', '--others', '--ignored', '--exclude-standard'], text=True).splitlines()
          for path in normal + ignored:
            status.setdefault(path, 'A')
          install_artifacts = {
            path for path in status
            if path.startswith('src/agi/__pycache__/')
            or path.startswith('src/continual/__pycache__/')
            or path.startswith('src/continual_chatgpt.egg-info/')
          }
          for path in install_artifacts:
            status.pop(path, None)
          if status != expected_status:
            raise SystemExit('lifecycle mutation mismatch: ' + json.dumps({
              'expected': expected_status,
              'observed': status,
              'missing': sorted(set(expected_status) - set(status)),
              'unexpected': sorted(set(status) - set(expected_status)),
            }, sort_keys=True))
          required = sorted(expected_status)
          for path in required:
            if not Path(path).is_file():
              raise SystemExit('required lifecycle path missing: ' + path)
          subprocess.run(['git', 'add', '-f', '--', *required], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != set(required):
            raise SystemExit('staged lifecycle set mismatch')
          immutable = sorted(path for path in staged if path.startswith('.continual/work-model/invocations/'))
          expected_immutable = sorted([
            f'.continual/work-model/invocations/{task_work_id}/response.json',
            summary['pending_request_ref'],
          ])
          if immutable != expected_immutable:
            raise SystemExit('immutable Work mutation set mismatch: ' + json.dumps(immutable))
          print('STAGED_PATHS=' + '\n'.join(required))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-task-evaluate-clean-g1-result] gen29 consume clean-g1 Task Evaluate and freeze post-result Candidate'
          git push origin "HEAD:$GITHUB_REF_NAME"
