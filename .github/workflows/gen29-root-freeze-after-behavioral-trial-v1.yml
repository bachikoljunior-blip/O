name: gen29 freeze Root request after behavioral trial v1

on:
  push:
    branches:
      - work/gen29-root-freeze-after-behavioral-trial-v1

permissions:
  contents: write

concurrency:
  group: gen29-root-freeze-after-behavioral-trial-v1
  cancel-in-progress: false

jobs:
  freeze-root:
    if: ${{ !contains(github.event.head_commit.message, '[native-root-freeze-after-trial-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: e3b0a6276a187b612da55a503c8191d886498a49
      EXPECTED_STATE_BLOB: f034b42bff7f6c36963766afb078463a17f1f0f3
      EXPECTED_SNAPSHOT_BLOB: 3ff00149178019b8c0305880d2bd6dcce0636c79
      EXPECTED_INBOX_BLOB: 93889b482c5b54dd90944f19ce425e845f455b35
      RUN_ID: run-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      SOURCE_CI_RUN_ID: '33238893400'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .
      - name: Assert exact main, authority, and Root revision101 boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base "${EXPECTED_MAIN}" HEAD)" = "${EXPECTED_MAIN}"
          test "${RUNTIME_MAIN}" = "${EXPECTED_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${RUNTIME_MAIN}" > /tmp/runtime-state-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "${RUNTIME_STATE_BLOB}" = "${EXPECTED_STATE_BLOB}"
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "${EXPECTED_STATE_BLOB}"
          test "$(git hash-object .continual/runs/${RUN_ID}/snapshot.json)" = "${EXPECTED_SNAPSHOT_BLOB}"
          echo "RUNTIME_MAIN=${RUNTIME_MAIN}" >> "${GITHUB_ENV}"
          echo "RUNTIME_STATE_BLOB=${RUNTIME_STATE_BLOB}" >> "${GITHUB_ENV}"
          mapfile -t launch_delta < <(git diff --name-only "${EXPECTED_MAIN}" HEAD)
          test "${#launch_delta[@]}" -eq 1
          test "${launch_delta[0]}" = ".github/workflows/gen29-root-freeze-after-behavioral-trial-v1.yml"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations

          root = Path('.')
          run_id = 'run-work-recovery-gen9-durability-repair'
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          snapshot = json.loads((root / '.continual/runs' / run_id / 'snapshot.json').read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_execute_native_lifecycle_remote_main_readback_verified_root_resume_required':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected_exact = {
              'completed_native_invocation_id': 'invoke-ea55cc8d30783a55c0d51e07',
              'completed_work_invocation_id': 'invoke-1fcc456eaec7f8f134759b06',
              'completed_response_digest': 'fd832614cc51e061b944056e62cd03798535a75863c9fa4092e49ad9598c3977',
              'run_snapshot_ref': f'.continual/runs/{run_id}/snapshot.json',
              'snapshot_head_sha': 'a832a4fc07a5719b2fe828dad9980708f8af80a5',
              'snapshot_blob_sha': '3ff00149178019b8c0305880d2bd6dcce0636c79',
              'snapshot_revision': 101,
              'native_phase': 'root_pending',
              'durability_status': 'root_boundary_remote_main_readback_verified_no_pending_work',
          }
          for key, value in expected_exact.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          if exact.get('pending_work_invocation_id') is not None or exact.get('pending_native_invocation_id') is not None:
              raise SystemExit('Root boundary incorrectly retains pending continuation')
          if snapshot.get('status') != 'continue' or snapshot.get('phase') != 'root_pending' or snapshot.get('revision') != 101:
              raise SystemExit('snapshot is not revision101 root_pending')
          if pending_work_invocations(root, run_id=run_id):
              raise SystemExit('Root boundary unexpectedly has pending Work')
          awaiting = []
          for path in sorted((root / '.continual/runs' / run_id / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append(value)
          if awaiting:
              raise SystemExit('Root boundary unexpectedly has awaiting native')
          verified = verify_work_invocations(root, run_id=run_id)
          expected = {'valid': True, 'requests': 94, 'responses': 94, 'pending': 0, 'native_completed': 88, 'native_fragments': 88, 'native_local_learn': 81}
          for key, value in expected.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r} != {value!r}')
          print('ROOT_BEFORE=' + json.dumps(verified, sort_keys=True))
          PY
          continual --root . work-verify --run-id "${RUN_ID}" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "${RUN_ID}" > /tmp/work-pending-before.json
      - name: Precommit and record runtime latest GitHub main observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          OBSERVED_MAIN="$(git rev-parse origin/main)"
          test "${OBSERVED_MAIN}" = "${EXPECTED_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${OBSERVED_MAIN}" > /tmp/remote-state-document.json
          test "$(jq -r '.sha' /tmp/remote-state-document.json)" = "${EXPECTED_STATE_BLOB}"
          continual --root . work-source-observation-prepare "${RUN_ID}" --state-blob-sha "${EXPECTED_STATE_BLOB}" --expected-commit-sha "${OBSERVED_MAIN}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-prepare.json
          echo "OBSERVED_MAIN=${OBSERVED_MAIN}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/remote-state-document.json').read_text())
          state = json.loads((Path('.') / 'agi/WORK_EXECUTION_STATE.json').read_text())
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.').resolve()).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "${RUN_ID}" "${WORK_OBSERVATION_ID}" --request-digest "${WORK_REQUEST_DIGEST}" --commit-sha "${OBSERVED_MAIN}" --blob-sha "${EXPECTED_STATE_BLOB}" --projection /tmp/work-source-projection.json --observed-at "${OBSERVED_AT}" --executor-binding "${EXECUTOR_BINDING}" --model-identity "${MODEL_IDENTITY}" > /tmp/work-source-receipt.json
      - name: Precommit and record exact fixed-policy successful CI observation
        shell: bash
        run: |
          set -euo pipefail
          continual --root . ci-source-observation-prepare "${RUN_ID}" --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-prepare.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}" > /tmp/workflow-run-full.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "${RUN_ID}" "${CI_OBSERVATION_ID}" --request-digest "${CI_REQUEST_DIGEST}" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "${OBSERVED_AT}" --executor-binding "${EXECUTOR_BINDING}" --model-identity "${MODEL_IDENTITY}" > /tmp/ci-source-receipt.json
      - name: Verify fresh receipts and continuity before Root invocation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/agi/WORK_EXECUTION_STATE.json?ref=${EXPECTED_MAIN}" > /tmp/pre-root-state-document.json
          test "$(jq -r '.sha' /tmp/pre-root-state-document.json)" = "${EXPECTED_STATE_BLOB}"
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id='run-work-recovery-gen9-durability-repair', state=state, state_blob_sha='f034b42bff7f6c36963766afb078463a17f1f0f3', now=now)
          ci = verify_ci_source_observation(root, run_id='run-work-recovery-gen9-durability-repair', state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id='run-work-recovery-gen9-durability-repair', executor_binding='current_chatgpt_work_session', model_identity='chatgpt-work-model-unverified')
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied Root resume')
          if continuity.get('continuation_durability', {}).get('reason') != 'no_pending_work_invocation':
              raise SystemExit('Root preflight unexpectedly found pending Work')
          print('ROOT_PREFLIGHT=' + json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY
      - name: Invoke Root exactly once and freeze one Work-exclusive request
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-resume "${RUN_ID}" --max-steps 1 --executor-binding "${EXECUTOR_BINDING}" --model-identity "${MODEL_IDENTITY}" > /tmp/root-resume.json
          continual --root . work-verify --run-id "${RUN_ID}" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "${RUN_ID}" > /tmp/work-pending-after.json
          cat /tmp/root-resume.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json
      - name: Validate one frozen Root request and persist receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations

          root = Path('.').resolve()
          run_id = 'run-work-recovery-gen9-durability-repair'
          run_dir = root / '.continual/runs' / run_id
          snapshot_ref = f'.continual/runs/{run_id}/snapshot.json'
          snapshot = json.loads((root / snapshot_ref).read_text())
          if subprocess.check_output(['git', 'hash-object', snapshot_ref], text=True).strip() != '3ff00149178019b8c0305880d2bd6dcce0636c79':
              raise SystemExit('Root freeze changed snapshot bytes')
          expected_snapshot = {'status': 'continue', 'phase': 'root_pending', 'revision': 101, 'checkpoint_reason': 'step_budget_exhausted'}
          for key, value in expected_snapshot.items():
              if snapshot.get(key) != value:
                  raise SystemExit(f'snapshot mismatch {key}: {snapshot.get(key)!r} != {value!r}')

          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 95, 'responses': 94, 'pending': 1, 'native_completed': 88, 'native_fragments': 88, 'native_local_learn': 81}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after verification mismatch {key}: {after.get(key)!r} != {value!r}')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one pending Work request, got {len(pending)}')
          request = verified_work_request(root, pending[0]['invocation_id'])
          work_id = request['invocation_id']
          request_ref = f'.continual/work-model/invocations/{work_id}/request.json'
          request_blob = subprocess.check_output(['git', 'hash-object', request_ref], text=True).strip()
          if request.get('component') != 'root' or request.get('prompt_path') != 'prompts/root.md':
              raise SystemExit('frozen request is not Root')
          if request.get('executor_binding') != 'current_chatgpt_work_session' or request.get('model_identity') != 'chatgpt-work-model-unverified':
              raise SystemExit('frozen Root request identity mismatch')
          if (root / request_ref).with_name('response.json').exists():
              raise SystemExit('new Root request already has a response')
          clocks = request.get('payload', {}).get('decision_context', {}).get('source_clock', {})
          if clocks.get('user_input_inbox', {}).get('version') != 'revision:35' or clocks.get('user_input_inbox', {}).get('git_blob_sha') != '93889b482c5b54dd90944f19ce425e845f455b35':
              raise SystemExit('Root request inbox clock mismatch')
          if clocks.get('native_run_snapshot', {}).get('version') != 'revision:101' or clocks.get('native_run_snapshot', {}).get('git_blob_sha') != '3ff00149178019b8c0305880d2bd6dcce0636c79':
              raise SystemExit('Root request snapshot clock mismatch')
          if clocks.get('work_execution_state', {}).get('git_blob_sha') != 'f034b42bff7f6c36963766afb078463a17f1f0f3':
              raise SystemExit('Root request state clock mismatch')

          preflight_candidates = []
          for path in sorted((run_dir / 'preflight').glob('preflight-root-*.json')):
              ref = path.relative_to(root).as_posix()
              existed_at_launch = subprocess.run(
                  ['git', 'cat-file', '-e', f'HEAD:{ref}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not existed_at_launch:
                  preflight_candidates.append(path)
          if len(preflight_candidates) != 1:
              raise SystemExit(f'expected exactly one newly generated Root preflight, got {len(preflight_candidates)}')
          preflight_path = preflight_candidates[0]
          preflight_ref = preflight_path.relative_to(root).as_posix()
          preflight = json.loads(preflight_path.read_text())
          if request.get('payload', {}).get('preflight_selection') != preflight.get('result'):
              raise SystemExit('Root request preflight selection does not exactly match generated preflight result')
          if preflight.get('result', {}).get('scope') != 'root':
              raise SystemExit('generated preflight is not Root scoped')
          preflight_blob = subprocess.check_output(['git', 'hash-object', preflight_ref], text=True).strip()

          awaiting = []
          for path in sorted((run_dir / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append((path, value))
          if len(awaiting) != 1:
              raise SystemExit(f'expected one awaiting Root native, got {len(awaiting)}')
          native_path, native = awaiting[0]
          native_id = native['invocation_id']
          native_ref = native_path.relative_to(root).as_posix()
          native_blob = subprocess.check_output(['git', 'hash-object', native_ref], text=True).strip()
          if native.get('component') != 'root' or native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request['request_digest'] or native.get('work_request_ref') != request_ref:
              raise SystemExit('awaiting Root native binding mismatch')

          events_ref = f'.continual/runs/{run_id}/events.jsonl'
          base_events = subprocess.check_output(['git', 'show', f'e3b0a6276a187b612da55a503c8191d886498a49:{events_ref}'], text=True)
          current_events = (root / events_ref).read_text()
          if not current_events.startswith(base_events):
              raise SystemExit('events ledger did not preserve exact prefix')
          appended = current_events[len(base_events):].splitlines()
          if len(appended) != 1:
              raise SystemExit(f'expected one Root event append, got {len(appended)}')
          event = json.loads(appended[0])
          expected_event = {'type': 'work_model_pending', 'run_id': run_id, 'component': 'root', 'invocation_id': native_id, 'work_invocation_id': work_id}
          for key, value in expected_event.items():
              if event.get(key) != value:
                  raise SystemExit(f'Root event mismatch {key}')

          work_prepare = json.loads(Path('/tmp/work-source-prepare.json').read_text())
          ci_prepare = json.loads(Path('/tmp/ci-source-prepare.json').read_text())
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-root-freeze-after-behavioral-trial-v1.json'
          summary = {
              'root_snapshot_revision': 101,
              'root_snapshot_phase': 'root_pending',
              'pending_component': 'root',
              'pending_work_invocation_id': work_id,
              'pending_request_ref': request_ref,
              'pending_request_digest': request['request_digest'],
              'pending_request_blob_sha': request_blob,
              'pending_preflight_ref': preflight_ref,
              'pending_preflight_blob_sha': preflight_blob,
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': native_ref,
              'pending_native_invocation_blob_sha': native_blob,
              'work_source_observation_id': work_prepare['observation_id'],
              'ci_source_observation_id': ci_prepare['observation_id'],
              'verification': expected_after,
          }
          receipt = {
              'schema_version': 1,
              'record_type': 'generation29_root_freeze_after_behavioral_trial_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'authority': {
                  'execution_id': 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3',
                  'lease_generation': 29,
                  'fence_token_digest': 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d',
              },
              'source_main_sha': os.environ['OBSERVED_MAIN'],
              'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': 33238893400,
              'idempotency_key': 'o-work-gen29:root-revision101:freeze-next-root-request:v1',
              'completed_effect': summary,
              'root_reinvoked': False,
              'request_recreated': False,
              'resume_required': True,
              'next_action': 'Remove the one-shot workflow, exact-head validate and merge this unique Root request, bind state, then answer and consume it in the same authoritative loop.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          Path('/tmp/root-freeze-summary.json').write_text(json.dumps({**summary, 'receipt_ref': receipt_rel}, indent=2, sort_keys=True) + '\n')
          print('ROOT_FREEZE=' + json.dumps(summary, sort_keys=True))
          PY
      - name: Stage only exact Root-freeze lifecycle and push once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          summary = json.loads(Path('/tmp/root-freeze-summary.json').read_text())
          run_id = 'run-work-recovery-gen9-durability-repair'
          required = {
              f'.continual/runs/{run_id}/events.jsonl',
              summary['pending_native_invocation_ref'],
              summary['pending_request_ref'],
              summary['pending_preflight_ref'],
              f".continual/runs/{run_id}/work-source-observations/{summary['work_source_observation_id']}/request.json",
              f".continual/runs/{run_id}/work-source-observations/{summary['work_source_observation_id']}/receipt.json",
              f".continual/runs/{run_id}/ci-source-observations/{summary['ci_source_observation_id']}/request.json",
              f".continual/runs/{run_id}/ci-source-observations/{summary['ci_source_observation_id']}/receipt.json",
              summary['receipt_ref'],
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          normal = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          ignored = set(subprocess.check_output(['git', 'ls-files', '--others', '--ignored', '--exclude-standard'], text=True).splitlines())
          all_changed = tracked | normal | ignored
          install_artifacts = {
              path for path in all_changed
              if path.startswith('src/agi/__pycache__/')
              or path.startswith('src/continual/__pycache__/')
              or path.startswith('src/continual_chatgpt.egg-info/')
          }
          if tracked & install_artifacts:
              raise SystemExit('tracked install artifact mutation forbidden')
          changed = all_changed - install_artifacts
          if changed != required:
              raise SystemExit('Root-freeze mutation set mismatch: ' + json.dumps({'missing': sorted(required-changed), 'unexpected': sorted(changed-required)}))
          for path in sorted(required):
              if not Path(path).is_file():
                  raise SystemExit('required Root-freeze path missing: ' + path)
          subprocess.run(['git', 'add', '-f', '--', *sorted(required)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != required:
              raise SystemExit('staged Root-freeze set mismatch')
          immutable = sorted(path for path in staged if path.startswith('.continual/work-model/invocations/'))
          if immutable != [summary['pending_request_ref']]:
              raise SystemExit('immutable Work mutation set mismatch: ' + json.dumps(immutable))
          print('STAGED_PATHS=' + '\n'.join(sorted(staged)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-root-freeze-after-trial-result] gen29 freeze Root request revision101'
          git push origin "HEAD:$GITHUB_REF_NAME"
