          ci_obs = json.loads(Path('/tmp/ci-source-prepare.json').read_text())['observation_id']
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-formal-proof-learn-consume-root-freeze-v1.json'
          expected = {
              f'.continual/runs/{run_id}/artifacts/post-task-learn.json': 'M',
              f'.continual/runs/{run_id}/events.jsonl': 'M',
              f'.continual/runs/{run_id}/snapshot.json': 'M',
              f'.continual/runs/{run_id}/invocations/{native_id}.json': 'M',
              f'.continual/work-model/invocations/{work_id}/response.json': 'A',
              summary['learn_fragment_ref']: 'A',
              summary['pending_native_invocation_ref']: 'A',
              summary['pending_request_ref']: 'A',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/request.json': 'A',
              f'.continual/runs/{run_id}/work-source-observations/{work_obs}/receipt.json': 'A',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/request.json': 'A',
              f'.continual/runs/{run_id}/ci-source-observations/{ci_obs}/receipt.json': 'A',
              receipt_rel: 'A',
          }
          status = {}
          for line in subprocess.check_output(['git','diff','--name-status'], text=True).splitlines():
              code, path = line.split('\t',1)
              status[path] = code
          others = (
              subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
              + subprocess.check_output(['git','ls-files','--others','--ignored','--exclude-standard'], text=True).splitlines()
          )
          for path in others:
              status.setdefault(path,'A')
          for p in list(status):
              if p.startswith('src/agi/__pycache__/') or p.startswith('src/continual/__pycache__/') or p.startswith('src/continual_chatgpt.egg-info/'):
                  status.pop(p,None)
          prefix = f'.continual/runs/{run_id}/preflight/preflight-root-'
          preflights = sorted(p for p,code in status.items() if p.startswith(prefix) and p.endswith('.json') and code == 'A')
          if len(preflights) != 1:
              raise SystemExit('expected one new Root preflight: ' + json.dumps(preflights))
          expected[preflights[0]] = 'A'
          if status != expected:
              raise SystemExit('lifecycle mutation mismatch: ' + json.dumps({
                  'expected': expected,
                  'observed': status,
                  'missing': sorted(set(expected)-set(status)),
                  'unexpected': sorted(set(status)-set(expected)),
              }, sort_keys=True))
          required = sorted(expected)
          for p in required:
