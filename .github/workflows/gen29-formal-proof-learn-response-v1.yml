name: gen29 formal-proof Learn consume v1

on:
  push:
    branches:
      - work/gen29-formal-proof-learn-response-v1

permissions:
  contents: write

concurrency:
  group: gen29-formal-proof-learn-response-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-learn-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 6533807b1f9d2c1d357b6f53db041e281a4bf034
      EXPECTED_STATE_BLOB: 3bd8dc35c958375d688678fa6b9a5845cf36be82
      EXPECTED_SNAPSHOT_BLOB: f4b831e10fb39b8b1d1dba7abf3beb3682ba5e98
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXPECTED_INBOX_REVISION: '38'
      LEARN_NATIVE_ID: invoke-8371529e801f3595b97f6edc
      LEARN_NATIVE_BLOB: ca7a88b37c38d0dfbd898f34c378feaacf79442d
      LEARN_WORK_ID: invoke-f05fdfdd0ff2e2d2eb017a5d
      LEARN_REQUEST_BLOB: 471944cf792f235af6141f7f2258b30d5cd5f9ca
      LEARN_REQUEST_DIGEST: d17c6fb573b81e83e29b8829ff8cd680f9e10807fb5055dbce4ecf82f102279a
      SOURCE_CI_RUN_ID: '33532115535'
      SOURCE_CI_HEAD: 1196d08af36e129e7398cc00e0b3bc8a0280eb25
      RUN_ID: run-work-recovery-gen9-durability-repair
      EPISODE_ID: episode-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Validate launch and refresh exact owner heartbeat by CAS
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          SOURCE_MAIN="$(git rev-parse origin/main)"
          test "$SOURCE_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          expected = ['.github/workflows/gen29-formal-proof-learn-response-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', __import__('os').environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$SOURCE_MAIN" > /tmp/source-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$SOURCE_MAIN" > /tmp/runtime-inbox-document.json
          test "$(jq -r '.sha' /tmp/source-state-document.json)" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/source-state-document.json | tr -d '\n' | base64 --decode > /tmp/source-state.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object /tmp/source-state.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$LEARN_WORK_ID/request.json)" = "$LEARN_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$LEARN_NATIVE_ID.json)" = "$LEARN_NATIVE_BLOB"
          cp /tmp/source-state.json agi/WORK_EXECUTION_STATE.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          work_id = os.environ['LEARN_WORK_ID']
          native_id = os.environ['LEARN_NATIVE_ID']
          state = json.loads(Path('/tmp/source-state.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_learn_formal_proof_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'pending_component': 'learn',
              'pending_work_invocation_id': work_id,
              'pending_work_invocation_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['LEARN_REQUEST_BLOB'],
              'pending_request_digest': os.environ['LEARN_REQUEST_DIGEST'],
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['LEARN_NATIVE_BLOB'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'snapshot_revision': 140,
              'snapshot_phase': 'post_task_learn_pending',
              'native_phase': 'post_task_learn_pending',
              'snapshot_head_sha': 'af6e50570387ea16b78bf1ab4dc8faecc85f975a',
              'durability_status': 'remote_main_readback_verified',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          bind = state.get('generation29_formal_proof_consolidate_learn_bind_v1', {})
          if bind.get('status') != 'remote_main_readback_verified' or bind.get('verified_remote_readback') is not True:
              raise SystemExit('Learn state binding is not verified')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not verified')
          if durability.get('source_main_sha') != exact.get('snapshot_head_sha'):
              raise SystemExit('continuation source/snapshot mismatch')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('durability pending identity mismatch')
          if inbox.get('revision') != 38:
              raise SystemExit('inbox revision mismatch')
          if snapshot.get('revision') != 140 or snapshot.get('phase') != 'post_task_learn_pending':
              raise SystemExit('snapshot is not revision140 post_task_learn_pending')
          if request.get('component') != 'learn' or request.get('request_digest') != os.environ['LEARN_REQUEST_DIGEST']:
              raise SystemExit('Learn request mismatch')
          if request.get('prompt_path') != 'prompts/learn.md':
              raise SystemExit('Learn prompt mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Learn identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Learn already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'learn':
              raise SystemExit('Learn native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Learn is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          if verified.get('valid') is not True or verified.get('pending') != 1:
              raise SystemExit(f'before verification invalid: {verified!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(verified, sort_keys=True) + '\n')
          now = datetime.now(UTC).isoformat().replace('+00:00', 'Z')
          state['heartbeat_at'] = now
          state['last_activity_at'] = now
          refresh = bind.setdefault('runner_start_refreshes', [])
          refresh.append({
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'refreshed_at': now,
              'reason': 'Bound queue delay so Context Kernel sees a current durable owner heartbeat immediately before the unchanged exact Learn consume.',
          })
          bind['runner_start_refresh_pending_exact_readback'] = True
          bind['next_action'] = f'Exact-read runner heartbeat, then consume {work_id} exactly once and freeze Root.'
          Path('/tmp/refreshed-state.json').write_text(json.dumps(state, indent=2, sort_keys=True) + '\n')
          PY
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          payload = {
              'message': 'o-work: refresh formal-proof Learn runner heartbeat',
              'content': base64.b64encode(Path('/tmp/refreshed-state.json').read_bytes()).decode(),
              'sha': os.environ['EXPECTED_STATE_BLOB'],
              'branch': 'main',
          }
          Path('/tmp/heartbeat-put.json').write_text(json.dumps(payload) + '\n')
          PY
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json" --input /tmp/heartbeat-put.json > /tmp/heartbeat-result.json
          RUNTIME_MAIN="$(jq -r '.commit.sha' /tmp/heartbeat-result.json)"
          RUNTIME_STATE_BLOB="$(jq -r '.content.sha' /tmp/heartbeat-result.json)"
          test -n "$RUNTIME_MAIN"
          test -n "$RUNTIME_STATE_BLOB"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RUNTIME_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          test "$(jq -r '.sha' /tmp/runtime-state-document.json)" = "$RUNTIME_STATE_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          bind = state['generation29_formal_proof_consolidate_learn_bind_v1']
          if bind.get('runner_start_refresh_pending_exact_readback') is not True:
              raise SystemExit('runner heartbeat readback marker missing')
          if not bind.get('runner_start_refreshes'):
              raise SystemExit('runner heartbeat receipt missing')
          PY
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json
          cat /tmp/work-checkpoint-before.json

      - name: Record fresh exact Work and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.store import Store
          state = json.loads(Path('agi/WORK_EXECUTION_STATE.json').read_text())
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          CI_POLICY_RUN_ID="$(jq -r '.source.workflow_run_id' /tmp/ci-source-prepare.json)"
          CI_POLICY_HEAD="$(jq -r '.source.exact_head_sha' /tmp/ci-source-prepare.json)"
          CI_POLICY_WORKFLOW_ID="$(jq -r '.source.workflow_id' /tmp/ci-source-prepare.json)"
          test "$CI_POLICY_RUN_ID" = "$SOURCE_CI_RUN_ID"
          test "$CI_POLICY_HEAD" = "$SOURCE_CI_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_POLICY_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_POLICY_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.id' /tmp/workflow-run-full.json)" = "$CI_POLICY_RUN_ID"
          test "$(jq -r '.workflow_id' /tmp/workflow-run-full.json)" = "$CI_POLICY_WORKFLOW_ID"
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$CI_POLICY_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('/tmp/ci-source-prepare.json').read_text())
          jobs = json.loads(Path('/tmp/workflow-jobs-full.json').read_text())['jobs']
          observed = {item['id']: item for item in jobs}
          for required in request['source']['required_jobs']:
              item = observed.get(required['id'])
              if item is None or item.get('name') != required['name'] or item.get('status') != 'completed' or item.get('conclusion') != 'success':
                  raise SystemExit(f"required CI job mismatch: {required!r} -> {item!r}")
          PY
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json
          echo "SOURCE_CI_RUN_ID=$CI_POLICY_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_CI_HEAD=$CI_POLICY_HEAD" >> "$GITHUB_ENV"

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$RUNTIME_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Submit exact NO_CHANGE Learn response and freeze Root
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/learn-output.json <<'JSON'
          {
            "result": {
              "decision": "NO_CHANGE",
              "reason": "The episode proves one precommitted immutable Lean theorem was solved and mechanically verified under exact bounded conditions, while the original task, user-level objective, upper objective, and AGI claim all remain FAIL. One theorem does not support a new reusable Candidate, activation, production routing, generalized theorem-proving capability, or model-selection change. Existing baseline-first, evidence-scope, and strict external-gate practices already cover the supported lesson, so adding a Candidate would duplicate policy and overgeneralize the evidence.",
              "candidates": [],
              "existing_candidate_actions": [
                {
                  "candidate_id": "candidate-agi-benchmark-suite-v1",
                  "action": "RETAIN_CANDIDATE",
                  "scope": "agi/capability-evaluation",
                  "reason": "The exact theorem adds one bounded data point but supplies no independent breadth or generalized-capability evidence sufficient for activation."
                },
                {
                  "candidate_id": "candidate-task-evaluate-unit-verdict-v1",
                  "action": "RETAIN_CANDIDATE",
                  "scope": "continual/incremental-task-evaluation",
                  "reason": "The episode correctly preserved unit PASS separately from task, user, upper-objective, and AGI FAIL, but it does not add protected activation evidence."
                }
              ],
              "retained_learning": [
                "For externally sourced formal proofs, freeze the exact source commit, blob, theorem, toolchain, and exclusions before solution access.",
                "A sentinel baseline failure, candidate compilation, corrupted-proof rejection, changed-statement rejection, clean replay, digest match, and zero upstream writes jointly support only the exact bounded unit verdict.",
                "A single theorem PASS must remain separate from theorem-proving breadth, robustness, autonomy, production fitness, self-improvement, AGI, and user-level completion.",
                "Lifecycle and canonical episode durability must be exact-read back before Learn or Root continuation."
              ],
              "claim_boundary": "This Learn decision applies only to Exercises.Analysis.OrderCompleteness.q1_integer_fractional_decomposition at aimmerwahr/lean-math-exercises commit ef9d2506ecf03bb3338e59d33edded195d94a9be, source blob b1472e9b72df28045f33d0270f860ce793ffbd5e, Lean v4.33.0-rc1, and mathlib 4851eb. It establishes no generalized theorem-proving capability, production fitness, independent AGI evidence, upper-objective completion, or user-level completion.",
              "activation_authorized": false,
              "production_routing_change_authorized": false,
              "next": "Return to Root and select a materially different safe falsifiable unit toward independent generalized-capability evidence while preserving the strict external AGI gate."
            },
            "fragment": {
              "component": "learn",
              "purpose": "Retain exact formal-proof evidence discipline without creating or activating a Candidate from one bounded theorem.",
              "evidence_refs": [
                ".continual/episodes/episode-work-recovery-gen9-durability-repair/episode.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-formal-proof-synthesis-v1-result.json",
                ".continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-evaluate-external-formal-proof-synthesis-v1-result.json",
                ".continual/candidates/index.json"
              ],
              "observations": [
                "The candidate proof compiled once for the exact frozen theorem, both negative controls rejected, clean replay passed, and upstream writes remained zero.",
                "Task Evaluate assigned unit_verdict PASS while task, user-level, upper-objective, and AGI verdicts remained FAIL.",
                "The supported process lessons are already represented by baseline-first and evidence-scope controls; a new formal-proof Candidate would be premature and duplicative.",
                "No activation, production routing, model-selection, generalized capability, AGI, or completion claim is supported."
              ],
              "unresolved": [
                "exact-head publication and remote-main readback of this Learn response and Root freeze",
                "selection of a materially different Root unit with independent external evidence",
                "the unchanged strict external AGI evidence gate and user-level upper objective"
              ]
            }
          }
          JSON
          python -m json.tool /tmp/learn-output.json > /dev/null
          continual --root . work-submit "$LEARN_WORK_ID" --response /tmp/learn-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/learn-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json
          cat /tmp/learn-submit.json
          cat /tmp/native-resume.json
          cat /tmp/work-verify-after.json
          cat /tmp/work-pending-after.json

      - name: Validate exact Learn completion and Root freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          work_id = os.environ['LEARN_WORK_ID']
          native_id = os.environ['LEARN_NATIVE_ID']
          expected_output = json.loads(Path('/tmp/learn-output.json').read_text())
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          if before.get('valid') is not True or before.get('pending') != 1:
              raise SystemExit(f'invalid before verification: {before!r}')
          increments = {
              'requests': 1,
              'responses': 1,
              'native_completed': 1,
              'native_fragments': 1,
              'native_local_learn': 0,
          }
