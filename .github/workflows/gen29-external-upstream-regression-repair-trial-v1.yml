name: gen29 external upstream regression repair trial v1
# refire-marker: workflow existed on the branch before this push

on:
  push:
    branches:
      - work/gen29-execute-external-upstream-regression-repair-v1

permissions:
  contents: write

concurrency:
  group: gen29-external-upstream-regression-repair-trial-v1
  cancel-in-progress: false

jobs:
  trial:
    if: ${{ !contains(github.event.head_commit.message, '[external-repair-trial-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_BASE: 6e1b53a290e7fabf34d77851fbde7c2318069232
      EXPECTED_MAIN: 6e1b53a290e7fabf34d77851fbde7c2318069232
      EXPECTED_STATE_BLOB: 65da89f17fa5f24139c057e343f7c0941ed0ea41
      EXPECTED_REQUEST_BLOB: a84d62b60d0a461f187dae5f7cd928ea1cdf9625
      EXPECTED_REQUEST_DIGEST: a3bbf548a4690c54ac9fec2dca672b47aeac7a83de55f1c57c8da64029d48473
      UPSTREAM_REPOSITORY: caru-ini/novelai-sdk
      UPSTREAM_COMMIT: 4ec0e19aad139b23592342b6a29592f5732e34bd
      UPSTREAM_LICENSE_BLOB: 23a314f89c9291f0e9974fc9d69431dd5aaa7ad7
      UPSTREAM_SOURCE_BLOB: dddfb55066f4b654878f5f0dbf18c8252d051be2
      ISSUE_SOURCE_SHA256: ea7d9bd984714822d4dc3de8b1b830024d14d2f938a7fe15aa06cd00f52d0880
      PROTOCOL_SHA256: e3c2eeb00fedf3fdbfeb021572e02fa48112313faba96a74993331e89cc41e3b
      TRIAL_DIR: .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-external-upstream-regression-repair-v1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Verify precommitted selector, exact O authority, and response absence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$BRANCH_BASE" HEAD)" = "$BRANCH_BASE"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          trial = Path(os.environ['TRIAL_DIR'])
          expected = sorted([
              '.github/workflows/gen29-external-upstream-regression-repair-trial-v1.yml',
              f'{trial}/issue-89-source.json',
              f'{trial}/precommitted-selector-manifest.json',
          ])
          observed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BRANCH_BASE'], 'HEAD'],
              text=True,
          ).splitlines())
          if observed != expected:
              raise SystemExit(f'pre-trial branch delta mismatch: {observed!r}')

          issue = json.loads((trial / 'issue-89-source.json').read_text())
          manifest = json.loads((trial / 'precommitted-selector-manifest.json').read_text())
          if issue['repository'] != os.environ['UPSTREAM_REPOSITORY'] or issue['issue_number'] != 89:
              raise SystemExit('frozen issue identity mismatch')
          if issue['state_observed'] != 'open' or 'solution pull' in issue['body'].lower():
              raise SystemExit('issue state or solution-leakage exclusion mismatch')
          selected = manifest['selected_task']
          if selected['upstream_commit'] != os.environ['UPSTREAM_COMMIT']:
              raise SystemExit('frozen upstream commit mismatch')
          if selected['license_blob_sha'] != os.environ['UPSTREAM_LICENSE_BLOB']:
              raise SystemExit('frozen license mismatch')
          if manifest['allowed_patch_paths'] != ['src/novelai/_utils/converter.py']:
              raise SystemExit('allowed patch paths widened')
          if manifest['side_effect_policy'] != {
              'upstream_writes': False,
              'provider_or_production_route_change': False,
              'candidate_activation': False,
          }:
              raise SystemExit('side effect policy mismatch')
          PY
          test "$(sha256sum "$TRIAL_DIR/issue-89-source.json" | cut -d' ' -f1)" = "$ISSUE_SOURCE_SHA256"
          test "$(sha256sum "$TRIAL_DIR/precommitted-selector-manifest.json" | cut -d' ' -f1)" = "$PROTOCOL_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$EXPECTED_MAIN" > /tmp/state-document.json
          test "$(jq -r '.sha' /tmp/state-document.json)" = "$EXPECTED_STATE_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/contents/.continual/work-model/invocations/invoke-cd047a4b916e96bcfc4f0e61/request.json?ref=$EXPECTED_MAIN" > /tmp/request-document.json
          test "$(jq -r '.sha' /tmp/request-document.json)" = "$EXPECTED_REQUEST_BLOB"
          if gh api "repos/$GITHUB_REPOSITORY/contents/.continual/work-model/invocations/invoke-cd047a4b916e96bcfc4f0e61/response.json?ref=$EXPECTED_MAIN" >/dev/null 2>&1; then
            echo 'Execute response already exists' >&2
            exit 1
          fi
          jq -r '.content' /tmp/request-document.json | tr -d '\n' | base64 --decode > /tmp/request.json
          test "$(jq -r '.request_digest' /tmp/request.json)" = "$EXPECTED_REQUEST_DIGEST"
          test "$(jq -r '.component' /tmp/request.json)" = 'execute'
          test "$(jq -r '.payload.preflight_selection.decision' /tmp/request.json)" = 'BASELINE_FIRST'

      - name: Clone only the frozen public upstream commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main --no-tags "https://github.com/$UPSTREAM_REPOSITORY.git" /tmp/upstream
          cd /tmp/upstream
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git rev-list --count HEAD)" = '1'
          test "$(git status --porcelain)" = ''
          test "$(git hash-object LICENSE)" = "$UPSTREAM_LICENSE_BLOB"
          test "$(git hash-object src/novelai/_utils/converter.py)" = "$UPSTREAM_SOURCE_BLOB"
          uv sync --frozen --group dev
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          receipt = {
              'repository': os.environ['UPSTREAM_REPOSITORY'],
              'issue_url': 'https://github.com/caru-ini/novelai-sdk/issues/89',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'commit_count_in_checkout': int(subprocess.check_output(['git', 'rev-list', '--count', 'HEAD'], text=True)),
              'origin_url': subprocess.check_output(['git', 'remote', 'get-url', 'origin'], text=True).strip(),
              'license': 'MIT',
              'license_blob_sha': subprocess.check_output(['git', 'hash-object', 'LICENSE'], text=True).strip(),
              'source_blob_sha': subprocess.check_output(['git', 'hash-object', 'src/novelai/_utils/converter.py'], text=True).strip(),
              'protocol_sha256': os.environ['PROTOCOL_SHA256'],
              'checkout_clean': True,
              'history_depth': 1,
              'solution_pr_read': False,
              'issue_comments_read': False,
              'later_commit_read': False,
              'prior_run_solution_read': False,
              'upstream_write_performed': False,
          }
          Path('/tmp/provenance-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Reproduce the precommitted defect before patch scoring
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reproduce_issue_89.py <<'PY'
          import json
          import sys

          from novelai._utils.converter import (
              _create_v4_prompts,
              convert_user_params_to_api_params,
          )
          from novelai.types import Character, GenerateImageParams

          characters = [
              Character(prompt='red', enabled=True, position=(0.2, 0.5)),
              Character(prompt='black', enabled=True, position=(0.8, 0.5)),
          ]
          v4_prompt, _ = _create_v4_prompts('two people', '', characters)
          params = GenerateImageParams(
              prompt='two people',
              model='nai-diffusion-4-5-full',
              characters=characters,
              seed=1234,
          )
          api_params = convert_user_params_to_api_params(params, None)
          centers = [
              [caption.centers[0].x, caption.centers[0].y]
              for caption in v4_prompt.caption.char_captions
          ]
          observed = {
              'v4_prompt_use_coords': v4_prompt.use_coords,
              'top_level_use_coords': api_params.use_coords,
              'centers': centers,
          }
          print(json.dumps(observed, sort_keys=True))
          expected = (
              v4_prompt.use_coords is True
              and api_params.use_coords is True
              and centers == [[0.2, 0.5], [0.8, 0.5]]
          )
          raise SystemExit(0 if expected else 1)
          PY
          cd /tmp/upstream
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          started = time.monotonic()
          result = subprocess.run(
              ['uv', 'run', 'python', '/tmp/reproduce_issue_89.py'],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=60,
          )
          receipt = {
              'command': 'uv run python /tmp/reproduce_issue_89.py',
              'exit_code': result.returncode,
              'elapsed_seconds': round(time.monotonic() - started, 6),
              'output': result.stdout.strip(),
              'expected_failure_observed': result.returncode == 1,
          }
          Path('/tmp/baseline-reproduction.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          if result.returncode != 1:
              raise SystemExit('NOT_EVALUABLE: focused baseline did not reproduce exactly')
          PY

      - name: Apply one minimal allowed-path patch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/upstream
          python - <<'PY'
          from pathlib import Path

          path = Path('src/novelai/_utils/converter.py')
          text = path.read_text()
          needle = '        use_coords=False,\n'
          if text.count(needle) != 3:
              raise SystemExit(f'unexpected use_coords site count: {text.count(needle)}')
          text = text.replace(
              needle,
              '        use_coords=any(char.enabled for char in characters or []),\n',
              1,
          )
          text = text.replace(
              needle,
              '        use_coords=any(char.enabled for char in params.characters or []),\n',
          )
          path.write_text(text)
          PY
          test "$(git diff --name-only)" = 'src/novelai/_utils/converter.py'
          test "$(git diff --numstat | cut -f3)" = 'src/novelai/_utils/converter.py'
          git diff --check
          git diff --binary -- src/novelai/_utils/converter.py > /tmp/upstream.patch
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          numstat = subprocess.check_output(['git', 'diff', '--numstat'], text=True).strip().split('\t')
          manifest = {
              'allowed_paths': ['src/novelai/_utils/converter.py'],
              'touched_paths': ['src/novelai/_utils/converter.py'],
              'additions': int(numstat[0]),
              'deletions': int(numstat[1]),
              'dependency_files_changed': False,
              'patch_sha256': subprocess.check_output(['sha256sum', '/tmp/upstream.patch'], text=True).split()[0],
              'implementation_basis': 'Direct inspection of the frozen source plus issue claim; no solution artifact was accessed.',
          }
          Path('/tmp/patch-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Verify focused repair and all official tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/upstream
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          def run(command, timeout):
              started = time.monotonic()
              result = subprocess.run(
                  command,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              return {
                  'command': ' '.join(command),
                  'exit_code': result.returncode,
                  'elapsed_seconds': round(time.monotonic() - started, 6),
                  'output': result.stdout[-12000:].strip(),
              }

          focused = run(['uv', 'run', 'python', '/tmp/reproduce_issue_89.py'], 60)
          focused['passed'] = focused['exit_code'] == 0
          Path('/tmp/patched-reproduction.json').write_text(json.dumps(focused, indent=2, sort_keys=True) + '\n')
          if not focused['passed']:
              raise SystemExit('FAILED: patched focused reproducer failed')

          official = run(['uv', 'run', 'pytest', '-q'], 900)
          official['passed'] = official['exit_code'] == 0
          Path('/tmp/official-tests.json').write_text(json.dumps(official, indent=2, sort_keys=True) + '\n')
          if not official['passed']:
              raise SystemExit('FAILED: official upstream tests failed')
          PY

      - name: Build deterministic bounded result and replay proof
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/upstream
          git apply --check --reverse /tmp/upstream.patch
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          names = [
              'provenance-receipt.json',
              'baseline-reproduction.json',
              'patch-manifest.json',
              'patched-reproduction.json',
              'official-tests.json',
          ]
          sources = {
              'provenance-receipt.json': Path('/tmp/provenance-receipt.json'),
              'baseline-reproduction.json': Path('/tmp/baseline-reproduction.json'),
              'patch-manifest.json': Path('/tmp/patch-manifest.json'),
              'patched-reproduction.json': Path('/tmp/patched-reproduction.json'),
              'official-tests.json': Path('/tmp/official-tests.json'),
          }
          digests = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in sources.items()}
          result = {
              'schema_version': 1,
              'trial_id': 'generation29-external-upstream-regression-repair-v1',
              'verdict': 'SOLVED',
              'repository': os.environ['UPSTREAM_REPOSITORY'],
              'issue_number': 89,
              'issue_url': 'https://github.com/caru-ini/novelai-sdk/issues/89',
              'upstream_commit': os.environ['UPSTREAM_COMMIT'],
              'protocol_sha256': os.environ['PROTOCOL_SHA256'],
              'baseline_reproduced': True,
              'focused_test_passed_after_patch': True,
              'official_tests_passed': True,
              'patch_paths': ['src/novelai/_utils/converter.py'],
              'dependency_drift': False,
              'solution_pr_read': False,
              'gold_patch_read': False,
              'later_commit_read': False,
              'prior_run_solution_read': False,
              'upstream_write_performed': False,
              'evidence_sha256': digests,
              'claim_boundary': 'SOLVED applies only to caru-ini/novelai-sdk issue 89 at exact commit 4ec0e19; no generalized capability, AGI, upper-objective, or user-completion claim.',
          }
          canonical = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['result_digest'] = hashlib.sha256(canonical).hexdigest()
          Path('/tmp/bounded-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

          replay = {
              'exact_commit_verified': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['UPSTREAM_COMMIT'],
              'patch_reverse_apply_check': True,
              'patch_paths_exact': subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() == ['src/novelai/_utils/converter.py'],
              'evidence_sha256': digests,
              'result_digest': result['result_digest'],
              'replay_verified': True,
          }
          Path('/tmp/replay-verification.json').write_text(json.dumps(replay, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit only the bounded trial evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TRIAL_DIR"
          cp /tmp/provenance-receipt.json "$TRIAL_DIR/provenance-receipt.json"
          cp /tmp/baseline-reproduction.json "$TRIAL_DIR/baseline-reproduction.json"
          cp /tmp/upstream.patch "$TRIAL_DIR/upstream.patch"
          cp /tmp/patch-manifest.json "$TRIAL_DIR/patch-manifest.json"
          cp /tmp/patched-reproduction.json "$TRIAL_DIR/patched-reproduction.json"
          cp /tmp/official-tests.json "$TRIAL_DIR/official-tests.json"
          cp /tmp/bounded-result.json "$TRIAL_DIR/bounded-result.json"
          cp /tmp/replay-verification.json "$TRIAL_DIR/replay-verification.json"
          python - <<'PY'
          import subprocess
          from pathlib import Path

          trial = Path(__import__('os').environ['TRIAL_DIR'])
          expected = sorted(str(trial / name) for name in [
              'baseline-reproduction.json',
              'bounded-result.json',
              'official-tests.json',
              'patch-manifest.json',
              'patched-reproduction.json',
              'provenance-receipt.json',
              'replay-verification.json',
              'upstream.patch',
          ])
          observed = sorted(str(path) for path in trial.iterdir() if path.is_file())
          if observed != expected:
              raise SystemExit(f'unexpected evidence set: {observed!r}')
          subprocess.run(['git', 'add', '-f', '--', *expected], check=True)
          staged = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != expected:
              raise SystemExit('staged evidence mismatch')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[external-repair-trial-result] gen29 exact-commit issue 89 bounded verdict'
          git push origin "HEAD:$GITHUB_REF_NAME"
