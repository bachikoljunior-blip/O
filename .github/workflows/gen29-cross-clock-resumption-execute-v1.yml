name: gen29 consume cross-clock resumption Execute v1

on:
  push:
    branches:
      - work/gen29-cross-clock-resumption-benchmark-v1

permissions:
  contents: write

concurrency:
  group: gen29-cross-clock-resumption-execute-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-execute-cross-clock-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_BASE: 066e2cef0d9beb7112d15137c090f3678fd4b516
      EXPECTED_MAIN: 0d3466556bd376cf8702da27c2f9d73e817811b4
      EXPECTED_STATE_BLOB: 58aed36bc25c6ac970cd48c17b21c6970c15e96e
      EXPECTED_SNAPSHOT_BLOB: d5415e5dcd1e8e165b3e1ce1f0772f6891a4dc2e
      EXPECTED_INBOX_BLOB: 34423c2dd71d95c55769f501fe1701ea0088fb32
      EXPECTED_INBOX_REVISION: '38'
      EXECUTE_NATIVE_ID: invoke-eb3e98ea0a68f04c825ae8ae
      EXECUTE_NATIVE_BLOB: 097923b9eedab9b8afc4f8ff4f3fe322fe8d461e
      EXECUTE_WORK_ID: invoke-39ae170c85525fc074cbf08e
      EXECUTE_REQUEST_BLOB: 87fed7cbc7ce4cbc6f86a3a5d201814df77cff62
      EXECUTE_REQUEST_DIGEST: db436365db961daeee0dacc9514660aac866b34d9afe00c09437196f6c814c03
      SOURCE_CI_RUN_ID: '33377667811'
      SOURCE_CI_HEAD: 257e421a232ba600d00cb2cdbc028c73f31bfc3a
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-cross-clock-resumption-counterfactual-v1
      TASK_UNIT_ID: unit-generation29-evaluate-cross-clock-resumption-counterfactual-v1
      TRIAL_DIR: .continual/runs/run-work-recovery-gen9-durability-repair/artifacts/unit-generation29-cross-clock-resumption-counterfactual-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e '.[test]'

      - name: Assert exact branch, main, authority, and Execute binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$BRANCH_BASE" HEAD)" = "$BRANCH_BASE"
          python - <<'PY'
          import os
          import subprocess
          expected = [
              '.github/workflows/gen29-cross-clock-resumption-execute-v1.yml',
              'agi/CROSS_CLOCK_RESUMPTION_BENCHMARK.json',
              'src/agi/cross_clock_resumption_benchmark.py',
              'tests/test_cross_clock_resumption_benchmark.py',
          ]
          observed = subprocess.check_output(['git','diff','--name-only',os.environ['BRANCH_BASE'],'HEAD'], text=True).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$EXECUTE_WORK_ID/request.json)" = "$EXECUTE_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$EXECUTE_NATIVE_ID.json)" = "$EXECUTE_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['EXECUTE_NATIVE_ID']
          work_id = os.environ['EXECUTE_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native = json.loads((root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json').read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_execute_cross_clock_resumption_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['EXECUTE_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['EXECUTE_REQUEST_BLOB'],
              'pending_request_digest': os.environ['EXECUTE_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 119,
              'native_phase': 'unit_pending',
              'pending_component': 'execute',
              'target_component': 'task_evaluate',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not exact-readback verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('inbox revision mismatch')
          if state.get('user_input_inbox', {}).get('highest_acknowledged_revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('state inbox acknowledgement mismatch')
          if snapshot.get('revision') != 119 or snapshot.get('phase') != 'unit_pending' or snapshot.get('current_component') != 'execute' or snapshot.get('current_unit') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('snapshot is not revision119 Execute unit_pending')
          if request.get('component') != 'execute' or request.get('request_digest') != os.environ['EXECUTE_REQUEST_DIGEST']:
              raise SystemExit('Execute request mismatch')
          payload = request.get('payload', {})
          if payload.get('execution_unit', {}).get('unit_id') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('Execute request unit mismatch')
          if payload.get('preflight_selection', {}).get('decision') != 'BASELINE_FIRST':
              raise SystemExit('Execute Candidate selection mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Execute identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Execute already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'execute':
              raise SystemExit('Execute native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Execute is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 124, 'responses': 123, 'pending': 1, 'native_completed': 117, 'native_fragments': 117, 'native_local_learn': 107}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          PY
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-verify-before.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Record fresh main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json
          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$EXPECTED_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY

      - name: Run benchmark, submit Execute, and freeze Task Evaluate preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider tests/test_cross_clock_resumption_benchmark.py
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from agi.cross_clock_resumption_benchmark import write_cross_clock_artifacts

          root = Path('.').resolve()
          trial_dir = root / os.environ['TRIAL_DIR']
          generated = write_cross_clock_artifacts(root / 'agi/CROSS_CLOCK_RESUMPTION_BENCHMARK.json', trial_dir)
          result = generated['result']
          names = generated['files']
          if generated['artifact_count'] != 10 or result['status'] != 'PASS':
              raise SystemExit('bounded benchmark did not produce the exact ten-file PASS set')
          if result['protected_summary']['all_rejected_before_effect'] is not True:
              raise SystemExit('protected rejection invariant failed')
          if any(result['protected_summary']['bad_counter_totals'].values()):
              raise SystemExit('protected stale/duplicate counter is nonzero')
          if result['control_summary']['all_informative'] is not True or result['control_summary']['live_authority_mutations'] != 0:
              raise SystemExit('control is non-informative or touched live authority')
          artifact_refs = [f"{os.environ['TRIAL_DIR']}/{name}" for name in names]
          artifact_blobs = {ref: subprocess.check_output(['git','hash-object',ref], text=True).strip() for ref in artifact_refs}
          task_unit = {
              'unit_id': os.environ['TASK_UNIT_ID'],
              'component': 'task_evaluate',
              'goal': 'Independently adjudicate the exact three-scenario protected-versus-fail-open cross-clock resumption benchmark, including precommitment, exact-request preservation, concrete repairs, exactly-once responses and successors, deterministic replay, informative one-guard controls, and zero live-authority mutation.',
              'scope': 'Only the frozen synthetic cross-clock resumption protocol and ten generated artifacts; no live generation-29 authority mutation, Candidate or route change, generalized capability, AGI, or completion claim.',
              'inputs': artifact_refs + [
                  'agi/CROSS_CLOCK_RESUMPTION_BENCHMARK.json',
                  'src/agi/cross_clock_resumption_benchmark.py',
                  'tests/test_cross_clock_resumption_benchmark.py',
              ],
              'evidence_needed': [
                  'protocol and generated precommitted-manifest digest identity',
                  'three protected traces rejecting before effects, preserving the exact request, repairing only the scenario cause, and resuming exactly once',
                  'three fail-open traces changing only one guard and exhibiting the precommitted stale-context, stale-write/divergent-successor, or inbox-bypass behavior',
                  'zero protected stale commits, duplicates, fence changes, inbox bypasses, stale-context actions, and live-authority mutations',
                  'byte-stable replay digests, guard-to-prevented-behavior mapping, focused tests, protected exact-head CI, expected-head merge, and remote readback',
              ],
              'expected_outputs': [
                  'separate bounded-unit and upper-objective verdicts',
                  'independent findings for every protected and fail-open scenario',
                  'explicit negative evidence, failure repair instructions, and narrow claim boundary',
              ],
              'success_conditions': [
                  'all protected traces match their precommitment and reject before effect',
                  'exact request identity is preserved and each repair yields one response and one successor',
                  'each fail-open control is single-guard and informative',
                  'all replays are byte-stable and no trace mutates live authority',
              ],
              'failure_conditions': [
                  'any protected stale or duplicate effect, request recreation, multiple successor, or live-authority mutation',
                  'any control changes multiple guards, misses its expected bad behavior, or writes live authority',
                  'protocol/result digest mismatch, nondeterministic replay, publication mismatch, or widened claim',
              ],
              'parent_continuation': 'After Task Evaluate, run post-result Candidate Evaluate, Consolidate Episode, and Learn; publish through protected exact-head CI and expected-head merge with readback; return to Root and continue materially different safe work while AGI and user completion remain false.',
          }
          output = {
              'result': {
                  'unit_id': os.environ['RESULT_UNIT_ID'],
                  'benchmark_id': result['benchmark_id'],
                  'status': 'PASS',
                  'verdict': 'BOUNDED_UNIT_PASS',
                  'reason': 'All three protected synthetic interruption scenarios rejected stale authority before effects, preserved the exact request, repaired only the concrete cause, and resumed exactly once. Each single-guard fail-open control exhibited its precommitted bad behavior, all replays were byte-stable, and no trace wrote live authority.',
                  'protocol_digest': result['protocol_digest'],
                  'result_digest': result['result_digest'],
                  'artifact_count': generated['artifact_count'],
                  'artifacts': artifact_blobs,
                  'implementation': [
                      'agi/CROSS_CLOCK_RESUMPTION_BENCHMARK.json',
                      'src/agi/cross_clock_resumption_benchmark.py',
                      'tests/test_cross_clock_resumption_benchmark.py',
                  ],
                  'protected_summary': result['protected_summary'],
                  'control_summary': result['control_summary'],
                  'guard_to_prevented_behavior': result['guard_to_prevented_behavior'],
                  'candidate_preflight_decision': 'BASELINE_FIRST',
                  'live_authority_mutations': 0,
                  'candidate_activation': False,
                  'provider_route_changed': False,
                  'production_route_changed': False,
                  'agi_claim_supported': False,
                  'upper_objective_achieved': False,
                  'user_level_objective_met': False,
                  'negative_evidence': [
                      'The benchmark contains only three synthetic repository-checkpoint scenarios and cannot establish production reliability or general capability.',
                      'Fail-open traces are counterfactual controls, not authorized production behavior.',
                      'No independent external evaluator or live route evaluated this bounded unit.',
                      'Protected exact-head merge and remote readback remain pending at Execute-response time.',
                      'No evidence in this unit establishes AGI, the upper objective, or user-level completion.',
                  ],
                  'claim_boundary': result['claim_boundary'],
                  'next_execution_unit': task_unit,
                  'continuation': task_unit['parent_continuation'],
              },
              'local_learn': {
                  'decision': 'NO_CHANGE',
                  'candidates': [],
                  'observations': [
                      'Cross-clock continuation guards are attributable when each protected trace is paired with a precommitted one-guard fail-open control.',
                      'Exact request preservation plus one response and one successor after concrete repair is the bounded liveness invariant.',
                      'Synthetic continuity evidence remains insufficient for production, generalized capability, AGI, or completion claims.',
                  ],
              },
              'fragment': {
                  'component': 'execute',
                  'unit_id': os.environ['RESULT_UNIT_ID'],
                  'status': 'PASS',
                  'benchmark_id': result['benchmark_id'],
                  'protocol_digest': result['protocol_digest'],
                  'result_digest': result['result_digest'],
                  'protected_scenario_count': result['protected_summary']['scenario_count'],
                  'all_protected_rejected_before_effect': result['protected_summary']['all_rejected_before_effect'],
                  'all_requests_preserved': result['protected_summary']['all_request_identities_preserved'],
                  'all_replays_verified': result['protected_summary']['all_replays_verified'],
                  'all_controls_informative': result['control_summary']['all_informative'],
                  'live_authority_mutations': 0,
                  'candidate_activation': False,
                  'agi_claim_supported': False,
                  'upper_objective_achieved': False,
                  'claim_boundary': result['claim_boundary'],
              },
          }
          Path('/tmp/execute-output.json').write_text(json.dumps(output, indent=2, sort_keys=True) + '\n')
          Path('/tmp/artifact-files.json').write_text(json.dumps(names, sort_keys=True) + '\n')
          Path('/tmp/artifact-blobs.json').write_text(json.dumps(artifact_blobs, indent=2, sort_keys=True) + '\n')
          PY
          EXECUTE_OUTPUT_BLOB="$(git hash-object /tmp/execute-output.json)"
          echo "EXECUTE_OUTPUT_BLOB=$EXECUTE_OUTPUT_BLOB" >> "$GITHUB_ENV"
          continual --root . work-submit "$EXECUTE_WORK_ID" --response /tmp/execute-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/execute-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate Execute completion and exact Task Evaluate preflight freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          execute_native_id = os.environ['EXECUTE_NATIVE_ID']
          execute_work_id = os.environ['EXECUTE_WORK_ID']
          expected_output = json.loads(Path('/tmp/execute-output.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 125, 'responses': 124, 'pending': 1, 'native_completed': 118, 'native_fragments': 118, 'native_local_learn': 108}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
