      - name: Validate Episode and exact Learn freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['CONSOLIDATE_NATIVE_ID']
          work_id = os.environ['CONSOLIDATE_WORK_ID']
          expected_output = json.loads(Path('/tmp/consolidate-output.json').read_text())
          before = json.loads(Path('/tmp/work-verify-before.json').read_text())
          expected_before = {'valid': True, 'requests': 127, 'responses': 126, 'pending': 1, 'native_completed': 120, 'native_fragments': 120, 'native_local_learn': 110}
          for key, value in expected_before.items():
              if before.get(key) != value:
                  raise SystemExit(f'before mismatch {key}: {before.get(key)!r}')
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 128, 'responses': 127, 'pending': 1, 'native_completed': 121, 'native_fragments': 121, 'native_local_learn': 111}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified = verified_work_invocation(root, work_id)
          if verified.get('output') != expected_output:
              raise SystemExit('persisted Consolidate output mismatch')
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if native.get('status') != 'complete' or native.get('component') != 'consolidate_episode' or native.get('output') != expected_output:
              raise SystemExit('Consolidate native completion mismatch')
          response_rel = f'.continual/work-model/invocations/{work_id}/response.json'
          fragment_rel = native.get('fragment_ref')
          local_rel = f'.continual/runs/{run_id}/local-learn/{native_id}-consolidate_episode.json'
          if not fragment_rel or not (root / fragment_rel).is_file() or not (root / local_rel).is_file():
              raise SystemExit('Consolidate fragment/local learn missing')
          if json.loads((root / local_rel).read_text()) != expected_output['local_learn']:
              raise SystemExit('Consolidate Local Learn mismatch')
          episode_rel = f'.continual/episodes/{os.environ["EPISODE_ID"]}/episode.json'
          if json.loads((root / episode_rel).read_text()) != expected_output['result']:
              raise SystemExit('Episode does not equal exact Consolidate result')
          snapshot_rel = f'.continual/runs/{run_id}/snapshot.json'
          snapshot = json.loads((root / snapshot_rel).read_text())
          if snapshot.get('revision') != 122 or snapshot.get('phase') != 'post_task_learn_pending' or snapshot.get('episode_id') != os.environ['EPISODE_ID']:
              raise SystemExit(f'bad revision122 Learn phase: {snapshot.get("revision")!r} {snapshot.get("phase")!r} {snapshot.get("episode_id")!r}')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one Learn request, got {len(pending)}')
          learn = pending[0]
          if learn.get('component') != 'learn':
              raise SystemExit('next pending component is not Learn')
          learn_id = learn['invocation_id']
          learn_rel = f'.continual/work-model/invocations/{learn_id}/request.json'
          if (root / learn_rel).with_name('response.json').exists():
              raise SystemExit('Learn already answered')
          payload = learn.get('payload', {})
          if payload.get('mode') != 'post-task' or payload.get('episode_id') != os.environ['EPISODE_ID'] or payload.get('current_episode') != expected_output['result']:
              raise SystemExit('Learn payload is not exact post-task Episode')
          awaiting = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'invocations').glob('*.json')):
              value = json.loads(path.read_text())
              if value.get('status') == 'awaiting_work_model':
                  awaiting.append((path, value))
          if len(awaiting) != 1:
              raise SystemExit(f'expected one awaiting Learn native journal, got {len(awaiting)}')
          learn_native_path, learn_native = awaiting[0]
          if learn_native.get('component') != 'learn' or learn_native.get('work_invocation_id') != learn_id or learn_native.get('work_request_digest') != learn.get('request_digest'):
              raise SystemExit('Learn native/Work binding mismatch')
          summary = {
              'consolidate_native_invocation_id': native_id,
              'consolidate_work_invocation_id': work_id,
              'consolidate_response_ref': response_rel,
              'consolidate_response_digest': verified['response']['response_digest'],
              'consolidate_response_blob_sha': subprocess.check_output(['git','hash-object',response_rel], text=True).strip(),
              'consolidate_native_ref': native_path.relative_to(root).as_posix(),
              'consolidate_native_blob_sha': subprocess.check_output(['git','hash-object',str(native_path)], text=True).strip(),
              'consolidate_fragment_ref': fragment_rel,
              'consolidate_fragment_blob_sha': subprocess.check_output(['git','hash-object',fragment_rel], text=True).strip(),
              'consolidate_local_learn_ref': local_rel,
              'consolidate_local_learn_blob_sha': subprocess.check_output(['git','hash-object',local_rel], text=True).strip(),
              'episode_ref': episode_rel,
              'episode_blob_sha': subprocess.check_output(['git','hash-object',episode_rel], text=True).strip(),
              'snapshot_ref': snapshot_rel,
              'snapshot_blob_sha': subprocess.check_output(['git','hash-object',snapshot_rel], text=True).strip(),
              'snapshot_revision': 122,
              'snapshot_phase': 'post_task_learn_pending',
              'pending_work_invocation_id': learn_id,
              'pending_request_ref': learn_rel,
              'pending_request_digest': learn['request_digest'],
              'pending_request_blob_sha': subprocess.check_output(['git','hash-object',learn_rel], text=True).strip(),
              'pending_native_invocation_id': learn_native['invocation_id'],
              'pending_native_invocation_ref': learn_native_path.relative_to(root).as_posix(),
              'pending_native_invocation_blob_sha': subprocess.check_output(['git','hash-object',str(learn_native_path)], text=True).strip(),
              'verification': expected_after,
          }
          Path('/tmp/consolidate-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          receipt_rel = f'.continual/runs/{run_id}/recovery-receipts/gen29-consolidate-cross-clock-resumption-consume-learn-freeze-v1.json'
          receipt = {
              'schema_version': 1, 'record_type': 'generation29_consolidate_consume_receipt',
              'recorded_at': datetime.now(UTC).isoformat().replace('+00:00','Z'),
              'authority': {'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},
              'source_main_sha': os.environ['RUNTIME_MAIN'], 'source_state_blob_sha': os.environ['RUNTIME_STATE_BLOB'],
              'source_ci_workflow_run_id': int(os.environ['SOURCE_CI_RUN_ID']),
              'idempotency_key': 'o-work-gen29:consume-consolidate-invoke-46cbaa8b1bf5ffba2a7991c5:freeze-cross-clock-learn:revision38:v1',
              'completed_effect': summary, 'request_recreated': False, 'consolidate_reinvoked': False,
              'resume_required': True,
              'next_action': 'Exact-head validate and merge this Consolidate lifecycle plus revision122 Learn freeze, bind state, then answer the exact Learn request once.',
          }
          receipt_path = root / receipt_rel
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print('CONSOLIDATE_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

