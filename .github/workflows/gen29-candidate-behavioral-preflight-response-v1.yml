name: gen29 consume behavioral Candidate preflight v1

on:
  push:
    branches:
      - work/gen29-candidate-behavioral-preflight-response-v1

permissions:
  contents: write

concurrency:
  group: gen29-candidate-behavioral-preflight-response-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-candidate-behavioral-preflight-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 80b5dc24cf6b398ae763dfa934aa71cfe7fa7a5b
      EXPECTED_STATE_BLOB: 0c3c912bfc543a5c2455ddcd558aa6df6a4a5e60
      EXPECTED_SNAPSHOT_BLOB: 3d6387236299dabff188a9b9401b6707c74f9ae3
      EXPECTED_INBOX_BLOB: 93889b482c5b54dd90944f19ce425e845f455b35
      EXPECTED_INBOX_REVISION: '35'
      CANDIDATE_NATIVE_ID: invoke-f4298d17c5c682a3fc870e5b
      CANDIDATE_NATIVE_BLOB: e41c911a5a4149999a54eb76a61f015d025ae4f7
      CANDIDATE_WORK_ID: invoke-7869112b0d411a16c51c8cfc
      CANDIDATE_REQUEST_BLOB: 3a78e24f1da67e3e40a7295c33748d81c03741b4
      CANDIDATE_REQUEST_DIGEST: 7a2fa9f66fa907be4424d91ca556918dd7561b999dfe6c4d9e145d52232af9bc
      SOURCE_CI_RUN_ID: '33285896884'
      SOURCE_CI_HEAD: 084d34c34ad4afb76660a7cab5b3b47ba759b380
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-external-observation-behavioral-effect-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, main, authority, and Candidate binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import os
          import subprocess
          expected = ['.github/workflows/gen29-candidate-behavioral-preflight-response-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$CANDIDATE_WORK_ID/request.json)" = "$CANDIDATE_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$CANDIDATE_NATIVE_ID.json)" = "$CANDIDATE_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['CANDIDATE_NATIVE_ID']
          work_id = os.environ['CANDIDATE_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_candidate_evaluate_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['CANDIDATE_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['CANDIDATE_REQUEST_BLOB'],
              'pending_request_digest': os.environ['CANDIDATE_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 99,
              'native_phase': 'unit_pending',
              'pending_component': 'candidate_evaluate',
              'target_component': 'execute',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not exact-readback verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('inbox revision mismatch')
          if state.get('user_input_inbox', {}).get('highest_acknowledged_revision') != int(os.environ['EXPECTED_INBOX_REVISION']):
              raise SystemExit('state inbox acknowledgement mismatch')
          if snapshot.get('revision') != 99 or snapshot.get('phase') != 'unit_pending' or snapshot.get('current_component') != 'execute' or snapshot.get('current_unit') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('snapshot is not revision99 Execute unit_pending')
          if request.get('component') != 'candidate_evaluate' or request.get('request_digest') != os.environ['CANDIDATE_REQUEST_DIGEST']:
              raise SystemExit('Candidate Evaluate request mismatch')
          payload = request.get('payload', {})
          if payload.get('mode') != 'pre-application' or payload.get('target_component') != 'execute':
              raise SystemExit('Candidate request mode/target mismatch')
          bound = payload.get('execution_unit', {})
          if bound.get('execution_unit', {}).get('unit_id') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('Candidate request unit mismatch')
          if bound.get('snapshot', {}).get('revision') != 99:
              raise SystemExit('Candidate request snapshot mismatch')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Candidate identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Candidate already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'candidate_evaluate':
              raise SystemExit('Candidate native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Candidate is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 93, 'responses': 92, 'pending': 1, 'native_completed': 86, 'native_fragments': 86, 'native_local_learn': 79}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(expected_counts, sort_keys=True) + '\n')
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Record fresh main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'],
              'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'],
              'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          test "$LATEST_MAIN" = "$EXPECTED_MAIN"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation

          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY

      - name: Submit exact Candidate response and freeze Execute
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidate-output.json <<'JSON'
          {
            "fragment": {
              "candidate_activation": false,
              "claim_boundary": "This decision authorizes only the bounded read-only revision99 behavioral trial. It is not Candidate activation, production routing, general reliability evidence, AGI evidence, or user-level completion.",
              "component": "candidate_evaluate",
              "mode": "pre-application",
              "selected_strategy": "active Execute prompt with uncontaminated baseline first",
              "unit_id": "unit-generation29-external-observation-behavioral-effect-v1"
            },
            "local_learn": {
              "candidates": [],
              "decision": "NO_CHANGE",
              "observations": [
                "A provenance-observation behavioral trial needs an unchanged semantic baseline so the HOLD-to-ALLOW difference remains attributable only to receipt eligibility.",
                "Topical adjacency does not justify a Candidate overlay when exact-scope verification is absent and the unit precommits controlled cases."
              ]
            },
            "result": {
              "applicability": [
                {
                  "candidate_id": "candidate-self-application-context-hygiene-v1",
                  "decision": "DEFER",
                  "reason": "Repository-development context is adjacent, but this Candidate remains REMAIN_CANDIDATE and is not VERIFIED_FOR_SCOPE for the exact revision99 paired behavioral trial. Applying it now would add an uncontrolled semantic overlay to a precommitted baseline."
                },
                {
                  "candidate_id": "candidate-bounded-recursive-context-retrieval-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Targets recursive source retrieval, while this unit tests a frozen external-observation publication decision."
                },
                {
                  "candidate_id": "candidate-agi-benchmark-suite-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Targets broad capability evaluation rather than the exact Context Kernel observation-to-decision fixture."
                },
                {
                  "candidate_id": "candidate-c6c462472386c57b124d",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Targets campaign authoring rather than this read-only publication-decision trial."
                },
                {
                  "candidate_id": "candidate-copilot-sdk-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Scoped to live genuine-model campaign migration; this unit forbids live dispatch and production effects."
                },
                {
                  "candidate_id": "candidate-github-models-live-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Scoped to an alternative live campaign provider and conflicts with the active live-campaign Candidate; neither affects this non-production fixture."
                },
                {
                  "candidate_id": "candidate-live-campaign-stage-isolation-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Scoped to live-campaign stage isolation, not frozen exact-head observation admission."
                },
                {
                  "candidate_id": "candidate-live-request-status-rendezvous-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Scoped to live-request observability, not the publication-decision function under test."
                },
                {
                  "candidate_id": "candidate-workspace-campaign-v1",
                  "decision": "NOT_APPLICABLE",
                  "reason": "Depends on the benchmark-suite Candidate and targets capability campaigns rather than this bounded Context Kernel trial."
                }
              ],
              "baseline": "Use the active Execute prompt unchanged with the revision99 frozen decision-context manifest and precommitted paired cases. Do not apply or activate a Candidate.",
              "cost_dimensions": {
                "external": "No external dispatch, merge, native invocation, Candidate activation, or production effect is authorized by the unit.",
                "failure_risk": "Primary risks are uncontrolled-input drift, accepting invalid observations, nondeterminism, stale authority, and widening the bounded claim.",
                "latency": "Measure only bounded local decision replay and exact-head CI duration; make no production-latency claim.",
                "quality": "Require HOLD-to-ALLOW only for the one eligible receipt and fail-closed HOLD with exact reasons for every negative control.",
                "token": "Record only if directly measured; do not infer missing token cost.",
                "tool": "Limit implementation to repository-local read-only decision logic, frozen artifacts, deterministic tests, and protected publication gates."
              },
              "decision": "BASELINE_FIRST",
              "evidence_to_collect": [
                "a machine-readable precommitted decision function and paired cases differing only in observation eligibility",
                "one fresh success receipt bound to the exact workflow, head, complete required jobs, authority, request digest, and source version",
                "HOLD decisions with structured reasons for absent, stale, wrong-head, digest-invalid, incomplete-job, and authority-conflicting controls",
                "byte-stable repeated traces with exact source-clock and inclusion or rejection bindings",
                "an empty mutation audit proving no dispatch, merge, native invocation, Candidate activation, or production effect",
                "focused tests, the protected repository suite, and unchanged exact-head publication evidence"
              ],
              "reason": "No indexed Candidate is verified for the exact external-observation behavioral-effect scope. The self-application Candidate is only adjacent and remains REMAIN_CANDIDATE; campaign, benchmark, and recursive-retrieval Candidates govern different scopes. Because the unit requires a precommitted controlled comparison, the active Execute prompt and frozen revision99 manifest are the uncontaminated baseline.",
              "regression_checks": [
                "the valid case changes only the publication decision from HOLD to ALLOW",
                "every absent, stale, wrong-head, digest-invalid, incomplete, or authority-conflicting case remains HOLD",
                "paired cases differ only in the declared observation condition",
                "repeated traces are byte-stable with verifiable source bindings",
                "the mutation audit remains empty and no production route or Candidate state changes",
                "claims remain limited to the exact fixture and do not imply reliability, capability, AGI, or user completion"
              ],
              "rollback": "If any invalid case allows, any uncontrolled input differs, replay is nondeterministic, source binding is unverifiable, mutation occurs, protected tests fail, or the claim widens, retain HOLD as the baseline, discard the experimental delta, and report FAIL or UNCERTAIN for only this exact trial.",
              "scope": "generation29/external-observation-behavioral-effect-v1"
            }
          }
          JSON
          python -m json.tool /tmp/candidate-output.json > /dev/null
          continual --root . work-submit "$CANDIDATE_WORK_ID" --response /tmp/candidate-output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/candidate-submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/native-resume.json
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-after.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-after.json

      - name: Validate Candidate completion and exact Execute freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_invocation, verify_work_invocations

          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          candidate_native_id = os.environ['CANDIDATE_NATIVE_ID']
          candidate_work_id = os.environ['CANDIDATE_WORK_ID']
          expected_output = json.loads(Path('/tmp/candidate-output.json').read_text())
          after = verify_work_invocations(root, run_id=run_id)
          expected_after = {'valid': True, 'requests': 94, 'responses': 93, 'pending': 1, 'native_completed': 87, 'native_fragments': 87, 'native_local_learn': 80}
          for key, value in expected_after.items():
              if after.get(key) != value:
                  raise SystemExit(f'after mismatch {key}: {after.get(key)!r} != {value!r}')
          verified_candidate = verified_work_invocation(root, candidate_work_id)
          if verified_candidate.get('output') != expected_output:
              raise SystemExit('persisted Candidate output mismatch')
          candidate_native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{candidate_native_id}.json'
          candidate_native = json.loads(candidate_native_path.read_text())
          if candidate_native.get('status') != 'complete' or candidate_native.get('component') != 'candidate_evaluate' or candidate_native.get('output') != expected_output:
              raise SystemExit('Candidate native completion mismatch')
          snapshot_path = root / '.continual' / 'runs' / run_id / 'snapshot.json'
          if subprocess.check_output(['git','hash-object',str(snapshot_path)], text=True).strip() != os.environ['EXPECTED_SNAPSHOT_BLOB']:
              raise SystemExit('revision99 snapshot changed during preflight consume')
          unit_path = root / '.continual' / 'runs' / run_id / 'execution-units' / f"{os.environ['RESULT_UNIT_ID']}.json"
          unit = json.loads(unit_path.read_text())
          if unit.get('component') != 'execute' or unit.get('unit_id') != os.environ['RESULT_UNIT_ID']:
              raise SystemExit('selected Execute unit mismatch')
          matches = []
          for path in sorted((root / '.continual' / 'runs' / run_id / 'preflight').glob('preflight-execute-*.json')):
              if json.loads(path.read_text()) == expected_output:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f'expected one exact Execute preflight output, got {len(matches)}')
          preflight_path = matches[0]
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1:
              raise SystemExit(f'expected one Execute request, got {len(pending)}')
          request = pending[0]
          if request.get('component') != 'execute':
              raise SystemExit('next pending request is not Execute')
