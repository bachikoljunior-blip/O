name: gen29-exact-work-verify

on:
  push:
    branches:
      - agent/recovery-gen29-exact-work-verify-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Verify exact Work journal and pending queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verify_work_invocations

          root = Path.cwd()
          run_id = "run-work-recovery-gen9-durability-repair"
          verification = verify_work_invocations(root, run_id=run_id)
          pending = pending_work_invocations(root, run_id=run_id)
          print("WORK_VERIFY=" + json.dumps(verification, sort_keys=True))
          print("WORK_PENDING=" + json.dumps(pending, sort_keys=True))
          assert verification["valid"] is True
          assert verification["requests"] == verification["responses"]
          assert verification["pending"] == 0
          assert pending == []
          PY
