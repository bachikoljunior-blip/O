name: gen29 consume matched-evidence Candidate and freeze Task Evaluate v1

on:
  push:
    branches:
      - work/gen29-matched-evidence-candidate-task-evaluate-v1

permissions:
  contents: write

concurrency:
  group: gen29-matched-evidence-candidate-task-evaluate-v1
  cancel-in-progress: false

jobs:
  consume:
    if: "!contains(github.event.head_commit.message, '[native-matched-evidence-candidate-result]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 866c6711e2140141a12d0bcc2c9330156316ed1a
      EXPECTED_STATE_BLOB: 107bb0b15b85ef2aa68a6411d03083575f4f3d4b
      EXPECTED_SNAPSHOT_BLOB: 1b27068d7d66aeba3ba045113a813a6732ae0569
      EXPECTED_INBOX_BLOB: 89a98913189a88ddef9e7cc53ed5436b1c3379fa
      CANDIDATE_NATIVE_ID: invoke-130962a1be814974604e4148
      CANDIDATE_NATIVE_BLOB: aabef732c86666e0e095f033d0fe4007bec25944
      CANDIDATE_WORK_ID: invoke-7bc390ea03a682f60389a491
      CANDIDATE_REQUEST_BLOB: b627e6d5a8ad51e3c1d5d60da001ecb77a8f069c
      CANDIDATE_REQUEST_DIGEST: 20e50875915d8f5cba76f1eda9d0873945d9655631eb5d5eeee6e1feaa73f007
      RUN_ID: run-work-recovery-gen9-durability-repair
      RESULT_UNIT_ID: unit-generation29-matched-evidence-acquisition-loop-v1
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
      WORKFLOW_PATH: .github/workflows/gen29-matched-evidence-candidate-task-evaluate-v1.yml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: python -m pip install -e .

      - name: Assert exact authority and frozen Candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$RUNTIME_MAIN" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN" HEAD)" = "$WORKFLOW_PATH"
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/state-doc.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/inbox-doc.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/state-doc.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/inbox-doc.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/state-doc.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/inbox-doc.json | tr -d '\n' | base64 --decode > /tmp/inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$CANDIDATE_WORK_ID/request.json)" = "$CANDIDATE_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$CANDIDATE_NATIVE_ID.json)" = "$CANDIDATE_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_request,verify_work_invocations
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']; wid=os.environ['CANDIDATE_WORK_ID']; nid=os.environ['CANDIDATE_NATIVE_ID']
          state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text()); inbox=json.loads(Path('/tmp/inbox.json').read_text())
          snap=json.loads((root/'.continual'/'runs'/run_id/'snapshot.json').read_text()); req=verified_work_request(root,wid)
          native=json.loads((root/'.continual'/'runs'/run_id/'invocations'/f'{nid}.json').read_text())
          if state.get('execution_id')!='work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3': raise SystemExit('execution mismatch')
          if state.get('lease_generation')!=29 or hashlib.sha256(state['fence_token'].encode()).hexdigest()!='c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d': raise SystemExit('generation/fence mismatch')
          if state.get('status')!='running' or state.get('resume_required') is not True: raise SystemExit('authority not resumable')
          if state.get('active_component')!='generation29_matched_evidence_candidate_evaluate_pending_native_consume': raise SystemExit('active mismatch')
          exact=state.get('exact_continuation',{})
          expected={'pending_native_invocation_id':nid,'pending_native_invocation_blob_sha':os.environ['CANDIDATE_NATIVE_BLOB'],'pending_work_invocation_id':wid,'pending_request_blob_sha':os.environ['CANDIDATE_REQUEST_BLOB'],'pending_request_digest':os.environ['CANDIDATE_REQUEST_DIGEST'],'pending_response_blob_sha':None,'snapshot_revision':145,'native_phase':'unit_pending','pending_component':'candidate_evaluate','target_component':'task_evaluate','durability_status':'remote_main_readback_verified'}
          for k,v in expected.items():
              if exact.get(k)!=v: raise SystemExit(f'exact mismatch {k}: {exact.get(k)!r}')
          if exact.get('verified_remote_readback') is not True: raise SystemExit('exact not verified')
          durability=state.get('continuation_durability',{})
          if durability.get('pending_work_invocation_id')!=wid or durability.get('pending_native_invocation_id')!=nid or durability.get('verified_remote_readback') is not True: raise SystemExit('durability mismatch')
          if inbox.get('revision')!=40 or state.get('user_input_inbox',{}).get('highest_acknowledged_revision')!=40: raise SystemExit('inbox mismatch')
          if snap.get('revision')!=145 or snap.get('phase')!='unit_pending' or snap.get('current_component')!='task_evaluate' or snap.get('current_unit')!=os.environ['RESULT_UNIT_ID']: raise SystemExit('snapshot mismatch')
          if req.get('component')!='candidate_evaluate' or req.get('request_digest')!=os.environ['CANDIDATE_REQUEST_DIGEST']: raise SystemExit('request mismatch')
          p=req.get('payload',{})
          if p.get('mode')!='pre-application' or p.get('target_component')!='task_evaluate': raise SystemExit('mode mismatch')
          cs=p.get('candidate_index',{}).get('candidates',[])
          if len(cs)!=1 or cs[0].get('candidate_id')!='candidate-task-evaluate-unit-verdict-v1': raise SystemExit('candidate mismatch')
          if (root/'.continual'/'work-model'/'invocations'/wid/'response.json').exists(): raise SystemExit('already answered')
          if native.get('status')!='awaiting_work_model' or native.get('component')!='candidate_evaluate' or native.get('work_invocation_id')!=wid or native.get('work_request_digest')!=req.get('request_digest'): raise SystemExit('native mismatch')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0].get('invocation_id')!=wid: raise SystemExit('not unique pending')
          got=verify_work_invocations(root,run_id=run_id); exp={'valid':True,'requests':161,'responses':160,'pending':1,'native_completed':154,'native_fragments':154,'native_local_learn':140}
          for k,v in exp.items():
              if got.get(k)!=v: raise SystemExit(f'before count {k}: {got.get(k)!r}')
          PY

      - name: Record fresh Work observation and continuity preflight
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/wprep.json
          python - <<'PY'
          import base64,json
          from pathlib import Path
          from continual.store import Store
          doc=json.loads(Path('/tmp/state-doc.json').read_text()); state=json.loads(base64.b64decode(''.join(doc['content'].splitlines())).decode())
          p={'status':state['status'],'owner_kind':state['owner_kind'],'execution_id':state['execution_id'],'lease_generation':state['lease_generation'],'fence_token_digest':Store(Path('.')).stable_digest(state['fence_token'],length=64),'heartbeat_at':state['heartbeat_at']}
          Path('/tmp/wprojection.json').write_text(json.dumps(p,sort_keys=True)+'\n')
          PY
          ID="$(jq -r '.observation_id' /tmp/wprep.json)"
          DIGEST="$(jq -r '.request_digest' /tmp/wprep.json)"
          AT="$(python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$ID" --request-digest "$DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/wprojection.json --observed-at "$AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/wreceipt.json
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$EXPECTED_MAIN" --jq .sha)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root=Path('.').resolve(); state=json.loads((root/'agi/WORK_EXECUTION_STATE.json').read_text()); now=Store(root).utc_now()
          verify_work_source_observation(root,run_id=os.environ['RUN_ID'],state=state,state_blob_sha=os.environ['RUNTIME_STATE_BLOB'],now=now)
          c=assert_work_resume_continuity_preflight(root,run_id=os.environ['RUN_ID'],executor_binding=os.environ['EXECUTOR_BINDING'],model_identity=os.environ['MODEL_IDENTITY'])
          if c.get('resume_authorized') is not True: raise SystemExit('continuity denied')
          PY

      - name: Submit exact Candidate response and resume once
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/output.json <<'JSON'
          {
            "fragment": {
              "candidate_activation": false,
              "claim_boundary": "One-call scoped Task Evaluate overlay trial only; no Candidate activation, promotion, production claim, generalized reliability claim, AGI claim, upper-objective claim, user-level completion, or monitor completion.",
              "component": "candidate_evaluate",
              "continuation": "Independently Task Evaluate the exact merged matched-evidence acquisition guard with separate bounded-unit and unchanged upper-objective verdicts, preserve all fail-closed controls and negative evidence, then continue the post-result lifecycle.",
              "mode": "pre-application",
              "selected_strategy": "TRIAL_CANDIDATE candidate-task-evaluate-unit-verdict-v1 as an additive overlay on the unchanged active Task Evaluate prompt",
              "unit_id": "unit-generation29-matched-evidence-acquisition-loop-v1"
            },
            "local_learn": {
              "candidates": [],
              "decision": "NO_CHANGE",
              "observations": [
                "The sole indexed Candidate targets the exact upcoming Task Evaluate component and incremental task-evaluation scope.",
                "Prior evidence proposes activation but is not VERIFIED_FOR_SCOPE, so only a one-call additive trial is justified.",
                "Dual-verdict discipline prevents a bounded routing-mechanism PASS from being conflated with the unchanged AGI upper objective."
              ]
            },
            "result": {
              "activation": false,
              "active_version": "prompts/task_evaluate.md",
              "agi_claim_supported": false,
              "applicability": "Directly applicable only to this exact Task Evaluate call because it adds a separately falsifiable bounded-unit verdict while preserving the unchanged original-task verdict.",
              "baseline_need": "Retain the active Task Evaluate contract. The overlay may add unit_verdict PASS, FAIL, or UNCERTAIN but cannot relax or replace the upper-objective verdict.",
              "candidate_activation": false,
              "candidate_id": "candidate-task-evaluate-unit-verdict-v1",
              "candidate_version": ".continual/candidates/candidate-task-evaluate-unit-verdict-v1/prompt.md",
              "conflicts": [],
              "cost_dimensions": {
                "external": "No external dispatch, deployment, production routing, Candidate promotion, or unrelated mutation.",
                "failure_risk": "Verdict conflation or claim widening requires rollback.",
                "latency": "One bounded overlay call only.",
                "quality": "Require exact trigger, controls, idempotency, recurrence, authority, CI, merge, and readback evidence.",
                "token": "Record only directly measured usage.",
                "tool": "Candidate selection authorizes no additional external tool action."
              },
              "decision": "TRIAL_CANDIDATE",
              "dependencies": [],
              "evaluated_candidate_id": "candidate-task-evaluate-unit-verdict-v1",
              "evidence_to_collect": [
                "exact merged guard and engine blobs with protected exact-head CI and expected-head merge",
                "typed sole-cause positive schedule and every fail-closed negative control",
                "deterministic idempotency and ordinary Root domain-switch recurrence",
                "exact source-clock, generation, fence, request, response, and receipt bindings",
                "separate original-task and bounded-unit verdicts with negative evidence, unmet conditions, and repair information",
                "proof that bounded-unit PASS does not imply Candidate activation, generalized autonomy, AGI, or user completion"
              ],
              "exact_scope": "continual/incremental-task-evaluation/matched-evidence-acquisition-loop-v1",
              "expected_scope": "continual/incremental-task-evaluation",
              "global_activation_authorized": false,
              "reason": "The Candidate targets the exact component and scope without dependency or conflict, but remains unverified for this unit. A one-call TRIAL_CANDIDATE tests additive dual-verdict discipline without promotion.",
              "regression_checks": [
                "original verdict evaluates the unchanged AGI upper objective",
                "unit_verdict covers only the exact matched-evidence guard and declared controls",
                "unit PASS cannot imply upper-objective PASS or remove unmet AGI conditions",
                "missing trigger, control, idempotency, recurrence, authority, CI, merge, or readback evidence prevents unit PASS",
                "negative evidence stays explicit",
                "Candidate remains unactivated and no external effect is authorized"
              ],
              "rollback": "If either verdict is omitted, scopes are conflated, a claim widens, negative evidence is suppressed, a failure condition weakens, or the active baseline changes, discard the overlay result, retain the baseline and negative evidence, and leave the Candidate unactivated.",
              "scope": "continual/incremental-task-evaluation/matched-evidence-acquisition-loop-v1",
              "status": "candidate",
              "upper_objective_achieved": false,
              "user_level_objective_met": false
            }
          }
          JSON
          python -m json.tool /tmp/output.json > /dev/null
          continual --root . work-submit "$CANDIDATE_WORK_ID" --response /tmp/output.json --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/submit.json
          continual --root . work-resume "$RUN_ID" --max-steps 2 --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/resume.json

      - name: Validate completion and frozen Task Evaluate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import UTC,datetime
          from pathlib import Path
          from continual.work_session import pending_work_invocations,verified_work_invocation,verify_work_invocations
          root=Path('.').resolve(); run_id=os.environ['RUN_ID']; wid=os.environ['CANDIDATE_WORK_ID']; nid=os.environ['CANDIDATE_NATIVE_ID']
          expected=json.loads(Path('/tmp/output.json').read_text()); got=verify_work_invocations(root,run_id=run_id)
          exp={'valid':True,'requests':162,'responses':161,'pending':1,'native_completed':155,'native_fragments':155,'native_local_learn':141}
          for k,v in exp.items():
              if got.get(k)!=v: raise SystemExit(f'after count {k}: {got.get(k)!r}')
          verified=verified_work_invocation(root,wid)
          if verified.get('output')!=expected: raise SystemExit('persisted output mismatch')
          cpath=root/'.continual'/'runs'/run_id/'invocations'/f'{nid}.json'; cn=json.loads(cpath.read_text())
          if cn.get('status')!='complete' or cn.get('output')!=expected: raise SystemExit('candidate native mismatch')
          spath=root/'.continual'/'runs'/run_id/'snapshot.json'
          if subprocess.check_output(['git','hash-object',str(spath)],text=True).strip()!=os.environ['EXPECTED_SNAPSHOT_BLOB']: raise SystemExit('snapshot changed')
          pending=pending_work_invocations(root,run_id=run_id)
          if len(pending)!=1 or pending[0].get('component')!='task_evaluate': raise SystemExit('Task Evaluate not unique')
          req=pending[0]; payload=req.get('payload',{}); candidate=payload.get('candidate',{})
          if candidate.get('candidate_id')!='candidate-task-evaluate-unit-verdict-v1' or candidate.get('prompt_mode')!='overlay': raise SystemExit('overlay mismatch')
          if payload.get('preflight_selection')!=expected['result'] or payload.get('execution_unit')!=os.environ['RESULT_UNIT_ID']: raise SystemExit('selection/unit mismatch')
          if 'candidate-task-evaluate-unit-verdict-v1' not in req.get('prompt_path',''): raise SystemExit('effective prompt mismatch')
          nwid=req['invocation_id']; rrel=f'.continual/work-model/invocations/{nwid}/request.json'
          awaiting=[]
          for p in sorted((root/'.continual'/'runs'/run_id/'invocations').glob('*.json')):
              v=json.loads(p.read_text())
              if v.get('status')=='awaiting_work_model': awaiting.append((p,v))
          if len(awaiting)!=1: raise SystemExit('awaiting native count mismatch')
          np,nv=awaiting[0]
          if nv.get('component')!='task_evaluate' or nv.get('work_invocation_id')!=nwid or nv.get('work_request_digest')!=req.get('request_digest'): raise SystemExit('next native mismatch')
          resp=f'.continual/work-model/invocations/{wid}/response.json'
          summary={'candidate_native_invocation_id':nid,'candidate_work_invocation_id':wid,'candidate_response_ref':resp,'candidate_response_digest':verified['response']['response_digest'],'candidate_response_blob_sha':subprocess.check_output(['git','hash-object',resp],text=True).strip(),'candidate_native_blob_sha':subprocess.check_output(['git','hash-object',str(cpath)],text=True).strip(),'candidate_fragment_ref':cn['fragment_ref'],'candidate_fragment_blob_sha':subprocess.check_output(['git','hash-object',cn['fragment_ref']],text=True).strip(),'candidate_local_learn_ref':f'.continual/runs/{run_id}/local-learn/{nid}-candidate_evaluate.json','pending_native_invocation_id':nv['invocation_id'],'pending_native_invocation_ref':np.relative_to(root).as_posix(),'pending_native_invocation_blob_sha':subprocess.check_output(['git','hash-object',str(np)],text=True).strip(),'pending_work_invocation_id':nwid,'pending_request_ref':rrel,'pending_request_digest':req['request_digest'],'pending_request_blob_sha':subprocess.check_output(['git','hash-object',rrel],text=True).strip(),'pending_component':'task_evaluate','snapshot_revision':145,'snapshot_phase':'unit_pending','snapshot_blob_sha':os.environ['EXPECTED_SNAPSHOT_BLOB'],'verification':exp}
          summary['candidate_local_learn_blob_sha']=subprocess.check_output(['git','hash-object',summary['candidate_local_learn_ref']],text=True).strip()
          Path('/tmp/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          receipt={'schema_version':1,'record_type':'generation29_matched_evidence_candidate_consume_receipt','recorded_at':datetime.now(UTC).isoformat().replace('+00:00','Z'),'authority':{'execution_id':'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3','lease_generation':29,'fence_token_digest':'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d'},'source_main_sha':os.environ['RUNTIME_MAIN'],'source_state_blob_sha':os.environ['RUNTIME_STATE_BLOB'],'idempotency_key':'o-work-gen29:consume-candidate-invoke-7bc390ea03a682f60389a491:freeze-task-evaluate:v1','completed_effect':summary,'request_recreated':False,'candidate_reinvoked':False,'candidate_activation':False,'resume_required':True,'upper_objective_achieved':False,'agi_achieved':False,'next_action':'Exact-head validate and merge this Candidate response plus Task Evaluate freeze, bind state by two-phase CAS/readback, then answer only the exact pending Task Evaluate request once and continue.'}
          rp=root/'.continual'/'runs'/run_id/'recovery-receipts'/'gen29-matched-evidence-candidate-consume-task-evaluate-freeze-v1.json'; rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Stage lifecycle delta, remove launcher, and push once
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- agi/WORK_EXECUTION_STATE.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          s=json.loads(Path('/tmp/summary.json').read_text()); run_id=os.environ['RUN_ID']; wid=os.environ['CANDIDATE_WORK_ID']; nid=os.environ['CANDIDATE_NATIVE_ID']
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:].split(' -> ')[-1]
              if p==os.environ['WORKFLOW_PATH'] or p.startswith(f'.continual/runs/{run_id}/') or p.startswith('.continual/work-model/invocations/') or p.startswith('src/continual_chatgpt.egg-info/') or '__pycache__/' in p: continue
              raise SystemExit('unexpected path '+p)
          required=[f'.continual/runs/{run_id}/events.jsonl',f'.continual/runs/{run_id}/invocations/{nid}.json',f'.continual/work-model/invocations/{wid}/response.json',s['candidate_fragment_ref'],s['candidate_local_learn_ref'],s['pending_native_invocation_ref'],s['pending_request_ref'],f'.continual/runs/{run_id}/recovery-receipts/gen29-matched-evidence-candidate-consume-task-evaluate-freeze-v1.json']
          for p in required:
              if not Path(p).is_file(): raise SystemExit('missing '+p)
          subprocess.run(['git','add','-f','--','.continual'],check=True)
          PY
          git rm "$WORKFLOW_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[native-matched-evidence-candidate-result] consume Candidate and freeze Task Evaluate'
          git push origin "HEAD:$GITHUB_REF_NAME"
