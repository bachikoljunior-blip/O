name: gen29 matched-evidence Candidate consume

on:
  push:
    branches:
      - work/gen29-matched-evidence-candidate-task-evaluate-v1

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact branch
        run: python -m pip install -e .
      - name: Consume frozen Candidate and freeze Task Evaluate
        run: python .github/scripts/gen29_matched_evidence_candidate_consume.py
