name: gen29 consume Consolidate after blind-holder v1

on:
  push:
    branches:
      - work/gen29-consolidate-after-blind-holder-v1

permissions:
  contents: write

concurrency:
  group: gen29-consolidate-after-blind-holder-v1
  cancel-in-progress: false

jobs:
  consume:
    if: ${{ !contains(github.event.head_commit.message, '[native-consolidate-blind-holder-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 911904c6fe8be8ea5ee4f9088253731cf51d1bda
      EXPECTED_STATE_BLOB: c662eae53c8f261f603704f2d953c4004c0385fd
      EXPECTED_SNAPSHOT_BLOB: 52cc9845903c84ae92f63d9e280ba1c9c2353fcc
      EXPECTED_INBOX_BLOB: 208906fb4669eca5c8f448a0a8db6e4dcb7dfee2
      EXPECTED_INBOX_REVISION: '37'
      CONSOLIDATE_NATIVE_ID: invoke-c5e64091e5d62bd7e9640329
      CONSOLIDATE_NATIVE_BLOB: 90717eb3121df7d1322451fa5fe282392ffd2d9b
      CONSOLIDATE_WORK_ID: invoke-56c06cc145c0a401cadf171d
      CONSOLIDATE_REQUEST_BLOB: 2102dee375178dda4f6a6a7f5e9a3377d68d2421
      CONSOLIDATE_REQUEST_DIGEST: 01d9126e4875f9d14c9bc659c6bc70be60cf867d1dbcd108f7a33b1ff206ee7f
      SOURCE_CI_RUN_ID: '33343164126'
      SOURCE_CI_HEAD: 91a1be5c992ee760699a29e54081a3dac255247a
      RUN_ID: run-work-recovery-gen9-durability-repair
      EPISODE_ID: episode-work-recovery-gen9-durability-repair
      EXECUTOR_BINDING: current_chatgpt_work_session
      MODEL_IDENTITY: chatgpt-work-model-unverified
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact repository runtime
        run: python -m pip install -e .

      - name: Assert exact branch, runtime main, authority, and Consolidate binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RUNTIME_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import subprocess
          expected = ['.github/workflows/gen29-consolidate-after-blind-holder-v1.yml']
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', __import__('os').environ['EXPECTED_MAIN'], 'HEAD'],
              text=True,
          ).splitlines()
          if observed != expected:
              raise SystemExit(f'launch delta mismatch: {observed!r}')
          PY
          python - "$EXPECTED_MAIN" "$RUNTIME_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('runtime main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe runtime-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$RUNTIME_MAIN" > /tmp/runtime-state-document.json
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/USER_INPUT_INBOX.json?ref=$RUNTIME_MAIN" > /tmp/runtime-inbox-document.json
          RUNTIME_STATE_BLOB="$(jq -r '.sha' /tmp/runtime-state-document.json)"
          test "$RUNTIME_STATE_BLOB" = "$EXPECTED_STATE_BLOB"
          test "$(jq -r '.sha' /tmp/runtime-inbox-document.json)" = "$EXPECTED_INBOX_BLOB"
          jq -r '.content' /tmp/runtime-state-document.json | tr -d '\n' | base64 --decode > agi/WORK_EXECUTION_STATE.json
          jq -r '.content' /tmp/runtime-inbox-document.json | tr -d '\n' | base64 --decode > /tmp/runtime-inbox.json
          test "$(git hash-object agi/WORK_EXECUTION_STATE.json)" = "$EXPECTED_STATE_BLOB"
          test "$(git hash-object /tmp/runtime-inbox.json)" = "$EXPECTED_INBOX_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/snapshot.json)" = "$EXPECTED_SNAPSHOT_BLOB"
          test "$(git hash-object .continual/work-model/invocations/$CONSOLIDATE_WORK_ID/request.json)" = "$CONSOLIDATE_REQUEST_BLOB"
          test "$(git hash-object .continual/runs/$RUN_ID/invocations/$CONSOLIDATE_NATIVE_ID.json)" = "$CONSOLIDATE_NATIVE_BLOB"
          echo "RUNTIME_MAIN=$RUNTIME_MAIN" >> "$GITHUB_ENV"
          echo "RUNTIME_STATE_BLOB=$RUNTIME_STATE_BLOB" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from continual.work_session import pending_work_invocations, verified_work_request, verify_work_invocations
          root = Path('.').resolve()
          run_id = os.environ['RUN_ID']
          native_id = os.environ['CONSOLIDATE_NATIVE_ID']
          work_id = os.environ['CONSOLIDATE_WORK_ID']
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          inbox = json.loads(Path('/tmp/runtime-inbox.json').read_text())
          snapshot = json.loads((root / '.continual' / 'runs' / run_id / 'snapshot.json').read_text())
          request = verified_work_request(root, work_id)
          native_path = root / '.continual' / 'runs' / run_id / 'invocations' / f'{native_id}.json'
          native = json.loads(native_path.read_text())
          if state.get('execution_id') != 'work-recovery-20260828T122724304Z-b9f52bccaba0472923908d65b1fb59c3':
              raise SystemExit('execution mismatch')
          if state.get('lease_generation') != 29 or hashlib.sha256(state['fence_token'].encode()).hexdigest() != 'c03cdd410193ed54352ee4fd5480cf5e4fccb77d5a1aca67809b7c3e4341890d':
              raise SystemExit('generation/fence mismatch')
          if state.get('status') != 'running' or state.get('resume_required') is not True:
              raise SystemExit('authority is not resumable running state')
          if state.get('active_component') != 'generation29_consolidate_blind_holder_pending_native_consume':
              raise SystemExit('active component mismatch')
          exact = state.get('exact_continuation', {})
          expected = {
              'completed_native_invocation_id': 'invoke-96c7568053ec5ca132e60d90',
              'completed_work_invocation_id': 'invoke-c3fdf7b0b9e70d29c0f21d86',
              'completed_response_digest': '381ba7606a37dfb82800425361cf7f96ef929d91b853458ce77a44c2c1b822d2',
              'pending_native_invocation_id': native_id,
              'pending_native_invocation_ref': f'.continual/runs/{run_id}/invocations/{native_id}.json',
              'pending_native_invocation_blob_sha': os.environ['CONSOLIDATE_NATIVE_BLOB'],
              'pending_work_invocation_id': work_id,
              'pending_request_ref': f'.continual/work-model/invocations/{work_id}/request.json',
              'pending_request_blob_sha': os.environ['CONSOLIDATE_REQUEST_BLOB'],
              'pending_request_digest': os.environ['CONSOLIDATE_REQUEST_DIGEST'],
              'pending_response_ref': None,
              'pending_response_blob_sha': None,
              'pending_response_digest': None,
              'response_exists_on_authoritative_remote': False,
              'snapshot_revision': 111,
              'native_phase': 'consolidate_pending',
              'pending_component': 'consolidate_episode',
              'durability_status': 'pending_native_consume',
          }
          for key, value in expected.items():
              if exact.get(key) != value:
                  raise SystemExit(f'exact continuation mismatch {key}: {exact.get(key)!r} != {value!r}')
          bind = state.get('generation29_post_task_candidate_blind_holder_consume_v1', {})
          if bind.get('status') != 'merged_to_main_verified_consolidate_bound_pending_native_consume':
              raise SystemExit('Consolidate state binding status mismatch')
          if bind.get('pending_consolidate_work_invocation_id') != work_id or bind.get('pending_consolidate_native_invocation_id') != native_id:
              raise SystemExit('Consolidate state identity mismatch')
          durability = state.get('continuation_durability', {})
          if durability.get('status') != 'remote_main_readback_verified' or durability.get('verified_remote_readback') is not True:
              raise SystemExit('continuation durability is not verified')
          if durability.get('pending_work_invocation_id') != work_id or durability.get('pending_native_invocation_id') != native_id:
              raise SystemExit('continuation durability identity mismatch')
          if inbox.get('revision') != 37:
              raise SystemExit('inbox revision mismatch')
          if snapshot.get('revision') != 111 or snapshot.get('phase') != 'consolidate_pending':
              raise SystemExit('snapshot is not revision111 consolidate_pending')
          if request.get('component') != 'consolidate_episode' or request.get('request_digest') != os.environ['CONSOLIDATE_REQUEST_DIGEST']:
              raise SystemExit('Consolidate request mismatch')
          if request.get('prompt_path') != 'prompts/consolidate_episode.md':
              raise SystemExit('Consolidate prompt mismatch')
          if request.get('payload', {}).get('preflight_selection', {}).get('decision') != 'USE_ACTIVE':
              raise SystemExit('Consolidate preflight is not USE_ACTIVE')
          if request.get('executor_binding') != os.environ['EXECUTOR_BINDING'] or request.get('model_identity') != os.environ['MODEL_IDENTITY']:
              raise SystemExit('Consolidate identity mismatch')
          if (root / '.continual' / 'work-model' / 'invocations' / work_id / 'response.json').exists():
              raise SystemExit('Consolidate already answered')
          if native.get('status') != 'awaiting_work_model' or native.get('component') != 'consolidate_episode':
              raise SystemExit('Consolidate native is not awaiting')
          if native.get('work_invocation_id') != work_id or native.get('work_request_digest') != request.get('request_digest'):
              raise SystemExit('native/Work binding mismatch')
          pending = pending_work_invocations(root, run_id=run_id)
          if len(pending) != 1 or pending[0].get('invocation_id') != work_id:
              raise SystemExit('Consolidate is not the unique pending Work item')
          verified = verify_work_invocations(root, run_id=run_id)
          expected_counts = {'valid': True, 'requests': 113, 'responses': 112, 'pending': 1, 'native_completed': 106, 'native_fragments': 106, 'native_local_learn': 98}
          for key, value in expected_counts.items():
              if verified.get(key) != value:
                  raise SystemExit(f'before verification mismatch {key}: {verified.get(key)!r}')
          Path('/tmp/expected-before.json').write_text(json.dumps(expected_counts, sort_keys=True) + '\n')
          PY
          continual --root . work-checkpoint-verify --state agi/WORK_EXECUTION_STATE.json > /tmp/work-checkpoint-before.json
          cat /tmp/work-checkpoint-before.json

      - name: Record fresh exact main and exact-head CI observations
        shell: bash
        run: |
          set -euo pipefail
          continual --root . work-source-observation-prepare "$RUN_ID" --state-blob-sha "$RUNTIME_STATE_BLOB" --expected-commit-sha "$RUNTIME_MAIN" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-prepare.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from continual.store import Store
          document = json.loads(Path('/tmp/runtime-state-document.json').read_text())
          state = json.loads(base64.b64decode(''.join(document['content'].splitlines())).decode())
          projection = {
              'status': state['status'], 'owner_kind': state['owner_kind'],
              'execution_id': state['execution_id'], 'lease_generation': state['lease_generation'],
              'fence_token_digest': Store(Path('.')).stable_digest(state['fence_token'], length=64),
              'heartbeat_at': state['heartbeat_at'],
          }
          Path('/tmp/work-source-projection.json').write_text(json.dumps(projection, sort_keys=True) + '\n')
          PY
          WORK_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/work-source-prepare.json)"
          WORK_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/work-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . work-source-observation-record "$RUN_ID" "$WORK_OBSERVATION_ID" --request-digest "$WORK_REQUEST_DIGEST" --commit-sha "$RUNTIME_MAIN" --blob-sha "$RUNTIME_STATE_BLOB" --projection /tmp/work-source-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/work-source-receipt.json

          continual --root . ci-source-observation-prepare "$RUN_ID" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-prepare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > /tmp/workflow-run-full.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" > /tmp/workflow-jobs-full.json
          test "$(jq -r '.head_sha' /tmp/workflow-run-full.json)" = "$SOURCE_CI_HEAD"
          test "$(jq -r '.status' /tmp/workflow-run-full.json)" = "completed"
          test "$(jq -r '.conclusion' /tmp/workflow-run-full.json)" = "success"
          jq -e '[.jobs[] | select(.name == "pytest shard 0 of 4" or .name == "pytest shard 1 of 4" or .name == "pytest shard 2 of 4" or .name == "pytest shard 3 of 4" or .name == "test") | select(.status == "completed" and .conclusion == "success")] | length == 5' /tmp/workflow-jobs-full.json
          jq '{id, workflow_id, name, status, conclusion, head_sha}' /tmp/workflow-run-full.json > /tmp/workflow-run-projection.json
          jq '[.jobs[] | {id, name, status, conclusion}] | sort_by(.id)' /tmp/workflow-jobs-full.json > /tmp/workflow-jobs-projection.json
          CI_OBSERVATION_ID="$(jq -r '.observation_id' /tmp/ci-source-prepare.json)"
          CI_REQUEST_DIGEST="$(jq -r '.request_digest' /tmp/ci-source-prepare.json)"
          OBSERVED_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat().replace("+00:00", "Z"))')"
          continual --root . ci-source-observation-record "$RUN_ID" "$CI_OBSERVATION_ID" --request-digest "$CI_REQUEST_DIGEST" --workflow-run /tmp/workflow-run-projection.json --jobs /tmp/workflow-jobs-projection.json --observed-at "$OBSERVED_AT" --executor-binding "$EXECUTOR_BINDING" --model-identity "$MODEL_IDENTITY" > /tmp/ci-source-receipt.json

      - name: Recheck CAS and continuity before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          LATEST_MAIN="$(git rev-parse origin/main)"
          python - "$EXPECTED_MAIN" "$LATEST_MAIN" <<'PY'
          import subprocess
          import sys
          base, latest = sys.argv[1:]
          if subprocess.check_output(['git', 'merge-base', base, latest], text=True).strip() != base:
              raise SystemExit('latest main lost expected ancestry')
          for line in subprocess.check_output(['git', 'diff', '--name-status', base, latest], text=True).splitlines():
              status, path = line.split('\t', 1)
              allowed = (
                  (status == 'M' and path == 'agi/WORK_EXECUTION_STATE.json')
                  or (status == 'A' and path.startswith('note/automation_control/receipts/') and path.endswith('.json'))
                  or (status == 'A' and path.startswith('note/research_workers_clean_g1/evaluation/checkpoint_') and path.endswith('_control_missing.json'))
              )
              if not allowed:
                  raise SystemExit(f'unsafe latest-main delta: {status} {path}')
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/agi/WORK_EXECUTION_STATE.json?ref=$LATEST_MAIN" > /tmp/pre-mutation-state-document.json
          test "$(jq -r '.sha' /tmp/pre-mutation-state-document.json)" = "$RUNTIME_STATE_BLOB"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from continual.ci_source_observation import verify_ci_source_observation
          from continual.continuity_preflight import assert_work_resume_continuity_preflight
          from continual.store import Store
          from continual.work_source_observation import verify_work_source_observation
          root = Path('.').resolve()
          state = json.loads((root / 'agi/WORK_EXECUTION_STATE.json').read_text())
          now = Store(root).utc_now()
          work = verify_work_source_observation(root, run_id=os.environ['RUN_ID'], state=state, state_blob_sha=os.environ['RUNTIME_STATE_BLOB'], now=now)
          ci = verify_ci_source_observation(root, run_id=os.environ['RUN_ID'], state=state, now=now)
          continuity = assert_work_resume_continuity_preflight(root, run_id=os.environ['RUN_ID'], executor_binding=os.environ['EXECUTOR_BINDING'], model_identity=os.environ['MODEL_IDENTITY'])
          if continuity.get('resume_authorized') is not True:
              raise SystemExit('continuity preflight denied')
          print(json.dumps({'work': work, 'ci': ci, 'continuity': continuity}, sort_keys=True))
          PY
          continual --root . work-verify --run-id "$RUN_ID" > /tmp/work-verify-before.json
          continual --root . work-pending --run-id "$RUN_ID" > /tmp/work-pending-before.json

      - name: Submit exact Consolidate response and freeze Learn
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/consolidate-output.json <<'JSON'
          {
            "result": {
              "episode_id": "episode-work-recovery-gen9-durability-repair",
              "episode_type": "bounded_blind_holder_protocol_repair_and_evaluation",
              "episode_summary": "A prior clean-g1 forecast remained correctly failed because source retrieval and task-rule access preceded commitment and same-session predictor isolation was unproven. Root therefore selected one repository-local blind-holder protocol repair before any new live forecast. The repaired gate froze task, rule, context, source, holder, and isolation bindings before retrieval; required response readback before reveal; replayed one synthetic positive fixture byte-stably; and rejected all 14 frozen negative controls for their exact reasons. Task Evaluate judged this exact synthetic gate PASS while retaining the upper objective and user-level verdicts as FAIL and agi_claim_supported=false. The dual-verdict Candidate preserved that separation and received only PROPOSE_ACTIVATION; activation remains unauthorized.",
              "execute_unit_id": "unit-generation29-blind-holder-heldout-protocol-repair-v1",
              "evaluation_unit_id": "unit-generation29-evaluate-blind-holder-protocol-repair-v1",
              "status": "continue",
              "claim_boundary": "PASS applies only to repository-local synthetic enforcement of the exact blind-holder event ordering, canonical digest bindings, declared isolation receipt, reveal authorization, deterministic replay, same-input baseline, 14 fail-closed controls, and cited request-time publication evidence. It excludes a live forecast, genuinely independent holder or predictor, external capability, production reliability, Candidate activation, generalized intelligence, AGI, and user-level completion.",
              "environment": {
                "run_id": "run-work-recovery-gen9-durability-repair",
                "executor_binding": "current_chatgpt_work_session",
                "model_identity": "chatgpt-work-model-unverified",
                "component_repository_commits": {
                  "root": "2fd752ada5d354c0d62274aeb14796fe1fca59f7",
                  "pre_execute_candidate": "1e5cf244db5da2036a19e1166b1a219a18cc3b2e",
                  "execute": "40d1422c256cbc2692c19c72fcae8a61340963f3",
                  "pre_task_evaluate_candidate": "2ba583925518f2845eb20a9e0c294b15dbee2d5e",
                  "task_evaluate": "6ee7a2ebf258bf2f25486ec89bf0719b307330ba",
                  "post_result_candidate": "e45bd8001e61d9504acc2ff2111b812d98414ed5"
                }
              },
              "sequence": [
                {
                  "step": 1,
                  "component": "root",
                  "kind": "routing",
                  "invocation_id": "invoke-848a5fdb4c9dc70b2178d66e",
                  "summary": "Preserved the prior contaminated forecast as FAIL and selected one bounded synthetic blind-holder protocol repair before any new live forecast."
                },
                {
                  "step": 2,
                  "component": "candidate_evaluate",
                  "kind": "pre_execute",
                  "invocation_id": "invoke-1a8b23359acdf0da62ad9522",
                  "summary": "Selected the active Execute prompt with a synthetic positive fixture and fail-closed negative controls; no Candidate or production activation was authorized."
                },
                {
                  "step": 3,
                  "component": "execute",
                  "kind": "protocol_repair",
                  "invocation_id": "invoke-c05ace0d499310ef6f8112b5",
                  "summary": "Implemented and recomputed the repository-local gate: one valid byte-stable positive replay, 14 exact-reason negative controls, no live provider or forecast, and the historical contaminated trial unchanged."
                },
                {
                  "step": 4,
                  "component": "publication_evidence",
                  "kind": "request_supplied_external_evidence",
                  "summary": "The frozen evidence cites PR371 for the implementation and synthetic artifacts and PR372 for the pre-Task lifecycle, exact-head tests, expected-head merges, and exact main readback."
                },
                {
                  "step": 5,
                  "component": "candidate_evaluate",
                  "kind": "pre_task_trial",
                  "invocation_id": "invoke-a410936ad17166d8d664f43c",
                  "summary": "Selected candidate-task-evaluate-unit-verdict-v1 for one reversible additive trial over the unchanged active Task Evaluate baseline; activation remained false."
                },
                {
                  "step": 6,
                  "component": "task_evaluate",
                  "kind": "dual_verdict",
                  "invocation_id": "invoke-d5cb1c32252a2e4ab92d0569",
                  "summary": "Returned unit_verdict PASS only for the synthetic protocol gate, while verdict and user_level_verdict remained FAIL, agi_claim_supported remained false, and all negative evidence was retained."
                },
                {
                  "step": 7,
                  "component": "candidate_evaluate",
                  "kind": "post_result",
                  "invocation_id": "invoke-96c7568053ec5ca132e60d90",
                  "summary": "Returned PROPOSE_ACTIVATION only; global activation remained false and a separate deterministic protected-baseline VERIFIED_FOR_SCOPE gate remained mandatory."
                },
                {
                  "step": 8,
                  "component": "side_effect_state",
                  "kind": "frozen_request_boundary",
                  "summary": "The implementation, pre-Task, and Task Evaluate evidence is supplied at request time. Publication/readback of the post-result Candidate, this Consolidate response, Learn, and successor Root remain later effects and are not backfilled."
                }
              ],
              "success_condition_mapping": [
                {
                  "condition": "Freeze task, rule, context, source, holder, and isolation commitments before primary retrieval.",
                  "status": "PASS",
                  "evidence": "The positive trace orders commitments_frozen, holder_committed, and isolation_bound before primary_retrieval at sequences 1 through 4."
                },
                {
                  "condition": "Persist the exact prediction response before revealing and scoring the hidden outcome.",
                  "status": "PASS",
                  "evidence": "The positive trace orders prediction and response_readback before reveal and score at sequences 5 through 8 with canonical digest checks."
                },
                {
                  "condition": "Replay the positive fixture deterministically against a non-fabricated same-input baseline.",
                  "status": "PASS",
                  "evidence": "Two validations produced the same decision digest 6cef5e0130499285f99098be81d5184dc290cdfb035e6adc91e10b42a9164bf9 and byte_stable_replay=true."
                },
                {
                  "condition": "Fail closed for every frozen protocol violation.",
                  "status": "PASS",
                  "evidence": "All 14 controls were invalid and each returned its one unique expected reason, including early retrieval, missing or same-session isolation, early reveal, binding mismatch, duplicate keys, replay drift, and fabricated or substituted baselines."
                },
                {
                  "condition": "Preserve the prior contaminated clean-g1 forecast without relabeling or rerunning it.",
                  "status": "PASS",
                  "evidence": "historical_score_relabelled=false, live_forecast_rerun=false, and the three fatal contamination findings remain."
                },
                {
                  "condition": "Keep the repair repository-local and synthetic with no protected production effect.",
                  "status": "PASS",
                  "evidence": "live_provider_execution_count=0, live_forecast_execution_count=0, external_holder_execution_count=0, Candidate activation=false, and production routing unchanged."
                },
                {
                  "condition": "Publish the implementation and pre-Task lifecycle through exact-head checks and exact readback.",
                  "status": "PASS",
                  "evidence": "The frozen evaluator evidence cites PR371 and PR372 with directive integrity, four shards, aggregate tests, expected-head merges, and exact blob readbacks."
                },
                {
