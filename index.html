<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="アエテリア戦記 — スマートフォンで遊べる、手続き生成のオープンワールドRPG。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アエテリア戦記">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="アエテリア戦記">
<meta property="og:description" content="手続き生成の大陸を冒険する、スマホ向け本格オープンワールドARPG。">
<title>アエテリア戦記 — オープンワールドRPG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<canvas id="game" role="application" aria-label="アエテリア戦記のゲーム画面" tabindex="0"></canvas>
<div id="boot">
  <div class="boot-title">アエテリア戦記</div>
  <div class="boot-sub">読み込み中…</div>
</div>
<div id="fatal" hidden role="alert">
  <div class="fatal-card">
    <h1>読み込みに失敗しました</h1>
    <p data-error>通信状態を確認して、もう一度お試しください。</p>
    <button type="button">再読み込み</button>
  </div>
</div>
<div id="a11y-status" class="sr-only" aria-live="polite"></div>
<noscript>
  <div class="noscript">このゲームを遊ぶには JavaScript を有効にしてください。</div>
</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
